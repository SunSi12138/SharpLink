mechanical_rules:
  production_origin_policy_is_separate_and_authoritative: true
  evaluate_all_test_projects_for_outgoing_project_references: true
  unregistered_test_project_with_project_reference: deny
  unregistered_test_target: deny
  test_reference_target_outside_registered_production_or_test_projects: deny
  evaluated_project_references_include_imports: true
  conditional_references_cannot_hide_edges: true
  project_reference_conditions_do_not_affect_authorization: true
  project_reference_mode_is_condition_invariant: true
  grouped_targets_expand_to_exact_individual_edges: true
  unlisted_test_origin_project_references: deny
  package_only_test_projects_may_remain_unregistered: true
  debt_exceptions_require_reason_and_tracking_issue: true
  debt_exceptions_are_not_precedent: true
