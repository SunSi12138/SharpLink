schema_version: 1

# Canonical machine-readable policy for ProjectReference edges whose origin is
# under test/. Production-origin edges remain exclusively governed by
# doc/project-reference-boundaries.yml.
production_policy:
  path: doc/project-reference-boundaries.yml
  authoritative_for_production_origins: true
  project_ids_source: projects
  test_policy_may_relax_production_policy: false

scope:
  test_root: test
  test_project_glob: "**/*.csproj"
  reference_kind: ProjectReference
  origin: test
  default: deny
  package_references: out_of_scope
  fixtures: included

inventory:
  baseline_branch: dev
  baseline_commit: 3e772ef0de75bda9f79d5f3508ef01f573bb6254
  # Historical107 + 40 preexisting dev omissions + allocation-probe1 + maintenance1.
  project_reference_edge_count: 149
  allowed_references_are_current_inventory: true
  debt_exception_count: 0

evaluation:
  active_items:
    source: msbuild_evaluated_items
    include_imports: true
    respect_conditions: true
  declaration_audit:
    source: project_and_repository_import_closure
    ignore_project_reference_conditions_for_authorization: true
    ignore_repository_import_conditions_for_traversal: true
    repository_imports_must_be_statically_traversable: true
    project_reference_include_must_be_literal_path: true
    unresolved_or_dynamic_project_reference_include: deny
    conditions_may_gate_presence_only: true
    mode_metadata_must_be_context_invariant: true
    mode_metadata_values_must_be_literal_on_reference:
      - ReferenceOutputAssembly
      - OutputItemType
    mode_metadata_from_item_definitions_or_updates: deny

mode_semantics:
  assembly:
    effective_metadata_defaults:
      ReferenceOutputAssembly: "true"
    required_effective_metadata:
      ReferenceOutputAssembly: "true"
    forbidden_effective_metadata:
      OutputItemType:
        - Analyzer
  analyzer:
    required_effective_metadata:
      OutputItemType: Analyzer
      ReferenceOutputAssembly: "false"
  build_only:
    required_effective_metadata:
      ReferenceOutputAssembly: "false"
    forbidden_effective_metadata:
      OutputItemType:
        - Analyzer

