name: Feature request
description: Propose an RPC use case or framework improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: Use case
      description: Describe the application or deployment problem, not only the desired API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and performance impact
      description: Note protocol, public API, NativeAOT, allocation, latency, throughput, or migration implications.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing Issues and the current documentation.
          required: true
