version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
      roslyn:
        patterns:
          - Microsoft.CodeAnalysis.*
      testing:
        patterns:
          - TUnit*
          - Microsoft.Testing.*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
