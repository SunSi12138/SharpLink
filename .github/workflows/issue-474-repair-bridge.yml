name: Issue 474 Repair Bridge

on:
  push:
    branches:
      - fix/474-call-admission-diagnostics

permissions:
  contents: write
  actions: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/474-call-admission-diagnostics
          fetch-depth: 0

      - name: Repair remaining stale call-admission diagnostic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('test/SharpLink.IntegrationTests/RuntimeAssemblyIntegrationTests.cs')
          text = path.read_text()
          old = '''        var serverActiveCalls = (int)(harness.Server.GetType().GetField(
                  "_globalActiveCalls",
                  BindingFlags.Instance | BindingFlags.NonPublic)?.GetValue(harness.Server) ?? -1);'''
          new = '''        var serverActiveCalls =
              ServerCallAdmissionDiagnostics.ActiveCallCount(harness.Server);'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one RuntimeAssembly stale diagnostic, found {count}')
          path.write_text(text.replace(old, new))
          PY

          if grep -R -n --include='*.cs' '_globalActiveCalls\|_pendingCallAdmissions' test/SharpLink.IntegrationTests; then
            echo 'stale call-admission diagnostics remain' >&2
            exit 1
          fi

      - name: Publish clean final head
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/SharpLink.IntegrationTests/RuntimeAssemblyIntegrationTests.cs
          git rm .github/workflows/issue-474-repair-bridge.yml
          git commit -m "test(server): update runtime assembly call diagnostics"
          git push origin HEAD:fix/474-call-admission-diagnostics

      - name: Run final validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run pr-fast.yml --repo "$GITHUB_REPOSITORY" --ref fix/474-call-admission-diagnostics
          gh workflow run pr-extended.yml --repo "$GITHUB_REPOSITORY" --ref fix/474-call-admission-diagnostics
