name: Temporary maintainability lambda hotspot validation

on:
  push:
    branches:
      - issue-350-maintainability-report

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: issue-350-maintainability-report
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore format build
        run: |
          dotnet restore Sharplink.slnx
          dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal
          dotnet build eng/SharpLink.Maintainability/SharpLink.Maintainability.csproj --no-restore -c Release -v minimal
      - name: Generate named dev snapshot and validate lambda hotspots
        env:
          SOURCE_REF: 00e2f18c6384c785d232bd59902102d3af7ad3da
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/maintainability"
          SHARPLINK_MAINTAINABILITY_SOURCE_REF="$SOURCE_REF" bash eng/report-maintainability.sh "$output"

          jq -e '.schemaVersion == 3' "$output/report.json"
          jq -e '[.complexMethods[] | select(.path == "src/SharpLink.Generator/RpcGenerator.cs" and (.name | startswith("<lambda>@")) and .cyclomaticComplexity == 22)] | length >= 1' "$output/report.json"
          jq -e '[.complexMethods[] | select(.path == "src/SharpLink.Generator/RpcGenerator.cs" and (.name | startswith("<lambda>@")) and .cyclomaticComplexity == 18)] | length >= 1' "$output/report.json"
          grep -F 'Tool ref: `bdb28961681e4c4e410fb6fe79582c917b22acfb`' "$output/report.md"

          cp "$output/report.md" eng/maintainability/dev-baseline.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eng/maintainability/dev-baseline.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh baseline with lambda hotspots'
            git push origin HEAD:issue-350-maintainability-report
          fi
