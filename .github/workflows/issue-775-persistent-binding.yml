name: Issue 775 persistent decode binding regression
on:
  push:
    branches: [prototype/775-static-session-binding]
    paths:
      - src/SharpLink.Server/**
      - eng/issue775/PersistentBindingChecks.cs
      - eng/issue775/persistent_regression.py
      - eng/issue775/test_persistent_binding.py
      - .github/workflows/issue-775-persistent-binding.yml
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2763bb4276a6f715e9dfd4827450e7285f919363
          path: old
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: candidate/global.json
      - name: Validate evidence reader
        run: python3 -m unittest discover -s candidate/eng/issue775 -p test_persistent_binding.py -v
      - name: Reproduce old bug and exercise all candidate decode paths
        run: |
          python3 candidate/eng/issue775/persistent_regression.py --old old --candidate candidate \
            --expected-candidate '${{ github.sha }}' --output persistent-regression
      - name: Retain exact source and failure details
        if: always()
        run: |
          mkdir -p persistent-regression
          git -C candidate archive HEAD | gzip > persistent-regression/source.tar.gz
          if test -f persistent-regression/summary.json; then cat persistent-regression/summary.json >> "$GITHUB_STEP_SUMMARY"; fi
          if test -f persistent-regression/execution-failures.json; then cat persistent-regression/execution-failures.json; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue775-persistent-binding-${{ github.sha }}
          path: persistent-regression/
          retention-days: 30
          if-no-files-found: error
