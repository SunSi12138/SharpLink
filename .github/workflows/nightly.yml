name: Nightly Regression

permissions:
  contents: read

on:
  push:
    branches: [dev]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  codec-compatibility:
    uses: ./.github/workflows/codec-compatibility.yml

  merge-chaos-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Restore Chaos Tests
        run: dotnet restore test/SharpLink.ChaosTests/SharpLink.ChaosTests.csproj

      - name: Build Chaos Tests
        run: dotnet build test/SharpLink.ChaosTests/SharpLink.ChaosTests.csproj --no-restore -c Release -v minimal

      - name: Chaos Smoke
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.ChaosTests
          --
          --duration-seconds 120
          --transport sharedmemory
          --concurrency 16
          --restart-interval-seconds 10
          --json-output artifacts/chaos/merge-to-dev-smoke.json

      - name: Upload Chaos Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaos-merge-to-dev-smoke
          path: |
            artifacts/chaos/merge-to-dev-smoke.json
            artifacts/chaos/merge-to-dev-smoke.dmp
            artifacts/chaos/merge-to-dev-smoke.dmp.crashreport.json
          if-no-files-found: warn
          retention-days: 14

  matrix-build-test:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Build
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Verify Generated Assemblies Do Not Reference Runtime
        if: runner.os == 'Linux'
        run: ./eng/verify-generated-assembly-dependencies.sh

      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Generator Tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build

      - name: Load Test Tests
        run: dotnet test --project test/SharpLink.LoadTest.Tests/SharpLink.LoadTest.Tests.csproj -c Release --no-build

      - name: Integration Tests
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.IntegrationTests
          --
          --maximum-parallel-tests 1
          --timeout 120s

      - name: Pack
        run: dotnet pack Sharplink.slnx --no-build --no-restore -c Release -o artifacts/nuget -v minimal

      - name: Restore Package Smoke
        run: dotnet restore test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj --force --no-cache --configfile test/SharpLink.PackageSmoke/NuGet.config
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

      - name: Run Package Smoke
        run: dotnet run -c Release --no-restore --project test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

  aot-smoke:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-14
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Run NativeAOT Transport and Topology Smoke
        shell: bash
        env:
          SHARPLINK_AOT_RID: ${{ matrix.rid }}
          SHARPLINK_AOT_OUTPUT: ${{ github.workspace }}/artifacts/aot
        run: ./eng/run-shared-memory-aot-process-smoke.sh

  perf-smoke:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Load Test Smoke
        run: dotnet run -c Release --project test/SharpLink.LoadTest -- --mode local --transport sharedmemory --operation add --concurrency 1,8,32 --warmup 2 --duration 8 --metrics-port 0

  allocation-trend:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Capture deterministic allocation trend
        continue-on-error: true
        uses: ./.github/actions/allocation-gate
        with:
          artifact-directory: artifacts/perf/allocation-trend
          negative-control: 'false'

      - name: Upload allocation trend evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allocation-nightly-${{ github.sha }}
          path: artifacts/perf/allocation-trend
          if-no-files-found: warn
          retention-days: 30

  chaos-soak:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 135
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Restore
        run: dotnet restore test/SharpLink.ChaosTests/SharpLink.ChaosTests.csproj

      - name: Build
        run: dotnet build test/SharpLink.ChaosTests/SharpLink.ChaosTests.csproj --no-restore -c Release -v minimal

      - name: Two-hour Mixed Chaos
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.ChaosTests
          --
          --duration-seconds 7200
          --transport sharedmemory
          --concurrency 32
          --restart-interval-seconds 30
          --json-output artifacts/chaos/nightly-2h.json

      - name: Upload Chaos Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaos-nightly-2h-${{ runner.os }}
          path: |
            artifacts/chaos/nightly-2h.json
            artifacts/chaos/nightly-2h.dmp
            artifacts/chaos/nightly-2h.dmp.crashreport.json
          if-no-files-found: warn
          retention-days: 14

  generated-abi-dynamic-module-soak:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 135
    env:
      SHARPLINK_P3_DYNAMIC_SOAK_DURATION_SECONDS: '7200'
      SHARPLINK_P3_DYNAMIC_SOAK_OUTPUT: ${{ github.workspace }}/artifacts/p3-generated-abi/dynamic-module-soak
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Two-hour Generated ABI Dynamic-module Churn
        run: ./eng/run-generated-abi-dynamic-module-soak.sh

      - name: Upload Generated ABI Soak Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-abi-dynamic-module-soak
          path: artifacts/p3-generated-abi/dynamic-module-soak
          if-no-files-found: warn
          retention-days: 14
