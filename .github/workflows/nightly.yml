name: Nightly Regression

permissions:
  contents: read

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  matrix-build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Build
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Generator Tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build

      - name: Load Test Tests
        run: dotnet test --project test/SharpLink.LoadTest.Tests/SharpLink.LoadTest.Tests.csproj -c Release --no-build

      - name: Integration Tests
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.IntegrationTests
          --
          --maximum-parallel-tests 1
          --timeout 120s

      - name: Pack
        run: dotnet pack Sharplink.slnx --no-build --no-restore -c Release -o artifacts/nuget -v minimal

      - name: Restore Package Smoke
        run: dotnet restore test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj --force --no-cache --configfile test/SharpLink.PackageSmoke/NuGet.config
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

      - name: Run Package Smoke
        run: dotnet run -c Release --no-restore --project test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

  aot-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-14
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run Independent-process Shared-memory AOT Smoke
        shell: bash
        env:
          SHARPLINK_AOT_RID: ${{ matrix.rid }}
          SHARPLINK_AOT_OUTPUT: ${{ github.workspace }}/artifacts/aot
        run: ./eng/run-shared-memory-aot-process-smoke.sh

  perf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Load Test Smoke
        run: dotnet run -c Release --project test/SharpLink.LoadTest -- --mode local --transport sharedmemory --operation add --concurrency 1,8,32 --warmup 2 --duration 8 --metrics-port 0

  chaos-soak:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 135
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore test/SharpLink.ChaosTests/SharpLink.ChaosTests.csproj

      - name: Build
        run: dotnet build test/SharpLink.ChaosTests/SharpLink.ChaosTests.csproj --no-restore -c Release -v minimal

      - name: Two-hour Mixed Chaos
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.ChaosTests
          --
          --duration-seconds 7200
          --transport sharedmemory
          --concurrency 32
          --restart-interval-seconds 30
          --json-output artifacts/chaos/nightly-2h.json

      - name: Upload Chaos Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaos-nightly-2h-${{ runner.os }}
          path: |
            artifacts/chaos/nightly-2h.json
            artifacts/chaos/nightly-2h.dmp
            artifacts/chaos/nightly-2h.dmp.crashreport.json
          if-no-files-found: warn
          retention-days: 14
