name: Official 2.0.3 Paired Diagnostic

on:
  push:
    branches: [codex/official-203-diagnostic-validation]
    paths: ['eng/official-version-comparison/REQUEST.json']

permissions:
  contents: read

concurrency:
  group: official203-diagnostic-O203D1
  cancel-in-progress: false

jobs:
  paired-diagnostic:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/codex/official-203-diagnostic-validation' && github.run_attempt == 1 && github.event.head_commit.message == 'run: official203 paired diagnostic O203D1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Initialize failure-retaining evidence paths
        shell: bash
        run: |
          set -euo pipefail
          export DOTNET_INSTALL_DIR="$RUNNER_TEMP/official203-sdk"
          export DOTNET_CLI_HOME="$RUNNER_TEMP/official203-diagnostic/cli-home"
          export PRIVATE_RUNTIME="$RUNNER_TEMP/official203-runtime"
          export DIAGNOSTIC_ROOT="$RUNNER_TEMP/official203-diagnostic"
          {
            echo "DOTNET_INSTALL_DIR=$DOTNET_INSTALL_DIR"
            echo "DOTNET_CLI_HOME=$DOTNET_CLI_HOME"
            echo "PRIVATE_RUNTIME=$PRIVATE_RUNTIME"
            echo "DIAGNOSTIC_ROOT=$DIAGNOSTIC_ROOT"
          } >> "$GITHUB_ENV"
          mkdir -p "$DIAGNOSTIC_ROOT/runtime-install" "$DOTNET_CLI_HOME"
          printf 'request=%s\nrun=%s\nattempt=%s\nrunner=%s/%s\nimage=%s/%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" "$RUNNER_ARCH" \
            "${ImageOS:-unknown}" "${ImageVersion:-unknown}" > "$DIAGNOSTIC_ROOT/launch-environment.txt"
      - name: Checkout bounded request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tools
          fetch-depth: 2
          persist-credentials: false
      - name: Verify single request, exact review identity and explicit root release
        id: request
        working-directory: tools
        shell: bash
        run: |
          set -euo pipefail
          cp eng/official-version-comparison/REQUEST.json "$DIAGNOSTIC_ROOT/submitted-request.json"
          cp "$GITHUB_EVENT_PATH" "$DIAGNOSTIC_ROOT/push-event.json"
          python3 eng/official-version-comparison/verify_request.py \
            --record "$DIAGNOSTIC_ROOT/verified-request.json" 2>&1 | tee "$DIAGNOSTIC_ROOT/request-gate.log"
      - name: Pin all subsequent tools and workflow bytes to reviewed request parent
        id: pin
        working-directory: tools
        env:
          REVIEWED_TOOL_SHA: ${{ steps.request.outputs.reviewed_tool_sha }}
          REVIEWED_TOOL_TREE: ${{ steps.request.outputs.reviewed_tool_tree }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$REVIEWED_TOOL_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_TOOL_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$REVIEWED_TOOL_TREE"
          test -z "$(git status --porcelain)"
          cp .github/workflows/official-version-comparison.yml "$DIAGNOSTIC_ROOT/reviewed-workflow.yml"
          printf '%s\n' "$REVIEWED_TOOL_SHA" > "$DIAGNOSTIC_ROOT/reviewed-tool-sha.txt"
      - name: Checkout exact development product, not request or tool revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 57f06f172d29fa5cfd4ea8e9b86a23f122df24ab
          path: sources/dev
          persist-credentials: false
      - name: Install exact build SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.102
      - name: Install SHA512-verified runtime-only private frameworks
        shell: bash
        run: |
          set -euo pipefail
          cd "$DIAGNOSTIC_ROOT/runtime-install"
          curl --fail --silent --show-error --location https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json --output releases.json
          curl --fail --silent --show-error --location https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.14/dotnet-runtime-10.0.14-linux-x64.tar.gz --output dotnet.tar.gz
          curl --fail --silent --show-error --location https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.14/aspnetcore-runtime-10.0.14-linux-x64.tar.gz --output aspnetcore.tar.gz
          {
            echo '634326028645f38731c8c4e71a68356e4ca0d6b6607139a234ab760687f742063edaf33a1f20dda615742d2dc8300ca2ff857619d51fbb38090383b71334af89  dotnet.tar.gz'
            echo 'dd024fd2616926a555b75cbf7a836f6dce998199f0596d9d75676dca2b9d59c8ee8673c6ac23473c0f1a4bdd59eb5cd02fe9ab097eeaf2dd8c8bd117c85e7031  aspnetcore.tar.gz'
          } | sha512sum --check | tee framework-verification.log
          mkdir "$PRIVATE_RUNTIME"
          tar -xzf dotnet.tar.gz -C "$PRIVATE_RUNTIME"
          tar -xzf aspnetcore.tar.gz -C "$PRIVATE_RUNTIME"
      - name: Warm hosted build dependencies
        working-directory: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 eng/official-version-comparison/warm_cache.py \
            --source "$GITHUB_WORKSPACE/sources/dev" \
            --dotnet "$DOTNET_INSTALL_DIR/dotnet" \
            --output "$DIAGNOSTIC_ROOT/dependency-cache" 2>&1 | tee "$DIAGNOSTIC_ROOT/dependency-warmup.log"
      - name: Fetch fixed official packages and verify retained public provenance
        working-directory: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 eng/official-version-comparison/fetch_published.py \
            --output "$DIAGNOSTIC_ROOT/published-cache" 2>&1 | tee "$DIAGNOSTIC_ROOT/published-fetch.log"
      - name: Prepare independent package and own-generator arms, build only
        working-directory: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 eng/official-version-comparison/prepare.py \
            --official-cache "$DIAGNOSTIC_ROOT/published-cache" \
            --official-provenance eng/official-version-comparison/published-cache/provenance.json \
            --dev-source "$GITHUB_WORKSPACE/sources/dev" \
            --dependency-cache "$DIAGNOSTIC_ROOT/dependency-cache/packages" \
            --dotnet "$DOTNET_INSTALL_DIR/dotnet" \
            --output "$DIAGNOSTIC_ROOT/prepared" 2>&1 | tee "$DIAGNOSTIC_ROOT/preparation.log"
      - name: Shut down build servers and establish the released quiet window
        shell: bash
        run: |
          set -euo pipefail
          for cli_home in "$DOTNET_CLI_HOME" "$DIAGNOSTIC_ROOT/dependency-cache/cli-home" "$DIAGNOSTIC_ROOT/prepared/cli-home"; do
            DOTNET_CLI_HOME="$cli_home" "$DOTNET_INSTALL_DIR/dotnet" build-server shutdown
          done 2>&1 | tee "$DIAGNOSTIC_ROOT/build-server-shutdown.log"
          python3 - <<'PY'
          import datetime, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['DIAGNOSTIC_ROOT'])
          listing = subprocess.check_output(['ps', '-eo', 'pid=,stat=,comm='], text=True)
          (root / 'quiet-window-processes.txt').write_text(listing)
          active = []
          for line in listing.splitlines():
              pid, state, command = line.split(None, 2)
              if not state.startswith('Z') and command.lower() in {'dotnet', 'testhost', 'msbuild', 'vbcscompiler', 'vstest.console'}:
                  active.append(line)
          if active:
              raise RuntimeError('Other CLR/build/test process prevents quiet window: ' + repr(active))
          verified = json.loads((root / 'verified-request.json').read_text())
          if verified['request']['rootRelease'] != 'authorized' or verified['request']['reviewStatus'] != 'PASS':
              raise RuntimeError('Root release/review assertion absent')
          record = {'noOtherClrBuildTest': True,
                    'owner': 'root-authorized O203D1 hosted job',
                    'timestampUtc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'requestCommit': verified['requestCommit'],
                    'reviewedToolCommit': verified['reviewedToolCommit'],
                    'runId': os.environ['GITHUB_RUN_ID'], 'attempt': 1,
                    'scope': 'this dedicated hosted job; no physical isolation claim'}
          (root / 'quiet-window.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Cold-gate eight cells, then the declared 48 timed processes only
        working-directory: tools
        env:
          REVIEWED_TOOL_SHA: ${{ steps.request.outputs.reviewed_tool_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 eng/official-version-comparison/run.py \
            --prepared "$DIAGNOSTIC_ROOT/prepared" \
            --runtime-dotnet "$PRIVATE_RUNTIME/dotnet" \
            --reviewed-tool-sha "$REVIEWED_TOOL_SHA" \
            --quiet-window-record "$DIAGNOSTIC_ROOT/quiet-window.json" \
            --output "$DIAGNOSTIC_ROOT/evidence" 2>&1 | tee "$DIAGNOSTIC_ROOT/driver.log"
      - name: Always perform offline validation, including incomplete and failed evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f tools/eng/official-version-comparison/validate.py && \
             test -f "$DIAGNOSTIC_ROOT/prepared/prepared.json" && test -d "$DIAGNOSTIC_ROOT/evidence"; then
            python3 tools/eng/official-version-comparison/validate.py \
              --input "$DIAGNOSTIC_ROOT/evidence" \
              --prepared "$DIAGNOSTIC_ROOT/prepared" \
              --runtime-dotnet "$PRIVATE_RUNTIME/dotnet" 2>&1 | tee "$DIAGNOSTIC_ROOT/offline-validation.log"
          else
            printf '%s\n' '{"status":"Invalid","reason":"Offline validation blocked: validator, completed preparation or run output missing; no evidence accepted."}' | tee "$DIAGNOSTIC_ROOT/offline-validation-blocked.json" "$DIAGNOSTIC_ROOT/offline-validation.log"
            exit 1
          fi
      - name: Retain all diagnostics, raw ticks, failed gates and incomplete attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: official203-O203D1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/official203-diagnostic
          if-no-files-found: error
          retention-days: 30
