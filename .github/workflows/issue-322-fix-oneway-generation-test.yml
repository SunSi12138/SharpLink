name: Issue 322 Fix Oneway Generation Test

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'issue-322-admission-program-generation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-322-admission-program-generation
          fetch-depth: 0

      - name: Add deterministic capture barrier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('test/SharpLink.IntegrationTests/DynamicAdmissionGenerationTests.cs')
          text = path.read_text()
          start = text.index('    public async Task EnabledCaptureShouldRemainEnabledWhenCurrentBecomesDisabled(bool oneWay)')
          end = text.index('\n    [Test]\n    [NotInParallel]\n    public async Task EnabledCaptureShouldRemainOnGenerationNWhenCurrentBecomesNPlusOne()', start)
          block = text[start:end]

          replacements = [
              (
                  '        var hookCount = 0;\n',
                  '        var hookCount = 0;\n        var captureCompleted = new TaskCompletionSource(\n            TaskCreationOptions.RunContinuationsAsynchronously);\n'
              ),
              (
                  '                server.PublishAdmissionProgramForTests(null);\n',
                  '                server.PublishAdmissionProgramForTests(null);\n                captureCompleted.TrySetResult();\n'
              ),
              (
                  '                await service.NotifyAsync("captured-enabled");\n',
                  '                await service.NotifyAsync("captured-enabled");\n                await captureCompleted.Task.WaitAsync(TimeSpan.FromSeconds(5));\n'
              )
          ]
          for old, new in replacements:
              count = block.count(old)
              if count != 1:
                  raise SystemExit(f'expected one scoped replacement, found {count}: {old!r}')
              block = block.replace(old, new, 1)

          path.write_text(text[:start] + block + text[end:])
          PY

      - name: Commit test fix and remove helper
        shell: bash
        run: |
          rm .github/workflows/issue-322-fix-oneway-generation-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/SharpLink.IntegrationTests/DynamicAdmissionGenerationTests.cs .github/workflows/issue-322-fix-oneway-generation-test.yml
          git commit -m "test(server): synchronize one-way admission publication race"
          git push origin HEAD:issue-322-admission-program-generation
