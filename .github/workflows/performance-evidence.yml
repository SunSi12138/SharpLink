name: Performance Matrix Smoke

on:
  push:
    branches:
      - issue-333-dynamic-admission-rate-update

permissions:
  contents: read

jobs:
  performance-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Prepare exact comparison worktrees
        shell: bash
        run: |
          set -euo pipefail
          git worktree add ../issue333-before 5856422666373ae596ce4920c7b7159d98d199bc
          git worktree add ../issue333-after 5967065a48c3045928d30a22eafd47882cae9e92
          dotnet restore ../issue333-before/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          dotnet restore ../issue333-after/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj

      - name: Benchmark pre-fix head
        shell: bash
        run: |
          set -euo pipefail
          cd ../issue333-before
          dotnet run -c Release --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj --no-restore -- --filter '*AdmissionFreshRateRpcBenchmarks*'
          dotnet run -c Release --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj --no-restore -- --filter '*AdmissionRateControllerBenchmarks*'

      - name: Benchmark coupled-credit fix
        shell: bash
        run: |
          set -euo pipefail
          cd ../issue333-after
          dotnet run -c Release --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj --no-restore -- --filter '*AdmissionFreshRateRpcBenchmarks*'
          dotnet run -c Release --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj --no-restore -- --filter '*AdmissionRateControllerBenchmarks*'
