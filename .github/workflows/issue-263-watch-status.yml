name: Issue 263 Watch Status

on:
  push:
    branches:
      - agent/issue-263-watch
    paths:
      - .github/workflows/issue-263-watch-status.yml

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report latest target run iteration 2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_id=$(gh api 'repos/${{ github.repository }}/actions/runs?branch=agent/issue-263-dynamic-interceptors&per_page=1' --jq '.workflow_runs[0].id // 0')
          status=$(gh api 'repos/${{ github.repository }}/actions/runs?branch=agent/issue-263-dynamic-interceptors&per_page=1' --jq '.workflow_runs[0].status // "none"')
          conclusion=$(gh api 'repos/${{ github.repository }}/actions/runs?branch=agent/issue-263-dynamic-interceptors&per_page=1' --jq '.workflow_runs[0].conclusion // "pending"')
          gh api repos/${{ github.repository }}/issues/263/comments -f body="<!-- issue-263-agent-watch-status-2 --> run_id=${run_id} status=${status} conclusion=${conclusion}"
