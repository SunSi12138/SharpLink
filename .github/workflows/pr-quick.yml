name: PR Quick

permissions:
  contents: write

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refactor-issue-311:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/311-codec-scope-routing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/311-codec-scope-routing
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Apply ownership and direct Codec refactor
        shell: bash
        run: |
          python - <<'PYRUN'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              ['git', 'show', 'fb3d8a51e01605bcb95494dd0dd904c98c20cb83:.github/workflows/issue-311-contract-diff-fix.yml'],
              text=True)
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          raw = source[start:end]
          lines = raw.splitlines()
          first = next(line for line in lines if line.strip())
          indent = len(first) - len(first.lstrip())
          prefix = ' ' * indent
          script = '\n'.join(line[indent:] if line.startswith(prefix) else line for line in lines)

          section_start = script.index('# Explicit selection is disabled only for the ContractDefault view.')
          section_end = script.index('# Resolve explicit attributes as either registered adapter or direct closed IRpcCodec<T>.', section_start)
          replacement = """# Explicit selection is disabled only for the ContractDefault view.
replace_block(
    path,
    '            var hasSelectedOverride = _contractMode',
    '            if (IsBuiltin(type))',
'''            ExplicitCodecSelection? selectedCodec = null;
            var hasSelectedOverride = _mode switch
            {
                DtoAnalysisMode.ContractPolicy => TrySelectContractCodecOverride(type, out selectedCodec),
                DtoAnalysisMode.Standalone => TrySelectExplicitCodec(type, out selectedCodec),
                _ => false
            };
            if (hasSelectedOverride)
            {
                if (selectedCodec is not null)
                    AddExplicitCodecModel(type, typeName, selectedCodec);
                return;
            }

''')
p = Path(path)
text = p.read_text().replace(
    'GetCodecName(typeName, _contractMode)',
    'GetCodecName(typeName, _mode == DtoAnalysisMode.ContractPolicy)')
p.write_text(text)

"""
          script = script[:section_start] + replacement + script[section_end:]

          script += r'''
p = Path('test/SharpLink.Generator.Tests/RpcCodecRouteTests.cs')
text = p.read_text()
method = text.index('ExplicitPerTypeAdapterShouldOverrideAssemblyRoute')
start = text.index('        var manifest = RunGeneratorAndGetSources(source).Single(static item =>', method)
end = text.index('        return Task.CompletedTask;', start)
replacement = ''' + "'''" + r'''        var manifest = RunGeneratorAndGetSources(source).Single(static item =>
            item.Contains("ISharpLinkGeneratedAssemblyManifest", StringComparison.Ordinal));
        var contractSection = manifest.Substring(
            manifest.IndexOf("__contractCodecs =", StringComparison.Ordinal));
        Ensure(contractSection.Contains("new __SharpLinkGeneratedCodec_", StringComparison.Ordinal),
            "a Contract-reachable explicit binding must be published into the Contract-owned Codec table");
''' + "'''" + r'''
p.write_text(text[:start] + replacement + text[end:])
'''
          exec(compile(script, 'issue-311-final-codec-binding.py', 'exec'), {'__name__': '__main__'})
          PYRUN

      - name: Format
        run: dotnet format Sharplink.slnx whitespace

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Build
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Generator Tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build

      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Integration Tests
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.IntegrationTests
          --
          --maximum-parallel-tests 1
          --timeout 120s

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "SunSi12138"
          git config user.email "54728594+SunSi12138@users.noreply.github.com"
          git add src/SharpLink.Abstractions/Sdk/RpcCodecAdapterAttribute.cs \
                  src/SharpLink.Generator/RpcGenerator.DtoAnalysis.cs \
                  src/SharpLink.Generator/RpcGenerator.CodecRoutes.cs \
                  src/SharpLink.Generator/RpcGenerator.Models.cs \
                  src/SharpLink.Generator/RpcGenerator.DtoEmitter.cs \
                  src/SharpLink.Generator/RpcGenerator.cs \
                  test/SharpLink.Generator.Tests/RpcCodecRouteTests.cs \
                  test/SharpLink.Generator.Tests/RpcDirectCodecBindingTests.cs
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Contract codec binding ownership"
          git push origin HEAD:fix/311-codec-scope-routing

  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Build
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Generator Tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build

      - name: Load Test Tests
        run: dotnet test --project test/SharpLink.LoadTest.Tests/SharpLink.LoadTest.Tests.csproj -c Release --no-build

      - name: Integration Tests
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.IntegrationTests
          --
          --maximum-parallel-tests 1
          --timeout 120s

      - name: Run Independent-process Shared-memory AOT Smoke
        env:
          SHARPLINK_AOT_RID: linux-x64
        run: ./eng/run-shared-memory-aot-process-smoke.sh

      - name: Pack
        run: dotnet pack Sharplink.slnx --no-build --no-restore -c Release -o artifacts/nuget -v minimal

      - name: Verify SDK Contains Generator
        run: unzip -l artifacts/nuget/SharpLink.Sdk.*.nupkg | grep -q 'analyzers/dotnet/cs/SharpLink.Generator.dll'

      - name: Verify package metadata, XML documentation, and symbols
        run: ./eng/verify-packages.sh artifacts/nuget

      - name: Restore Package Smoke
        run: dotnet restore test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj --force --no-cache --configfile test/SharpLink.PackageSmoke/NuGet.config
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

      - name: Run Package Smoke
        run: dotnet run -c Release --no-restore --project test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

      - name: Demo Oneway
        run: dotnet run -c Release --no-build --project demo/Oneway

      - name: Load Smoke
        run: dotnet run -c Release --no-build --project test/SharpLink.LoadTest -- --mode local --transport sharedmemory --operation add --concurrency 1,4 --warmup 2 --duration 5 --metrics-port 0

      - name: Chaos Smoke
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.ChaosTests
          --
          --duration-seconds 120
          --transport sharedmemory
          --concurrency 16
          --restart-interval-seconds 10
          --json-output artifacts/chaos/pr-smoke.json

      - name: Upload Chaos Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaos-pr-smoke
          path: |
            artifacts/chaos/pr-smoke.json
            artifacts/chaos/pr-smoke.dmp
            artifacts/chaos/pr-smoke.dmp.crashreport.json
          if-no-files-found: warn
