name: PR Quick

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codec-compatibility:
    uses: ./.github/workflows/codec-compatibility.yml

  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Verify Formatting
        run: dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build Debug
        run: dotnet build Sharplink.slnx --no-restore -c Debug -v minimal

      - name: Build Release
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Verify Generated Assemblies Do Not Reference Runtime
        run: ./eng/verify-generated-assembly-dependencies.sh

      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Generator Tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build

      - name: Load Test Tests
        run: dotnet test --project test/SharpLink.LoadTest.Tests/SharpLink.LoadTest.Tests.csproj -c Release --no-build

      - name: Integration Tests
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.IntegrationTests
          --
          --maximum-parallel-tests 1
          --timeout 120s

      - name: Run NativeAOT Transport and Topology Smoke
        env:
          SHARPLINK_AOT_RID: linux-x64
        run: ./eng/run-shared-memory-aot-process-smoke.sh

      - name: Pack
        run: dotnet pack Sharplink.slnx --no-build --no-restore -c Release -o artifacts/nuget -v minimal

      - name: Verify SDK Contains Generator
        run: unzip -l artifacts/nuget/SharpLink.Sdk.*.nupkg | grep -q 'analyzers/dotnet/cs/SharpLink.Generator.dll'

      - name: Verify package metadata, XML documentation, and symbols
        run: ./eng/verify-packages.sh artifacts/nuget

      - name: Verify Hosting direct Runtime dependency
        run: ./eng/verify-hosting-package-dependency.sh artifacts/nuget

      - name: Verify Abstractions has no DI dependency
        run: ./eng/verify-abstractions-package-dependency.sh artifacts/nuget

      - name: Restore Package Smoke
        run: dotnet restore test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj --force --no-cache --configfile test/SharpLink.PackageSmoke/NuGet.config
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

      - name: Run Package Smoke
        run: dotnet run -c Release --no-restore --project test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

      - name: Demo Oneway
        run: dotnet run -c Release --no-build --project demo/Oneway

      - name: Load Smoke
        run: dotnet run -c Release --no-build --project test/SharpLink.LoadTest -- --mode local --transport sharedmemory --operation add --concurrency 1,4 --warmup 2 --duration 5 --metrics-port 0

      - name: Chaos Smoke
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.ChaosTests
          --
          --duration-seconds 120
          --transport sharedmemory
          --concurrency 16
          --restart-interval-seconds 10
          --json-output artifacts/chaos/pr-smoke.json

      - name: Upload Chaos Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaos-pr-smoke
          path: |
            artifacts/chaos/pr-smoke.json
            artifacts/chaos/pr-smoke.dmp
            artifacts/chaos/pr-smoke.dmp.crashreport.json
          if-no-files-found: warn

      - name: Issue 305 formal c1 single-partition gate
        if: github.event.pull_request.number == 309
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cat > /tmp/issue305-patch-loadtest.py <<'PY'
          from pathlib import Path
          path = Path('test/SharpLink.LoadTest/Program.cs')
          text = path.read_text()
          old_validation = '''if (admissionMode is not ("disabled" or "immediate" or "queue" or "reject"))'''
          new_validation = '''if (admissionMode is not ("disabled" or "immediate" or "partition-immediate" or "queue" or "reject"))'''
          old_switch = '''            "immediate" => builder.UseAdmissionControl(admission =>\n                admission.Global.UseConcurrency(4096)),\n            "queue" => builder.UseAdmissionControl(admission =>'''
          new_switch = '''            "immediate" => builder.UseAdmissionControl(admission =>\n                admission.Global.UseConcurrency(4096)),\n            "partition-immediate" => builder.UseAdmissionControl(admission =>\n                admission.UsePartition(\n                    static _ => "hot",\n                    partition =>\n                    {\n                        partition.MaxPartitions = 1;\n                        partition.UseConcurrency(4096);\n                    })),\n            "queue" => builder.UseAdmissionControl(admission =>'''
          if old_validation not in text or old_switch not in text:
              raise SystemExit('load-test admission patch anchors changed')
          text = text.replace(old_validation, new_validation, 1)
          text = text.replace(old_switch, new_switch, 1)
          path.write_text(text)
          PY

          rm -rf /tmp/issue305-c1-baseline /tmp/issue305-c1-candidate
          git checkout --force "$BASE_SHA"
          git clean -xffd
          python3 /tmp/issue305-patch-loadtest.py
          dotnet restore test/SharpLink.LoadTest/SharpLink.LoadTest.csproj
          dotnet publish test/SharpLink.LoadTest/SharpLink.LoadTest.csproj -c Release --no-restore -o /tmp/issue305-c1-baseline

          git checkout --force "$HEAD_SHA"
          git clean -xffd
          python3 /tmp/issue305-patch-loadtest.py
          dotnet restore test/SharpLink.LoadTest/SharpLink.LoadTest.csproj
          dotnet publish test/SharpLink.LoadTest/SharpLink.LoadTest.csproj -c Release --no-restore -o /tmp/issue305-c1-candidate

          mkdir -p artifacts/issue-305-c1/runs
          : > artifacts/issue-305-c1/formal-load.log
          run_stage() {
            local binary="$1"
            local label="$2"
            local output="artifacts/issue-305-c1/runs/${label}.log"
            echo "=== $label ===" | tee -a artifacts/issue-305-c1/formal-load.log
            "$binary/SharpLink.LoadTest" \
              --mode local --transport tcp --operation add \
              --duration 15 --warmup 3 --concurrency 1 \
              --min-connections 1 --max-connections 1 \
              --request-timeout disabled --admission partition-immediate \
              --recording formal --maximum-recorded-operations 2000000 --metrics-port 0 \
              | tee "$output"
            local result
            result=$(grep '^\[Result\]' "$output" | tail -1)
            test -n "$result"
            echo "SAMPLE label=$label $result" | tee -a artifacts/issue-305-c1/formal-load.log
          }
          run_stage /tmp/issue305-c1-baseline baseline-r1
          run_stage /tmp/issue305-c1-candidate candidate-r1
          run_stage /tmp/issue305-c1-candidate candidate-r2
          run_stage /tmp/issue305-c1-baseline baseline-r2
          run_stage /tmp/issue305-c1-baseline baseline-r3
          run_stage /tmp/issue305-c1-candidate candidate-r3
          run_stage /tmp/issue305-c1-candidate candidate-r4
          run_stage /tmp/issue305-c1-baseline baseline-r4
          run_stage /tmp/issue305-c1-baseline baseline-r5
          run_stage /tmp/issue305-c1-candidate candidate-r5

          python3 - <<'PY'
          import re
          import statistics
          from pathlib import Path
          text = Path('artifacts/issue-305-c1/formal-load.log').read_text()
          pattern = re.compile(
              r'SAMPLE label=(?P<label>\S+) \[Result\] op=add c=1 '
              r'qps=(?P<qps>[0-9.]+).*?p50=(?P<p50>[0-9.]+)us '
              r'p95=(?P<p95>[0-9.]+)us p99=(?P<p99>[0-9.]+)us .*?avg=(?P<avg>[0-9.]+)us')
          rows = []
          for match in pattern.finditer(text):
              row = match.groupdict()
              rows.append({
                  'label': row['label'],
                  'kind': 'candidate' if row['label'].startswith('candidate') else 'baseline',
                  'qps': float(row['qps']), 'p50': float(row['p50']),
                  'p95': float(row['p95']), 'p99': float(row['p99']), 'avg': float(row['avg'])})
          if len(rows) != 10:
              raise SystemExit(f'expected 10 formal c1 result rows, got {len(rows)}')
          baseline = [r for r in rows if r['kind'] == 'baseline']
          candidate = [r for r in rows if r['kind'] == 'candidate']
          med = lambda values, key: statistics.median(r[key] for r in values)
          bavg, cavg = med(baseline, 'avg'), med(candidate, 'avg')
          bp50, cp50 = med(baseline, 'p50'), med(candidate, 'p50')
          bp99, cp99 = med(baseline, 'p99'), med(candidate, 'p99')
          bqps, cqps = med(baseline, 'qps'), med(candidate, 'qps')
          avg_delta = (cavg / bavg - 1.0) * 100.0
          p50_delta = (cp50 / bp50 - 1.0) * 100.0
          p99_delta = (cp99 / bp99 - 1.0) * 100.0
          qps_delta = (cqps / bqps - 1.0) * 100.0
          gate = 'PASS' if avg_delta <= 2.0 else 'FAIL'
          summary = f'''# Issue #305 formal c1 single-partition evidence

| Metric | Baseline median | A2 median | Delta |
| :--- | ---: | ---: | ---: |
| Average latency | {bavg:.2f} us | {cavg:.2f} us | {avg_delta:+.2f}% |
| P50 | {bp50:.2f} us | {cp50:.2f} us | {p50_delta:+.2f}% |
| P99 | {bp99:.2f} us | {cp99:.2f} us | {p99_delta:+.2f}% |
| QPS | {bqps:.0f} | {cqps:.0f} | {qps_delta:+.2f}% |

Gate: **{gate}** — evaluated on median average full-RPC latency across five interleaved 15-second samples per variant; #305 requires single-partition latency not to stably regress by more than 2%.
'''
          Path('artifacts/issue-305-c1/summary.md').write_text(summary)
          print(summary)
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a') as stream:
              stream.write(summary)
          if gate == 'FAIL':
              raise SystemExit('Issue #305 formal c1 latency gate failed')
          PY

      - name: Upload Issue 305 c1 evidence
        if: always() && github.event.pull_request.number == 309
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-305-c1-evidence
          path: artifacts/issue-305-c1
          if-no-files-found: warn
