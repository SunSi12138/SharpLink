name: PR Quick

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codec-compatibility:
    uses: ./.github/workflows/codec-compatibility.yml

  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Verify Formatting
        run: dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build Debug
        run: dotnet build Sharplink.slnx --no-restore -c Debug -v minimal

      - name: Build Release
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Verify Generated Assemblies Do Not Reference Runtime
        run: ./eng/verify-generated-assembly-dependencies.sh

      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Generator Tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build

      - name: Load Test Tests
        run: dotnet test --project test/SharpLink.LoadTest.Tests/SharpLink.LoadTest.Tests.csproj -c Release --no-build

      - name: Integration Tests
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.IntegrationTests
          --
          --maximum-parallel-tests 1
          --timeout 120s

      - name: Run NativeAOT Transport and Topology Smoke
        env:
          SHARPLINK_AOT_RID: linux-x64
        run: ./eng/run-shared-memory-aot-process-smoke.sh

      - name: Pack
        run: dotnet pack Sharplink.slnx --no-build --no-restore -c Release -o artifacts/nuget -v minimal

      - name: Verify SDK Contains Generator
        run: unzip -l artifacts/nuget/SharpLink.Sdk.*.nupkg | grep -q 'analyzers/dotnet/cs/SharpLink.Generator.dll'

      - name: Verify package metadata, XML documentation, and symbols
        run: ./eng/verify-packages.sh artifacts/nuget

      - name: Verify Hosting direct Runtime dependency
        run: ./eng/verify-hosting-package-dependency.sh artifacts/nuget

      - name: Verify Abstractions has no DI dependency
        run: ./eng/verify-abstractions-package-dependency.sh artifacts/nuget

      - name: Restore Package Smoke
        run: dotnet restore test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj --force --no-cache --configfile test/SharpLink.PackageSmoke/NuGet.config
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

      - name: Run Package Smoke
        run: dotnet run -c Release --no-restore --project test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

      - name: Demo Oneway
        run: dotnet run -c Release --no-build --project demo/Oneway

      - name: Load Smoke
        run: dotnet run -c Release --no-build --project test/SharpLink.LoadTest -- --mode local --transport sharedmemory --operation add --concurrency 1,4 --warmup 2 --duration 5 --metrics-port 0

      - name: Chaos Smoke
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.ChaosTests
          --
          --duration-seconds 120
          --transport sharedmemory
          --concurrency 16
          --restart-interval-seconds 10
          --json-output artifacts/chaos/pr-smoke.json

      - name: Upload Chaos Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaos-pr-smoke
          path: |
            artifacts/chaos/pr-smoke.json
            artifacts/chaos/pr-smoke.dmp
            artifacts/chaos/pr-smoke.dmp.crashreport.json
          if-no-files-found: warn

  issue-245-review-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Checkout evidence harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tmp/issue-245-review-evidence
          path: harness

      - name: Checkout audited baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c89a79bf6a3acdc24dd0f3289dbbcbe84b1ab186
          path: baseline

      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c9142d35eb5e6326bf7681b64bfb55e3d9cfec88
          path: candidate

      - name: Inject identical review evidence harness
        shell: bash
        run: |
          set -euo pipefail
          for tree in baseline candidate; do
            cp harness/test/SharpLink.Benchmarks/AdmissionPartitionReviewEvidence.cs \
              "$tree/test/SharpLink.Benchmarks/AdmissionPartitionReviewEvidence.cs"
            python3 - "$tree/test/SharpLink.Benchmarks/Program.cs" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          needle = "    public static async Task Main(string[] args)\n    {\n"
          insert = """    public static async Task Main(string[] args)
    {
        if (args.Length > 0 && string.Equals(
            args[0], "--issue-245-review-evidence", StringComparison.Ordinal))
        {
            await AdmissionPartitionReviewEvidence.RunAsync(args[1..]);
            return;
        }
"""
          if needle not in text:
              raise SystemExit(f"Program entrypoint shape not found in {path}")
          path.write_text(text.replace(needle, insert, 1))
          PY
          done

      - name: Restore and build evidence projects
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore baseline/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          dotnet restore candidate/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          dotnet build baseline/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-restore
          dotnet build candidate/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-restore

      - name: Run controlled alternating baseline candidate matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          run_one() {
            local tree="$1"
            local label="$2"
            local round="$3"
            local sha="$4"
            echo "=== $label round $round ==="
            SHARPLINK_BENCHMARK_SHA="$sha" dotnet run \
              --project "$tree/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj" \
              -c Release --no-build -- \
              --issue-245-review-evidence "$label" \
              "$(pwd)/evidence/${label}-${round}.json"
          }

          run_one baseline baseline 1 c89a79bf6a3acdc24dd0f3289dbbcbe84b1ab186
          run_one candidate candidate 1 c9142d35eb5e6326bf7681b64bfb55e3d9cfec88
          run_one candidate candidate 2 c9142d35eb5e6326bf7681b64bfb55e3d9cfec88
          run_one baseline baseline 2 c89a79bf6a3acdc24dd0f3289dbbcbe84b1ab186
          run_one baseline baseline 3 c89a79bf6a3acdc24dd0f3289dbbcbe84b1ab186
          run_one candidate candidate 3 c9142d35eb5e6326bf7681b64bfb55e3d9cfec88

      - name: Summarize and enforce RPC regression gate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import statistics
          from collections import defaultdict
          from pathlib import Path

          grouped = defaultdict(lambda: {"baseline": [], "candidate": []})
          for path in sorted(Path("evidence").glob("*.json")):
              doc = json.loads(path.read_text())
              label = doc["label"]
              for item in doc["results"]:
                  key = (item["kind"], item["partitions"], item["concurrency"])
                  grouped[key][label].append(item)

          lines = [
              "# Issue #245 controlled review evidence",
              "",
              "Baseline: `c89a79bf6a3acdc24dd0f3289dbbcbe84b1ab186`  ",
              "Candidate A2: `c9142d35eb5e6326bf7681b64bfb55e3d9cfec88`",
              "",
              "Each cell is the median of 3 alternating runs in the same GitHub Actions job.",
              "",
              "| Kind | Partitions | C | Baseline QPS | A2 QPS | QPS delta | Baseline P99 us | A2 P99 us | P99 delta | A2 scans | A2 visited |",
              "|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|",
          ]
          failures = []
          for key in sorted(grouped):
              kind, partitions, concurrency = key
              sides = grouped[key]
              if len(sides["baseline"]) != 3 or len(sides["candidate"]) != 3:
                  raise SystemExit(f"missing runs for {key}: {len(sides['baseline'])}/{len(sides['candidate'])}")
              bq = statistics.median(x["throughputPerSecond"] for x in sides["baseline"])
              cq = statistics.median(x["throughputPerSecond"] for x in sides["candidate"])
              bp = statistics.median(x["p99Us"] for x in sides["baseline"])
              cp = statistics.median(x["p99Us"] for x in sides["candidate"])
              scans = statistics.median(x["reclaimScans"] for x in sides["candidate"])
              visited = statistics.median(x["reclaimEntriesVisited"] for x in sides["candidate"])
              qdelta = (cq / bq - 1.0) * 100.0
              pdelta = (cp / bp - 1.0) * 100.0
              lines.append(
                  f"| {kind} | {partitions} | {concurrency} | {bq:.0f} | {cq:.0f} | {qdelta:+.1f}% | "
                  f"{bp:.2f} | {cp:.2f} | {pdelta:+.1f}% | {scans:.0f} | {visited:.0f} |")
              if kind == "rpc-recently-idle":
                  if cq < bq * 0.97:
                      failures.append(f"RPC c{concurrency} throughput regressed {qdelta:.1f}%")
                  if cp > bp * 1.03:
                      failures.append(f"RPC c{concurrency} P99 regressed {pdelta:.1f}%")

          lines.extend([
              "",
              "Gate: end-to-end partitioned unary throughput must not regress >3%; P99 must not regress >3%.",
              "Pool rows are attribution/contention evidence; expired-churn rows intentionally exercise the rare reconciliation path.",
          ])
          summary = "\n".join(lines) + "\n"
          Path("evidence/summary.md").write_text(summary)
          print(summary)
          if failures:
              print("\nGate failures:")
              for failure in failures:
                  print(f"- {failure}")
              raise SystemExit(1)
          PY

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-245-review-evidence
          path: evidence/
          if-no-files-found: error
