name: PR Quick

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      EVIDENCE_ROOT: ${{ runner.temp }}/issue252-experiment-a
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Experiment A paired gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          BASE_ROOT="$RUNNER_TEMP/issue252-a-base"

          git fetch --no-tags origin dev
          git worktree add --detach "$BASE_ROOT" origin/dev
          cp test/SharpLink.Benchmarks/PendingRequestCrossSegmentConcurrencyBenchmarks.cs \
             "$BASE_ROOT/test/SharpLink.Benchmarks/PendingRequestCrossSegmentConcurrencyBenchmarks.cs"

          echo "base_sha=$(git rev-parse origin/dev)"
          echo "candidate_merge_sha=$(git rev-parse HEAD)"

          python3 eng/issue252-experiment-a.py
          git diff --check
          git diff --stat

          dotnet test test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --nologo

          dotnet build "$BASE_ROOT/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj" -c Release -v minimal
          dotnet build test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release -v minimal

          run_variant() {
            local round="$1"
            local name="$2"
            local root="$3"
            local out="$EVIDENCE_ROOT/round${round}-${name}"
            mkdir -p "$out"
            (
              cd "$root"
              dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-build -- \
                --filter '*RuntimeHotPathBenchmarks.PendingRegisterAndComplete*' \
                --artifacts "$out/single" --exporters json
            ) | tee "$out/single.log"
            (
              cd "$root"
              dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-build -- \
                --filter '*PendingRequestCrossSegmentConcurrencyBenchmarks.RegisterAndCompleteAcrossFourSegments*' \
                --artifacts "$out/cross" --exporters json
            ) | tee "$out/cross.log"
          }

          run_variant 1 eager-dev "$BASE_ROOT"
          run_variant 1 experiment-a "$GITHUB_WORKSPACE"
          run_variant 2 experiment-a "$GITHUB_WORKSPACE"
          run_variant 2 eager-dev "$BASE_ROOT"
          run_variant 3 eager-dev "$BASE_ROOT"
          run_variant 3 experiment-a "$GITHUB_WORKSPACE"

          python3 - <<'PY'
          from pathlib import Path
          import json, os, re, statistics

          root = Path(os.environ['EVIDENCE_ROOT'])

          def mean_ns(path: Path) -> float:
              text = path.read_text()
              matches = re.findall(r'^Mean = ([0-9.]+) (ns|us|ms)', text, re.M)
              if not matches:
                  raise SystemExit(f'no BDN mean in {path}')
              value, unit = matches[-1]
              return float(value) * {'ns': 1.0, 'us': 1000.0, 'ms': 1_000_000.0}[unit]

          rounds = []
          for number in (1, 2, 3):
              base_single = mean_ns(root / f'round{number}-eager-dev' / 'single.log')
              cand_single = mean_ns(root / f'round{number}-experiment-a' / 'single.log')
              base_cross = mean_ns(root / f'round{number}-eager-dev' / 'cross.log')
              cand_cross = mean_ns(root / f'round{number}-experiment-a' / 'cross.log')
              rounds.append({
                  'round': number,
                  'base_single_ns': base_single,
                  'candidate_single_ns': cand_single,
                  'single_delta_percent': (cand_single / base_single - 1.0) * 100.0,
                  'base_cross_ns': base_cross,
                  'candidate_cross_ns': cand_cross,
                  'cross_delta_percent': (cand_cross / base_cross - 1.0) * 100.0,
              })

          single_deltas = [r['single_delta_percent'] for r in rounds]
          cross_deltas = [r['cross_delta_percent'] for r in rounds]
          median_single = statistics.median(single_deltas)
          median_cross = statistics.median(cross_deltas)
          single_within = sum(delta <= 3.0 for delta in single_deltas)
          cross_within = sum(delta <= 3.0 for delta in cross_deltas)
          passed = (
              median_single <= 3.0 and single_within >= 2 and
              median_cross <= 3.0 and cross_within >= 2
          )
          result = {
              'experiment': 'A-operation-local-slot-hoisting',
              'gate_percent': 3.0,
              'rounds': rounds,
              'median_single_delta_percent': median_single,
              'single_rounds_within_gate': single_within,
              'median_cross_delta_percent': median_cross,
              'cross_rounds_within_gate': cross_within,
              'passed': passed,
          }
          (root / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          print('EXPERIMENT_A_RESULT=' + json.dumps(result, separators=(',', ':')))
          if not passed:
              raise SystemExit('Experiment A missed the stable <=3% gate')
          PY

      - name: Upload Experiment A evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue252-experiment-a-rerun
          path: ${{ runner.temp }}/issue252-experiment-a
          if-no-files-found: warn
          retention-days: 30

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Verify Formatting
        run: dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Verify Generated Assemblies Do Not Reference Runtime
        run: ./eng/verify-generated-assembly-dependencies.sh

      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Generator Tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build

      - name: Load Test Tests
        run: dotnet test --project test/SharpLink.LoadTest.Tests/SharpLink.LoadTest.Tests.csproj -c Release --no-build

      - name: Integration Tests
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.IntegrationTests
          --
          --maximum-parallel-tests 1
          --timeout 120s

      - name: Run NativeAOT Transport and Topology Smoke
        env:
          SHARPLINK_AOT_RID: linux-x64
        run: ./eng/run-shared-memory-aot-process-smoke.sh

      - name: Pack
        run: dotnet pack Sharplink.slnx --no-build --no-restore -c Release -o artifacts/nuget -v minimal

      - name: Verify SDK Contains Generator
        run: unzip -l artifacts/nuget/SharpLink.Sdk.*.nupkg | grep -q 'analyzers/dotnet/cs/SharpLink.Generator.dll'

      - name: Verify package metadata, XML documentation, and symbols
        run: ./eng/verify-packages.sh artifacts/nuget

      - name: Verify Hosting direct Runtime dependency
        run: ./eng/verify-hosting-package-dependency.sh artifacts/nuget

      - name: Verify Abstractions has no DI dependency
        run: ./eng/verify-abstractions-package-dependency.sh artifacts/nuget

      - name: Restore Package Smoke
        run: dotnet restore test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj --force --no-cache --configfile test/SharpLink.PackageSmoke/NuGet.config
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

      - name: Run Package Smoke
        run: dotnet run -c Release --no-restore --project test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

      - name: Demo Oneway
        run: dotnet run -c Release --no-build --project demo/Oneway

      - name: Load Smoke
        run: dotnet run -c Release --no-build --project test/SharpLink.LoadTest -- --mode local --transport sharedmemory --operation add --concurrency 1,4 --warmup 2 --duration 5 --metrics-port 0

      - name: Chaos Smoke
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.ChaosTests
          --
          --duration-seconds 120
          --transport sharedmemory
          --concurrency 16
          --restart-interval-seconds 10
          --json-output artifacts/chaos/pr-smoke.json

      - name: Upload Chaos Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaos-pr-smoke
          path: |
            artifacts/chaos/pr-smoke.json
            artifacts/chaos/pr-smoke.dmp
            artifacts/chaos/pr-smoke.dmp.crashreport.json
          if-no-files-found: warn
