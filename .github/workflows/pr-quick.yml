name: PR Quick

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codec-compatibility:
    uses: ./.github/workflows/codec-compatibility.yml

  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Verify Formatting
        run: dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build Debug
        run: dotnet build Sharplink.slnx --no-restore -c Debug -v minimal

      - name: Build Release
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Verify Generated Assemblies Do Not Reference Runtime
        run: ./eng/verify-generated-assembly-dependencies.sh

      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Generator Tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build

      - name: Load Test Tests
        run: dotnet test --project test/SharpLink.LoadTest.Tests/SharpLink.LoadTest.Tests.csproj -c Release --no-build

      - name: Integration Tests
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.IntegrationTests
          --
          --maximum-parallel-tests 1
          --timeout 120s

      - name: Run NativeAOT Transport and Topology Smoke
        env:
          SHARPLINK_AOT_RID: linux-x64
        run: ./eng/run-shared-memory-aot-process-smoke.sh

      - name: Pack
        run: dotnet pack Sharplink.slnx --no-build --no-restore -c Release -o artifacts/nuget -v minimal

      - name: Verify SDK Contains Generator
        run: unzip -l artifacts/nuget/SharpLink.Sdk.*.nupkg | grep -q 'analyzers/dotnet/cs/SharpLink.Generator.dll'

      - name: Verify package metadata, XML documentation, and symbols
        run: ./eng/verify-packages.sh artifacts/nuget

      - name: Verify Hosting direct Runtime dependency
        run: ./eng/verify-hosting-package-dependency.sh artifacts/nuget

      - name: Verify Abstractions has no DI dependency
        run: ./eng/verify-abstractions-package-dependency.sh artifacts/nuget

      - name: Restore Package Smoke
        run: dotnet restore test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj --force --no-cache --configfile test/SharpLink.PackageSmoke/NuGet.config
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

      - name: Run Package Smoke
        run: dotnet run -c Release --no-restore --project test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

      - name: Demo Oneway
        run: dotnet run -c Release --no-build --project demo/Oneway

      - name: Load Smoke
        run: dotnet run -c Release --no-build --project test/SharpLink.LoadTest -- --mode local --transport sharedmemory --operation add --concurrency 1,4 --warmup 2 --duration 5 --metrics-port 0

      - name: Chaos Smoke
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.ChaosTests
          --
          --duration-seconds 120
          --transport sharedmemory
          --concurrency 16
          --restart-interval-seconds 10
          --json-output artifacts/chaos/pr-smoke.json

      - name: Upload Chaos Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaos-pr-smoke
          path: |
            artifacts/chaos/pr-smoke.json
            artifacts/chaos/pr-smoke.dmp
            artifacts/chaos/pr-smoke.dmp.crashreport.json
          if-no-files-found: warn

  handshake-default-evidence:
    if: github.event_name == 'pull_request' && github.head_ref == 'issue-250-handshake-default-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      SHARPLINK_BENCHMARK_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj

      - name: Record environment
        shell: bash
        run: |
          mkdir -p artifacts/issue-250
          dotnet --info > artifacts/issue-250/dotnet-info.txt
          uname -a > artifacts/issue-250/uname.txt
          lscpu > artifacts/issue-250/cpu.txt

      - name: Run candidate matrix
        run: >-
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          -c Release --no-restore --
          --handshake-default-evidence
          artifacts/issue-250/handshake-default-evidence.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-250-handshake-evidence-${{ github.event.pull_request.head.sha }}
          path: artifacts/issue-250
          if-no-files-found: warn
          retention-days: 30

  issue-250-doc-finalize:
    if: github.event_name == 'pull_request' && github.head_ref == 'issue-250-handshake-default-evidence'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Finalize README and CHANGELOG
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = readme.replace(
              'https://img.shields.io/badge/MIT-yellow.svg',
              'https://img.shields.io/badge/License-MIT-yellow.svg')
          readme = readme.replace(
              '- `SharpLink.Generator`：契约/服务分析器和代码生成',
              '- `SharpLink.Generator`：契约/服务分析器与 `Proxy/Stub` 代码生成')
          readme_path.write_text(readme)

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          bullet = (
              '- Server connection admission now defaults to an independent 64-concurrent '
              'pre-auth handshake bound (TLS → Protocol v2 → application authentication), '
              'clamped by a lower `MaxConcurrentConnections`. Explicit '
              '`MaxConcurrentHandshakes = 0` remains the opt-out that restores the previous '
              'follow-the-connection-bound behavior; the live-connection default remains 1,024 '
              'and Protocol v2/wire behavior is unchanged.\n'
          )
          if bullet not in changelog:
              anchor = '## [Unreleased]\n\n### Changed\n\n'
              if changelog.count(anchor) != 1:
                  raise SystemExit('Unexpected Unreleased/Changed anchor')
              changelog = changelog.replace(anchor, anchor + bullet + '\n', 1)
              changelog_path.write_text(changelog)
          PY

      - name: Commit finalized docs
        shell: bash
        run: |
          git add README.md CHANGELOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'docs: record secure handshake admission default'
          git push origin HEAD:${{ github.head_ref }}
