name: PR742 integration preflight
on:
  push:
    branches: [work/742-integration-preflight-20261004]
permissions:
  contents: read
jobs:
  dispatch-integrated-extended:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch existing PR Extended on the checked integrated branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/SunSi12138/SharpLink
          expected=885306c66ee2e61c6fdd400bc52e2143aa48d6db
          current="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api/git/ref/heads/perf/735-resolved-flow-state" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "$current" = "$expected"
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "$api/actions/workflows/pr-extended.yml/dispatches" --data '{"ref":"perf/735-resolved-flow-state"}'
          printf 'Dispatched existing PR Extended once on integrated PR742 head `%s`; PR remains Draft.\n' "$current" >> "$GITHUB_STEP_SUMMARY"
