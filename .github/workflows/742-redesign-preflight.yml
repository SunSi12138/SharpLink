name: 742 Lifecycle and Admission Redesign
on:
  push:
    branches: ['perf/735-preflight-flags']
    paths:
      - '.github/workflows/742-redesign-preflight.yml'
      - 'eng/preflight-742-redesign/**'
permissions:
  contents: read
concurrency:
  group: 742-lifecycle-redesign
  cancel-in-progress: false
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_PROCESSOR_COUNT: '4'
      TUNIT_MAX_PARALLEL_TESTS: '8'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Reconstruct exact control and integrated source
        run: |
          set -euo pipefail
          python3 eng/preflight-742-redesign/prepare.py "$RUNNER_TEMP/redesign" --patches "$PWD"/eng/preflight-742-redesign/{send,receive,tail}.patch
          echo "CONTROL_ROOT=$RUNNER_TEMP/redesign/control" >> "$GITHUB_ENV"
          echo "CANDIDATE_ROOT=$RUNNER_TEMP/redesign/candidate" >> "$GITHUB_ENV"
          echo "OUT=$PWD/artifacts/redesign-correctness" >> "$GITHUB_ENV"
          mkdir -p artifacts/redesign-correctness
          cp "$RUNNER_TEMP/redesign/identities.json" artifacts/redesign-correctness/
          dotnet --info > artifacts/redesign-correctness/dotnet.txt
      - name: Pristine control lifecycle allocation baseline
        run: |
          set -euo pipefail
          dotnet build "$CONTROL_ROOT/test/SharpLink.UnitTests" -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true > "$OUT/pristine-control-build.log" 2>&1 || { cat "$OUT/pristine-control-build.log"; exit 1; }
          python3 eng/preflight-742-redesign/lifecycle.py control "$CONTROL_ROOT" "$OUT"
      - name: Preserve deterministic original registry and admission failures
        run: |
          set -euo pipefail
          python3 eng/preflight-742-redesign/negative-controls.py "$CONTROL_ROOT" "$CANDIDATE_ROOT" "$OUT"
      - name: Build exact final source and run all default engineering gates
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ROOT"
          git diff --exit-code -- src test
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true > "$OUT/final-build.log" 2>&1 || { cat "$OUT/final-build.log"; exit 1; }
          mapfile -t changed < <(git diff --cached --name-only -- src test)
          dotnet format whitespace test/SharpLink.UnitTests/SharpLink.UnitTests.csproj --no-restore --verify-no-changes --include "${changed[@]}" 2>&1 | tee "$OUT/format.log"
          python3 eng/check-project-reference-boundaries.py 2>&1 | tee "$OUT/references.log"
          bash eng/check-maintainability.sh 2>&1 | tee "$OUT/maintainability.log"
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU 2>&1 | tee "$OUT/default-unit.log"
      - name: Compare complete candidate lifecycle allocation without test hooks
        run: |
          set -euo pipefail
          python3 eng/preflight-742-redesign/lifecycle.py candidate "$CANDIDATE_ROOT" "$OUT"
      - name: Compare emitted closed state machine layouts
        run: |
          set -euo pipefail
          dotnet run -c Release --project eng/preflight-742-redesign/layout/layout.csproj -- "$CONTROL_ROOT" "$CANDIDATE_ROOT" > "$OUT/layout.txt"
          cat "$OUT/layout.txt"
      - name: Original single-consumption and suspended consumer negative controls
        run: |
          set -euo pipefail
          python3 eng/preflight-742-redesign/ownership-controls.py "$CANDIDATE_ROOT" "$OUT"
      - name: Restore exact source and original deterministic allocation gate
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ROOT"
          git diff --exit-code -- src test
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true > "$OUT/restored-build.log" 2>&1 || { cat "$OUT/restored-build.log"; exit 1; }
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU -- --treenode-filter '/*/*/ClientStreamValueTaskConsumptionTests/*' 2>&1 | tee "$OUT/consumption-final.log"
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU -- --treenode-filter '/*/*/PooledDispatcherSlowWaitTests/*' 2>&1 | tee "$OUT/wait-final.log"
          dotnet build test/SharpLink.Benchmarks -c Release -p:Platform=AnyCPU -p:PublishAot=false -p:TreatWarningsAsErrors=true > "$OUT/benchmark-build.log" 2>&1 || { cat "$OUT/benchmark-build.log"; exit 1; }
          SHARPLINK_ALLOCATION_OUTPUT="$OUT/allocation-gate.json" bash eng/run-allocation-gate.sh 2>&1 | tee "$OUT/allocation-gate.log"
      - name: Original ready-writer checks and full experimental suite
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ROOT"
          python3 eng/test-ready-writer.py
          python3 eng/test-ready-writer-budget.py
          python3 eng/test-ready-writer-collection.py
          python3 eng/test-ready-writer-native.py
          python3 eng/prepare-ready-writer.py --apply
          dotnet build test/SharpLink.Benchmarks -c Release -p:ReadyWriterExperiment=true -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true > "$OUT/writer-build.log" 2>&1 || { cat "$OUT/writer-build.log"; exit 1; }
          dotnet test/SharpLink.Benchmarks/bin/Release/net10.0/SharpLink.Benchmarks.dll --ready-writer-self-test 2>&1 | tee "$OUT/writer-checks.log"
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true > "$OUT/experimental-build.log" 2>&1 || { cat "$OUT/experimental-build.log"; exit 1; }
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU 2>&1 | tee "$OUT/experimental-unit.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: 742-redesign-correctness-${{ github.sha }}
          path: |
            artifacts/redesign-correctness
            ${{ runner.temp }}/redesign/candidate/artifacts/first-receive-integration
          if-no-files-found: error
          retention-days: 30

  integrated-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DOTNET_PROCESSOR_COUNT: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Freeze actual dev, prior candidate and integrated candidate
        run: |
          set -euo pipefail
          python3 eng/preflight-742-redesign/prepare.py "$RUNNER_TEMP/redesign" --include-dev --patches "$PWD"/eng/preflight-742-redesign/{send,receive,tail}.patch
          mkdir -p artifacts/redesign-screen
          cp "$RUNNER_TEMP/redesign/identities.json" artifacts/redesign-screen/
          dotnet --info > artifacts/redesign-screen/dotnet.txt
          lscpu > artifacts/redesign-screen/cpu.txt
          for label in dev control candidate; do
            root="$RUNNER_TEMP/redesign/$label"
            for project in SharpLink.Benchmarks SharpLink.StreamLoadTest; do
              dotnet build "$root/test/$project" -c Release -p:PublishAot=false -m:1 /nodeReuse:false > "artifacts/redesign-screen/build-$label-$project.log" 2>&1 || { cat "artifacts/redesign-screen/build-$label-$project.log"; exit 1; }
            done
          done
      - name: Predeclared untraced whole-design screen
        run: |
          set -euo pipefail
          python3 eng/preflight-742-redesign/screen.py "$RUNNER_TEMP/redesign/dev" "$RUNNER_TEMP/redesign/control" "$RUNNER_TEMP/redesign/candidate" artifacts/redesign-screen/raw
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: 742-redesign-screen-${{ github.sha }}
          path: artifacts/redesign-screen
          if-no-files-found: error
          retention-days: 30

  original-micro-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runtime: [pgo0, pgo1, native]
    env:
      DOTNET_PROCESSOR_COUNT: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Reconstruct original micro arms and host metadata
        run: |
          set -euo pipefail
          python3 eng/preflight-742-redesign/prepare.py "$RUNNER_TEMP/redesign" --include-dev --patches "$PWD"/eng/preflight-742-redesign/{send,receive,tail}.patch
          mkdir -p artifacts/redesign-micro
          cp "$RUNNER_TEMP/redesign/identities.json" artifacts/redesign-micro/
          dotnet --info > artifacts/redesign-micro/dotnet.txt
          lscpu > artifacts/redesign-micro/cpu.txt
          for label in control candidate; do
            root="$RUNNER_TEMP/redesign/$label"
            if [[ '${{ matrix.runtime }}' == native ]]; then
              dotnet publish "$root/test/SharpLink.ResolvedFlowStateAotEvidence" -c Release -r linux-x64 -p:PublishAot=true -p:StripSymbols=false -o "$root/artifacts/redesign-native" > "artifacts/redesign-micro/build-$label.log" 2>&1 || { cat "artifacts/redesign-micro/build-$label.log"; exit 1; }
            else
              dotnet build "$root/test/SharpLink.Benchmarks" -c Release -p:PublishAot=false -m:1 /nodeReuse:false > "artifacts/redesign-micro/build-$label.log" 2>&1 || { cat "artifacts/redesign-micro/build-$label.log"; exit 1; }
            fi
          done
      - name: Unchanged complete key and resolved matrix with balanced independent repeats
        run: |
          set -euo pipefail
          python3 eng/preflight-742-redesign/micro.py "$RUNNER_TEMP/redesign/control" "$RUNNER_TEMP/redesign/candidate" artifacts/redesign-micro/raw --runtime '${{ matrix.runtime }}'
      - name: Build identical actual NativeAOT RPC hosts
        if: matrix.runtime == 'native'
        run: |
          set -euo pipefail
          python3 eng/preflight-735-prepare-native-rpc.py "$RUNNER_TEMP/redesign/dev" "$RUNNER_TEMP/redesign/control" artifacts/redesign-micro/native-host-dc
          python3 eng/preflight-735-prepare-native-rpc.py "$RUNNER_TEMP/redesign/control" "$RUNNER_TEMP/redesign/candidate" artifacts/redesign-micro/native-host-cn
          for label in dev control candidate; do
            root="$RUNNER_TEMP/redesign/$label"
            dotnet publish "$root/test/SharpLink.FirstReceiveRpcEvidence" -c Release -r linux-x64 -p:PublishAot=true -p:StripSymbols=false -o "$root/artifacts/redesign-native-rpc" > "artifacts/redesign-micro/native-rpc-build-$label.log" 2>&1 || { cat "artifacts/redesign-micro/native-rpc-build-$label.log"; exit 1; }
            sha256sum "$root/artifacts/redesign-native-rpc/SharpLink.Benchmarks" >> artifacts/redesign-micro/native-binaries.sha256
            nm "$root/artifacts/redesign-native-rpc/SharpLink.Benchmarks" > "artifacts/redesign-micro/native-symbols-$label.txt"
            python3 eng/preflight-742-redesign/disassemble.py "$root/artifacts/redesign-native-rpc/SharpLink.Benchmarks" "artifacts/redesign-micro/native-code-$label.txt"
          done
      - name: Actual NativeAOT short and duplex RPC screen
        if: matrix.runtime == 'native'
        run: |
          set -euo pipefail
          python3 eng/preflight-742-redesign/screen.py "$RUNNER_TEMP/redesign/dev" "$RUNNER_TEMP/redesign/control" "$RUNNER_TEMP/redesign/candidate" artifacts/redesign-micro/native-rpc --runtime native
      - name: Original NativeAOT ready-writer correctness on integrated source
        if: matrix.runtime == 'native'
        run: |
          set -euo pipefail
          out="$PWD/artifacts/redesign-micro"
          cd "$RUNNER_TEMP/redesign/candidate"
          python3 eng/prepare-ready-writer.py --apply
          dotnet publish test/SharpLink.ReadyWriterAotEvidence -c Release -r linux-x64 -p:PublishAot=true -p:StripSymbols=false -o "$out/ready-native" > "$out/ready-native-build.log" 2>&1 || { cat "$out/ready-native-build.log"; exit 1; }
          "$out/ready-native/SharpLink.Benchmarks" --ready-writer-self-test 2>&1 | tee "$out/ready-native-checks.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: 742-redesign-${{ matrix.runtime }}-${{ github.sha }}
          path: artifacts/redesign-micro
          if-no-files-found: error
          retention-days: 30
