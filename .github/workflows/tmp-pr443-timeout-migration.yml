name: tmp-pr443-timeout-migration

on:
  push:
    branches:
      - fix/282-explicit-timeout-policy
    paths:
      - .github/workflows/tmp-pr443-timeout-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/282-explicit-timeout-policy
          fetch-depth: 0

      - name: Migrate first-party integration and smoke builders
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [
              Path('test/SharpLink.IntegrationTests'),
              Path('test/SharpLink.PackageSmoke'),
              Path('test/SharpLink.ReferenceRooting.PackageClient'),
              Path('test/SharpLink.AotSmoke'),
              Path('test/SharpLink.PreCreditAotSmoke'),
          ]
          builders = (
              'SharpClientBuilder.Create()',
              'SharpLinkMultiClusterClientBuilder.Create()',
          )
          policies = ('.DisableRequestTimeout()', '.UseRequestTimeout(')

          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob('*.cs')):
                  text = path.read_text(encoding='utf-8')
                  original = text
                  for builder in builders:
                      start = 0
                      while True:
                          idx = text.find(builder, start)
                          if idx < 0:
                              break
                          after = idx + len(builder)
                          semi = text.find(';', after)
                          if semi < 0:
                              semi = min(len(text), after + 2000)
                          statement = text[after:semi]
                          if not any(policy in statement for policy in policies):
                              text = text[:after] + '.DisableRequestTimeout()' + text[after:]
                              start = after + len('.DisableRequestTimeout()')
                          else:
                              start = after
                  if text != original:
                      path.write_text(text, encoding='utf-8')
                      changed.append(str(path))

          print(f'changed {len(changed)} files')
          for path in changed:
              print(path)
          PY

          git diff --check
          if git diff --quiet; then
            echo "No migration changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/SharpLink.IntegrationTests test/SharpLink.PackageSmoke test/SharpLink.ReferenceRooting.PackageClient test/SharpLink.AotSmoke test/SharpLink.PreCreditAotSmoke
          git commit -m "test: select explicit request timeout policies"
          git push origin HEAD:fix/282-explicit-timeout-policy
