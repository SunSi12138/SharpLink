name: Thirteen ordinary five-additional-case fixture validation
permissions:
  contents: read
on:
  push:
    branches: ['validation/five-case-fixtures-20261105']
    paths:
      - '.github/workflows/pure-failure-diagnostic.yml'
      - 'eng/run-pure-failure-diagnostic.py'
      - 'eng/tests/test_pure_failure_diagnostic.py'
      - 'eng/rebase-three-fixture-census.py'
      - 'eng/tests/test_three_fixture_census.py'
      - 'eng/three-fixture-census-rebase.json'
      - 'eng/fixture-migration-baseline/**'
      - 'eng/unit-census.json'
      - 'eng/unit-execution-results.py'
      - 'test/SharpLink.UnitTests/Protocol/ProtocolV2Tests.cs'
      - 'test/SharpLink.UnitTests/Runtime/SendPumpProgressIsolationTests.cs'
      - 'src/SharpLink.Runtime/OwnedFrame.cs'
      - 'test/SharpLink.UnitTests/Runtime/Stack13FrameClearTests.cs'
concurrency:
  group: five-case-fixture-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-thirteen:
    runs-on: ubuntu-24.04
    # Original preparation3600; thirteen-case phase1500; overall5100 seconds.
    timeout-minutes: 110
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup isolated pinned SDK
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/five-case-fixtures-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.114'
      - name: Verify bound candidate product and tests
        shell: bash
        run: |
          test "$(git rev-parse HEAD:src)" = "c3a94c896418a5d5ec62646461f17c67dc89bc96"
          test "$(git rev-parse HEAD:test)" = "6052d7b2a52946f8d9048e76287167768f13c673"
      - name: One build, two metadata discoveries, thirteen fresh exact UIDs
        run: python3 eng/run-pure-failure-diagnostic.py --configuration Release
