name: Issue 252 Cross Segment Evidence

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      EVIDENCE_ROOT: ${{ github.workspace }}/artifacts/issue252-cross-segment-evidence
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Prepare eager baseline and final candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          git fetch --no-tags origin dev
          BASE_SHA="$(git rev-parse origin/dev)"
          CANDIDATE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          printf '%s\n' "$BASE_SHA" > "$EVIDENCE_ROOT/base-sha.txt"
          printf '%s\n' "$CANDIDATE_SHA" > "$EVIDENCE_ROOT/candidate-sha.txt"

          git worktree add --detach "$RUNNER_TEMP/issue252-base" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/issue252-candidate" "$CANDIDATE_SHA"

          cp "$RUNNER_TEMP/issue252-candidate/test/SharpLink.Benchmarks/PendingRequestCrossSegmentConcurrencyBenchmarks.cs" \
             "$RUNNER_TEMP/issue252-base/test/SharpLink.Benchmarks/PendingRequestCrossSegmentConcurrencyBenchmarks.cs"

      - name: Collect paired benchmark evidence
        shell: bash
        run: |
          set -euo pipefail

          run_variant() {
            local name="$1"
            local root="$2"
            local out="$EVIDENCE_ROOT/$name"
            local project="$root/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj"
            mkdir -p "$out"

            echo "=== $name: build ==="
            dotnet build "$project" -c Release -v minimal

            echo "=== $name: single-thread pending hot path ==="
            (
              cd "$root"
              dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-build -- \
                --filter '*RuntimeHotPathBenchmarks.PendingRegisterAndComplete*' \
                --artifacts "$out/single-thread" \
                --exporters json
            ) | tee "$out/single-thread.log"

            echo "=== $name: 1024-in-flight cross-segment concurrency ==="
            (
              cd "$root"
              dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-build -- \
                --filter '*PendingRequestCrossSegmentConcurrencyBenchmarks.RegisterAndCompleteAcrossFourSegments*' \
                --artifacts "$out/cross-segment" \
                --exporters json
            ) | tee "$out/cross-segment.log"
          }

          run_variant eager-dev "$RUNNER_TEMP/issue252-base"
          run_variant final-segmented "$RUNNER_TEMP/issue252-candidate"

      - name: Upload cross-segment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue252-cross-segment-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/issue252-cross-segment-evidence
          if-no-files-found: error
          retention-days: 30
