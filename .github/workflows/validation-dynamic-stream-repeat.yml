name: Dynamic stream bounded repeat diagnosis
on:
  workflow_dispatch:
  push:
    branches:
      - 'validation/dynamic-stream-repeat-20261104'
    paths:
      - '.github/workflows/validation-dynamic-stream-repeat.yml'
      - 'eng/dynamic-stream-repeat/CI.json'
      - 'eng/dynamic-stream-repeat/SOURCE.json'
      - 'eng/dynamic-stream-repeat/StreamExitStage.cs'
      - 'eng/dynamic-stream-repeat/error_graph.py'
      - 'eng/dynamic-stream-repeat/owner_probe.py'
      - 'eng/dynamic-stream-repeat/prepare.py'
      - 'eng/dynamic-stream-repeat/process_owner.py'
      - 'eng/dynamic-stream-repeat/results.py'
      - 'eng/dynamic-stream-repeat/run.py'
      - 'eng/dynamic-stream-repeat/plan.py'
      - 'eng/dynamic-stream-repeat/test_repeat.py'
      - 'eng/dynamic-stream-repeat/test_preimage/RuntimeAssemblyIntegrationTests.RegistrationAndReplacement.cs'
      - 'eng/dynamic-stream-repeat/test_preimage/RuntimeAssemblyIntegrationTests.Support.cs'
      - 'eng/dynamic-stream-repeat/test_preimage/RuntimeAssemblyIntegrationTests.cs'
      - 'eng/dynamic-stream-repeat/test_short.py'
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Exact reviewed payload manifest
        run: python3 -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('eng/dynamic-stream-repeat/CI.json').read_bytes()).hexdigest() == 'fa79026496ad628b1ed7800ef4ceb9e6d97bc46fe70e554be65ad2ad7918097a'"
      - name: Source/schema/owner negative controls
        run: python3 -B -m unittest discover -s eng/dynamic-stream-repeat -p 'test_*.py'
      - name: Finite harmless Linux owner probes (not .NET tests)
        run: python3 -B eng/dynamic-stream-repeat/owner_probe.py
  repeated-cases:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9d1635c8988870ee295098fe9e65cb49924013d2
          path: selected-main
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Exact reviewed payload manifest
        working-directory: validation
        run: python3 -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('eng/dynamic-stream-repeat/CI.json').read_bytes()).hexdigest() == 'fa79026496ad628b1ed7800ef4ceb9e6d97bc46fe70e554be65ad2ad7918097a'"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: selected-main/global.json
      - name: 100 rounds of three original-semantics cases; incomplete is failure
        working-directory: selected-main
        run: python3 -B ../validation/eng/dynamic-stream-repeat/run.py "$PWD"
      # Raw output, stage records, private graphs and reports are intentionally not uploaded.
