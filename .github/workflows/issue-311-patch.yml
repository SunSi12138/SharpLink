name: Issue 311 Patch

on:
  push:
    branches:
      - fix/311-codec-scope-routing

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/311-codec-scope-routing
      - name: Apply focused source edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          dto = 'src/SharpLink.Generator/RpcGenerator.DtoAnalysis.cs'
          replace_once(dto,
              '    private sealed class DtoAnalysisState\n',
              '    private sealed partial class DtoAnalysisState\n')
          replace_once(dto,
              '            CollectAdapterRegistrations();\n            CollectAssemblyBindings();\n',
              '            CollectAdapterRegistrations();\n            CollectAssemblyBindings();\n            CollectAssemblyRoutes();\n')
          replace_once(dto,
              '''                if (_compilation.GetAssemblyOrModuleSymbol(reference) is not IAssemblySymbol assembly ||
                    !_allowedAssemblyNames.Contains(assembly.Identity.Name))
''',
              '''                if (_compilation.GetAssemblyOrModuleSymbol(reference) is not IAssemblySymbol assembly ||
                    !_allowedAssemblyNames.Contains(assembly.Identity.Name) ||
                    HasGeneratedAssemblyManifest(assembly))
''')
          replace_once(dto,
              '''            if (TrySelectAdapter(type, out var adapter))
            {
                if (adapter is not null)
                {
                    _models[typeName] = new GeneratedCodecModel(
                        typeName,
                        GetCodecName(typeName),
                        GetSchemaId(typeName, adapter.WireFormatId),
                        GeneratedCodecKind.Adapter,
                        type.IsReferenceType,
                        ImmutableArray<GeneratedMemberModel>.Empty,
                        ImmutableArray<string>.Empty,
                        null,
                        null,
                        null,
                        GetTypeName(adapter.AdapterType),
                        adapter.AdapterId,
                        adapter.WireFormatId,
                        GetAssemblyDependencies([type]),
                        type.Locations.FirstOrDefault());
                }
                return;
            }
''',
              '''            if (TrySelectAdapter(type, out var adapter))
            {
                if (adapter is not null)
                    AddAdapterModel(type, typeName, adapter);
                return;
            }
            if (TrySelectRouteAdapter(type, out var routedAdapter))
            {
                if (routedAdapter is not null)
                    AddAdapterModel(type, typeName, routedAdapter);
                return;
            }
''')

          analysis = 'src/SharpLink.Generator/RpcGenerator.Analysis.cs'
          replace_once(analysis,
              '                        IsInlineFixedRpcType(p.Type),\n',
              '                        IsInlineFixedRpcType(p.Type) && !HasNativeCodecRoute(symbol.ContainingAssembly),\n')

          routes = 'src/SharpLink.Generator/RpcGenerator.CodecRoutes.cs'
          replace_once(routes,
              '    private static bool HasNativeCodecRoute(IAssemblySymbol assembly)\n',
              '''    private static bool HasGeneratedAssemblyManifest(IAssemblySymbol assembly)
        => assembly.GetAttributes().Any(static attribute =>
            string.Equals(
                attribute.AttributeClass?.ToDisplayString(),
                GeneratedAssemblyManifestAttributeMetadataName,
                StringComparison.Ordinal));

    private static bool HasNativeCodecRoute(IAssemblySymbol assembly)
''')

          provider = 'src/SharpLink.Runtime/Codec/RpcCodecProvider.cs'
          replace_once(provider,
              '''    [MethodImpl(MethodImplOptions.AggressiveInlining)]
    public IRpcCodec<T> GetCodec<T>()
    {
        ObjectDisposedException.ThrowIf(Volatile.Read(ref _disposed) != 0, this);

        if (SharedRpcCodec<T>.Instance is { } shared)
            return shared;

        var targetType = typeof(T);
        if (_resolvedCodecs.TryGetValue(targetType, out var fastCached))
        {
            if (fastCached.IsExplicit)
                return Cast<T>(fastCached.Codec);
            var fastSnapshot = Volatile.Read(ref _generatedRegistrationSnapshot);
            if (ReferenceEquals(fastCached.SnapshotIdentity, fastSnapshot.Identity))
                return Cast<T>(fastCached.Codec);
        }

        return ResolveCodec<T>(targetType);
    }
''',
              '''    [MethodImpl(MethodImplOptions.AggressiveInlining)]
    public IRpcCodec<T> GetCodec<T>()
    {
        ObjectDisposedException.ThrowIf(Volatile.Read(ref _disposed) != 0, this);

        var targetType = typeof(T);
        if (_resolvedCodecs.TryGetValue(targetType, out var fastCached))
        {
            if (fastCached.IsExplicit)
                return Cast<T>(fastCached.Codec);
            var fastSnapshot = Volatile.Read(ref _generatedRegistrationSnapshot);
            if (ReferenceEquals(fastCached.SnapshotIdentity, fastSnapshot.Identity))
                return Cast<T>(fastCached.Codec);
        }

        var snapshot = Volatile.Read(ref _generatedRegistrationSnapshot);
        if (!snapshot.Registrations.ContainsKey(targetType) && SharedRpcCodec<T>.Instance is { } shared)
            return shared;

        return ResolveCodec<T>(targetType);
    }
''')

          forwarding = 'test/SharpLink.UnitTests/SdkTypeForwardingTests.cs'
          replace_once(forwarding,
              '''        "SharpLink.Sdk.RpcCodecAdapterRegistrationAttribute",
        "SharpLink.Sdk.RpcContractAttribute",
''',
              '''        "SharpLink.Sdk.RpcCodecAdapterRegistrationAttribute",
        "SharpLink.Sdk.RpcCodecRouteAttribute",
        "SharpLink.Sdk.RpcCodecScope",
        "SharpLink.Sdk.RpcContractAttribute",
''')
          replace_once(forwarding,
              '            "SDK should expose exactly the contract types published in 1.0.0 as forwarders");\n',
              '            "SDK should expose exactly the published contract types as forwarders");\n')
          PY
          git diff --check
      - name: Commit focused edits and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/issue-311-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test
          git commit -m 'Integrate compile-time codec scope routing'
          git push origin HEAD:fix/311-codec-scope-routing
