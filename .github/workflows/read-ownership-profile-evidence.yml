name: Read Ownership One-Pass EventPipe Diagnosis

on:
  push:
    branches:
      - 'perf/pr753-read-ownership-opt-d33136386d56'
    paths:
      - '.github/workflows/read-ownership-profile-evidence.yml'
      - 'eng/profile-753/**'

permissions:
  contents: read

jobs:
  bounded-profile-pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout isolated diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.112

      - name: Record environment and immutable harness sources
        shell: bash
        run: |
          mkdir -p artifacts/profile-753/preflight artifacts/profile-753/harness
          dotnet --info > artifacts/profile-753/preflight/dotnet-info.txt
          uname -a > artifacts/profile-753/preflight/uname.txt
          lscpu > artifacts/profile-753/preflight/cpu.txt
          free -b > artifacts/profile-753/preflight/memory.txt
          ps -eo pid,comm,args > artifacts/profile-753/preflight/processes.txt
          git rev-parse HEAD > artifacts/profile-753/preflight/harness-commit.txt
          printf 'run=%s\nattempt=%s\nrunner=%s\nimage=%s\nimage_version=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_ENVIRONMENT" \
            "$ImageOS" "$ImageVersion" > artifacts/profile-753/preflight/runner.txt
          git ls-files eng/profile-753 .github/workflows/read-ownership-profile-evidence.yml \
            eng/perf/run-read-ownership.py eng/perf/summarize-read-ownership.py \
            eng/perf/test-read-ownership-harness.py | while IFS= read -r file; do
              cp --parents "$file" artifacts/profile-753/harness/
              sha256sum "$file"
            done > artifacts/profile-753/preflight/harness-sha256.txt

      - name: Test runner gates and install pinned official trace tool
        shell: bash
        run: |
          python3 eng/profile-753/test-runner.py 2>&1 | tee artifacts/profile-753/preflight/runner-tests.log
          python3 eng/perf/test-read-ownership-harness.py 2>&1 | tee artifacts/profile-753/preflight/formal-validator-tests.log
          dotnet tool install dotnet-trace --version 10.0.745401 --tool-path "$RUNNER_TEMP/pr753-tools" \
            2>&1 | tee artifacts/profile-753/preflight/tool-install.log
          "$RUNNER_TEMP/pr753-tools/dotnet-trace" --version > artifacts/profile-753/preflight/tool-version.txt

      - name: Build pinned parser and calibration
        shell: bash
        run: |
          dotnet build eng/profile-753/parser/ProfileParser.csproj -c Release -v minimal -m:1 -nr:false \
            -p:UseSharedCompilation=false 2>&1 | tee artifacts/profile-753/preflight/parser-build.log
          dotnet build eng/profile-753/calibration/Calibration.csproj -c Release -v minimal -m:1 -nr:false \
            -p:UseSharedCompilation=false 2>&1 | tee artifacts/profile-753/preflight/calibration-build.log
          find eng/profile-753/parser/bin eng/profile-753/calibration/bin -type f -print0 | \
            sort -z | xargs -0 sha256sum > artifacts/profile-753/preflight/parser-calibration-binary-sha256.txt
          cp eng/profile-753/parser/obj/project.assets.json artifacts/profile-753/preflight/parser-assets.json
          cp eng/profile-753/calibration/obj/project.assets.json artifacts/profile-753/preflight/calibration-assets.json
          dotnet eng/profile-753/parser/bin/Release/net10.0/ProfileParser.dll --self-test \
            2>&1 | tee artifacts/profile-753/preflight/parser-tests.log

      - name: Calibrate before the single bounded eighteen-process series
        shell: bash
        run: |
          python3 eng/profile-753/run.py \
            --manifest eng/profile-753/revisions.json \
            --output "$GITHUB_WORKSPACE/artifacts/profile-753/evidence" \
            --work "$RUNNER_TEMP/pr753-profile-arms" \
            --trace "$RUNNER_TEMP/pr753-tools/dotnet-trace" \
            --parser "$GITHUB_WORKSPACE/eng/profile-753/parser/bin/Release/net10.0/ProfileParser.dll" \
            --calibration "$GITHUB_WORKSPACE/eng/profile-753/calibration/bin/Release/net10.0/Calibration.dll"

      - name: Publish diagnostic completion summary
        shell: bash
        run: cat artifacts/profile-753/evidence/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package lossless transfer parts below the download cap
        if: always()
        shell: bash
        run: python3 eng/profile-753/package.py artifacts/profile-753 artifacts/profile-753-parts

      - name: Preserve all original evidence even if collection or packaging failed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: read-ownership-profile-full-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/profile-753
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Upload transfer index
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: read-ownership-profile-index-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/profile-753-parts/index.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload transfer part 00 when present
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: read-ownership-profile-part00-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/profile-753-parts/evidence.part00
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload transfer part 01 when present
