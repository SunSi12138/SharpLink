name: Issue 287 review5 format finalize

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.event.pull_request.head.ref == 'issue-287-call-control-cleanup' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-287-call-control-cleanup
          fetch-depth: 0
      - name: Guard branch head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/issue-287-call-control-cleanup | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
      - name: Apply lifecycle repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/issue-287-review5-format.py
          git diff --check
      - name: Commit real source
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git rm -f .github/issue-287-review5-format.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: repair client stream decode deadline gate'
          remote_head="$(git ls-remote origin refs/heads/issue-287-call-control-cleanup | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git push origin HEAD:issue-287-call-control-cleanup
