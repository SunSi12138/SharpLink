name: Issue 285 Apply Registration Arm Fix

permissions:
  contents: write

on:
  push:
    branches:
      - agent/issue-285-deadline-final-arm-race
  pull_request:
    branches:
      - dev

jobs:
  patch:
    if: github.event_name == 'pull_request' || github.event.head_commit.message != 'fix(client): reconcile concurrent deadline arms'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/issue-285-deadline-final-arm-race
          fetch-depth: 0

      - name: Apply narrow source patch and self-delete workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/SharpLink.Client/PendingRequestTable.cs')
          text = path.read_text(encoding='utf-8')
          old = '''            Interlocked.Increment(ref _deadlineScheduleVersion);\n            ArmDeadlineTimer(deadlineTimestamp);\n            return;\n'''
          new = '''            var version = Interlocked.Increment(ref _deadlineScheduleVersion);\n            ArmDeadlineTimer(deadlineTimestamp);\n            if (Volatile.Read(ref _deadlineScheduleVersion) != version)\n                ReconcileDeadlineTimer();\n            return;\n'''
          if old not in text:
              raise SystemExit('expected UpdateEarliestDeadline source shape not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/issue-285-apply-registration-arm-fix.yml').unlink()

      - name: Commit source patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(client): reconcile concurrent deadline arms'
          git push origin HEAD:agent/issue-285-deadline-final-arm-race
