name: Temporary AOT UnsafeBlit Plan Fix

on:
  push:
    branches:
      - feature/issue-396-deterministic-rpc-identity
    paths:
      - .github/workflows/temp-aot-unsafe-blit-plan-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/issue-396-deterministic-rpc-identity
          fetch-depth: 0

      - name: Apply resolved-plan NativeAOT fix
        run: python3 .github/temp-aot-unsafe-blit-plan-fix.py

      - name: Commit final patch
        shell: bash
        run: |
          rm .github/workflows/temp-aot-unsafe-blit-plan-fix.yml
          rm .github/temp-aot-unsafe-blit-plan-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: derive UnsafeBlit AOT guards from resolved plan"
          git push origin HEAD:feature/issue-396-deterministic-rpc-identity

      - name: Dispatch final validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run pr-fast.yml --ref feature/issue-396-deterministic-rpc-identity
          gh workflow run pr-extended.yml --ref feature/issue-396-deterministic-rpc-identity
