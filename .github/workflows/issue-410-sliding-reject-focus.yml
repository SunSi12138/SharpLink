name: Issue 410 SlidingWindow reject focus

on:
  push:
    branches:
      - tmp/issue-410-sliding-reject-focus-20260906

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      BASELINE_SHA: 51e3f2c66a24615abf738f76a2380f223d72f2ab
      CANDIDATE_SHA: 28d574b555f6204d626ecb0399603ba6c22b0a7e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Run alternating focused comparisons
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/issue410-sliding-reject-focus"
          mkdir -p "$evidence"
          dotnet --info > "$evidence/dotnet-info.txt"
          uname -a > "$evidence/uname.txt"
          lscpu > "$evidence/cpu.txt"

          run_case() {
            local label="$1"
            local sha="$2"
            git checkout --force "$sha"
            git clean -fdx
            dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
            rm -rf BenchmarkDotNet.Artifacts
            dotnet run -c Release --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -- \
              --filter '*AdmissionRateControllerBenchmarks*ImmediateReject*'
            mkdir -p "$evidence/$label"
            cp -R BenchmarkDotNet.Artifacts/. "$evidence/$label/"
          }

          run_case baseline-1 "$BASELINE_SHA"
          run_case candidate-1 "$CANDIDATE_SHA"
          run_case candidate-2 "$CANDIDATE_SHA"
          run_case baseline-2 "$BASELINE_SHA"
          run_case baseline-3 "$BASELINE_SHA"
          run_case candidate-3 "$CANDIDATE_SHA"

          git checkout --force "$GITHUB_SHA"
          mkdir -p artifacts/issue410-sliding-reject-focus
          cp -R "$evidence/." artifacts/issue410-sliding-reject-focus/

      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: issue-410-sliding-reject-focus-${{ github.sha }}
          path: artifacts/issue410-sliding-reject-focus
          if-no-files-found: error
