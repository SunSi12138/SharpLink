name: Hosted Provider Precedence Regression Evidence
on:
  push:
    branches: [validation/hosted-explicit-service-provider]
permissions:
  contents: read
jobs:
  baseline-red-candidate-green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      TUNIT_MAX_PARALLEL_TESTS: '8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Verify pinned old failure and new success
        run: python3 eng/hosted-provider-validation.py
      - name: Upload full evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/hosted-provider
          if-no-files-found: error
          retention-days: 30
