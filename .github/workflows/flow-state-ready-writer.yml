name: Flow State Ready Writer Research

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/flow-state-ready-writer.yml'
      - 'eng/*ready-writer*.py'
      - 'test/SharpLink.UnitTests/Client/EmissionEntryBarrier*.cs'
      - 'test/SharpLink.UnitTests/Client/SharpLinkClientDeadlinePublicationTests.cs'
      - 'test/SharpLink.UnitTests/TestClientTransportFactory.cs'
      - 'test/SharpLink.ReadyWriterExperiment/**'
      - 'test/SharpLink.ReadyWriterAotEvidence/**'
      - 'test/SharpLink.Benchmarks/ReadyWriter*.cs'
      - 'test/SharpLink.Benchmarks/PhaseBTransport*.cs'
      - 'test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj'
      - 'src/SharpLink.Runtime/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-state-ready-writer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TUNIT_MAX_PARALLEL_TESTS: '8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-dotnet
      - name: Check pinned sources and evidence guards
        run: |
          python3 eng/test-ready-writer.py
          python3 eng/test-ready-writer-budget.py
          python3 eng/test-ready-writer-native.py
          python3 eng/prepare-ready-writer.py --apply
      - name: Compile and check actual pump integration
        run: |
          dotnet build test/SharpLink.Benchmarks -c Release -p:ReadyWriterExperiment=true -p:Platform=AnyCPU
          dotnet test/SharpLink.Benchmarks/bin/Release/net10.0/SharpLink.Benchmarks.dll --ready-writer-self-test
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU
      - name: Preserve frame-layout and existing runtime contracts
        run: |
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU -- --treenode-filter '/*/*/SendPumpProgressIsolationTests/*'
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU

  jit-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_PROCESSOR_COUNT: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-dotnet
      - name: Prepare disposable measured tree
        run: |
          python3 eng/test-ready-writer.py
          python3 eng/test-ready-writer-budget.py
          python3 eng/test-ready-writer-native.py
          python3 eng/prepare-ready-writer.py --apply
          git add src/SharpLink.Runtime/OwnedFrame.cs src/SharpLink.Runtime/RpcSession.SendPump.cs src/SharpLink.Runtime/RpcSession.ReadyWriter.cs
          echo "MEASURED_TREE=$(git write-tree)" >> "$GITHUB_ENV"
          mkdir -p artifacts/ready-writer
          git rev-parse HEAD > artifacts/ready-writer/checkout.txt
          git diff --cached --binary > artifacts/ready-writer/disposable-runtime.patch
          dotnet --info > artifacts/ready-writer/dotnet.txt
          lscpu > artifacts/ready-writer/cpu.txt
      - name: Build, self-check and measure all matched controls
        run: |
          dotnet build test/SharpLink.Benchmarks -c Release -p:ReadyWriterExperiment=true -p:Platform=AnyCPU
          dotnet test/SharpLink.Benchmarks/bin/Release/net10.0/SharpLink.Benchmarks.dll --ready-writer-self-test
          python3 eng/run-ready-writer-budget.py artifacts/ready-writer --source "$MEASURED_TREE"
          python3 eng/verify-ready-writer-budget.py artifacts/ready-writer
          cat artifacts/ready-writer/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ready-writer-jit-${{ github.event.pull_request.head.sha || github.sha }}-attempt${{ github.run_attempt }}
          path: artifacts/ready-writer
          if-no-files-found: error
          retention-days: 30

  native-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_PROCESSOR_COUNT: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-dotnet
      - name: Prepare the same disposable measured tree
        run: |
          python3 eng/test-ready-writer-native.py
          python3 eng/prepare-ready-writer.py --apply
          git add src/SharpLink.Runtime/OwnedFrame.cs src/SharpLink.Runtime/RpcSession.SendPump.cs src/SharpLink.Runtime/RpcSession.ReadyWriter.cs
          echo "MEASURED_TREE=$(git write-tree)" >> "$GITHUB_ENV"
          mkdir -p artifacts/ready-native-evidence
          git rev-parse HEAD > artifacts/ready-native-evidence/checkout.txt
          git diff --cached --binary > artifacts/ready-native-evidence/disposable-runtime.patch
          dotnet --info > artifacts/ready-native-evidence/dotnet.txt
          lscpu > artifacts/ready-native-evidence/cpu.txt
      - name: Publish minimal native host and check actual writer path
        run: |
          dotnet publish test/SharpLink.ReadyWriterAotEvidence -c Release -r linux-x64 -p:Platform=AnyCPU -o artifacts/ready-native
          artifacts/ready-native/SharpLink.Benchmarks --ready-writer-self-test
      - name: Complete NativeAOT transport controls including negative cases
        run: |
          python3 eng/run-ready-writer-native.py artifacts/ready-native-evidence --binary artifacts/ready-native/SharpLink.Benchmarks --source "$MEASURED_TREE"
          python3 eng/verify-ready-writer-native.py artifacts/ready-native-evidence
          cat artifacts/ready-native-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ready-writer-native-${{ github.event.pull_request.head.sha || github.sha }}-attempt${{ github.run_attempt }}
          path: artifacts/ready-native-evidence
          if-no-files-found: error
          retention-days: 30
