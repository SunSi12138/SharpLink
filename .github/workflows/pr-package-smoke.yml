name: PR Package Smoke

permissions:
  contents: read

on:
  push:
    branches:
      - 'validation/dependency-forward-dev-20261030'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'README.md'
      - 'samples/**'
      - '.github/actions/package-smoke/**'
      - '.github/actions/verify-packages/**'
      - '.github/workflows/pr-package-smoke.yml'
      - 'eng/run-packaged-trim-smoke.py'
      - 'eng/tests/test_packaged_trim_smoke.py'
      - 'eng/run-quickstart-package-smoke.sh'
      - 'eng/verify-packages.sh'
      - 'eng/run-project-reference-trim-smoke.sh'
      - 'eng/run-shared-memory-aot-process-smoke.sh'
      - 'src/SharpLink.Runtime/**'
      - 'src/SharpLink.Shared/**'
      - 'src/SharpLink.Generator/**'
      - 'src/SharpLink.Sdk/**'
      - 'src/SharpLink.Abstractions/**'
      - 'src/SharpLink.GenerationControl/**'
      - 'src/SharpLink.Client/**'
      - 'src/SharpLink.Server/**'
      - 'src/SharpLink.Hosting/**'
      - 'test/SharpLink.PackageSmoke/**'
      - 'test/SharpLink.PackageAotSmoke/**'
      - 'test/SharpLink.PackageTrimSmoke/**'
      - 'test/SharpLink.PackagePartialTrimSmoke/**'
      - 'test/SharpLink.PackageLateTrimSmoke/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'Sharplink.slnx'
  workflow_dispatch:

concurrency:
  group: pr-package-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Build Release
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Run ProjectReference trim-only UnsafeBlit smoke
        env:
          SHARPLINK_TRIM_RID: linux-x64
        run: bash ./eng/run-project-reference-trim-smoke.sh

      - name: Run isolated NativeAOT smoke before packaging
        env:
          SHARPLINK_AOT_RID: linux-x64
          SHARPLINK_AOT_OUTPUT: ${{ github.workspace }}/artifacts/pr-package-aot-smoke
        run: ./eng/run-shared-memory-aot-process-smoke.sh

      - name: Pack
        run: dotnet pack Sharplink.slnx --no-build --no-restore -c Release -o artifacts/nuget -v minimal

      - name: Verify NuGet package contracts
        uses: ./.github/actions/verify-packages

      - name: Verify reviewed public API
        shell: bash
        run: |
          if ! bash ./eng/verify-public-api.sh; then
            cat artifacts/public-api/current/public-api.diff || true
            exit 1
          fi

      - name: Run NuGet package smoke
        uses: ./.github/actions/package-smoke

      - name: Upload packaged Trim and NativeAOT evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-package-trim-${{ github.sha }}
          path: artifacts/packaged-trim
          if-no-files-found: warn
          retention-days: 30
