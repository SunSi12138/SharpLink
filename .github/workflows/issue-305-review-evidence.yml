name: Issue 305 review evidence

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  contention-p99:
    if: github.event.pull_request.number == 309
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Prepare formal load-test harness
        run: |
          mkdir -p artifacts/issue-305-review
          {
            echo "runner=$(uname -a)"
            echo "cpu=$(lscpu | grep 'Model name' | head -1)"
            echo "dotnet=$(dotnet --version)"
            echo "base=${{ github.event.pull_request.base.sha }}"
            echo "head=${{ github.event.pull_request.head.sha }}"
          } | tee artifacts/issue-305-review/environment.txt

          cat > /tmp/issue305-patch-loadtest.py <<'PY'
          from pathlib import Path

          path = Path('test/SharpLink.LoadTest/Program.cs')
          text = path.read_text()
          old_validation = '''if (admissionMode is not ("disabled" or "immediate" or "queue" or "reject"))'''
          new_validation = '''if (admissionMode is not ("disabled" or "immediate" or "partition-immediate" or "queue" or "reject"))'''
          old_switch = '''            "immediate" => builder.UseAdmissionControl(admission =>\n                admission.Global.UseConcurrency(4096)),\n            "queue" => builder.UseAdmissionControl(admission =>'''
          new_switch = '''            "immediate" => builder.UseAdmissionControl(admission =>\n                admission.Global.UseConcurrency(4096)),\n            "partition-immediate" => builder.UseAdmissionControl(admission =>\n                admission.UsePartition(\n                    static _ => "hot",\n                    partition =>\n                    {\n                        partition.MaxPartitions = 1;\n                        partition.UseConcurrency(4096);\n                    })),\n            "queue" => builder.UseAdmissionControl(admission =>'''
          if old_validation not in text or old_switch not in text:
              raise SystemExit('load-test admission patch anchors changed')
          text = text.replace(old_validation, new_validation, 1)
          text = text.replace(old_switch, new_switch, 1)
          path.write_text(text)
          PY

      - name: Build frozen baseline load test
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout --force "$BASE_SHA"
          python3 /tmp/issue305-patch-loadtest.py
          dotnet restore test/SharpLink.LoadTest/SharpLink.LoadTest.csproj
          dotnet publish test/SharpLink.LoadTest/SharpLink.LoadTest.csproj \
            -c Release --no-restore -o /tmp/issue305-baseline

      - name: Build candidate load test
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout --force "$HEAD_SHA"
          python3 /tmp/issue305-patch-loadtest.py
          dotnet restore test/SharpLink.LoadTest/SharpLink.LoadTest.csproj
          dotnet publish test/SharpLink.LoadTest/SharpLink.LoadTest.csproj \
            -c Release --no-restore -o /tmp/issue305-candidate

      - name: Run formal c32/c128 samples
        run: |
          mkdir -p artifacts/issue-305-review/runs
          : > artifacts/issue-305-review/formal-load.log

          run_stage() {
            local binary="$1"
            local label="$2"
            local concurrency="$3"
            local output="artifacts/issue-305-review/runs/${label}-c${concurrency}.log"
            echo "=== $label c=$concurrency ===" | tee -a artifacts/issue-305-review/formal-load.log
            "$binary/SharpLink.LoadTest" \
              --mode local \
              --transport tcp \
              --operation add \
              --duration 10 \
              --warmup 3 \
              --concurrency "$concurrency" \
              --min-connections 1 \
              --max-connections 1 \
              --request-timeout disabled \
              --admission partition-immediate \
              --recording formal \
              --maximum-recorded-operations 5000000 \
              --metrics-port 0 \
              | tee "$output"
            local result
            result=$(grep '^\[Result\]' "$output" | tail -1)
            if [ -z "$result" ]; then
              echo "missing result for $label c=$concurrency" >&2
              exit 1
            fi
            echo "SAMPLE label=$label $result" | tee -a artifacts/issue-305-review/formal-load.log
          }

          run_stage /tmp/issue305-baseline baseline-r1 32
          run_stage /tmp/issue305-candidate candidate-r1 32
          run_stage /tmp/issue305-candidate candidate-r1 128
          run_stage /tmp/issue305-baseline baseline-r1 128

          run_stage /tmp/issue305-candidate candidate-r2 128
          run_stage /tmp/issue305-baseline baseline-r2 128
          run_stage /tmp/issue305-baseline baseline-r2 32
          run_stage /tmp/issue305-candidate candidate-r2 32

          run_stage /tmp/issue305-baseline baseline-r3 32
          run_stage /tmp/issue305-candidate candidate-r3 32
          run_stage /tmp/issue305-candidate candidate-r3 128
          run_stage /tmp/issue305-baseline baseline-r3 128

      - name: Evaluate formal P99 gate
        run: |
          python3 - <<'PY'
          import re
          import statistics
          from pathlib import Path

          text = Path('artifacts/issue-305-review/formal-load.log').read_text()
          pattern = re.compile(
              r'SAMPLE label=(?P<label>\S+) \[Result\] op=add c=(?P<c>\d+) '
              r'qps=(?P<qps>[0-9.]+).*?p99=(?P<p99>[0-9.]+)us')
          rows = []
          for match in pattern.finditer(text):
              row = match.groupdict()
              rows.append({
                  'label': row['label'],
                  'kind': 'candidate' if row['label'].startswith('candidate') else 'baseline',
                  'c': int(row['c']),
                  'qps': float(row['qps']),
                  'p99': float(row['p99']),
              })

          if len(rows) != 12:
              raise SystemExit(f'expected 12 formal result rows, got {len(rows)}')

          lines = [
              '# Issue #305 formal c32/c128 contention evidence',
              '',
              '| Concurrency | Baseline median P99 | A2 median P99 | P99 delta | Baseline median QPS | A2 median QPS | QPS delta | Gate |',
              '| ---: | ---: | ---: | ---: | ---: | ---: | ---: | :--- |',
          ]
          failed = False
          for concurrency in (32, 128):
              baseline = [r for r in rows if r['kind'] == 'baseline' and r['c'] == concurrency]
              candidate = [r for r in rows if r['kind'] == 'candidate' and r['c'] == concurrency]
              bp99 = statistics.median(r['p99'] for r in baseline)
              cp99 = statistics.median(r['p99'] for r in candidate)
              bqps = statistics.median(r['qps'] for r in baseline)
              cqps = statistics.median(r['qps'] for r in candidate)
              p99_delta = (cp99 / bp99 - 1.0) * 100.0
              qps_delta = (cqps / bqps - 1.0) * 100.0
              gate = 'PASS' if p99_delta <= 3.0 else 'FAIL'
              failed |= gate == 'FAIL'
              lines.append(
                  f'| {concurrency} | {bp99:.2f} us | {cp99:.2f} us | {p99_delta:+.2f}% | '
                  f'{bqps:.0f} | {cqps:.0f} | {qps_delta:+.2f}% | **{gate}** |')

          lines += [
              '',
              'Method: the repository `SharpLink.LoadTest` formal latency recorder, three 10-second measurement stages per variant/concurrency after 3-second warm-up, one TCP connection, one hot partition, partition concurrency limit 4096. Baseline and A2 are separate published binaries and samples are interleaved. The same runner-only load-test patch adds `partition-immediate` to both binaries; it does not change the compared admission implementation.',
              '',
              'Raw stage logs are under `runs/`, and extracted results are in `formal-load.log`.',
          ]
          summary = '\n'.join(lines) + '\n'
          Path('artifacts/issue-305-review/summary.md').write_text(summary)
          print(summary)
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a') as stream:
              stream.write(summary)
          if failed:
              raise SystemExit('Issue #305 formal P99 gate failed')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-305-review-evidence
          path: artifacts/issue-305-review
          if-no-files-found: error
