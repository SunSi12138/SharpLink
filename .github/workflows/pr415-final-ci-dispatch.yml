name: PR415 Final CI Dispatch

permissions:
  actions: write
  contents: write

on:
  push:
    branches:
      - feature/issue-396-deterministic-rpc-identity

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/issue-396-deterministic-rpc-identity
          fetch-depth: 0

      - name: Remove dispatcher and publish final head
        shell: bash
        run: |
          rm .github/workflows/pr415-final-ci-dispatch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pr415-final-ci-dispatch.yml
          git commit -m "chore: remove PR 415 CI dispatcher"
          git push origin HEAD:feature/issue-396-deterministic-rpc-identity

      - name: Dispatch Fast and Extended on final head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/pr-fast.yml/dispatches" -f ref=feature/issue-396-deterministic-rpc-identity
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/pr-extended.yml/dispatches" -f ref=feature/issue-396-deterministic-rpc-identity
