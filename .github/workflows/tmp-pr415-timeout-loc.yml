name: PR415 Timeout LOC Cleanup

on:
  push:
    branches:
      - feature/issue-396-deterministic-rpc-identity

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/issue-396-deterministic-rpc-identity
          fetch-depth: 0
      - name: Keep explicit policies without LOC debt
        shell: python
        run: |
          from pathlib import Path
          import re

          paths = [
              Path('test/SharpLink.IntegrationTests/DynamicEndpointIntegrationTests.cs'),
              Path('test/SharpLink.IntegrationTests/InterceptorIntegrationTests.cs'),
              Path('test/SharpLink.IntegrationTests/SharedMemoryTransportConnectionIntegrationTests.cs'),
              Path('test/SharpLink.IntegrationTests/StaticEndpointIntegrationTests.cs'),
              Path('test/SharpLink.IntegrationTests/TransportConnectionIntegrationTests.cs'),
          ]
          pattern = re.compile(
              r'(SharpClientBuilder\.Create\(\)|SharpLinkMultiClusterClientBuilder\.Create\(\))\r?\n[ \t]*\.DisableRequestTimeout\(\)')
          changed = []
          for path in paths:
              original = path.read_text(encoding='utf-8')
              text, count = pattern.subn(r'\1.DisableRequestTimeout()', original)
              if count:
                  path.write_text(text, encoding='utf-8')
                  changed.append((str(path), count))
          if not changed:
              raise SystemExit('No timeout policy chains were compacted.')
          for path, count in changed:
              print(f'{path}: {count}')
      - run: git diff --check
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/SharpLink.IntegrationTests/DynamicEndpointIntegrationTests.cs \
                  test/SharpLink.IntegrationTests/InterceptorIntegrationTests.cs \
                  test/SharpLink.IntegrationTests/SharedMemoryTransportConnectionIntegrationTests.cs \
                  test/SharpLink.IntegrationTests/StaticEndpointIntegrationTests.cs \
                  test/SharpLink.IntegrationTests/TransportConnectionIntegrationTests.cs
          git commit -m "test: keep explicit timeout policies within LOC baseline"
          git push origin HEAD:feature/issue-396-deterministic-rpc-identity
