name: Issue 245 Perf

on:
  push:
    branches:
      - tmp/issue-245-perf-baseline
      - tmp/issue-245-perf-candidate
  pull_request:
    branches:
      - dev

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Restore benchmark project
        run: dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
      - name: Run issue 245 benchmark
        run: >-
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          -c Release --no-restore --
          --filter "*AdmissionPartitionReleaseBenchmarks*"
