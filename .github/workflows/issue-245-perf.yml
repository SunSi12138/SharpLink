name: Issue 245 Perf Controlled

on:
  pull_request:
    branches:
      - dev

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Checkout baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/issue-245-perf-baseline
          path: baseline

      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/issue-245-idle-reclaim
          path: candidate

      - name: Restore baseline benchmark
        working-directory: baseline
        run: dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj

      - name: Run baseline benchmark
        working-directory: baseline
        run: >-
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          -c Release --no-restore --
          --filter "*AdmissionPartitionReleaseBenchmarks*"

      - name: Restore candidate benchmark
        working-directory: candidate
        run: dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj

      - name: Run candidate benchmark
        working-directory: candidate
        run: >-
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          -c Release --no-restore --
          --filter "*AdmissionPartitionReleaseBenchmarks*"
