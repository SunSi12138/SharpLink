name: Temp PR415 iOS arm64 R2R Diagnostic

on:
  push:
    branches:
      - tmp/pr415-ios-arm64-r2r-diagnostic

permissions:
  contents: read

jobs:
  ios-arm64-r2r:
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_11_SDK: 11.0.100-preview.7.26381.103
      IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
      SHARPLINK_COMMIT: ${{ github.sha }}
      SHARPLINK_IOS_PROBE_TIMEOUT_MS: '60000'
      SHARPLINK_IOS_PROBE_ATTEMPTS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Record runner and Xcode
        shell: bash
        run: |
          sw_vers
          xcodebuild -version
      - name: Inject fixture-construction diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/SharpLink.CodecCompatibility/Fixtures.cs')
          text = path.read_text()

          replacements = [
              (
                  '    {\n        Id = id;\n        Category = category;\n        _value = value;',
                  '    {\n        Console.WriteLine($"SharpLink codec diagnostic: construct start {id} ({typeof(T).FullName}).");\n        Id = id;\n        Category = category;\n        _value = value;'
              ),
              (
                  '        FieldOffsets = fieldNames.ToDictionary(static name => name, static name => Marshal.OffsetOf<T>(name).ToInt32(), StringComparer.Ordinal);\n        ExpectedLogicalValue = Describe(value);',
                  '        FieldOffsets = fieldNames.ToDictionary(static name => name, static name => Marshal.OffsetOf<T>(name).ToInt32(), StringComparer.Ordinal);\n        Console.WriteLine($"SharpLink codec diagnostic: offsets complete {id}.");\n        ExpectedLogicalValue = Describe(value);\n        Console.WriteLine($"SharpLink codec diagnostic: construct complete {id}.");'
              ),
              (
                  '    private static IReadOnlyList<IFixture> CreateFixtures()\n    {\n        var block64',
                  '    private static IReadOnlyList<IFixture> CreateFixtures()\n    {\n        Console.WriteLine("SharpLink codec diagnostic: CreateFixtures start.");\n        var block64'
              ),
              (
                  '        return\n        [\n            new Fixture<byte>("Byte", "no-padding", 0xA5),',
                  '        Console.WriteLine("SharpLink codec diagnostic: CreateFixtures block values complete.");\n        return\n        [\n            new Fixture<byte>("Byte", "no-padding", 0xA5),'
              )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'diagnostic patch anchor not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- test/SharpLink.CodecCompatibility/Fixtures.cs
      - name: Pin .NET 11 Preview 7
        shell: bash
        run: |
          cat > global.json <<EOF
          {
            "sdk": {
              "version": "$DOTNET_11_SDK",
              "rollForward": "disable",
              "allowPrerelease": true
            }
          }
          EOF
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Install iOS workload
        run: dotnet workload install ios
      - name: Boot iOS 26.5 simulator
        shell: bash
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl list runtimes
          udid="$(python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          runtime = os.environ['IOS_SIMULATOR_RUNTIME']
          for device in data['devices'].get(runtime, []):
              if device.get('isAvailable') and device.get('name', '').startswith('iPhone'):
                  print(device['udid'])
                  raise SystemExit
          raise SystemExit(f'No available iPhone simulator for {runtime}')
          PY
          )"
          echo "IOS_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          for attempt in $(seq 1 90); do
            if xcrun simctl list devices | grep "$udid" | grep -q '(Booted)'; then
              break
            fi
            sleep 2
          done
          xcrun simctl list devices | grep "$udid" | grep '(Booted)'
      - name: Build and run Release ReadyToRun producer
        shell: bash
        run: |
          actual="$(dotnet --version)"
          test "$actual" = "$DOTNET_11_SDK"
          rm -rf test/SharpLink.CodecCompatibility.iOS/bin test/SharpLink.CodecCompatibility.iOS/obj
          dotnet build -c Release -f net11.0-ios -r iossimulator-arm64 \
            test/SharpLink.CodecCompatibility.iOS/SharpLink.CodecCompatibility.iOS.csproj \
            -p:CodecRuntime=coreclr \
            -p:PublishReadyToRun=true
          app="$(find test/SharpLink.CodecCompatibility.iOS/bin/Release -path '*/net11.0-ios/iossimulator-arm64/*' -name '*.app' -type d | head -n 1)"
          test -n "$app"
          file "$app/SharpLink.CodecCompatibility" || true
          xcrun simctl install "$IOS_SIMULATOR_UDID" "$app"
          node test/SharpLink.CodecCompatibility.iOS/run-ios.mjs \
            produce "artifacts/codec-compat/construct-${{ matrix.replica }}" \
            "$SHARPLINK_COMMIT" "$actual" \
            net11.0-ios/iossimulator-arm64
          test -f "artifacts/codec-compat/construct-${{ matrix.replica }}/manifest.json"
