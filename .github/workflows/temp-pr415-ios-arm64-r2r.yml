name: Temp PR415 iOS arm64 R2R Diagnostic

on:
  push:
    branches:
      - tmp/pr415-ios-arm64-r2r-diagnostic

permissions:
  contents: read

jobs:
  ios-arm64-r2r:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_11_SDK: 11.0.100-preview.3.26207.106
      DOTNET_11_WORKLOAD_SET: 11.0.100-preview.3.26213.1
      IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-3
      SHARPLINK_COMMIT: ${{ github.sha }}
      SHARPLINK_IOS_PROBE_TIMEOUT_MS: '60000'
      SHARPLINK_IOS_PROBE_ATTEMPTS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Pin .NET 11 Preview 3
        shell: bash
        run: |
          cat > global.json <<EOF
          {
            "sdk": {
              "version": "$DOTNET_11_SDK",
              "rollForward": "disable",
              "allowPrerelease": true
            }
          }
          EOF
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.3.26207.106
      - name: Install Preview 3 iOS workload
        run: |
          dotnet workload install ios \
            --version "$DOTNET_11_WORKLOAD_SET" \
            --source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-workloads/nuget/v3/index.json
          dotnet workload --info
      - name: Boot iOS 26.3 simulator
        shell: bash
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl list runtimes
          udid="$(python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          runtime = os.environ['IOS_SIMULATOR_RUNTIME']
          for device in data['devices'].get(runtime, []):
              if device.get('isAvailable') and device.get('name', '').startswith('iPhone'):
                  print(device['udid'])
                  raise SystemExit
          raise SystemExit(f'No available iPhone simulator for {runtime}')
          PY
          )"
          echo "IOS_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          for attempt in $(seq 1 90); do
            if xcrun simctl list devices | grep "$udid" | grep -q '(Booted)'; then
              break
            fi
            sleep 2
          done
          xcrun simctl list devices | grep "$udid" | grep '(Booted)'
      - name: Build and run Release ReadyToRun producer
        shell: bash
        run: |
          actual="$(dotnet --version)"
          test "$actual" = "$DOTNET_11_SDK"
          rm -rf test/SharpLink.CodecCompatibility.iOS/bin test/SharpLink.CodecCompatibility.iOS/obj
          dotnet build -c Release -f net11.0-ios -r iossimulator-arm64 \
            test/SharpLink.CodecCompatibility.iOS/SharpLink.CodecCompatibility.iOS.csproj \
            -p:CodecRuntime=coreclr \
            -p:PublishReadyToRun=true
          app="$(find test/SharpLink.CodecCompatibility.iOS/bin/Release -path '*/net11.0-ios/iossimulator-arm64/*' -name '*.app' -type d | head -n 1)"
          test -n "$app"
          echo "APP=$app"
          file "$app/SharpLink.CodecCompatibility" || true
          xcrun simctl install "$IOS_SIMULATOR_UDID" "$app"
          node test/SharpLink.CodecCompatibility.iOS/run-ios.mjs \
            produce artifacts/codec-compat/ios-arm64-coreclr-corpus \
            "$SHARPLINK_COMMIT" "$actual" \
            net11.0-ios/iossimulator-arm64
          test -f artifacts/codec-compat/ios-arm64-coreclr-corpus/manifest.json
