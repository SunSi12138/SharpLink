name: issue-430-worker

on:
  push:
    branches:
      - tmp/issue-430-worker
    paths:
      - .github/workflows/issue-430-worker.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reconstruct validated candidate
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .tmp/issue430/patch.00 \
            .tmp/issue430/fix01.* \
            .tmp/issue430/patch.02 \
            .tmp/issue430/patch.03 \
            .tmp/issue430/patch.04 \
            .tmp/issue430/patch.05 \
            .tmp/issue430/fix06.* \
            > /tmp/issue430.patch.b64
          echo 'a3cbcd30bee0c5269fc1cff22d7c94f8f68630ab457ffc541c004b4326dd49ca  /tmp/issue430.patch.b64' | sha256sum -c -
          echo '4bdaa07ca9a3e8f76495ac88fa9eec6852da30471ae4433efab6f9b03a13884b  .tmp/issue430/new-integration-provider.patch' | sha256sum -c -
          echo 'a37c14f66c55abf33816abf3f9d5235becab180fcc997d7f266c65ffb5876e4d  .tmp/issue430/new-unit-provider.patch' | sha256sum -c -
          echo 'f80fdb8d766290318ac79b5f7f3e1a5779d4c3a73a018455e989bdd9877fd88a  .tmp/issue430/followup1.patch' | sha256sum -c -
          echo '0dbf17dd266eaff298c382d025bb53189352a4845336b525db377d429f7517a9  .tmp/issue430/followup2.patch' | sha256sum -c -
          echo '1b80abd43680d72fe5aab8dd3be0d6a77375392884c77b0bb6affebf5a395ac5  .tmp/issue430/followup3.patch' | sha256sum -c -
          base64 -d /tmp/issue430.patch.b64 | gzip -d > /tmp/issue430.patch
          cp .tmp/issue430/new-integration-provider.patch /tmp/issue430-new-integration-provider.patch
          cp .tmp/issue430/new-unit-provider.patch /tmp/issue430-new-unit-provider.patch
          cp .tmp/issue430/followup1.patch /tmp/issue430-followup1.patch
          cp .tmp/issue430/followup2.patch /tmp/issue430-followup2.patch
          cp .tmp/issue430/followup3.patch /tmp/issue430-followup3.patch
          git fetch origin dev fix/430-compression-provider-boundary
          git checkout -B issue430-promote origin/dev
          test "$(git rev-parse HEAD)" = "51e3f2c66a24615abf738f76a2380f223d72f2ab"
          test "$(git rev-parse origin/fix/430-compression-provider-boundary)" = "e7177835114d34772087b059491fa0b4bd7607df"
          git apply --check /tmp/issue430.patch
          git apply /tmp/issue430.patch
          git apply --check /tmp/issue430-new-integration-provider.patch
          git apply /tmp/issue430-new-integration-provider.patch
          git apply --check /tmp/issue430-new-unit-provider.patch
          git apply /tmp/issue430-new-unit-provider.patch
          git apply --check /tmp/issue430-followup1.patch
          git apply /tmp/issue430-followup1.patch
          git apply --check /tmp/issue430-followup2.patch
          git apply /tmp/issue430-followup2.patch
          git apply --check /tmp/issue430-followup3.patch
          git apply /tmp/issue430-followup3.patch
          git diff --check
          if git grep -n -E 'SharpLinkCompressionProviders|SharpLinkCompressionResult|SharpLinkCompressionOutputLimitException|Crc32Accumulator|BrotliCompressionProvider|SCP1|Brotli|brotli' -- src demo doc README.md; then
            echo 'Concrete compression machinery remains in Core/demo/docs.' >&2
            exit 1
          fi

      - name: Create focused commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SunSi12138'
          git config user.email '54728594+SunSi12138@users.noreply.github.com'

          git add \
            src/SharpLink.Runtime/Compression/SharpLinkCompression.cs \
            src/SharpLink.Runtime/RpcSession.Compression.cs \
            src/SharpLink.Server/SharpLinkServer.DecodeExecutor.cs
          git commit -m 'refactor(compression): define algorithm-free provider boundary'

          git add demo/Compression/Program.cs eng/maintainability/baseline.json test
          git commit -m 'test(compression): migrate callers off built-in algorithms'

          git add CHANGELOG.md README.md doc
          git commit -m 'docs(compression): document algorithm-free Core boundary'

          test -z "$(git status --porcelain)"
          git log --oneline -4
          echo "PROMOTE_HEAD=$(git rev-parse HEAD)"

      - name: Push implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git push \
            --force-with-lease=refs/heads/fix/430-compression-provider-boundary:e7177835114d34772087b059491fa0b4bd7607df \
            origin HEAD:refs/heads/fix/430-compression-provider-boundary
          echo "PUSHED_HEAD=$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
