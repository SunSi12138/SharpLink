name: issue-430-worker

on:
  push:
    branches:
      - tmp/issue-430-worker
    paths:
      - .github/workflows/issue-430-worker.yml

permissions:
  contents: write

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/430-compression-provider-boundary
          fetch-depth: 0
      - name: Await staged patch
        run: echo PATCH_STAGING
