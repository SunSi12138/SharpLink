name: issue-430-worker

on:
  push:
    branches:
      - tmp/issue-430-worker
    paths:
      - .github/workflows/issue-430-worker.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Report staged patch chunks
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .tmp/issue430/patch.*
          wc -c .tmp/issue430/patch.*
          cat .tmp/issue430/patch.* > /tmp/issue430.patch.b64
          echo "WHOLE $(sha256sum /tmp/issue430.patch.b64)"
          echo "WHOLE_BYTES $(wc -c < /tmp/issue430.patch.b64)"
