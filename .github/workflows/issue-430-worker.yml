name: issue-430-worker

on:
  push:
    branches:
      - tmp/issue-430-worker
    paths:
      - .github/workflows/issue-430-worker.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Export current issue 430 implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/430-compression-provider-boundary
          git checkout -B issue430-export origin/fix/430-compression-provider-boundary
          test "$(git rev-parse HEAD)" = "5a025579e2417e5b72a91ab4dd924d871c0cd02f"
          rm -rf .git
      - name: Upload worktree
        uses: actions/upload-artifact@v4
        with:
          name: issue430-stage2-worktree
          path: .
          include-hidden-files: true
          retention-days: 1
