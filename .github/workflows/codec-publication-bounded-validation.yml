name: Codec publication bounded validation

on:
  push:
    branches: [codex/fix-codec-publication-reentrancy]
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/codec-publication-bounded-validation.yml'

permissions:
  contents: read

jobs:
  existing-rpc-and-collectible-corpus:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      TUNIT_MAX_PARALLEL_TESTS: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.115
      - name: Build exact source with audited dependencies
        run: |
          New-Item -ItemType Directory -Force artifacts/codec-publication | Out-Null
          dotnet --info | Tee-Object artifacts/codec-publication/dotnet-info.log
          dotnet build test/SharpLink.IntegrationTests/SharpLink.IntegrationTests.csproj -c Release -v minimal 2>&1 | Tee-Object artifacts/codec-publication/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exact thirteen unchanged RPC and collectible controls
        run: |
          $cases = @(
            @('RuntimeAssemblyIntegrationTests', 'SameFullNameReferencedCodecDependencyShouldRequireExactGenerationOnClientAndServer'),
            @('RuntimeAssemblyIntegrationTests', 'ReferencedCodecDependenciesShouldShutdownDependantsBeforeProvidersOnClientAndServer'),
            @('RuntimeAssemblyIntegrationTests', 'SameFullNameDeclaredModuleDependencyShouldRequireExactBoundGenerationOnClientAndServer'),
            @('RuntimeAssemblyIntegrationTests', 'ReferencedCodecDependencyShouldRequireRunningProviderOnClientAndServer'),
            @('RuntimeAssemblyIntegrationTests', 'RuntimeAssembliesShouldRegisterTransactionallyAndSupportEveryCallShape'),
            @('RuntimeAssemblyIntegrationTests', 'ReplacementShouldRejectContractGenerationWhileDependentServiceRemainsRegistered'),
            @('RuntimeAssemblyIntegrationTests', 'ReplacementShouldProceedAfterDependentServiceIsRemoved'),
            @('RuntimeAssemblyIntegrationTests', 'ReplacementValidationFailureShouldLeaveTheOldSnapshotServing'),
            @('RuntimeAssemblyIntegrationTests', 'ConcurrentRegistrationShouldPublishExactlyOneCompleteSnapshot'),
            @('RuntimeAssemblyIntegrationTests', 'CollectibleContextShouldUnloadAfterFrameworkReferencesAreReleased'),
            @('RuntimeAssemblyIntegrationTests', 'RejectedApi4DynamicRegistrationShouldReleaseItsCollectibleContext'),
            @('RuntimeAssemblyIntegrationTests', 'DisposalFailuresShouldNotSkipRemainingModuleCleanup'),
            @('RuntimeAssemblyIntegrationTests', 'ModuleUnregisterShouldJoinRetiredConnectionServiceCleanup')
          )
          $results = @()
          foreach ($case in $cases) {
            $name = $case[1]
            $filter = "/*/*/$($case[0])/$name"
            $log = "artifacts/codec-publication/$name.log"
            dotnet run -c Release --no-build --project test/SharpLink.IntegrationTests -- --treenode-filter $filter --maximum-parallel-tests 1 --timeout 120s 2>&1 | Tee-Object $log
            $code = $LASTEXITCODE
            $text = (Get-Content $log -Raw) -replace '\x1b\[[0-9;]*m', ''
            $counts = @{}
            foreach ($key in @('total', 'failed', 'succeeded', 'skipped')) {
              $found = [regex]::Matches($text, "\b${key}:\s*(\d+)\b")
              $counts[$key] = if ($found.Count) { [int]$found[-1].Groups[1].Value } elseif ($key -eq 'failed') { 0 } else { -1 }
            }
            $results += @{ name = $name; exitCode = $code; counts = $counts }
            $results | ConvertTo-Json -Depth 6 | Set-Content artifacts/codec-publication/results.json
            if ($code -ne 0 -or $counts.total -ne 1 -or $counts.failed -ne 0 -or $counts.succeeded -ne 1 -or $counts.skipped -ne 0) {
              throw "Exact frozen control failed: $name / $($counts | ConvertTo-Json -Compress)"
            }
          }
          if ($results.Count -ne 13) { throw 'Incomplete frozen corpus' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codec-publication-${{ runner.os }}-${{ github.sha }}
          path: |
            artifacts/codec-publication/
            test/SharpLink.IntegrationTests/bin/Release/net10.0/TestResults/
          retention-days: 7
          if-no-files-found: error
