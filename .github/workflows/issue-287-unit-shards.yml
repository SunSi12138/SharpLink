name: Issue 287 unit shards

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-287-call-control-cleanup
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Apply current issue patch
        run: bash .github/issue-287-apply-current.sh
      - name: Restore and build
        run: |
          dotnet restore Sharplink.slnx
          dotnet build Sharplink.slnx --no-restore -c Release -v minimal
      - name: Run namespace shards
        shell: bash
        run: |
          set +e
          rc=0
          for ns in \
            SharpLink.UnitTests.Abstractions \
            SharpLink.UnitTests.Builder \
            SharpLink.UnitTests.Client \
            SharpLink.UnitTests.Hosting \
            SharpLink.UnitTests.Protocol \
            SharpLink.UnitTests.Runtime \
            SharpLink.UnitTests.Server \
            SharpLink.UnitTests
          do
            echo "===== $ns ====="
            timeout 2m dotnet test \
              --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj \
              --no-build -c Release -- \
              --treenode-filter "/*/$ns/*/*" \
              --maximum-parallel-tests 1 \
              --output Detailed
            code=$?
            echo "===== $ns exit=$code ====="
            if [ $code -ne 0 ]; then rc=1; fi
          done
          exit $rc
