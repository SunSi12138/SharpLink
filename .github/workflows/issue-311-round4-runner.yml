name: Issue 311 round 4 runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/311-codec-scope-routing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/311-codec-scope-routing
          fetch-depth: 0
      - name: Apply stored patch script
        shell: bash
        run: |
          python - <<'PYRUN'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/issue-311-round4-patch.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          script = script.replace(
              'SharpLink.Sdk.RpcCodecAdapterRegistration(typeof(Vendor.ExternalGraph), typeof(ExplicitAdapter))',
              'SharpLink.Sdk.RpcCodecAdapter(typeof(Vendor.ExternalGraph), typeof(ExplicitAdapter))')
          exec(compile(script, 'issue-311-round4-patch.py', 'exec'), {'__name__': '__main__'})
          PYRUN
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test
          git commit -m "Address codec routing review gaps"
          git push origin HEAD:fix/311-codec-scope-routing
