name: Temporary terminal observer isolation repair
on:
  push:
    branches: ['codex/temp-terminal-observer-repair-20261115']
permissions:
  contents: read
jobs:
  repair-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      TUNIT_MAX_PARALLEL_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.115'
      - name: Record environment and amended frozen plan
        shell: bash
        run: |
          mkdir -p artifacts/terminal-observer-repair
          { git rev-parse HEAD; git log -1 --format=fuller; uname -a; dotnet --info; } > artifacts/terminal-observer-repair/environment.txt
          cp doc/terminal-observer-drain-validation.md artifacts/terminal-observer-repair/PLAN.md
      - name: Build controls
        shell: bash
        run: |
          dotnet build test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release -v minimal | tee artifacts/terminal-observer-repair/unit-build.log
          dotnet build test/SharpLink.IntegrationTests/SharpLink.IntegrationTests.csproj -c Release -v minimal | tee artifacts/terminal-observer-repair/public-build.log
      - name: Exercise all three independent controls, retaining every exit
        shell: bash
        run: |
          set +e
          timeout 90s dotnet exec --fx-version 10.0.15 test/SharpLink.UnitTests/bin/Release/net10.0/SharpLink.UnitTests.dll --treenode-filter '/*/*/TerminalObserverDrainTests/*' --output Detailed > artifacts/terminal-observer-repair/unit.log 2>&1
          echo "$?" > artifacts/terminal-observer-repair/unit.exit
          cp test/SharpLink.UnitTests/bin/Release/net10.0/TestResults/*report.html artifacts/terminal-observer-repair/unit-report.html
          timeout 90s dotnet exec --fx-version 10.0.15 test/SharpLink.UnitTests/bin/Release/net10.0/SharpLink.UnitTests.dll --treenode-filter '/*/*/BackpressuredSendOwnershipTests/*' --output Detailed > artifacts/terminal-observer-repair/ownership.log 2>&1
          echo "$?" > artifacts/terminal-observer-repair/ownership.exit
          cp test/SharpLink.UnitTests/bin/Release/net10.0/TestResults/*report.html artifacts/terminal-observer-repair/ownership-report.html
          timeout 90s dotnet exec --fx-version 10.0.15 test/SharpLink.IntegrationTests/bin/Release/net10.0/SharpLink.IntegrationTests.dll --treenode-filter '/*/*/TerminalObserverDrainIntegrationTests/*' --output Detailed > artifacts/terminal-observer-repair/public.log 2>&1
          echo "$?" > artifacts/terminal-observer-repair/public.exit
          cp test/SharpLink.IntegrationTests/bin/Release/net10.0/TestResults/*report.html artifacts/terminal-observer-repair/public-report.html
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('artifacts/terminal-observer-repair')
          rows = []
          for name, count in [('unit',9), ('ownership',28), ('public',2)]:
              raw = (root / (name+'.log')).read_text()
              print(raw)
              clean = re.sub(r'\x1b\[[0-9;]*m', '', raw)
              code = int((root/(name+'.exit')).read_text())
              passed = code == 0 and all(re.search(k+r':\s*'+str(v)+r'\b', clean) for k,v in [('total',count),('failed',0),('succeeded',count),('skipped',0)])
              passed = passed and (root/(name+'-report.html')).is_file()
              rows.append(dict(name=name,count=count,exit=code,passed=bool(passed)))
          (root/'summary.json').write_text(json.dumps(rows,indent=2))
          assert all(row['passed'] for row in rows), rows
          PY
      - name: Retain repair evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: terminal-observer-repair-${{ github.sha }}
          path: artifacts/terminal-observer-repair/
          if-no-files-found: error
          retention-days: 14
