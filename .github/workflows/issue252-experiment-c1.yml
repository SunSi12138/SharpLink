name: issue252 experiment C1

on:
  push:
    branches:
      - agent/issue-252-experiment-c1

permissions:
  contents: read

jobs:
  c1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare paired dev worktrees
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin dev
          BASE="$RUNNER_TEMP/issue252-c1-base"
          CANDIDATE="$RUNNER_TEMP/issue252-c1-candidate"
          git worktree add --detach "$BASE" origin/dev
          git worktree add --detach "$CANDIDATE" origin/dev
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
          echo "base_sha=$(git -C "$BASE" rev-parse HEAD)"

      - name: Apply C1 lazy-flat prototype
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("${{ env.CANDIDATE }}") / "src/SharpLink.Client/PendingRequestTable.cs"
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, got {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          def replace_count(old, new, expected):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"expected {expected} matches, got {count}: {old[:100]!r}")
              text = text.replace(old, new)

          replace_once(
              "    private readonly PendingCall?[] _slots;\n",
              "    private readonly int _capacity;\n    private PendingCall?[]? _slots;\n")

          replace_once(
              "        _slots = new PendingCall?[capacity];\n        _indexMask = capacity - 1;\n",
              "        _capacity = capacity;\n        _indexMask = capacity - 1;\n")

          replace_once(
              "    public int Capacity => _slots.Length;\n",
              "    public int Capacity => _capacity;\n")

          replace_once(
              "        {\n            var count = 0;\n            for (var index = 0; index < _slots.Length; index++)\n                if (Volatile.Read(ref _slots[index]) is not null)\n                    count++;\n            return count;\n        }\n",
              "        {\n            var slots = Volatile.Read(ref _slots);\n            if (slots is null)\n                return 0;\n\n            var count = 0;\n            for (var index = 0; index < slots.Length; index++)\n                if (Volatile.Read(ref slots[index]) is not null)\n                    count++;\n            return count;\n        }\n")

          replace_once(
              "    public bool Dispatch(long id, ref ReadOnlySequence<byte> payload)\n    {\n        var index = (int)(id & _indexMask);\n        var current = Volatile.Read(ref _slots[index]);\n",
              "    public bool Dispatch(long id, ref ReadOnlySequence<byte> payload)\n    {\n        var slots = Volatile.Read(ref _slots);\n        if (slots is null)\n            return false;\n\n        var index = (int)(id & _indexMask);\n        var current = Volatile.Read(ref slots[index]);\n")

          replace_once(
              "                if (!ReferenceEquals(Volatile.Read(ref _slots[index]), current) ||\n                    current.Id != id ||\n",
              "                if (!ReferenceEquals(Volatile.Read(ref slots[index]), current) ||\n                    current.Id != id ||\n")

          replace_once(
              "    public bool Contains(long id)\n    {\n        var call = Volatile.Read(ref _slots[(int)(id & _indexMask)]);\n        return call is not null && call.Id == id;\n    }\n",
              "    public bool Contains(long id)\n    {\n        var slots = Volatile.Read(ref _slots);\n        if (slots is null)\n            return false;\n\n        var call = Volatile.Read(ref slots[(int)(id & _indexMask)]);\n        return call is not null && call.Id == id;\n    }\n")

          replace_once(
              "    public CancellationToken GetProducerCancellationToken(long id)\n    {\n        var call = Volatile.Read(ref _slots[(int)(id & _indexMask)]);\n        if (call is null || call.Id != id)\n            return new CancellationToken(canceled: true);\n        return call.ProducerCancellationToken;\n    }\n",
              "    public CancellationToken GetProducerCancellationToken(long id)\n    {\n        var slots = Volatile.Read(ref _slots);\n        if (slots is null)\n            return new CancellationToken(canceled: true);\n\n        var call = Volatile.Read(ref slots[(int)(id & _indexMask)]);\n        if (call is null || call.Id != id)\n            return new CancellationToken(canceled: true);\n        return call.ProducerCancellationToken;\n    }\n")

          replace_once(
              "    public void FailAllPendingRequests(Exception exception)\n    {\n        ArgumentNullException.ThrowIfNull(exception);\n        for (var index = 0; index < _slots.Length; index++)\n",
              "    public void FailAllPendingRequests(Exception exception)\n    {\n        ArgumentNullException.ThrowIfNull(exception);\n        var slots = Volatile.Read(ref _slots);\n        if (slots is null)\n            return;\n\n        for (var index = 0; index < slots.Length; index++)\n")

          replace_count(
              "        var published = false;\n        try\n        {\n            while (true)\n            {\n                for (var attempt = 0; attempt < _slots.Length; attempt++)\n",
              "        var published = false;\n        try\n        {\n            var slots = GetOrCreateSlots();\n            while (true)\n            {\n                for (var attempt = 0; attempt < slots.Length; attempt++)\n",
              2)

          replace_count(
              "                    if (Volatile.Read(ref _slots[index]) is not null)\n",
              "                    if (Volatile.Read(ref slots[index]) is not null)\n",
              2)

          replace_count(
              "                    if (Interlocked.CompareExchange(ref _slots[index], call, null) is null)\n",
              "                    if (Interlocked.CompareExchange(ref slots[index], call, null) is null)\n",
              2)

          replace_once(
              "        if (active <= _slots.Length)\n",
              "        if (active <= _capacity)\n")

          replace_once(
              "        if (remaining < _slots.Length && Volatile.Read(ref _waiterCount) != 0)\n",
              "        if (remaining < _capacity && Volatile.Read(ref _waiterCount) != 0)\n")

          replace_once(
              "    private bool TryTakeMatchingCall(long id, out PendingCall? call)\n    {\n        var index = (int)(id & _indexMask);\n",
              "    private bool TryTakeMatchingCall(long id, out PendingCall? call)\n    {\n        var slots = Volatile.Read(ref _slots);\n        if (slots is null)\n        {\n            call = null;\n            return false;\n        }\n\n        var index = (int)(id & _indexMask);\n")

          replace_once(
              "    private bool TryTakeCallAtIndex(int index, out PendingCall? call)\n    {\n        while (true)\n",
              "    private bool TryTakeCallAtIndex(int index, out PendingCall? call)\n    {\n        var slots = Volatile.Read(ref _slots)!;\n        while (true)\n")

          replace_once(
              "            Interlocked.Exchange(ref _approximateEarliestDeadline, long.MaxValue);\n            var now = _timeProvider.GetTimestamp();\n            for (var index = 0; index < _slots.Length; index++)\n",
              "            Interlocked.Exchange(ref _approximateEarliestDeadline, long.MaxValue);\n            var slots = Volatile.Read(ref _slots);\n            if (slots is null)\n                return;\n\n            var now = _timeProvider.GetTimestamp();\n            for (var index = 0; index < slots.Length; index++)\n")

          replace_count("ref _slots[index]", "ref slots[index]", 5)

          marker = "    private bool TryAcquireCapacity()\n"
          helper = """    [MethodImpl(MethodImplOptions.AggressiveInlining)]
    private PendingCall?[] GetOrCreateSlots()
    {
        var slots = Volatile.Read(ref _slots);
        if (slots is not null)
            return slots;

        var created = new PendingCall?[_capacity];
        return Interlocked.CompareExchange(ref _slots, created, null) ?? created;
    }

"""
          replace_once(marker, helper + marker)

          if "_slots.Length" in text or "ref _slots[index]" in text:
              raise SystemExit("C1 patch left direct lazy-slot accesses behind")

          path.write_text(text)
          PY

          git -C "$CANDIDATE" diff --check
          git -C "$CANDIDATE" diff -- src/SharpLink.Client/PendingRequestTable.cs

      - name: Add construction allocation benchmark to both worktrees
        shell: bash
        run: |
          set -euxo pipefail
          for dir in "$BASE" "$CANDIDATE"; do
            cat > "$dir/test/SharpLink.Benchmarks/PendingRequestConstructionBenchmarks.cs" <<'CS'
          using BenchmarkDotNet.Attributes;
          using BenchmarkDotNet.Engines;
          using SharpLink.Client;
          using SharpLink.Runtime;

          namespace SharpLink.Benchmarks;

          [MemoryDiagnoser]
          [SimpleJob(RunStrategy.Throughput, launchCount: 1, warmupCount: 3, iterationCount: 10)]
          public class PendingRequestConstructionBenchmarks
          {
              private SharpLinkRuntimeContext _context = null!;

              [GlobalSetup]
              public void Setup()
                  => _context = new SharpLinkRuntimeContextBuilder().Build();

              [GlobalCleanup]
              public void Cleanup()
                  => _context.Dispose();

              [Benchmark]
              public int ConstructAndDispose()
              {
                  using var table = new PendingRequestTable(
                      65_536,
                      _context.Codecs,
                      BenchmarkPendingCallOwner.Instance,
                      TimeProvider.System);
                  return table.Capacity;
              }
          }
          CS
          done

      - name: Validate C1 correctness
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CANDIDATE"
          dotnet restore Sharplink.slnx
          dotnet build Sharplink.slnx --no-restore -c Release -v minimal
          dotnet test test/SharpLink.UnitTests/SharpLink.UnitTests.csproj --no-build -c Release --verbosity minimal

      - name: Build paired benchmark projects
        shell: bash
        run: |
          set -euxo pipefail
          dotnet build "$BASE/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj" -c Release -v minimal
          dotnet build "$CANDIDATE/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj" -c Release -v minimal

      - name: Run paired C1 evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/issue252-c1-results"
          mkdir -p "$OUT"

          run_bench() {
            local dir="$1"
            local variant="$2"
            local round="$3"
            local filter="$4"
            local key="$5"
            local artifacts="$OUT/${round}-${variant}-${key}"
            local log="$artifacts.log"
            echo "[issue252-C1] round=$round variant=$variant benchmark=$key"
            mkdir -p "$artifacts"
            (
              cd "$dir"
              dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj \
                -c Release --no-build -- \
                --filter "$filter" \
                --artifacts "$artifacts"
            ) | tee "$log"
          }

          # Construction allocation is large/deterministic enough that one paired run is sufficient
          # for this prototype viability check.
          run_bench "$BASE" eager-dev memory '*PendingRequestConstructionBenchmarks.ConstructAndDispose*' construction
          run_bench "$CANDIDATE" c1-lazy-flat memory '*PendingRequestConstructionBenchmarks.ConstructAndDispose*' construction

          # Alternate order to reduce runner drift when judging the <=3% hot-path gate.
          run_bench "$BASE" eager-dev 1 '*RuntimeHotPathBenchmarks.PendingRegisterAndComplete*' single
          run_bench "$CANDIDATE" c1-lazy-flat 1 '*RuntimeHotPathBenchmarks.PendingRegisterAndComplete*' single
          run_bench "$CANDIDATE" c1-lazy-flat 2 '*RuntimeHotPathBenchmarks.PendingRegisterAndComplete*' single
          run_bench "$BASE" eager-dev 2 '*RuntimeHotPathBenchmarks.PendingRegisterAndComplete*' single
          run_bench "$BASE" eager-dev 3 '*RuntimeHotPathBenchmarks.PendingRegisterAndComplete*' single
          run_bench "$CANDIDATE" c1-lazy-flat 3 '*RuntimeHotPathBenchmarks.PendingRegisterAndComplete*' single

          python3 - "$OUT" <<'PY'
          import csv
          import glob
          import json
          import statistics
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])

          def number_with_unit(value):
              value = value.strip()
              if value in ('', '-', 'NA', 'N/A'):
                  return 0.0, ''
              parts = value.replace(',', '').split()
              return float(parts[0]), parts[1] if len(parts) > 1 else ''

          def time_ns(value):
              number, unit = number_with_unit(value)
              scale = {'ns': 1.0, 'us': 1_000.0, 'µs': 1_000.0, 'ms': 1_000_000.0, 's': 1_000_000_000.0}
              return number * scale[unit]

          def bytes_value(value):
              number, unit = number_with_unit(value)
              scale = {'': 1.0, 'B': 1.0, 'KB': 1024.0, 'MB': 1024.0 * 1024.0, 'GB': 1024.0 * 1024.0 * 1024.0}
              return number * scale[unit]

          def row_for(pattern):
              files = glob.glob(str(root / pattern / 'results' / '*-report.csv'))
              if len(files) != 1:
                  raise SystemExit(f'expected one CSV for {pattern}, got {files}')
              with open(files[0], newline='') as f:
                  rows = list(csv.DictReader(f))
              if len(rows) != 1:
                  raise SystemExit(f'expected one benchmark row in {files[0]}, got {len(rows)}')
              return rows[0]

          memory_base = row_for('memory-eager-dev-construction')
          memory_c1 = row_for('memory-c1-lazy-flat-construction')
          base_construction_alloc = bytes_value(memory_base.get('Allocated', '0'))
          c1_construction_alloc = bytes_value(memory_c1.get('Allocated', '0'))

          rounds = []
          for round_no in (1, 2, 3):
              base = row_for(f'{round_no}-eager-dev-single')
              c1 = row_for(f'{round_no}-c1-lazy-flat-single')
              base_ns = time_ns(base['Mean'])
              c1_ns = time_ns(c1['Mean'])
              delta = (c1_ns / base_ns - 1.0) * 100.0
              rounds.append({
                  'round': round_no,
                  'base_single_ns': base_ns,
                  'candidate_single_ns': c1_ns,
                  'single_delta_percent': delta,
                  'base_allocated_b_per_op': bytes_value(base.get('Allocated', '0')),
                  'candidate_allocated_b_per_op': bytes_value(c1.get('Allocated', '0')),
              })

          deltas = [r['single_delta_percent'] for r in rounds]
          median_delta = statistics.median(deltas)
          within = sum(delta <= 3.0 for delta in deltas)
          hot_alloc_ok = all(r['candidate_allocated_b_per_op'] <= r['base_allocated_b_per_op'] for r in rounds)
          memory_ratio = c1_construction_alloc / base_construction_alloc if base_construction_alloc else 1.0
          passed = median_delta <= 3.0 and within >= 2 and hot_alloc_ok and memory_ratio <= 0.10

          result = {
              'experiment': 'C1-lazy-flat-first-touch',
              'gate_percent': 3.0,
              'base_construction_allocated_b': base_construction_alloc,
              'candidate_construction_allocated_b': c1_construction_alloc,
              'construction_allocation_reduction_percent': (1.0 - memory_ratio) * 100.0,
              'rounds': rounds,
              'median_single_delta_percent': median_delta,
              'single_rounds_within_gate': within,
              'hot_path_allocation_non_regression': hot_alloc_ok,
              'passed': passed,
          }
          print('EXPERIMENT_C1_RESULT=' + json.dumps(result, separators=(',', ':')))
          (root / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          if not passed:
              raise SystemExit('Experiment C1 missed the viability gate')
          PY

      - name: Upload C1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue252-experiment-c1
          path: ${{ runner.temp }}/issue252-c1-results
          if-no-files-found: warn
