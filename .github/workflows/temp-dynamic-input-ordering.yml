name: Temporary dynamic input close ordering
on:
  push:
    branches: ['validation/dynamic-input-close-order-20261115']
permissions:
  contents: read
jobs:
  components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-dotnet
      - name: Build existing real Session and generated-child component fixtures
        shell: bash
        run: |
          dotnet build test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release -v minimal
          dotnet build test/SharpLink.IntegrationTests/SharpLink.IntegrationTests.csproj -c Release -v minimal
      - name: Synchronous credit close-all ordering and retained physical controls
        shell: bash
        run: |
          mkdir -p artifacts/dynamic-input-ordering
          dotnet run --project test/SharpLink.UnitTests -c Release --no-build -- \
            --treenode-filter '/*/*/DynamicInputDrainOrderingTests/*' \
            --maximum-parallel-tests 1 --timeout 60s --output Detailed \
            --results-directory "$GITHUB_WORKSPACE/artifacts/dynamic-input-ordering/ordering" \
            > artifacts/dynamic-input-ordering/ordering.log 2>&1
          cat artifacts/dynamic-input-ordering/ordering.log
          dotnet run --project test/SharpLink.IntegrationTests -c Release --no-build -- \
            --treenode-filter '/*/*/DynamicInputDrainComponentTests/*' \
            --maximum-parallel-tests 1 --timeout 60s --output Detailed \
            --results-directory "$GITHUB_WORKSPACE/artifacts/dynamic-input-ordering/components" \
            > artifacts/dynamic-input-ordering/components.log 2>&1
          cat artifacts/dynamic-input-ordering/components.log
      - name: Require actual exact component results and HTML reports
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          p=Path('artifacts/dynamic-input-ordering')
          logs={}
          for name,total in [('ordering',1),('components',5)]:
              t=re.sub(r'\x1b\[[0-9;]*m','',(p/(name+'.log')).read_text())
              def count(k):
                  m=re.findall(r'\b'+k+r':\s*(\d+)\b',t)
                  return int(m[-1]) if m else 0
              assert [count(k) for k in ['total','failed','succeeded','skipped']] == [total,0,total,0],t
              logs[name]=t
          cases=[json.loads(s) for s in re.findall(r'\{"firstCodecCalls"[^\n]*?\}',logs['ordering'])]
          assert cases == [dict(firstCodecCalls=1,secondCodecCalls=0,
              lateSecondStreamEnteredBusinessCodec=False,drainCompleted=False,scalarRoutes=2)],cases
          reports=list(p.rglob('*report.html'))
          assert len(reports)==2,reports
          (p/'result.json').write_text(json.dumps(dict(source=os.environ['GITHUB_SHA'],
              ordering=cases[0],ordinaryPhysicalComponents=5,htmlReports=2),indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dynamic-input-ordering-${{ runner.os }}
          path: artifacts/dynamic-input-ordering
          retention-days: 30
