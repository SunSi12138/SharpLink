name: Issue 311 new review fixes

on:
  push:
    branches:
      - fix/311-codec-scope-routing
    paths:
      - .github/workflows/issue-311-new-review-fixes.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/311-codec-scope-routing
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1))

          # P1: dynamic is not a legal generated closed type (typeof(dynamic) is invalid C#).
          dto_path = 'src/SharpLink.Generator/RpcGenerator.DtoAnalysis.cs'
          replace_once(
              dto_path,
              '''            if (TrySelectContractCodecOverride(type, out var selectedAdapter))
            {
                if (selectedAdapter is not null)
                    AddAdapterModel(type, typeName, selectedAdapter);
                return;
            }
''',
              '''            if (type.TypeKind == TypeKind.Dynamic)
            {
                Report(DtoDiagnosticKind.Unsupported, type,
                    "dynamic values cannot be represented by generated Codec or RPC artifacts; use a concrete closed payload type");
                _failed.Add(typeName);
                return;
            }
            if (TrySelectContractCodecOverride(type, out var selectedAdapter))
            {
                if (selectedAdapter is not null)
                    AddAdapterModel(type, typeName, selectedAdapter);
                return;
            }
''')

          # P2: persist final generated codec kind/schema metadata and compare kind transitions
          # for directly-described payloads (DTOs, collections, arrays, Memory, Nullable, ...).
          manifest_path = Path('src/SharpLink.Generator/RpcGenerator.ContractManifest.cs')
          manifest = manifest_path.read_text()
          old_codec_emit = '''            document.Codecs.Add(new ContractManifestCodec
            {
                Type = RemoveGlobalPrefix(codec.TypeName),
                WireFormatId = codec.WireFormatId,
                SourceLocation = codec.Location
            });
'''
          new_codec_emit = '''            document.Codecs.Add(new ContractManifestCodec
            {
                Type = RemoveGlobalPrefix(codec.TypeName),
                WireFormatId = codec.WireFormatId,
                Kind = codec.Kind.ToString(),
                SchemaId = codec.SchemaId,
                SourceLocation = codec.Location
            });
'''
          if manifest.count(old_codec_emit) != 1:
              raise SystemExit('ContractManifest codec emission block not found exactly once')
          manifest = manifest.replace(old_codec_emit, new_codec_emit, 1)

          old_codec_model = '''    private sealed class ContractManifestCodec
    {
        public string Type { get; set; } = string.Empty;
        public string WireFormatId { get; set; } = string.Empty;
        [JsonIgnore] public Location? SourceLocation { get; set; }
    }
'''
          new_codec_model = '''    private sealed class ContractManifestCodec
    {
        public string Type { get; set; } = string.Empty;
        public string WireFormatId { get; set; } = string.Empty;
        public string? Kind { get; set; }
        public string? SchemaId { get; set; }
        [JsonIgnore] public Location? SourceLocation { get; set; }
    }
'''
          if manifest.count(old_codec_model) != 1:
              raise SystemExit('ContractManifest codec model block not found exactly once')
          manifest = manifest.replace(old_codec_model, new_codec_model, 1)

          start_marker = '        var baselineDtoNames = new HashSet<string>('
          end_marker = '        var currentEnums = current.Enums.ToDictionary'
          start = manifest.index(start_marker)
          end = manifest.index(end_marker, start)
          replacement = '''        var baselineDtoNames = new HashSet<string>(
            baseline.Dtos.Select(static dto => dto.Name), StringComparer.Ordinal);
        var currentDtoNames = new HashSet<string>(
            current.Dtos.Select(static dto => dto.Name), StringComparer.Ordinal);
        var baselineCodecs = baseline.Codecs.ToDictionary(static codec => codec.Type, StringComparer.Ordinal);
        var currentCodecs = current.Codecs.ToDictionary(static codec => codec.Type, StringComparer.Ordinal);
        var directlyDescribedCodecTypes = new HashSet<string>(
            baseline.Contracts
                .SelectMany(static contract => contract.Methods)
                .SelectMany(static method => method.Request.Append(method.Response))
                .Select(static value => value.Type)
                .Concat(baseline.Dtos.SelectMany(static dto => dto.Members).Select(static member => member.Type)),
            StringComparer.Ordinal);

        foreach (var type in directlyDescribedCodecTypes)
        {
            if (!baselineCodecs.TryGetValue(type, out var oldCodec) ||
                !currentCodecs.TryGetValue(type, out var newCodec) ||
                string.IsNullOrWhiteSpace(oldCodec.Kind) ||
                string.IsNullOrWhiteSpace(newCodec.Kind) ||
                string.Equals(oldCodec.Kind, newCodec.Kind, StringComparison.Ordinal))
            {
                continue;
            }

            diagnostics.Add(Change(
                ContractCompatibilityKind.WireType,
                newCodec.SourceLocation,
                type,
                $"direct Codec selection changed from {oldCodec.Kind}/{oldCodec.SchemaId ?? "unknown"} to {newCodec.Kind}/{newCodec.SchemaId ?? "unknown"}",
                "restore the previous generated Codec selection or publish a new RPC payload type"));
        }

        // API-format-1 baselines emitted before codec kind/schema metadata still need the
        // DTO transition fallback so their existing fingerprints remain valid and usable.
        foreach (var oldDto in baseline.Dtos)
        {
            if (currentDtoNames.Contains(oldDto.Name) ||
                !currentCodecs.TryGetValue(oldDto.Name, out var currentCodec))
            {
                continue;
            }
            if (baselineCodecs.TryGetValue(oldDto.Name, out var baselineCodec) &&
                !string.IsNullOrWhiteSpace(baselineCodec.Kind) &&
                !string.IsNullOrWhiteSpace(currentCodec.Kind))
            {
                continue;
            }
            diagnostics.Add(Change(
                ContractCompatibilityKind.WireType,
                currentCodec.SourceLocation,
                oldDto.Name,
                "Codec selection changed from a SharpLink native DTO to a non-DTO Codec",
                "restore the native DTO Codec or publish a new RPC payload type"));
        }
        foreach (var newDto in current.Dtos)
        {
            if (baselineDtoNames.Contains(newDto.Name) ||
                !baselineCodecs.TryGetValue(newDto.Name, out var baselineCodec))
            {
                continue;
            }
            if (currentCodecs.TryGetValue(newDto.Name, out var currentCodec) &&
                !string.IsNullOrWhiteSpace(baselineCodec.Kind) &&
                !string.IsNullOrWhiteSpace(currentCodec.Kind))
            {
                continue;
            }
            diagnostics.Add(Change(
                ContractCompatibilityKind.WireType,
                newDto.SourceLocation,
                newDto.Name,
                "Codec selection changed from a non-DTO Codec to a SharpLink native DTO",
                "restore the previous Codec selection or publish a new RPC payload type"));
        }

        foreach (var oldCodec in baseline.Codecs)
        {
            if (directlyDescribedCodecTypes.Contains(oldCodec.Type) ||
                !currentCodecs.TryGetValue(oldCodec.Type, out var newCodec) ||
                string.Equals(oldCodec.WireFormatId, newCodec.WireFormatId, StringComparison.Ordinal))
            {
                continue;
            }

            diagnostics.Add(Change(
                ContractCompatibilityKind.WireType,
                newCodec.SourceLocation,
                oldCodec.Type,
                $"nested Codec wire format changed from {oldCodec.WireFormatId} to {newCodec.WireFormatId}",
                "restore the previous nested wire format or add a new RPC payload type"));
        }

'''
          manifest = manifest[:start] + replacement + manifest[end:]
          manifest_path.write_text(manifest)

          # P1: multi-cluster dependency views must preserve owner-scoped route metadata.
          multicluster_path = 'src/SharpLink.Client/SharpLinkMultiClusterClientBuilder.cs'
          replace_once(
              multicluster_path,
              '''        public IReadOnlyList<IRpcGeneratedCodecFactory> Codecs => source.Codecs;
        public IReadOnlyList<string> Dependencies => source.Dependencies;
''',
              '''        public IReadOnlyList<IRpcGeneratedCodecFactory> Codecs => source.Codecs;
        public IReadOnlyList<Type> ManifestScopedCodecTargets => source.ManifestScopedCodecTargets;
        public IReadOnlyList<string> Dependencies => source.Dependencies;
''')

          # Regression: a broad Managed route must not turn dynamic into an illegal generated target.
          route_tests_path = Path('test/SharpLink.Generator.Tests/RpcCodecRouteTests.cs')
          route_tests = route_tests_path.read_text()
          route_marker = '    private static string BuildRouteSource(string contract)'
          dynamic_test = '''    [Test]
    public Task ManagedRouteShouldNotCaptureDynamicPayload()
    {
        var source = AddAssemblyAttributes(BuildRouteSource("""
[SharpLink.Sdk.RpcContract]
public interface IDynamicRouteContract : SharpLink.Sdk.IService
{
    ValueTask<dynamic> Echo(dynamic value, CancellationToken cancellationToken);
}

public sealed class RouteAdapter : TestRouteAdapterBase
{
    public override string AdapterId => "route.dynamic/v1";
    public override string WireFormatId => "route-dynamic-wire/v1";
}
"""),
            "[assembly: SharpLink.Sdk.RpcCodecAdapterRegistration(typeof(RouteAdapter), \\"route.dynamic/v1\\", \\"route-dynamic-wire/v1\\")]",
            "[assembly: SharpLink.Sdk.RpcCodecRoute(SharpLink.Sdk.RpcCodecScope.Managed, typeof(RouteAdapter))]");

        var diagnostics = RunGenerator(source);
        Ensure(diagnostics.Any(static diagnostic => diagnostic.Id == "SHARPLINK009"),
            "dynamic payloads must retain the SharpLink unsupported diagnostic instead of being routed");
        var generated = string.Join("\\n", RunGeneratorAndGetSources(source));
        Ensure(!generated.Contains("CreateCodec<dynamic>()", StringComparison.Ordinal),
            "dynamic must not enter a routed Codec factory");
        Ensure(!generated.Contains("typeof(dynamic)", StringComparison.Ordinal),
            "generated manifests must not contain illegal typeof(dynamic)");
        return Task.CompletedTask;
    }

'''
          if route_tests.count(route_marker) != 1:
              raise SystemExit('RpcCodecRouteTests helper marker not found exactly once')
          route_tests_path.write_text(route_tests.replace(route_marker, dynamic_test + route_marker, 1))

          # Regression: native generated collection -> Adapter with same WireFormatId is a wire break.
          contract_tests_path = Path('test/SharpLink.Generator.Tests/RpcCodecRouteContractManifestTests.cs')
          contract_tests = contract_tests_path.read_text()
          contract_marker = '    private static System.Text.Json.Nodes.JsonObject GetFirstRequestValue(string json)'
          collection_test = '''    [Test]
    public Task NativeRouteOnCollectionShouldBeWireBreakWhenWireFormatIdIsUnchanged()
    {
        const string contract = """
public sealed class NativeItem
{
    public int Value { get; set; }
}

[SharpLink.Sdk.RpcContract]
public interface ICollectionRouteContract : SharpLink.Sdk.IService
{
    ValueTask<System.Collections.Generic.List<NativeItem>> Echo(
        System.Collections.Generic.List<NativeItem> value,
        CancellationToken cancellationToken);
}

public sealed class RouteAdapter : TestRouteAdapterBase
{
    public override string AdapterId => "route.collection-kind/v1";
    public override string WireFormatId => "sharplink-native/v1";
}
""";
        const string registration =
            "[assembly: SharpLink.Sdk.RpcCodecAdapterRegistration(typeof(RouteAdapter), \\"route.collection-kind/v1\\", \\"sharplink-native/v1\\")]";
        var baselineSource = AddAssemblyAttributes(BuildRouteSource(contract), registration);
        var routedSource = AddAssemblyAttributes(
            BuildRouteSource(contract),
            registration,
            "[assembly: SharpLink.Sdk.RpcCodecRoute(SharpLink.Sdk.RpcCodecScope.Native, typeof(RouteAdapter))]");

        var baseline = RunContractGenerator(baselineSource);
        var compared = RunContractGenerator(routedSource, baseline.Json);
        Ensure(compared.Diagnostics.Any(static diagnostic => diagnostic.Id == "SHARPLINK030"),
            $"changing a direct collection from native generated List Codec to a routed Adapter must be a wire break even with the same WireFormatId. Diagnostics: {FormatDiagnostics(compared.Diagnostics)}");
        return Task.CompletedTask;
    }

'''
          if contract_tests.count(contract_marker) != 1:
              raise SystemExit('RpcCodecRouteContractManifestTests helper marker not found exactly once')
          contract_tests_path.write_text(contract_tests.replace(contract_marker, collection_test + contract_marker, 1))

          # Regression at the exact multi-cluster wrapper boundary: routed dependency metadata survives the view.
          Path('test/SharpLink.UnitTests/Client/RpcCodecRouteMultiClusterTests.cs').write_text('''using System.Linq;
using System.Reflection;
using SharpLink.Client;

namespace SharpLink.UnitTests.Client;

public sealed class RpcCodecRouteMultiClusterTests
{
    [Test]
    public Task DependencyManifestViewShouldPreserveRoutedCodecOwnership()
    {
        ISharpLinkGeneratedAssemblyManifest source = new RoutedDependencyManifest();
        var viewType = typeof(SharpLinkMultiClusterClientBuilder)
            .GetNestedType("DependencyManifestView", BindingFlags.NonPublic)!;
        var constructor = viewType
            .GetConstructors(BindingFlags.Instance | BindingFlags.Public | BindingFlags.NonPublic)
            .Single();
        var view = (ISharpLinkGeneratedAssemblyManifest)constructor.Invoke([source]);

        Ensure(view.Codecs.Count == 1 && view.Codecs[0].TargetType == typeof(ScopedPayload),
            "the dependency view must retain the routed generated Codec factory");
        Ensure(view.ManifestScopedCodecTargets.Count == 1 &&
               view.ManifestScopedCodecTargets[0] == typeof(ScopedPayload),
            "the dependency view must retain owner-scoped route metadata instead of publishing the Codec globally");
        return Task.CompletedTask;
    }

    private sealed class RoutedDependencyManifest : ISharpLinkGeneratedAssemblyManifest
    {
        public int ApiVersion => SharpLinkGeneratedManifestVersions.Api;
        public int ProtocolVersion => SharpLinkGeneratedManifestVersions.Protocol;
        public string GeneratorVersion => "test";
        public Assembly OwnerAssembly => typeof(RpcCodecRouteMultiClusterTests).Assembly;
        public string CompileTimeDescriptor => string.Empty;
        public IReadOnlyList<SharpLinkGeneratedContractDescriptor> Contracts => [];
        public IReadOnlyList<SharpLinkGeneratedServiceDescriptor> Services => [];
        public IReadOnlyList<IRpcGeneratedCodecFactory> Codecs => [new ScopedFactory()];
        public IReadOnlyList<Type> ManifestScopedCodecTargets => [typeof(ScopedPayload)];
        public IReadOnlyList<string> Dependencies => [];
    }

    private sealed class ScopedFactory : IRpcGeneratedCodecFactory
    {
        public Type TargetType => typeof(ScopedPayload);
        public string SchemaId => "scoped-dependency/v1";
        public string WireFormatId => "sharplink-native/v1";
        public string? AdapterId => null;
        public IRpcCodecAdapter? Adapter => null;
        public IRpcCodec Create(IRpcCodecProvider provider, IRpcCodecAdapterScope? adapterScope)
            => new ScopedCodec();
        public bool IsCompatibleCodec(IRpcCodec codec) => codec is IRpcCodec<ScopedPayload>;
    }

    private sealed class ScopedCodec : IRpcCodec<ScopedPayload>
    {
        public void Serialize(in ScopedPayload value, IBufferWriter<byte> buffer) { }
        public ScopedPayload Deserialize(in ReadOnlySequence<byte> buffer) => new();
    }

    private sealed class ScopedPayload;

    private static void Ensure(bool condition, string message)
    {
        if (!condition)
            throw new InvalidOperationException(message);
    }
}
''')
          PY

      - name: Format changed files
        run: >-
          dotnet format Sharplink.slnx whitespace --include
          src/SharpLink.Generator/RpcGenerator.DtoAnalysis.cs
          src/SharpLink.Generator/RpcGenerator.ContractManifest.cs
          src/SharpLink.Client/SharpLinkMultiClusterClientBuilder.cs
          test/SharpLink.Generator.Tests/RpcCodecRouteTests.cs
          test/SharpLink.Generator.Tests/RpcCodecRouteContractManifestTests.cs
          test/SharpLink.UnitTests/Client/RpcCodecRouteMultiClusterTests.cs

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Build
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Generator tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build

      - name: Unit tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Commit fixes
        run: |
          git config user.name "SunSi12138"
          git config user.email "54728594+SunSi12138@users.noreply.github.com"
          git add \
            src/SharpLink.Generator/RpcGenerator.DtoAnalysis.cs \
            src/SharpLink.Generator/RpcGenerator.ContractManifest.cs \
            src/SharpLink.Client/SharpLinkMultiClusterClientBuilder.cs \
            test/SharpLink.Generator.Tests/RpcCodecRouteTests.cs \
            test/SharpLink.Generator.Tests/RpcCodecRouteContractManifestTests.cs \
            test/SharpLink.UnitTests/Client/RpcCodecRouteMultiClusterTests.cs
          git diff --cached --check
          git commit -m "Address latest codec routing review feedback"
          git push origin HEAD:fix/311-codec-scope-routing
