name: Issue 410 partition FixedWindow unification

on:
  push:
    branches:
      - issue-410-dynamic-fixed-window-clean

permissions:
  contents: write

concurrency:
  group: issue-410-partition-unification
  cancel-in-progress: true

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Apply refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/issue410-partition-promote.py')
          text = path.read_text()

          old = 'replace_once(path, "        _fixedWindowStart = now;\\n", "")'
          new = '''replace_once(
              path,
              """        _tokenAnchor = now;\\n        _fixedWindowStart = now;\\n        _slidingSegmentStart = now;\\n""",
              """        _tokenAnchor = now;\\n        _slidingSegmentStart = now;\\n""",
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one constructor marker, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''replace_once(
              "src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs",
              """    internal void GrantConcurrencyWaitersAfterTargetCommit()\\n    {\\n        foreach (var binding in _ruleStateBindings)\\n            binding.ConcurrencyState?.GrantWaitersAfterTargetCommit();\\n        _partitions?.GrantConcurrencyWaitersAfterTargetCommit();\\n    }\\n\\n""",
              """    internal void GrantConcurrencyWaitersAfterTargetCommit()\\n    {\\n        foreach (var binding in _ruleStateBindings)\\n            binding.ConcurrencyState?.GrantWaitersAfterTargetCommit();\\n        _partitions?.GrantConcurrencyWaitersAfterTargetCommit();\\n    }\\n\\n    internal void PublishRateTargets()\\n    {\\n        foreach (var binding in _ruleStateBindings)\\n            binding.RateState?.OnPublished();\\n        _partitions?.PublishRateTargets();\\n    }\\n\\n""",
          )'''
          new = '''replace_once(
              "src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs",
              "internal sealed class SharpLinkAdmissionController : IAsyncDisposable",
              "internal sealed partial class SharpLinkAdmissionController : IAsyncDisposable",
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one controller publication transform, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''replace_once(
              "src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs",
              """    internal void GrantConcurrencyWaitersAfterTargetCommit()\\n    {\\n        lock (_gate)\\n        {\\n            foreach (var entry in _entries.Values)\\n            {\\n                foreach (var generation in entry.Generations)\\n                    generation.Concurrency?.GrantWaitersAfterTargetCommit();\\n            }\\n        }\\n    }\\n\\n""",
              """    internal void GrantConcurrencyWaitersAfterTargetCommit()\\n    {\\n        lock (_gate)\\n        {\\n            foreach (var entry in _entries.Values)\\n            {\\n                foreach (var generation in entry.Generations)\\n                    generation.Concurrency?.GrantWaitersAfterTargetCommit();\\n            }\\n        }\\n    }\\n\\n    internal void PublishRateTargets()\\n    {\\n        lock (_gate)\\n        {\\n            foreach (var entry in _entries.Values)\\n                entry.Current.Rate?.OnPublished();\\n        }\\n    }\\n\\n""",
          )'''
          new = '''replace_once(
              "src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs",
              "internal sealed class AdmissionPartitionPool : IDisposable",
              "internal sealed partial class AdmissionPartitionPool : IDisposable",
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one partition publication transform, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''replace_once(
              "src/SharpLink.Server/SharpLinkServer.AdmissionProgram.cs",
              "AdmissionRatePublication.PublishTargets(replacement.Controller);",
              "replacement.Controller.PublishRateTargets();",
          )
          publication = ROOT / "src/SharpLink.Server/Admission/AdmissionRatePublication.cs"
          if not publication.exists():
              raise RuntimeError("AdmissionRatePublication.cs unexpectedly missing")
          publication.unlink()'''
          new = '''replace_once(
              "src/SharpLink.Server/SharpLinkServer.AdmissionProgram.cs",
              "AdmissionRatePublication.PublishTargets(replacement.Controller);",
              "replacement.Controller.PublishRateTargets();",
          )
          publication = ROOT / "src/SharpLink.Server/Admission/AdmissionRatePublication.cs"
          publication.write_text("""namespace SharpLink.Server;

/// <summary>Post-pointer publication for stable FixedWindow targets.</summary>
internal sealed partial class SharpLinkAdmissionController
{
    internal void PublishRateTargets()
    {
        foreach (var binding in _ruleStateBindings)
            binding.RateState?.OnPublished();
        _partitions?.PublishRateTargets();
    }
}

internal sealed partial class AdmissionPartitionPool
{
    internal void PublishRateTargets()
    {
        lock (_gate)
        {
            foreach (var entry in _entries.Values)
                entry.Current.Rate?.OnPublished();
        }
    }
}
""")'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one publication-file transform, found {text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          python3 .github/issue410-partition-promote.py

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Format
        run: dotnet format whitespace Sharplink.slnx --no-restore

      - name: Maintainability
        run: bash eng/check-maintainability.sh

      - name: Build Release
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Remove staging harness and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/issue410-partition-promote.py
          rm .github/workflows/issue-410-partition-promote.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No refactor diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(admission): unify fixed-window partition state'
          git push origin HEAD:issue-410-dynamic-fixed-window-clean
