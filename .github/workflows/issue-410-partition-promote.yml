name: Issue 410 partition FixedWindow unification

on:
  push:
    branches:
      - issue-410-dynamic-fixed-window-clean

permissions:
  contents: write

concurrency:
  group: issue-410-partition-unification
  cancel-in-progress: true

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Apply refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/issue410-partition-promote.py')
          text = path.read_text()

          old = 'replace_once(path, "        _fixedWindowStart = now;\\n", "")'
          new = '''replace_once(
              path,
              """        _tokenAnchor = now;\\n        _fixedWindowStart = now;\\n        _slidingSegmentStart = now;\\n""",
              """        _tokenAnchor = now;\\n        _slidingSegmentStart = now;\\n""",
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one constructor marker, found {text.count(old)}')
          text = text.replace(old, new, 1)

          start_marker = '# Consolidate rate publication on the controller and include every current partition entry.'
          end_marker = '# The legacy state is now TokenBucket/SlidingWindow only; remove its dead FixedWindow branches.'
          start = text.index(start_marker)
          end = text.index(end_marker)
          support_source = (
              'namespace SharpLink.Server;\n\n'
              '/// <summary>Post-pointer publication for stable FixedWindow targets.</summary>\n'
              'internal sealed partial class SharpLinkAdmissionController\n'
              '{\n'
              '    internal void PublishRateTargets()\n'
              '    {\n'
              '        foreach (var binding in _ruleStateBindings)\n'
              '            binding.RateState?.OnPublished();\n'
              '        _partitions?.PublishRateTargets();\n'
              '    }\n'
              '}\n\n'
              'internal sealed partial class AdmissionPartitionPool\n'
              '{\n'
              '    internal void PublishRateTargets()\n'
              '    {\n'
              '        lock (_gate)\n'
              '        {\n'
              '            _publishedPolicy = _currentPolicy;\n'
              '            foreach (var entry in _entries.Values)\n'
              '                entry.Current.Rate?.OnPublished();\n'
              '        }\n'
              '    }\n'
              '}\n'
          )
          replacement = (
              start_marker + '\n'
              'replace_once(\n'
              '    "src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs",\n'
              '    "internal sealed class SharpLinkAdmissionController : IAsyncDisposable",\n'
              '    "internal sealed partial class SharpLinkAdmissionController : IAsyncDisposable",\n'
              ')\n'
              'replace_once(\n'
              '    "src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs",\n'
              '    "internal sealed class AdmissionPartitionPool : IDisposable",\n'
              '    "internal sealed partial class AdmissionPartitionPool : IDisposable",\n'
              ')\n'
              'replace_once(\n'
              '    "src/SharpLink.Server/SharpLinkServer.AdmissionProgram.cs",\n'
              '    "AdmissionRatePublication.PublishTargets(replacement.Controller);",\n'
              '    "replacement.Controller.PublishRateTargets();",\n'
              ')\n'
              'publication = ROOT / "src/SharpLink.Server/Admission/AdmissionRatePublication.cs"\n'
              f'publication.write_text({support_source!r})\n\n'
          )
          text = text[:start] + replacement + text[end:]

          insert_marker = '# Server-level partition integration: shared accounting snapshots and post-pointer queue activation.'
          published_state = '''# Partition entries created after publication must know which policy may publish its queued target.
          replace_once(
              "src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs",
              """    private SharpLinkPartitionAdmissionOptions _options;\\n    private AdmissionPartitionPolicyGeneration _currentPolicy;\\n    private List<AdmissionPartitionPolicyGeneration> _policies;\\n""",
              """    private SharpLinkPartitionAdmissionOptions _options;\\n    private AdmissionPartitionPolicyGeneration _currentPolicy;\\n    private AdmissionPartitionPolicyGeneration _publishedPolicy;\\n    private List<AdmissionPartitionPolicyGeneration> _policies;\\n""",
          )
          replace_once(
              "src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs",
              """        _currentPolicy = new AdmissionPartitionPolicyGeneration(this, _options, sequence: 1);\\n        _policies = [_currentPolicy];\\n""",
              """        _currentPolicy = new AdmissionPartitionPolicyGeneration(this, _options, sequence: 1);\\n        _publishedPolicy = _currentPolicy;\\n        _policies = [_currentPolicy];\\n""",
          )
          replace_once(
              "src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs",
              """            if (!ReferenceEquals(entry.Current.Policy, _currentPolicy))\\n            {\\n                throw new InvalidOperationException(\\n                    \"New admission partition entry did not converge to the current policy generation.\");\\n            }\\n            return entry;\\n""",
              """            if (!ReferenceEquals(entry.Current.Policy, _currentPolicy))\\n            {\\n                throw new InvalidOperationException(\\n                    \"New admission partition entry did not converge to the current policy generation.\");\\n            }\\n            if (ReferenceEquals(entry.Current.Policy, _publishedPolicy))\\n                entry.Current.Rate?.OnPublished();\\n            return entry;\\n""",
          )

          '''
          if text.count(insert_marker) != 1:
              raise SystemExit(f'expected one partition-test insertion marker, found {text.count(insert_marker)}')
          text = text.replace(insert_marker, published_state + insert_marker, 1)

          extra_test_marker = '    [Test]\n    [NotInParallel]\n    public async Task PartitionImmediateIncreaseMustNotWakeQueuedWorkBeforeProgramPublication()'
          extra_test = '''    [Test]
              public async Task OldSnapshotCreatingEntryAfterPublicationShouldSeePublishedQueuedTarget()
              {
                  await using var server = CreateServer();
                  var publicServer = (ISharpLinkServer)server;
                  publicServer.EnableAdmissionControl(options =>
                  {
                      Configure(options, 1);
                      ConfigureQueue(options);
                  });
                  var source = Current(server);
                  Ensure(source.TryAcquireUse(), "test must pin source before the partition entry exists");

                  try
                  {
                      publicServer.UpdateAdmissionControl(options =>
                      {
                          Configure(options, 3);
                          ConfigureQueue(options);
                      });

                      await ConsumeAsync(source, allowQueue: true);
                      var rebound = await source.Controller.AcquireAsync(
                          Context(), 1, allowQueue: true, CancellationToken.None);
                      Ensure(rebound.IsAcquired,
                          "old snapshot retry on an entry created after publication must use the published queued target");
                      rebound.Lease!.Dispose();
                  }
                  finally
                  {
                      source.ReleaseUse();
                  }
              }

          '''
          # Insert the generated test into the raw source emitted by the staging script.
          raw_test_marker = "    [Test]\\n    [NotInParallel]\\n    public async Task PartitionImmediateIncreaseMustNotWakeQueuedWorkBeforeProgramPublication()"
          generated_test_insert = extra_test.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n')
          test_patch = (
              "partition_text = partition_tests.read_text()\n"
              f"marker = {raw_test_marker!r}\n"
              f"insert = {extra_test!r}\n"
              "if partition_text.count(marker) != 1:\n"
              "    raise RuntimeError(f'expected one late-entry test marker, found {partition_text.count(marker)}')\n"
              "partition_tests.write_text(partition_text.replace(marker, insert + marker, 1))\n\n"
          )
          final_marker = 'print("issue #410 partition FixedWindow refactor staged")'
          if text.count(final_marker) != 1:
              raise SystemExit(f'expected one staging final marker, found {text.count(final_marker)}')
          text = text.replace(final_marker, test_patch + final_marker, 1)

          path.write_text(text)
          PY
          python3 .github/issue410-partition-promote.py

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Format
        run: dotnet format whitespace Sharplink.slnx --no-restore

      - name: Maintainability
        run: bash eng/check-maintainability.sh

      - name: Build Release
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Remove staging harness and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/issue410-partition-promote.py
          rm .github/workflows/issue-410-partition-promote.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No refactor diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(admission): unify fixed-window partition state'
          git push origin HEAD:issue-410-dynamic-fixed-window-clean
