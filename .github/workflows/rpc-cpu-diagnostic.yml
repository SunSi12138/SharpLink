name: Baseline User CPU Diagnostic

on:
  push:
    branches: [codex/rpc-cpu-diagnostic-validation]
    paths: ['eng/physical-ownership-probes/rpc-cpu-diagnostic/REQUEST.json']

permissions:
  contents: read

jobs:
  cpu-diagnostic:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/codex/rpc-cpu-diagnostic-validation' && github.run_attempt == 1 && github.event.head_commit.message == 'run: baseline CPU diagnostic C1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - name: Checkout reviewed tool request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tools
          fetch-depth: 2
          persist-credentials: false
      - name: Validate one-shot request and existing user-only perf before builds
        working-directory: tools
        run: python3 eng/physical-ownership-probes/rpc-cpu-diagnostic/gate.py "$RUNNER_TEMP/rpc-cpu/gate"
      - name: Checkout exact baseline product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 57f06f172d29fa5cfd4ea8e9b86a23f122df24ab
          path: sources/dev
          persist-credentials: false
      - name: Configure isolated build/runtime paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rpc-cpu/runtime-install" "$RUNNER_TEMP/rpc-cpu-cli"
          echo "DOTNET_CLI_HOME=$RUNNER_TEMP/rpc-cpu-cli" >> "$GITHUB_ENV"
          {
            echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/rpc-cpu-sdk"
            echo "PRIVATE_RUNTIME=$RUNNER_TEMP/rpc-cpu-runtime"
            echo "CPU_ROOT=$RUNNER_TEMP/rpc-cpu"
          } >> "$GITHUB_ENV"
      - name: Install exact build SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.102
      - name: Install SHA512-verified official private frameworks
        shell: bash
        run: |
          set -euo pipefail
          cd "$CPU_ROOT/runtime-install"
          curl --fail --silent --show-error --location https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json --output releases.json
          curl --fail --silent --show-error --location https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.14/dotnet-runtime-10.0.14-linux-x64.tar.gz --output dotnet.tar.gz
          curl --fail --silent --show-error --location https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.14/aspnetcore-runtime-10.0.14-linux-x64.tar.gz --output aspnetcore.tar.gz
          {
            echo '634326028645f38731c8c4e71a68356e4ca0d6b6607139a234ab760687f742063edaf33a1f20dda615742d2dc8300ca2ff857619d51fbb38090383b71334af89  dotnet.tar.gz'
            echo 'dd024fd2616926a555b75cbf7a836f6dce998199f0596d9d75676dca2b9d59c8ee8673c6ac23473c0f1a4bdd59eb5cd02fe9ab097eeaf2dd8c8bd117c85e7031  aspnetcore.tar.gz'
          } | sha512sum --check | tee framework-verification.log
          mkdir "$PRIVATE_RUNTIME"
          tar -xzf dotnet.tar.gz -C "$PRIVATE_RUNTIME"
          tar -xzf aspnetcore.tar.gz -C "$PRIVATE_RUNTIME"
      - name: Fixed baseline-only three CPU captures
        shell: bash
        working-directory: tools
        run: |
          set -euo pipefail
          python3 eng/physical-ownership-probes/rpc-cpu-diagnostic/run.py \
            --source "$GITHUB_WORKSPACE/sources/dev" \
            --build-dotnet "$DOTNET_INSTALL_DIR/dotnet" \
            --runtime-dotnet "$PRIVATE_RUNTIME/dotnet" \
            --gate "$RUNNER_TEMP/rpc-cpu/gate" \
            --output "$RUNNER_TEMP/rpc-cpu/evidence" 2>&1 | tee "$RUNNER_TEMP/rpc-cpu/driver.log"
      - name: Retain this diagnostic only including first failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-user-cpu-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rpc-cpu
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
