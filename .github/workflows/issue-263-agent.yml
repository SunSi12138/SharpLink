name: Issue 263 Candidate Validation

on:
  push:
    branches:
      - agent/issue-263-dynamic-interceptors
    paths:
      - .github/workflows/issue-263-agent.yml

permissions:
  contents: write
  issues: write

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate candidate iteration 2
        shell: bash
        run: bash .github/issue-263-validate.sh

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-263-validation-${{ github.sha }}
          path: artifacts/issue-263
          if-no-files-found: warn
          retention-days: 14

      - name: Report validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status='${{ job.status }}'
          head=$(cat artifacts/issue-263/validated-head.txt 2>/dev/null || git rev-parse HEAD)
          gh api repos/${{ github.repository }}/issues/263/comments \
            -f body="<!-- issue-263-agent-validation --> status=${status} run_id=${{ github.run_id }} head=${head}"
