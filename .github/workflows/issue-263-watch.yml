name: Issue 263 Watch

on:
  push:
    branches:
      - agent/issue-263-watch
    paths:
      - .github/workflows/issue-263-watch.yml

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report candidate branch runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          data=$(gh api 'repos/${{ github.repository }}/actions/runs?branch=agent/issue-263-dynamic-interceptors&per_page=20')
          rows=$(printf '%s' "$data" | jq -r '.workflow_runs[] | "id=\(.id) name=\(.name) event=\(.event) status=\(.status) conclusion=\(.conclusion // "pending") head=\(.head_sha)"')
          if [ -z "$rows" ]; then
            rows='no runs found for candidate branch'
          fi
          body="<!-- issue-263-agent-watch-list -->
\`\`\`
$rows
\`\`\`"
          gh api repos/${{ github.repository }}/issues/263/comments -f body="$body"
