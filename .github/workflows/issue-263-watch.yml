name: Issue 263 Watch

on:
  push:
    branches:
      - agent/issue-263-watch
    paths:
      - .github/workflows/issue-263-watch.yml

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report candidate validation run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          data=$(gh api 'repos/${{ github.repository }}/actions/runs?branch=agent/issue-263-dynamic-interceptors&per_page=20')
          row=$(printf '%s' "$data" | jq -c '[.workflow_runs[] | select(.name == "Issue 263 Candidate Validation")][0]')
          if [ "$row" = "null" ]; then
            body='<!-- issue-263-agent-watch --> no candidate validation run found'
          else
            run_id=$(printf '%s' "$row" | jq -r '.id')
            status=$(printf '%s' "$row" | jq -r '.status')
            conclusion=$(printf '%s' "$row" | jq -r '.conclusion // "pending"')
            head=$(printf '%s' "$row" | jq -r '.head_sha')
            body="<!-- issue-263-agent-watch --> run_id=${run_id} status=${status} conclusion=${conclusion} head=${head}"
          fi
          gh api repos/${{ github.repository }}/issues/263/comments -f body="$body"
