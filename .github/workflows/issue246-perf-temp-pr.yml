name: Issue 246 Perf Evidence PR (temporary)

permissions:
  contents: read

on:
  pull_request:
    branches: [dev]

concurrency:
  group: issue246-perf-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    if: github.event.pull_request.number == 257
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      REPS: '5'
      SCAN_ITERS: '500'
      LATENCY_SAMPLES: '20'
      HOTPATH_ITERS: '1000000'
    steps:
      - name: Checkout dev baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Extract identical harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/raw evidence/logs harness
          python3 - <<'PY'
          import re, textwrap
          from pathlib import Path
          src=Path('head/.github/workflows/issue246-perf-temp.yml').read_text()
          for name in ('Issue246Perf.csproj','Program.cs'):
              m=re.search(rf"cat > harness/{re.escape(name)} <<'EOF'\n(.*?)\n          EOF",src,re.S)
              if not m: raise SystemExit(f'cannot extract {name}')
              Path('harness',name).write_text(textwrap.dedent(m.group(1)))
          PY
          sed -i '/using SharpLink.Runtime;/i using SharpLink.Abstractions;' harness/Program.cs
          for v in base head; do
            mkdir -p "$v/artifacts/issue246-perf"
            cp harness/Issue246Perf.csproj harness/Program.cs "$v/artifacts/issue246-perf/"
          done

      - name: Capture environment and verify baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=$(git -C base rev-parse HEAD); HEAD_SHA=$(git -C head rev-parse HEAD)
          grep -Eq 'Rent[[:space:]]*\([[:space:]]*_maxCalls[[:space:]]*\)' base/src/SharpLink.Server/ServerCallDeadlineScheduler.cs
          {
            echo "base_sha=$BASE_SHA"; echo "head_sha=$HEAD_SHA"; echo "runner=${RUNNER_NAME:-unknown}"
            echo "kernel=$(uname -a)"; echo "dotnet=$(dotnet --version)"; echo "nproc=$(nproc)"
            echo "cpu_model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee evidence/environment.txt
          lscpu > evidence/lscpu.txt; dotnet --info > evidence/dotnet-info.txt

      - name: Build both variants
        shell: bash
        run: |
          set -euo pipefail
          for v in base head; do
            echo "===== RESTORE $v ====="
            dotnet restore "$v/artifacts/issue246-perf/Issue246Perf.csproj" 2>&1 | tee "evidence/logs/${v}-restore.log"
            echo "===== BUILD $v ====="
            dotnet build "$v/artifacts/issue246-perf/Issue246Perf.csproj" -c Release --no-restore -v minimal 2>&1 | tee "evidence/logs/${v}-build.log"
          done

      - name: Run ABBA measurements pinned to one logical CPU
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(nproc)" -ge 3 ]; then CPU=2; else CPU=0; fi
          echo "cpu=$CPU" | tee evidence/cpu-pin.txt
          BASE_DLL="$PWD/base/artifacts/issue246-perf/bin/Release/net10.0/SharpLink.Benchmarks.dll"
          HEAD_DLL="$PWD/head/artifacts/issue246-perf/bin/Release/net10.0/SharpLink.Benchmarks.dll"
          run_one() {
            variant="$1"; mode="$2"; name="$3"; max="$4"; active="$5"; shape="$6"; rep="$7"
            if [ "$variant" = base ]; then dll="$BASE_DLL"; else dll="$HEAD_DLL"; fi
            file="evidence/raw/${variant}-${name}-${mode}-rep$(printf '%02d' "$rep").json"
            taskset -c "$CPU" dotnet "$dll" --variant "$variant" --mode "$mode" --max "$max" --active "$active" --shape "$shape" --iterations "$SCAN_ITERS" --latency-samples "$LATENCY_SAMPLES" --hotpath-iterations "$HOTPATH_ITERS" > "$file"
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$file"
          }
          for rep in $(seq 1 "$REPS"); do
            if [ $((rep % 2)) -eq 1 ]; then ORDER='base head'; else ORDER='head base'; fi
            echo "rep=$rep order=$ORDER"
            for variant in $ORDER; do run_one "$variant" hotpath hotpath 1024 1 clustered "$rep"; done
            while IFS='|' read -r name max active shape latency; do
              for variant in $ORDER; do
                run_one "$variant" scan "$name" "$max" "$active" "$shape" "$rep"
                if [ "$latency" = yes ]; then run_one "$variant" latency "$name" "$max" "$active" "$shape" "$rep"; fi
              done
            done <<'EOF'
          default_1024_a8|1024|8|staggered|yes
          high_65536_a8|65536|8|staggered|yes
          high_65536_a1024|65536|1024|staggered|yes
          high_65536_a128_clustered|65536|128|clustered|yes
          high_65536_a0_clear|65536|0|clustered|no
          EOF
          done

      - name: Summarize evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json,math,statistics
          from collections import defaultdict
          from pathlib import Path
          root=Path('evidence'); data=[json.loads(p.read_text()) for p in sorted((root/'raw').glob('*.json'))]
          groups=defaultdict(list)
          for d in data:
              s='hotpath' if d['mode']=='hotpath' else f"max={d['max_calls']} active={d['active_calls']} {d.get('shape','')}"
              groups[(s,d['mode'],d['variant'])].append(d)
          metrics={'scan':['requested_min_length','actual_rented_length','snapshot_rented_bytes','cold_scan_ns','scan_ns_per_op','working_set_cold_delta_bytes','peak_working_set_bytes'],'latency':['batch_lateness_ns_p50','batch_lateness_ns_p95','batch_lateness_ns_p99','batch_lateness_ns_max'],'hotpath':['set_remove_ns_per_op','allocated_b_per_op']}
          rows=[]
          for s,m in sorted({(k[0],k[1]) for k in groups}):
              b=groups.get((s,m,'base'),[]); h=groups.get((s,m,'head'),[])
              if not b or not h: continue
              for k in metrics[m]:
                  bm=statistics.median(float(x[k]) for x in b); hm=statistics.median(float(x[k]) for x in h); d=(hm/bm-1)*100 if bm else float('nan')
                  rows.append((s,m,k,bm,hm,d,len(b)))
          with (root/'summary.csv').open('w',newline='') as f:
              w=csv.writer(f); w.writerow(['scenario','mode','metric','base_median','head_median','delta_percent','runs_each']); w.writerows(rows)
          lines=['# Issue #246 GitHub-hosted base/head evidence','', 'Same hosted VM/job, same pinned logical CPU, five alternating ABBA repetitions.','', '| Scenario | Mode | Metric | Base median | Head median | Delta |','|---|---|---|---:|---:|---:|']
          for s,m,k,b,h,d,n in rows:
              ds='n/a' if not math.isfinite(d) else f'{d:+.2f}%'; lines.append(f'| {s} | {m} | {k} | {b:,.2f} | {h:,.2f} | {ds} |')
          lines += ['', 'Hosted-runner CPU/lateness values are comparative evidence, not bare-metal absolute guarantees. Snapshot sizing and managed B/op are resource-oriented measurements.']
          (root/'summary.md').write_text('\n'.join(lines)+'\n'); print((root/'summary.md').read_text())
          PY
          cat evidence/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue246-perf-evidence
          path: evidence
          if-no-files-found: warn
          retention-days: 14
