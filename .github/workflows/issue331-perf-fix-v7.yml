name: Issue 331 Perf Fix V7

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Match BCL exhausted probe field-read shape
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/SharpLink.Server/Admission/AdmissionLimiterState.cs')
          text = path.read_text()
          old = '''        if (Volatile.Read(ref _active) >= Volatile.Read(ref _permitLimit) ||\n            Volatile.Read(ref _disposed) != 0)\n'''
          new = '''        if (_active >= _permitLimit || _disposed != 0)\n'''
          if old not in text:
              raise SystemExit('reject probe pattern missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Validate formatting and full unit suite
        shell: bash
        env:
          TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          set -euxo pipefail
          dotnet restore Sharplink.slnx
          dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal
          dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-restore

      - name: Commit tested patch and remove helper
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/workflows/issue331-perf-fix-v7.yml
          git add src/SharpLink.Server/Admission/AdmissionLimiterState.cs .github/workflows/issue331-perf-fix-v7.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use BCL-shaped exhausted admission probe'
          git push origin HEAD:issue-331-dynamic-admission-update
