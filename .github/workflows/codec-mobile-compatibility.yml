name: Codec Mobile Evidence

# This workflow currently exercises only non-Mono mobile codec evidence.
# Mono-based Android/iOS coverage is intentionally excluded from this matrix.

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/codec-mobile-compatibility.yml'
      - 'src/SharpLink.Runtime/Codec/**'
      - 'src/SharpLink.Runtime/SharpLink.Runtime.csproj'
      - 'test/SharpLink.CodecCompatibility/**'
      - 'test/SharpLink.CodecCompatibility.Android/**'
      - 'test/SharpLink.CodecCompatibility.Browser/portable-artifacts.mjs'

concurrency:
  group: codec-mobile-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      SHARPLINK_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Record SDK version
        shell: bash
        run: echo "SHARPLINK_SDK_VERSION=$(dotnet --version)" >> "$GITHUB_ENV"

      - name: Produce canonical desktop corpus
        run: >-
          dotnet run -c Release
          --project test/SharpLink.CodecCompatibility/SharpLink.CodecCompatibility.csproj
          -- produce
          --output artifacts/codec-compat/desktop-reference

      - name: Upload canonical desktop corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codec-mobile-corpus-desktop-linux-x64
          path: artifacts/codec-compat/desktop-reference
          if-no-files-found: error
          retention-days: 30

  android:
    needs: desktop-reference
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      SHARPLINK_COMMIT: ${{ github.sha }}
      ANDROID_API: '35'
      ANDROID_AVD: sharplink-codec
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Record SDK version
        shell: bash
        run: echo "SHARPLINK_SDK_VERSION=$(dotnet --version)" >> "$GITHUB_ENV"

      - name: Download canonical desktop corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codec-mobile-corpus-desktop-linux-x64
          path: artifacts/codec-compat/producers/codec-mobile-corpus-desktop-linux-x64

      - name: Prepare Android x64 emulator
        shell: bash
        run: |
          sudo chmod 666 /dev/kvm || true
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-$ANDROID_API" "system-images;android-$ANDROID_API;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVDMANAGER" create avd --force --name "$ANDROID_AVD" --package "system-images;android-$ANDROID_API;google_apis;x86_64" --device pixel_6
          echo "Visible AVDs:"
          emulator -list-avds
          emulator -list-avds | grep -Fx "$ANDROID_AVD"
          nohup emulator -avd "$ANDROID_AVD" -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > artifacts-android-emulator.log 2>&1 &
          if ! timeout 180 adb wait-for-device; then
            cat artifacts-android-emulator.log
            exit 1
          fi
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]]; then
            cat artifacts-android-emulator.log
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.product.cpu.abi

      - name: Build and run Android CoreCLR producer
        shell: bash
        run: |
          rm -rf test/SharpLink.CodecCompatibility.Android/bin test/SharpLink.CodecCompatibility.Android/obj
          dotnet build -c Debug -f net10.0-android -r android-x64 \
            test/SharpLink.CodecCompatibility.Android/SharpLink.CodecCompatibility.Android.csproj \
            -t:SignAndroidPackage \
            -p:CodecRuntime=coreclr \
            -p:AndroidPackageFormats=apk \
            -p:AndroidBuildApplicationPackage=true
          apk="$(find test/SharpLink.CodecCompatibility.Android/bin/Debug -name '*-Signed.apk' -type f | head -n 1)"
          test -n "$apk"
          cp "$apk" artifacts/codec-compat/android-coreclr.apk
          adb install -r "$apk"
          node test/SharpLink.CodecCompatibility.Android/run-android.mjs \
            produce artifacts/codec-compat/android-coreclr-corpus \
            "$SHARPLINK_COMMIT" "$SHARPLINK_SDK_VERSION" CoreCLR
          adb uninstall com.sharplink.codeccompat || true

      - name: Assemble Android CoreCLR producer fan-in
        shell: bash
        run: |
          mkdir -p artifacts/codec-compat/producers/codec-mobile-corpus-android-x64-coreclr
          cp -R artifacts/codec-compat/android-coreclr-corpus/. artifacts/codec-compat/producers/codec-mobile-corpus-android-x64-coreclr/

      - name: Verify documented edges on Android CoreCLR
        shell: bash
        env:
          SHARPLINK_SKIP_BUILTIN_RAW: '1'
        run: |
          adb install -r artifacts/codec-compat/android-coreclr.apk
          node test/SharpLink.CodecCompatibility.Android/run-android.mjs \
            verify artifacts/codec-compat/producers \
            artifacts/codec-compat/android-coreclr-verification/verification.json \
            "$SHARPLINK_COMMIT" "$SHARPLINK_SDK_VERSION" CoreCLR
          adb uninstall com.sharplink.codeccompat || true

      - name: Append raw evidence for Android CoreCLR
        run: |
          node test/SharpLink.CodecCompatibility.Browser/portable-artifacts.mjs \
            append-raw artifacts/codec-compat/android-coreclr-verification/verification.json \
            artifacts/codec-compat/producers artifacts/codec-compat/android-coreclr-corpus
          node test/SharpLink.CodecCompatibility.Browser/portable-artifacts.mjs \
            check-report artifacts/codec-compat/android-coreclr-verification/verification.json

      - name: Upload Android CoreCLR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codec-mobile-evidence-android-x64
          path: |
            artifacts/codec-compat/android-coreclr-corpus
            artifacts/codec-compat/android-coreclr-verification/verification.json
            artifacts/codec-compat/android-coreclr-verification/verification-progress.log
            artifacts-android-emulator.log
          if-no-files-found: warn
          retention-days: 30

  summary:
    needs: android
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require Android CoreCLR job
        shell: bash
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          if [[ "$ANDROID_RESULT" != "success" ]]; then
            echo "::error::Android CoreCLR codec evidence result: $ANDROID_RESULT"
            exit 1
          fi

      - name: Download Android CoreCLR evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codec-mobile-evidence-android-x64
          path: artifacts/codec-compat/verifications

      - name: Locate Android CoreCLR verification report
        shell: bash
        run: |
          report="$(find artifacts/codec-compat/verifications -path '*android-coreclr-verification/verification.json' -type f | head -n 1)"
          if [[ -z "$report" ]]; then
            echo "::error::Android CoreCLR verification report was not found."
            exit 1
          fi
          echo "CORECLR_REPORT=$report" >> "$GITHUB_ENV"

      - name: Validate Android CoreCLR evidence report
        run: >-
          node test/SharpLink.CodecCompatibility.Browser/portable-artifacts.mjs
          check-report
          "$CORECLR_REPORT"
