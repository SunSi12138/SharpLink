name: PR Fast

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Start Fast validation timing
        run: echo "FAST_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Production Project Reference Boundary Guard
        run: python3 eng/check-project-reference-boundaries.py

      - name: Verify Formatting
        run: dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Maintainability Debt Gate Tests
        run: python3 eng/test-verify-maintainability.py

      - name: Maintainability Debt Gate
        run: bash eng/check-maintainability.sh

      - name: Build Release
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Verify Generated Assemblies Do Not Reference Runtime
        run: ./eng/verify-generated-assembly-dependencies.sh

      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Generator Tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build

      - name: Load Test Tests
        run: dotnet test --project test/SharpLink.LoadTest.Tests/SharpLink.LoadTest.Tests.csproj -c Release --no-build

      - name: Record Fast validation steps elapsed
        if: always()
        shell: bash
        run: |
          now=$(date +%s)
          elapsed=$((now - FAST_STARTED_AT))
          minutes=$((elapsed / 60))
          seconds=$((elapsed % 60))
          {
            echo "### PR Fast timing"
            echo
            printf -- "- Fast validation steps elapsed: %dm %02ds\n" "$minutes" "$seconds"
            echo "- Scope: first workflow step through the final validation step; runner setup and action post-cleanup are excluded"
            echo "- Full Fast job target: <= 3m under normal hosted-runner conditions"
            echo "- Hard timeout: 5m"
            echo "- Previous PR Quick full active-duration median: 7m 03s (representative fresh-run range: 6m 47s to 7m 06s)"
            echo "- Compare the completed Actions job timestamps for an exact like-for-like full-duration comparison"
          } >> "$GITHUB_STEP_SUMMARY"
