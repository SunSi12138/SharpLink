name: PR Fast

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      SHARPLINK_MATRIX_TIER: smoke
      SHARPLINK_MATRIX_REPETITIONS: '1'
      SHARPLINK_MATRIX_WORKLOADS: unary,streams
      SHARPLINK_MATRIX_STREAM_OPERATION: all
      SHARPLINK_MATRIX_OUTPUT: ${{ github.workspace }}/artifacts/performance/issue-399-baseline/${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Record environment
        shell: bash
        run: |
          mkdir -p artifacts/performance/issue-399-baseline/${{ github.sha }}
          dotnet --info > artifacts/performance/issue-399-baseline/${{ github.sha }}/dotnet-info.txt
          uname -a > artifacts/performance/issue-399-baseline/${{ github.sha }}/uname.txt
          lscpu > artifacts/performance/issue-399-baseline/${{ github.sha }}/cpu.txt

      - name: Run issue 399 performance baseline
        run: ./eng/run-performance-matrix.sh

      - name: Upload issue 399 baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-399-performance-baseline-${{ github.sha }}
          path: artifacts/performance/issue-399-baseline/${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
