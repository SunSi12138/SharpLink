name: PR Fast

permissions:
  contents: write

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Apply, validate, and commit final review fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev --depth=1
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          codec = Path('src/SharpLink.Generator/RpcGenerator.CodecIdentity.cs')
          text = codec.read_text()
          if 'GetEnumDeclarationSemanticIdentity' not in text:
              replacement = '''        private string GetFixedMemberSemanticIdentity(GeneratedMemberModel member)
              {
                  var typeName = member.FixedTypeName ?? member.TypeName;
                  if (string.Equals(typeName, "System.DateTimeOffset", StringComparison.Ordinal) ||
                      string.Equals(typeName, "global::System.DateTimeOffset", StringComparison.Ordinal))
                  {
                      return "datetime-offset/dto-offset-minutes-i16le-padding6-utc-ticks-i64le/v1";
                  }

                  if (member.EnumUnderlyingType is not null &&
                      TryResolveReachableType(member.TypeName, out var fixedMemberType) &&
                      fixedMemberType is INamedTypeSymbol { TypeKind: TypeKind.Enum } enumType)
                  {
                      return string.Join(
                          ":",
                          "fixed/v1",
                          member.FixedSize.ToString(InvariantCulture),
                          GetEnumDeclarationSemanticIdentity(enumType));
                  }

                  return string.Join(
                      ":",
                      "fixed/v1",
                      member.FixedSize.ToString(InvariantCulture),
                      member.EnumUnderlyingType ?? typeName);
              }

              private static string GetEnumDeclarationSemanticIdentity(INamedTypeSymbol enumType)
              {
                  var parts = new List<string>
                  {
                      "enum-declaration/v1",
                      enumType.ToDisplayString(SymbolDisplayFormat.FullyQualifiedFormat),
                      enumType.EnumUnderlyingType!.ToDisplayString(SymbolDisplayFormat.FullyQualifiedFormat)
                  };
                  foreach (var field in enumType.GetMembers()
                               .OfType<IFieldSymbol>()
                               .Where(static field => field.HasConstantValue)
                               .OrderBy(static field => field.Name, StringComparer.Ordinal))
                  {
                      parts.Add(field.Name + "=" + Convert.ToString(field.ConstantValue, InvariantCulture));
                  }
                  return string.Join("|", parts);
              }

'''
              pattern = r'        private static string GetFixedMemberSemanticIdentity\(GeneratedMemberModel member\)\n        \{.*?\n        \}\n\n(?=        private bool TryGetFrameworkPrimitiveCodecHash)'
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'fixed-member regex count={count}')
              old = '''                hash = Hashing.GetSemanticHash(
                          "codec/v1",
                          "enum",
                          GetFinalCodecHash(enumUnderlying, cache, stack).ToHex());'''
              new = '''                hash = Hashing.GetSemanticHash(
                          "codec/v1",
                          "enum",
                          GetFinalCodecHash(enumUnderlying, cache, stack).ToHex(),
                          GetEnumDeclarationSemanticIdentity((INamedTypeSymbol)type));'''
              if text.count(old) != 1:
                  raise SystemExit(f'direct enum marker count={text.count(old)}')
              text = text.replace(old, new)
              codec.write_text(text)

          replace_one(
              'test/SharpLink.CodecCompatibility/Fixtures.cs',
              '            new Fixture<DateTimeOffset>("DateTimeOffsetRaw", "builtin-semantic-raw", new DateTimeOffset(2026, 8, 20, 12, 34, 56, TimeSpan.FromHours(8)), static (left, right) => left.Ticks == right.Ticks && left.UtcTicks == right.UtcTicks && left.Offset == right.Offset),',
              '            new Fixture<DateTimeOffset>("DateTimeOffsetRaw", "builtin-semantic-raw", new DateTimeOffset(2026, 8, 20, 12, 34, 56, TimeSpan.FromHours(8)), static (left, right) => left.Ticks == right.Ticks && left.UtcTicks == right.UtcTicks && left.Offset == right.Offset),\n            new Fixture<DateTimeOffsetContainer>("DateTimeOffsetNestedRaw", "builtin-semantic-raw", new DateTimeOffsetContainer { Prefix = 0x5A, Value = new DateTimeOffset(2026, 8, 20, 12, 34, 56, TimeSpan.FromHours(8)), Tail = 0x0102030405060708 }, static (left, right) => left.Prefix == right.Prefix && left.Value.Ticks == right.Value.Ticks && left.Value.UtcTicks == right.Value.UtcTicks && left.Value.Offset == right.Value.Offset && left.Tail == right.Tail, false, nameof(DateTimeOffsetContainer.Prefix), nameof(DateTimeOffsetContainer.Value), nameof(DateTimeOffsetContainer.Tail)),')
          replace_one(
              'test/SharpLink.CodecCompatibility/Fixtures.cs',
              '[StructLayout(LayoutKind.Sequential)]\ninternal struct NestedPadded { public ByteInt32 Inner; public byte Tail; public long Count; }',
              '[StructLayout(LayoutKind.Sequential)]\ninternal struct NestedPadded { public ByteInt32 Inner; public byte Tail; public long Count; }\n\n[StructLayout(LayoutKind.Sequential)]\ninternal struct DateTimeOffsetContainer { public byte Prefix; public DateTimeOffset Value; public long Tail; }')

          replace_one(
              'doc/contracts-and-codecs.md',
              '- 当前 Generator Manifest 仍沿用 `SchemaId` / `WireFormatId` 作为既有 generated registration 与 baseline infrastructure；#386 只负责确定 assembly-owned final Codec graph，不把这些字符串扩展成新的 per-type compatibility model。后续 #396 会以 fixed-width `CodecHash` / `RpcAssemblyHash` 替换长期 identity 模型并执行 assembly-level exact equality。',
              '- 当前 Phase 1 identity 模型由最终 Codec graph 上的 fixed-width `CodecHash`、方法/契约 hash 与 `RpcAssemblyHash` 组成；dispatch route ID 只负责路由，不承担 wire compatibility identity。远端 assembly hash 发布与 bind-time exact equality 仍属于 #396 后续阶段。')
          old_doc = '''Generated RPC 的 Codec 由 Contract assembly 在编译期拥有并冻结。对非 Framework wire primitive 的闭合 CLR 类型，手写 `IRpcCodec<T>` 只通过 `RpcCodec` 精确绑定。当前 dev 仍要求 Codec 用 `RpcCodecImplementation` 提供 legacy wire/schema registration identity；这不是 #386 新定义的长期 compatibility API，后续由 #396 的 hash identity 模型替换：

```csharp
[assembly: RpcCodec(typeof(MyType), typeof(MyTypeCodec))]

[RpcCodecImplementation("my-type/v1", "my-type-schema/v1")]
public sealed class MyTypeCodec : IRpcCodec<MyType>
{
    // ...
}
```'''
          new_doc = '''Generated RPC 的 Codec 由 Contract assembly 在编译期拥有并冻结。对非 Framework wire primitive 的闭合 CLR 类型，手写 `IRpcCodec<T>` 只通过 `RpcCodec` 精确绑定。Opaque custom Codec 必须用 `[RpcCodecSemanticIdentity(high, low)]` 声明其 wire semantic identity；最终 `CodecHash` 将这份显式 identity 纳入方法、契约与 `RpcAssemblyHash`。只要编码含义或兼容性发生变化，就必须 bump semantic identity：

```csharp
[assembly: RpcCodec(typeof(MyType), typeof(MyTypeCodec))]

[RpcCodecSemanticIdentity(0x0123456789ABCDEF, 0xFEDCBA9876543210)]
public sealed class MyTypeCodec : IRpcCodec<MyType>
{
    // ...
}
```'''
          replace_one('doc/contracts-and-codecs.md', old_doc, new_doc)
          replace_one(
              'doc/contracts-and-codecs.md',
              '这个原始表示包含结构体 padding；它既不是 canonical field-wise 编码，也不能把普通 `new`/`default` 后的 padding 为零当作跨运行时安全保证。',
              '这个原始表示包含结构体 padding；它既不是 canonical field-wise 编码，也不能把普通 `new`/`default` 后的 padding 为零当作跨运行时安全保证。UnsafeBlit 的兼容性承诺收敛为同一 protocol/release 的受支持 runtime/platform matrix 内稳定；它不承诺跨 protocol/release 或任意 CLR ABI 的 raw-layout 可移植性。')

          Path('test/SharpLink.Generator.Tests/RpcCodecEighthReviewRegressionTests.cs').write_text(r'''using System;
using System.Linq;
using System.Threading.Tasks;

namespace SharpLink.Generator.Tests;

public partial class RpcAnalyzerTests
{
    [Test]
    public Task EnumValueMappingShouldParticipateInDirectAndDtoCodecIdentity()
    {
        static string DirectSource(bool swapped)
        {
            var members = swapped ? "Ok = 1, Error = 0" : "Ok = 0, Error = 1";
            return BuildSource($$"""
public enum Status : byte { {{members}} }

[SharpLink.Sdk.RpcContract]
public interface IDirectEnumIdentityContract : SharpLink.Sdk.IService
{
    ValueTask<Status> Echo(Status value, CancellationToken cancellationToken);
}
""");
        }

        static string DtoSource(bool swapped)
        {
            var members = swapped ? "Ok = 1, Error = 0" : "Ok = 0, Error = 1";
            return BuildSource($$"""
public enum Status : byte { {{members}} }

[SharpLink.Sdk.RpcSerializable]
public sealed class EnumEnvelope
{
    public Status Value { get; set; }
}

[SharpLink.Sdk.RpcContract]
public interface IDtoEnumIdentityContract : SharpLink.Sdk.IService
{
    ValueTask<EnumEnvelope> Echo(EnumEnvelope value, CancellationToken cancellationToken);
}
""");
        }

        static string Manifest(string source)
            => RunGeneratorAndGetSources(source)
                .Single(static generated => generated.Contains("ISharpLinkGeneratedAssemblyManifest", StringComparison.Ordinal));

        var directBaseline = Manifest(DirectSource(swapped: false));
        var directChanged = Manifest(DirectSource(swapped: true));
        Ensure(
            ExtractGeneratedRpcAssemblyHash(directBaseline) != ExtractGeneratedRpcAssemblyHash(directChanged),
            "swapping enum name/value mappings must change RpcAssemblyHash for a direct enum contract even when the underlying byte width is unchanged");

        var dtoBaseline = Manifest(DtoSource(swapped: false));
        var dtoChanged = Manifest(DtoSource(swapped: true));
        Ensure(
            ExtractGeneratedCodecIdentity(dtoBaseline, "EnumEnvelope") != ExtractGeneratedCodecIdentity(dtoChanged, "EnumEnvelope"),
            "enum declaration identity must propagate through fixed DTO members");
        Ensure(
            ExtractGeneratedRpcAssemblyHash(dtoBaseline) != ExtractGeneratedRpcAssemblyHash(dtoChanged),
            "the DTO enum mapping change must propagate into RpcAssemblyHash");
        return Task.CompletedTask;
    }
}
''')
          PY

          git rm -f .github/workflows/pr415-review-run.yml .github/workflows/pr415-review-scan.yml
          git show origin/dev:.github/workflows/pr-fast.yml > .github/workflows/pr-fast.yml

          git diff --check
          dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release
          dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release
          dotnet build test/SharpLink.CodecCompatibility/SharpLink.CodecCompatibility.csproj -c Release
          dotnet run --project test/SharpLink.CodecCompatibility/SharpLink.CodecCompatibility.csproj -c Release -- self --output /tmp/codec-self

          git config user.name "SunSi12138"
          git config user.email "54728594+SunSi12138@users.noreply.github.com"
          git add src test doc .github/workflows
          if git diff --cached --quiet; then
            echo "No review patch changes remain."
            exit 0
          fi
          git commit -m "fix: close deterministic identity review gaps"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Start Fast validation timing
        run: echo "FAST_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Production Project Reference Boundary Guard
        run: python3 eng/check-project-reference-boundaries.py

      - name: Verify Formatting
        run: dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Maintainability Debt Gate Tests
        run: python3 eng/test-verify-maintainability.py

      - name: Maintainability Debt Gate
        run: bash eng/check-maintainability.sh

      - name: Build Release
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Verify Generated Assemblies Do Not Reference Runtime
        run: ./eng/verify-generated-assembly-dependencies.sh

      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Generator Tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build

      - name: Load Test Tests
        run: dotnet test --project test/SharpLink.LoadTest.Tests/SharpLink.LoadTest.Tests.csproj -c Release --no-build

      - name: Record Fast validation steps elapsed
        if: always()
        shell: bash
        run: |
          now=$(date +%s)
          elapsed=$((now - FAST_STARTED_AT))
          minutes=$((elapsed / 60))
          seconds=$((elapsed % 60))
          {
            echo "### PR Fast timing"
            echo
            printf -- "- Fast validation steps elapsed: %dm %02ds\n" "$minutes" "$seconds"
            echo "- Scope: first workflow step through the final validation step; runner setup and action post-cleanup are excluded"
            echo "- Full Fast job target: <= 3m under normal hosted-runner conditions"
            echo "- Hard timeout: 5m"
            echo "- Previous PR Quick full active-duration median: 7m 03s (representative fresh-run range: 6m 47s to 7m 06s)"
            echo "- Compare the completed Actions job timestamps for an exact like-for-like full-duration comparison"
          } >> "$GITHUB_STEP_SUMMARY"
