name: PR Fast

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: issue-399-bdn-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast:
    name: issue-399-benchmarkdotnet-ab
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      ISSUE399_BASE: e42e80c5e87c2fa075d45bbae0f46c00dcd67821
      ISSUE399_HEAD: d3fdfe424cbd3585c616f279416060e6aea842c5
      ISSUE399_ARTIFACT_ROOT: ${{ runner.temp }}/issue399-bdn
    steps:
      - name: Checkout exact baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ISSUE399_BASE }}
          fetch-depth: 1
          clean: true

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Record runner environment
        shell: bash
        run: |
          mkdir -p "$ISSUE399_ARTIFACT_ROOT/environment"
          printf '%s\n' "$ISSUE399_BASE" > "$ISSUE399_ARTIFACT_ROOT/environment/base-sha.txt"
          printf '%s\n' "$ISSUE399_HEAD" > "$ISSUE399_ARTIFACT_ROOT/environment/head-sha.txt"
          dotnet --info > "$ISSUE399_ARTIFACT_ROOT/environment/dotnet-info.txt"
          uname -a > "$ISSUE399_ARTIFACT_ROOT/environment/uname.txt"
          lscpu > "$ISSUE399_ARTIFACT_ROOT/environment/cpu.txt"

      - name: BenchmarkDotNet exact baseline
        shell: bash
        run: |
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release -- \
            --filter '*UnaryBenchmarks.Rpc_Add*' \
                     '*StreamingBenchmarks.Rpc_ClientStreamUpload*' \
                     '*StreamingBenchmarks.Rpc_ServerStreamDownload*' \
                     '*StreamingBenchmarks.Rpc_DuplexStream*' \
            --artifacts "$ISSUE399_ARTIFACT_ROOT/baseline"

      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ISSUE399_HEAD }}
          fetch-depth: 1
          clean: true

      - name: BenchmarkDotNet exact candidate head
        shell: bash
        run: |
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release -- \
            --filter '*UnaryBenchmarks.Rpc_Add*' \
                     '*StreamingBenchmarks.Rpc_ClientStreamUpload*' \
                     '*StreamingBenchmarks.Rpc_ServerStreamDownload*' \
                     '*StreamingBenchmarks.Rpc_DuplexStream*' \
            --artifacts "$ISSUE399_ARTIFACT_ROOT/head"

      - name: Stage evidence
        if: always()
        shell: bash
        run: |
          rm -rf artifacts/issue399-bdn
          mkdir -p artifacts/issue399-bdn
          cp -R "$ISSUE399_ARTIFACT_ROOT/." artifacts/issue399-bdn/

      - name: Upload issue 399 BenchmarkDotNet A/B evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-399-bdn-ab-${{ github.sha }}
          path: artifacts/issue399-bdn
          if-no-files-found: error
          retention-days: 30
