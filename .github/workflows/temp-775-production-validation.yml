name: Temporary 775 remaining platform validation

permissions:
  contents: read

on:
  push:
    branches: ['codex/775-production-integration']

# Remove this workflow after its source-bound reports are consumed. This is not
# a full Unit/release-green claim: paused/red #387 is deliberately not executed.
# Run43592141330 already supplies all three binding/Integration reports and verified
# package/fresh-sample/three-host packaged Trim/AOT evidence for unchanged product0c236531.
# Only the documentation compiler selector and missing downstream gates run here.
jobs:
  remaining-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      TUNIT_MAX_PARALLEL_TESTS: '8'
      SHARPLINK_AOT_RID: ${{ matrix.rid }}
      SHARPLINK_AOT_OUTPUT: ${{ github.workspace }}/artifacts/775-ci/native
    steps:
      - name: Preserve repository line endings on the hosted Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dotnet
      - name: Build ordinary Release solution
        run: dotnet build Sharplink.slnx -c Release -v minimal
      - name: Generator documentation and outstanding load-driver tests
        shell: bash
        run: |
          for project in Generator.Tests LoadTest.Tests StreamLoadTest.Tests; do
            dotnet test --project "test/SharpLink.$project/SharpLink.$project.csproj" -c Release --no-build
          done
      - name: Real native process, topology, sidecar and pre-credit smokes
        shell: bash
        run: bash eng/run-shared-memory-aot-process-smoke.sh
      - name: Preserve platform evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 775-platform-${{ matrix.rid }}-${{ github.sha }}
          path: |
            artifacts/775-ci/native/*.log
            artifacts/775-ci/native/sharppack-sidecar/*.log
            artifacts/775-ci/native/precredit/*.log
            test/*/bin/Release/net10.0/TestResults
          if-no-files-found: warn
          retention-days: 30
