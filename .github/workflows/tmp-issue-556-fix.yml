name: Apply issue 556 minimal fix

on:
  push:
    branches: [tmp/issue-556-fix-runner]
    paths:
      - .github/workflows/tmp-issue-556-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout validation PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/pending-pool-lifecycle-validation
          fetch-depth: 0

      - name: Apply minimal deadline scan fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/SharpLink.Client/PendingRequestTable.cs')
          text = path.read_text(encoding='utf-8')
          old = '''    private void ScanExpiredDeadlines()
    {
        if (Volatile.Read(ref _disposed) != 0)
            return;

        var slots = Volatile.Read(ref _slots);
        if (slots is null)
            return;

        for (var index = 0; index < slots.Length; index++)
        {
            var call = Volatile.Read(ref slots[index]);
            if (call is null || !call.Deadline.HasValue)
                continue;
            if (call.Deadline.IsExpired(_timeProvider))
            {
                TryComplete(call.Id, PendingCallCompletionReason.DeadlineExceeded);
            }
            else
            {
                _deadlineScheduler.Observe(call.Deadline);
            }
        }
    }
'''
          new = '''    private bool TryTakeExpiredCallAtIndex(
        PendingCall?[] slots,
        int index,
        PendingCall expected,
        long expectedId,
        out PendingCall? call)
    {
        lock (expected.CompletionGate)
        {
            if (!ReferenceEquals(Volatile.Read(ref slots[index]), expected) ||
                expected.Id != expectedId ||
                !expected.Deadline.HasValue ||
                !expected.Deadline.IsExpired(_timeProvider))
            {
                call = null;
                return false;
            }

            if (!ReferenceEquals(Interlocked.CompareExchange(ref slots[index], null, expected), expected))
            {
                call = null;
                return false;
            }

            expected.WaitUntilRegistered();
            call = expected;
            return true;
        }
    }

    private void ScanExpiredDeadlines()
    {
        if (Volatile.Read(ref _disposed) != 0)
            return;

        var slots = Volatile.Read(ref _slots);
        if (slots is null)
            return;

        for (var index = 0; index < slots.Length; index++)
        {
            var call = Volatile.Read(ref slots[index]);
            if (call is null)
                continue;

            // This first sample is only a cheap candidate filter. The request identity,
            // authoritative deadline check and slot removal are revalidated together below.
            var expectedId = call.Id;
            var deadline = call.Deadline;
            if (!deadline.HasValue)
                continue;
            if (deadline.IsExpired(_timeProvider))
            {
                if (!TryTakeExpiredCallAtIndex(slots, index, call, expectedId, out var expiredCall))
                    continue;

                var emptyPayload = ReadOnlySequence<byte>.Empty;
                CompleteTakenCall(
                    expiredCall!, PendingCallCompletionReason.DeadlineExceeded, exception: null, ref emptyPayload);
            }
            else
            {
                _deadlineScheduler.Observe(deadline);
            }
        }
    }
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one scanner target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff --stat

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Build validation workers
        run: dotnet build test/SharpLink.UnitTests -c Release -v minimal

      - name: Run deterministic issue 556 regression workers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/issue-556
          for scenario in deadline-response deadline-cancel deadline-disconnect; do
            output="$PWD/artifacts/issue-556/${scenario}.json"
            SHARPLINK_VALIDATION_SCENARIO="$scenario" \
            SHARPLINK_VALIDATION_OUTPUT="$output" \
              dotnet run -c Release --no-build --no-launch-profile \
              --project test/SharpLink.UnitTests -- \
              --treenode-filter '/*/*/PendingLifecycleValidationProbe/Run' \
              --maximum-parallel-tests 1
            python3 - "$output" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          assert report['sameReference'] is True
          assert report['futureBefore'] is True and report['futureAfter'] is True
          assert report['invariant'] is True, report
          assert report['secondError'] is None, report
          assert report['active'] == 0 and report['count'] == 0, report
          print(json.dumps(report))
          PY
          done

      - name: Commit and publish fix to validation PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/SharpLink.Client/PendingRequestTable.cs
          git commit -m "fix(client): bind deadline scan to pending identity"
          git push origin HEAD:refs/heads/test/pending-pool-lifecycle-validation
