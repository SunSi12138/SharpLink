name: Issue 474 Ready Bridge

on:
  push:
    branches:
      - fix/474-call-admission-diagnostics

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  ready-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/474-call-admission-diagnostics
          fetch-depth: 0

      - name: Remove bridge from final head
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-474-ready-bridge.yml
          git commit -m "chore: remove temporary ready bridge"
          git push origin HEAD:fix/474-call-admission-diagnostics

      - name: Mark PR ready and run final validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr ready 475 --repo "$GITHUB_REPOSITORY"
          gh workflow run pr-fast.yml --repo "$GITHUB_REPOSITORY" --ref fix/474-call-admission-diagnostics
          gh workflow run pr-extended.yml --repo "$GITHUB_REPOSITORY" --ref fix/474-call-admission-diagnostics
