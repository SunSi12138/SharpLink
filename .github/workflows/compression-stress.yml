name: Compression Stress

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: compression-stress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compression-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      SHARPLINK_RUN_COMPRESSION_STRESS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore test/SharpLink.IntegrationTests/SharpLink.IntegrationTests.csproj

      - name: Build
        run: dotnet build test/SharpLink.IntegrationTests/SharpLink.IntegrationTests.csproj --no-restore -c Release -v minimal

      - name: Run 100k compressed rejection stress
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.IntegrationTests
          --
          --maximum-parallel-tests 1
          --timeout 10m
          --treenode-filter "/*/*/CompressionMergeGateValidationTests/HundredThousandCapacityRejectedCompressedRequestsShouldNotDecodeOrLeakAccounting"
