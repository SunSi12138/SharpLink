name: Issue 311 final codec binding refactor

on:
  push:
    branches: [fix/311-codec-scope-routing]
    paths:
      - '.github/workflows/issue-311-contract-diff-fix.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/issue-311-contract-diff-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'fix/311-codec-scope-routing'
    runs-on: ubuntu-24.04
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/311-codec-scope-routing
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Apply final ownership and direct Codec binding refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_block(path, start_marker, end_marker, replacement):
              p = Path(path)
              text = p.read_text()
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              p.write_text(text[:start] + replacement + text[end:])

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise RuntimeError(f"{path}: marker not found: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Existing attribute: allow a direct closed IRpcCodec<T> binding to carry its stable wire identity.
          path = 'src/SharpLink.Abstractions/Sdk/RpcCodecAdapterAttribute.cs'
          p = Path(path)
          text = p.read_text()
          text = text.replace(
              '/// <summary>Explicitly selects a registered Codec adapter for a closed RPC payload type.</summary>',
              '/// <summary>Explicitly selects a registered Codec adapter or direct Codec for a closed RPC payload type.</summary>')
          text = text.replace(
              '    /// <summary>Gets the selected adapter implementation type.</summary>\n    public Type AdapterType { get; }\n',
              '    /// <summary>Gets the selected adapter or direct Codec implementation type.</summary>\n    public Type AdapterType { get; }\n\n    /// <summary>Gets or sets the stable wire-format identity for a direct IRpcCodec&lt;T&gt; binding.</summary>\n    public string? WireFormatId { get; set; }\n')
          p.write_text(text)

          # Three analysis views: standalone/static-global, Contract default, and Contract policy.
          path = 'src/SharpLink.Generator/RpcGenerator.DtoAnalysis.cs'
          replace_block(
              path,
              '    private static DtoGenerationResult AnalyzeGeneratedCodecs(',
              '        private void CollectCurrentAssemblyRoots(',
          '''    private static DtoGenerationResult AnalyzeGeneratedCodecs(
              Compilation compilation,
              CancellationToken cancellationToken)
          {
              var standalone = new DtoAnalysisState(compilation, cancellationToken, DtoAnalysisMode.Standalone).Analyze();
              var contractDefault = new DtoAnalysisState(compilation, cancellationToken, DtoAnalysisMode.ContractDefault).Analyze();
              var contractPolicy = new DtoAnalysisState(compilation, cancellationToken, DtoAnalysisMode.ContractPolicy).Analyze();
              var globalCodecs = MergeGlobalCodecs(contractDefault.Codecs, standalone.Codecs);
              var contractCodecs = SelectContractScopedCodecs(globalCodecs, contractPolicy.Codecs);
              var diagnostics = standalone.Diagnostics
                  .Concat(contractPolicy.Diagnostics)
                  .GroupBy(static item => (item.Kind, item.TypeName, item.Detail))
                  .Select(static group => group.First())
                  .ToImmutableArray();
              var enums = standalone.Enums
                  .Concat(contractDefault.Enums)
                  .Concat(contractPolicy.Enums)
                  .GroupBy(static item => item.TypeName, StringComparer.Ordinal)
                  .Select(static group => group.First())
                  .OrderBy(static item => item.TypeName, StringComparer.Ordinal)
                  .ToImmutableArray();
              return new DtoGenerationResult(
                  globalCodecs,
                  contractCodecs,
                  contractPolicy.Codecs,
                  diagnostics,
                  enums);
          }

          private static ImmutableArray<GeneratedCodecModel> MergeGlobalCodecs(
              ImmutableArray<GeneratedCodecModel> contractDefault,
              ImmutableArray<GeneratedCodecModel> standalone)
          {
              var byType = contractDefault.ToDictionary(static codec => codec.TypeName, StringComparer.Ordinal);
              foreach (var codec in standalone)
                  byType[codec.TypeName] = codec;
              return byType.Values
                  .OrderBy(static codec => codec.TypeName, StringComparer.Ordinal)
                  .ToImmutableArray();
          }

          private static ImmutableArray<GeneratedCodecModel> SelectContractScopedCodecs(
              ImmutableArray<GeneratedCodecModel> globalCodecs,
              ImmutableArray<GeneratedCodecModel> contractCodecs)
          {
              var globalByType = globalCodecs.ToDictionary(static codec => codec.TypeName, StringComparer.Ordinal);
              var scopedTypes = new HashSet<string>(StringComparer.Ordinal);

              foreach (var codec in contractCodecs)
              {
                  if (!globalByType.TryGetValue(codec.TypeName, out var global) ||
                      !HasSameCodecDefinition(global, codec))
                  {
                      scopedTypes.Add(codec.TypeName);
                  }
              }

              bool changed;
              do
              {
                  changed = false;
                  foreach (var codec in contractCodecs)
                  {
                      if (scopedTypes.Contains(codec.TypeName))
                          continue;
                      if (GetCodecDependencies(codec).Any(scopedTypes.Contains))
                          changed |= scopedTypes.Add(codec.TypeName);
                  }
              }
              while (changed);

              return contractCodecs
                  .Where(codec => scopedTypes.Contains(codec.TypeName))
                  .OrderBy(static codec => codec.TypeName, StringComparer.Ordinal)
                  .ToImmutableArray();
          }

          private static IEnumerable<string> GetCodecDependencies(GeneratedCodecModel codec)
          {
              if (codec.ElementType is not null)
                  yield return codec.ElementType;
              if (codec.KeyType is not null)
                  yield return codec.KeyType;
              if (codec.ValueType is not null)
                  yield return codec.ValueType;
              foreach (var member in codec.Members)
              {
                  if (member.Kind == GeneratedMemberKind.Complex)
                      yield return member.TypeName;
              }
          }

          private static bool HasSameCodecDefinition(GeneratedCodecModel left, GeneratedCodecModel right)
          {
              if (!string.Equals(left.TypeName, right.TypeName, StringComparison.Ordinal) ||
                  !string.Equals(left.SchemaId, right.SchemaId, StringComparison.Ordinal) ||
                  left.Kind != right.Kind || left.IsReferenceType != right.IsReferenceType ||
                  !string.Equals(left.ElementType, right.ElementType, StringComparison.Ordinal) ||
                  !string.Equals(left.KeyType, right.KeyType, StringComparison.Ordinal) ||
                  !string.Equals(left.ValueType, right.ValueType, StringComparison.Ordinal) ||
                  !string.Equals(left.AdapterType, right.AdapterType, StringComparison.Ordinal) ||
                  !string.Equals(left.AdapterId, right.AdapterId, StringComparison.Ordinal) ||
                  !string.Equals(left.WireFormatId, right.WireFormatId, StringComparison.Ordinal) ||
                  !left.ConstructorMembers.SequenceEqual(right.ConstructorMembers, StringComparer.Ordinal) ||
                  !left.AssemblyDependencies.SequenceEqual(right.AssemblyDependencies, StringComparer.Ordinal) ||
                  left.Members.Length != right.Members.Length)
              {
                  return false;
              }

              for (var index = 0; index < left.Members.Length; index++)
              {
                  if (left.Members[index] with { Location = null } != right.Members[index] with { Location = null })
                      return false;
              }
              return true;
          }

          private enum DtoAnalysisMode
          {
              Standalone,
              ContractDefault,
              ContractPolicy
          }

          private sealed record DtoAnalysisPassResult(
              ImmutableArray<GeneratedCodecModel> Codecs,
              ImmutableArray<DtoDiagnosticModel> Diagnostics,
              ImmutableArray<GeneratedEnumModel> Enums);

          private sealed partial class DtoAnalysisState
          {
              private const int MaximumDepth = 64;
              private readonly Compilation _compilation;
              private readonly CancellationToken _cancellationToken;
              private readonly DtoAnalysisMode _mode;
              private readonly HashSet<string> _allowedAssemblyNames;
              private readonly Dictionary<ITypeSymbol, AdapterRegistration> _adaptersByType =
                  new(SymbolEqualityComparer.Default);
              private readonly Dictionary<ITypeSymbol, AdapterRegistration> _adaptersBySelector =
                  new(SymbolEqualityComparer.Default);
              private readonly Dictionary<ITypeSymbol, ExplicitBindingCandidate> _assemblyBindings =
                  new(SymbolEqualityComparer.Default);
              private readonly Dictionary<string, GeneratedCodecModel> _models = new(StringComparer.Ordinal);
              private readonly Dictionary<string, GeneratedEnumModel> _enums = new(StringComparer.Ordinal);
              private readonly HashSet<string> _failed = new(StringComparer.Ordinal);
              private readonly HashSet<string> _diagnosticKeys = new(StringComparer.Ordinal);
              private readonly List<DtoDiagnosticModel> _diagnostics = [];

              public DtoAnalysisState(
                  Compilation compilation,
                  CancellationToken cancellationToken,
                  DtoAnalysisMode mode)
              {
                  _compilation = compilation;
                  _cancellationToken = cancellationToken;
                  _mode = mode;
                  _allowedAssemblyNames = ResolveReferenceAssemblyNames(compilation);
                  _allowedAssemblyNames.Add(compilation.Assembly.Identity.Name);
                  CollectAdapterRegistrations();
                  if (_mode != DtoAnalysisMode.ContractDefault)
                      CollectAssemblyBindings();
                  if (_mode == DtoAnalysisMode.ContractPolicy)
                      CollectAssemblyRoutes();
              }

              public DtoAnalysisPassResult Analyze()
              {
                  var roots = new Dictionary<string, ITypeSymbol>(StringComparer.Ordinal);
                  CollectCurrentAssemblyRoots(
                      _compilation.Assembly.GlobalNamespace,
                      roots,
                      includeSerializable: _mode == DtoAnalysisMode.Standalone,
                      includeContracts: _mode != DtoAnalysisMode.Standalone);
                  if (_mode != DtoAnalysisMode.Standalone)
                      CollectReferencedContractRoots(roots);

                  foreach (var root in roots.OrderBy(static pair => pair.Key, StringComparer.Ordinal))
                  {
                      _cancellationToken.ThrowIfCancellationRequested();
                      Visit(root.Value, [], 0);
                  }

                  return new DtoAnalysisPassResult(
                      _models.Values.OrderBy(static model => model.TypeName, StringComparer.Ordinal).ToImmutableArray(),
                      _diagnostics.ToImmutableArray(),
                      _enums.Values.OrderBy(static item => item.TypeName, StringComparer.Ordinal).ToImmutableArray());
              }

          ''')

          # Assembly explicit bindings preserve the existing attribute but can carry direct-Codec wire identity.
          replace_block(
              path,
              '        private void CollectAssemblyBindings()',
              '        private void Visit(ITypeSymbol type, List<ITypeSymbol> stack, int depth)',
          '''        private void CollectAssemblyBindings()
          {
              foreach (var attribute in _compilation.Assembly.GetAttributes()
                           .Where(static attribute => IsAttribute(attribute, "SharpLink.Sdk", "RpcCodecAdapterAttribute")))
              {
                  var location = attribute.ApplicationSyntaxReference?.GetSyntax(_cancellationToken).GetLocation() ?? Location.None;
                  if (attribute.ConstructorArguments.Length != 2 ||
                      attribute.ConstructorArguments[0].Value is not ITypeSymbol target ||
                      attribute.ConstructorArguments[1].Value is not INamedTypeSymbol implementation)
                  {
                      Report(DtoDiagnosticKind.AdapterBindingInvalid, _compilation.Assembly,
                          "assembly-level RpcCodecAdapter requires targetType and an adapter or direct Codec implementation type", location);
                      continue;
                  }
                  if (HasTypeParameter(target))
                  {
                      Report(DtoDiagnosticKind.AdapterTargetInvalid, target,
                          "Codec target must be a closed type", location);
                      continue;
                  }
                  target = NormalizeAdapterTarget(target);
                  if (IsNonOverridableBuiltin(target))
                  {
                      Report(DtoDiagnosticKind.BuiltinAdapterOverride, target,
                          "built-in primitive Codecs cannot be rebound by RpcCodecAdapter", location);
                      continue;
                  }
                  AddAssemblyBinding(
                      target,
                      new ExplicitBindingCandidate(implementation, GetAttributeWireFormatId(attribute), location));
              }
          }

          private void AddAssemblyBinding(ITypeSymbol target, ExplicitBindingCandidate candidate)
          {
              if (_assemblyBindings.TryGetValue(target, out var existing) &&
                  (!SymbolEqualityComparer.Default.Equals(existing.ImplementationType, candidate.ImplementationType) ||
                   !string.Equals(existing.WireFormatId, candidate.WireFormatId, StringComparison.Ordinal)))
              {
                  Report(DtoDiagnosticKind.AdapterSelectionConflict, target,
                      "the target is explicitly bound to multiple different Codec implementations",
                      candidate.Location);
                  return;
              }
              _assemblyBindings[target] = candidate;
          }

          private static string? GetAttributeWireFormatId(AttributeData attribute)
          {
              foreach (var namedArgument in attribute.NamedArguments)
              {
                  if (namedArgument.Key == "WireFormatId")
                      return namedArgument.Value.Value as string;
              }
              return null;
          }

          ''')

          # Explicit selection is disabled only for the ContractDefault view.
          p = Path(path)
          text = p.read_text()
          old = '''            var hasSelectedOverride = _contractMode
              ? TrySelectContractCodecOverride(type, out var selectedAdapter)
              : TrySelectAdapter(type, out selectedAdapter);
          if (hasSelectedOverride)
          {
              if (selectedAdapter is not null)
                  AddAdapterModel(type, typeName, selectedAdapter);
              return;
          }
          '''
          new = '''            ExplicitCodecSelection? selectedCodec = null;
          var hasSelectedOverride = _mode switch
          {
              DtoAnalysisMode.ContractPolicy => TrySelectContractCodecOverride(type, out selectedCodec),
              DtoAnalysisMode.Standalone => TrySelectExplicitCodec(type, out selectedCodec),
              _ => false
          };
          if (hasSelectedOverride)
          {
              if (selectedCodec is not null)
                  AddExplicitCodecModel(type, typeName, selectedCodec);
              return;
          }
          '''
          if old not in text:
              raise RuntimeError('Visit explicit selection block not found')
          text = text.replace(old, new, 1)
          text = text.replace('GetCodecName(typeName, _contractMode)',
                              'GetCodecName(typeName, _mode == DtoAnalysisMode.ContractPolicy)')
          p.write_text(text)

          # Resolve explicit attributes as either registered adapter or direct closed IRpcCodec<T>.
          replace_block(
              path,
              '        private bool TrySelectAdapter(ITypeSymbol type, out AdapterRegistration? selected)',
              '        private static bool IsValidAdapterType(INamedTypeSymbol type)',
          '''        private bool TrySelectExplicitCodec(ITypeSymbol type, out ExplicitCodecSelection? selected)
          {
              if (!TryCollectExplicitCodecCandidates(type, reportInvalid: true, out var candidates))
              {
                  selected = null;
                  _failed.Add(GetTypeName(type));
                  return true;
              }
              if (candidates.Count == 0)
              {
                  selected = null;
                  return false;
              }

              var selections = new List<ExplicitCodecSelection>();
              foreach (var candidate in candidates)
              {
                  if (!TryResolveExplicitCodecCandidate(type, candidate, reportInvalid: true, out var resolved))
                  {
                      selected = null;
                      _failed.Add(GetTypeName(type));
                      return true;
                  }
                  if (resolved is not null &&
                      !selections.Any(existing => ExplicitSelectionsEqual(existing, resolved)))
                  {
                      selections.Add(resolved);
                  }
              }

              if (selections.Count != 1)
              {
                  Report(DtoDiagnosticKind.AdapterSelectionConflict, type,
                      "the target selects multiple different explicit Codec implementations", candidates[0].Location);
                  selected = null;
                  _failed.Add(GetTypeName(type));
                  return true;
              }
              selected = selections[0];
              return true;
          }

          private bool HasResolvableExplicitCodec(ITypeSymbol type)
          {
              if (!TryCollectExplicitCodecCandidates(type, reportInvalid: false, out var candidates) ||
                  candidates.Count == 0)
              {
                  return false;
              }

              var selections = new List<ExplicitCodecSelection>();
              foreach (var candidate in candidates)
              {
                  if (!TryResolveExplicitCodecCandidate(type, candidate, reportInvalid: false, out var resolved) ||
                      resolved is null)
                  {
                      return false;
                  }
                  if (!selections.Any(existing => ExplicitSelectionsEqual(existing, resolved)))
                      selections.Add(resolved);
              }
              return selections.Count == 1;
          }

          private bool TryCollectExplicitCodecCandidates(
              ITypeSymbol type,
              bool reportInvalid,
              out List<ExplicitBindingCandidate> candidates)
          {
              candidates = [];
              foreach (var attribute in type.GetAttributes())
              {
                  var location = attribute.ApplicationSyntaxReference?.GetSyntax(_cancellationToken).GetLocation() ??
                      type.Locations.FirstOrDefault() ?? Location.None;
                  if (IsAttribute(attribute, "SharpLink.Sdk", "RpcCodecAdapterAttribute"))
                  {
                      if (attribute.ConstructorArguments.Length != 1 ||
                          attribute.ConstructorArguments[0].Value is not INamedTypeSymbol implementation)
                      {
                          if (reportInvalid)
                          {
                              Report(DtoDiagnosticKind.AdapterBindingInvalid, type,
                                  "type-level RpcCodecAdapter requires only an adapter or direct Codec implementation type", location);
                          }
                          return false;
                      }
                      candidates.Add(new ExplicitBindingCandidate(
                          implementation,
                          GetAttributeWireFormatId(attribute),
                          location));
                  }
                  if (attribute.AttributeClass is { } attributeClass &&
                      _adaptersBySelector.TryGetValue(attributeClass, out var selectorRegistration))
                  {
                      candidates.Add(new ExplicitBindingCandidate(
                          selectorRegistration.AdapterType,
                          null,
                          location));
                  }
              }
              if (_assemblyBindings.TryGetValue(NormalizeAdapterTarget(type), out var assemblyBinding))
                  candidates.Add(assemblyBinding);
              return true;
          }

          private bool TryResolveExplicitCodecCandidate(
              ITypeSymbol target,
              ExplicitBindingCandidate candidate,
              bool reportInvalid,
              out ExplicitCodecSelection? selected)
          {
              if (_adaptersByType.TryGetValue(candidate.ImplementationType, out var adapter))
              {
                  if (candidate.WireFormatId is not null)
                  {
                      if (reportInvalid)
                      {
                          Report(DtoDiagnosticKind.AdapterBindingInvalid, target,
                              "WireFormatId on RpcCodecAdapter is only valid for a direct IRpcCodec<T> binding; registered Adapters carry their own wire identity",
                              candidate.Location);
                      }
                      selected = null;
                      return false;
                  }
                  selected = new ExplicitCodecSelection(
                      adapter.AdapterType,
                      adapter.AdapterId,
                      adapter.WireFormatId,
                      IsDirectCodec: false,
                      candidate.Location);
                  return true;
              }

              if (ImplementsRpcCodecAdapter(candidate.ImplementationType))
              {
                  if (reportInvalid)
                  {
                      Report(DtoDiagnosticKind.AdapterRegistrationInvalid, target,
                          $"selected Adapter '{GetTypeName(candidate.ImplementationType)}' has no valid RpcCodecAdapterRegistration",
                          candidate.Location);
                  }
                  selected = null;
                  return false;
              }

              if (!IsValidDirectCodecType(candidate.ImplementationType, target))
              {
                  if (reportInvalid)
                  {
                      Report(DtoDiagnosticKind.AdapterTypeInvalid, candidate.ImplementationType,
                          $"direct Codec must be public sealed with a public parameterless constructor and implement IRpcCodec<{GetTypeName(target)}> exactly",
                          candidate.Location);
                  }
                  selected = null;
                  return false;
              }

              if (candidate.WireFormatId is null || !IsStableIdentity(candidate.WireFormatId))
              {
                  if (reportInvalid)
                  {
                      Report(DtoDiagnosticKind.AdapterBindingInvalid, target,
                          "a direct IRpcCodec<T> binding requires a non-empty stable ASCII WireFormatId on RpcCodecAdapter",
                          candidate.Location);
                  }
                  selected = null;
                  return false;
              }

              selected = new ExplicitCodecSelection(
                  candidate.ImplementationType,
                  AdapterId: null,
                  candidate.WireFormatId,
                  IsDirectCodec: true,
                  candidate.Location);
              return true;
          }

          private static bool ExplicitSelectionsEqual(ExplicitCodecSelection left, ExplicitCodecSelection right)
              => SymbolEqualityComparer.Default.Equals(left.ImplementationType, right.ImplementationType) &&
                 string.Equals(left.AdapterId, right.AdapterId, StringComparison.Ordinal) &&
                 string.Equals(left.WireFormatId, right.WireFormatId, StringComparison.Ordinal) &&
                 left.IsDirectCodec == right.IsDirectCodec;

          private static bool ImplementsRpcCodecAdapter(INamedTypeSymbol type)
              => type.AllInterfaces.Any(static item =>
                  item.Name == "IRpcCodecAdapter" &&
                  item.ContainingNamespace.ToDisplayString() == "SharpLink.Abstractions");

          private static bool IsValidDirectCodecType(INamedTypeSymbol type, ITypeSymbol target)
              => IsEffectivelyPublic(type) &&
                 type.TypeKind == TypeKind.Class &&
                 type.IsSealed &&
                 !type.IsAbstract &&
                 !HasTypeParameter(type) &&
                 type.InstanceConstructors.Any(static constructor =>
                     constructor.DeclaredAccessibility == Accessibility.Public &&
                     constructor.Parameters.Length == 0) &&
                 type.AllInterfaces.Any(item =>
                     item.Name == "IRpcCodec" &&
                     item.Arity == 1 &&
                     item.ContainingNamespace.ToDisplayString() == "SharpLink.Abstractions" &&
                     SymbolEqualityComparer.Default.Equals(
                         NormalizeAdapterTarget(item.TypeArguments[0]),
                         NormalizeAdapterTarget(target)));

          ''')

          # New candidate/selection records beside AdapterRegistration.
          p = Path(path)
          text = p.read_text()
          marker = '''        private sealed record AdapterRegistration(
              INamedTypeSymbol AdapterType,
              string AdapterId,
              string WireFormatId,
              ITypeSymbol? SelectorType,
              Location Location);
          '''
          replacement = '''        private sealed record ExplicitBindingCandidate(
              INamedTypeSymbol ImplementationType,
              string? WireFormatId,
              Location Location);

          private sealed record ExplicitCodecSelection(
              INamedTypeSymbol ImplementationType,
              string? AdapterId,
              string WireFormatId,
              bool IsDirectCodec,
              Location Location);

          private sealed record AdapterRegistration(
              INamedTypeSymbol AdapterType,
              string AdapterId,
              string WireFormatId,
              ITypeSymbol? SelectorType,
              Location Location);
          '''
          if marker not in text:
              raise RuntimeError('AdapterRegistration marker not found')
          p.write_text(text.replace(marker, replacement, 1))

          # Contract override selection now returns one unified explicit selection.
          path = 'src/SharpLink.Generator/RpcGenerator.CodecRoutes.cs'
          replace_block(
              path,
              '        private bool TrySelectContractCodecOverride(ITypeSymbol type, out AdapterRegistration? selected)',
              '        private bool IsRouteEligible(ITypeSymbol type)',
          '''        private bool TrySelectContractCodecOverride(ITypeSymbol type, out ExplicitCodecSelection? selected)
          {
              // Contract compilation has one deterministic precedence entrypoint:
              // explicit per-type Codec/Adapter selection > assembly route > SharpLink default generation.
              if (TrySelectExplicitCodec(type, out selected))
                  return true;
              return TrySelectRouteAdapter(type, out selected);
          }

          private bool TrySelectRouteAdapter(ITypeSymbol type, out ExplicitCodecSelection? selected)
          {
              selected = null;
              if (!IsRouteEligible(type))
                  return false;

              var scope = ClassifyCodecScope(type);
              if (_conflictingRouteScopes.Contains(scope))
              {
                  _failed.Add(GetTypeName(type));
                  return true;
              }
              if (!_assemblyRoutes.TryGetValue(scope, out var adapterType))
                  return false;
              if (!_adaptersByType.TryGetValue(adapterType, out var adapter))
              {
                  Report(
                      DtoDiagnosticKind.AdapterRegistrationInvalid,
                      type,
                      $"routed Adapter '{GetTypeName(adapterType)}' has no valid RpcCodecAdapterRegistration",
                      type.Locations.FirstOrDefault());
                  _failed.Add(GetTypeName(type));
                  return true;
              }

              selected = new ExplicitCodecSelection(
                  adapter.AdapterType,
                  adapter.AdapterId,
                  adapter.WireFormatId,
                  IsDirectCodec: false,
                  type.Locations.FirstOrDefault() ?? Location.None);
              return true;
          }

          private void AddExplicitCodecModel(ITypeSymbol type, string typeName, ExplicitCodecSelection selection)
          {
              var schema = selection.IsDirectCodec
                  ? $"direct|{GetTypeName(selection.ImplementationType)}|{selection.WireFormatId}"
                  : selection.WireFormatId;
              _models[typeName] = new GeneratedCodecModel(
                  typeName,
                  GetCodecName(typeName, _mode == DtoAnalysisMode.ContractPolicy),
                  GetSchemaId(typeName, schema),
                  selection.IsDirectCodec ? GeneratedCodecKind.Direct : GeneratedCodecKind.Adapter,
                  type.IsReferenceType,
                  ImmutableArray<GeneratedMemberModel>.Empty,
                  ImmutableArray<string>.Empty,
                  null,
                  null,
                  null,
                  GetTypeName(selection.ImplementationType),
                  selection.AdapterId,
                  selection.WireFormatId,
                  GetAssemblyDependencies([type, selection.ImplementationType]),
                  selection.Location);
          }

          ''')
          p = Path(path)
          text = p.read_text().replace('HasResolvableExplicitAdapter(type)', 'HasResolvableExplicitCodec(type)')
          p.write_text(text)

          # Model direct Codec kind and keep a full Contract model separate from the owner delta.
          path = 'src/SharpLink.Generator/RpcGenerator.Models.cs'
          replace_once(path, 'internal enum GeneratedCodecKind\n{\n    Adapter,\n',
                             'internal enum GeneratedCodecKind\n{\n    Adapter,\n    Direct,\n')
          replace_once(path,
          '''internal sealed record DtoGenerationResult(
              ImmutableArray<GeneratedCodecModel> Codecs,
              ImmutableArray<GeneratedCodecModel> ContractCodecs,
              ImmutableArray<DtoDiagnosticModel> Diagnostics,
              ImmutableArray<GeneratedEnumModel> Enums);
          ''',
          '''internal sealed record DtoGenerationResult(
              ImmutableArray<GeneratedCodecModel> Codecs,
              ImmutableArray<GeneratedCodecModel> ContractCodecs,
              ImmutableArray<GeneratedCodecModel> ContractManifestCodecs,
              ImmutableArray<DtoDiagnosticModel> Diagnostics,
              ImmutableArray<GeneratedEnumModel> Enums);
          ''')
          replace_once(path,
          '''        if (x is null || y is null || x.Codecs.Length != y.Codecs.Length ||
              x.ContractCodecs.Length != y.ContractCodecs.Length ||
              x.Diagnostics.Length != y.Diagnostics.Length || x.Enums.Length != y.Enums.Length)
          ''',
          '''        if (x is null || y is null || x.Codecs.Length != y.Codecs.Length ||
              x.ContractCodecs.Length != y.ContractCodecs.Length ||
              x.ContractManifestCodecs.Length != y.ContractManifestCodecs.Length ||
              x.Diagnostics.Length != y.Diagnostics.Length || x.Enums.Length != y.Enums.Length)
          ''')
          replace_once(path,
          '''        for (var index = 0; index < x.Diagnostics.Length; index++)
          ''',
          '''        for (var index = 0; index < x.ContractManifestCodecs.Length; index++)
          {
              if (!CodecEquals(x.ContractManifestCodecs[index], y.ContractManifestCodecs[index]))
                  return false;
          }
          for (var index = 0; index < x.Diagnostics.Length; index++)
          ''')
          replace_once(path,
          '''        foreach (var diagnostic in obj.Diagnostics)
          ''',
          '''        foreach (var codec in obj.ContractManifestCodecs)
          {
              hash = unchecked(hash * 31 + StringComparer.Ordinal.GetHashCode(codec.TypeName));
              hash = unchecked(hash * 31 + StringComparer.Ordinal.GetHashCode(codec.SchemaId));
          }
          foreach (var diagnostic in obj.Diagnostics)
          ''')

          # Direct factories instantiate the selected IRpcCodec<T> without adapter lifecycle state.
          path = 'src/SharpLink.Generator/RpcGenerator.DtoEmitter.cs'
          replace_once(path,
          '''        foreach (var codec in codecs)
          {
              if (codec.Kind == GeneratedCodecKind.Adapter)
                  AppendAdapterCodecFactory(sb, codec);
              else if (codec.Kind == GeneratedCodecKind.Dto)
                  AppendDtoCodec(sb, codec);
              else
                  AppendCollectionCodec(sb, codec);
          }
          ''',
          '''        foreach (var codec in codecs)
          {
              if (codec.Kind == GeneratedCodecKind.Adapter)
                  AppendAdapterCodecFactory(sb, codec);
              else if (codec.Kind == GeneratedCodecKind.Direct)
                  AppendDirectCodecFactory(sb, codec);
              else if (codec.Kind == GeneratedCodecKind.Dto)
                  AppendDtoCodec(sb, codec);
              else
                  AppendCollectionCodec(sb, codec);
          }
          ''')
          p = Path(path)
          text = p.read_text()
          marker = '    private static string GetAdapterHolderName(string adapterId)\n'
          direct = '''    private static void AppendDirectCodecFactory(StringBuilder sb, GeneratedCodecModel model)
          {
              sb.AppendLine($"internal static class {model.CodecName}");
              sb.AppendLine("{");
              sb.AppendLine("    internal sealed class Factory : IRpcGeneratedCodecFactory");
              sb.AppendLine("    {");
              sb.AppendLine($"        public Type TargetType => typeof({model.TypeName});");
              sb.AppendLine($"        public string SchemaId => \\\"{EscapeString(model.SchemaId)}\\\";");
              sb.AppendLine($"        public string WireFormatId => \\\"{EscapeString(model.WireFormatId)}\\\";");
              sb.AppendLine("        public string? AdapterId => null;");
              sb.AppendLine("        public IRpcCodecAdapter? Adapter => null;");
              sb.AppendLine("        public IRpcCodec Create(IRpcCodecProvider provider, IRpcCodecAdapterScope? adapterScope)");
              sb.AppendLine("        {");
              sb.AppendLine("            ArgumentNullException.ThrowIfNull(provider);");
              sb.AppendLine($"            return new {model.AdapterType}();");
              sb.AppendLine("        }");
              sb.AppendLine($"        public bool IsCompatibleCodec(IRpcCodec codec) => codec is IRpcCodec<{model.TypeName}>;");
              sb.AppendLine("    }");
              sb.AppendLine("}");
              sb.AppendLine();
          }

          '''
          if marker not in text:
              raise RuntimeError('DtoEmitter insertion marker not found')
          p.write_text(text.replace(marker, direct + marker, 1))

          # Contract compatibility consumes the full policy model, while runtime manifest gets only the delta.
          path = 'src/SharpLink.Generator/RpcGenerator.cs'
          replace_once(path,
              '                value.Left.Right.ContractCodecs,\n                value.Left.Right.Enums,\n',
              '                value.Left.Right.ContractManifestCodecs,\n                value.Left.Right.Enums,\n')

          # Generator regression coverage for direct Codecs, third-party binding, policy precedence, and dual-role ownership.
          Path('test/SharpLink.Generator.Tests/RpcDirectCodecBindingTests.cs').write_text(r'''using System;
