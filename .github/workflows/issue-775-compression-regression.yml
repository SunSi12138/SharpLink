name: Issue 775 bound method compression regression
on:
  push:
    branches: [prototype/775-static-session-binding]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  regression:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[issue775-compression]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a473f5d3a50d3b23874f8b1bb72f46e65ff939d1
          path: old
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: candidate/global.json
      - name: Reproduce old bug and verify exact candidate with identical tests
        run: |
          python3 candidate/eng/issue775/compression_regression.py --old old --candidate candidate \
            --expected-candidate '${{ github.sha }}' --output compression-regression
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue775-compression-${{ github.sha }}
          path: compression-regression/
          retention-days: 30
          if-no-files-found: error
