name: Issue 331 Perf Fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.ref == 'issue-331-dynamic-admission-update'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Apply allocation and reject fast-path patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          limiter_path = Path('src/SharpLink.Server/Admission/AdmissionLimiterState.cs')
          text = limiter_path.read_text()

          text = replace_once(text,
          '''    internal bool IsLeaseFromTargetVersion(RateLimitLease lease, long targetVersion)\n        => lease is ConcurrencyLease concurrencyLease &&\n           ReferenceEquals(concurrencyLease.State, this) &&\n           concurrencyLease.TargetVersion == targetVersion;\n''',
          '''    internal bool IsLeaseFromTargetVersion(RateLimitLease lease, long targetVersion)\n        => lease is VersionedConcurrencyLease concurrencyLease &&\n           ReferenceEquals(concurrencyLease.State, this) &&\n           concurrencyLease.TargetVersion == targetVersion;\n''', 'lease version type')

          text = replace_once(text,
          '''            _active++;\n            return new ConcurrencyLease(this, UnversionedTarget);\n''',
          '''            _active++;\n            return new ConcurrencyLease(this);\n''', 'attempt lease')

          old_async = '''    protected override ValueTask<RateLimitLease> AcquireAsyncCore(\n        int permitCount,\n        CancellationToken cancellationToken)\n    {\n        ValidatePermitCount(permitCount);\n        if (cancellationToken.IsCancellationRequested)\n            return ValueTask.FromCanceled<RateLimitLease>(cancellationToken);\n\n        var versionOwner = _targetVersionOwner;\n        if (versionOwner is null)\n            return AcquireAsyncUnversioned(cancellationToken);\n\n        while (true)\n        {\n            var targetVersion = versionOwner.ReadStableConcurrencyTargetVersion();\n            Waiter? waiter = null;\n            RateLimitLease? immediateLease = null;\n\n            lock (_gate)\n            {\n                if (_disposed != 0)\n                    return ValueTask.FromResult<RateLimitLease>(FailedLease.Instance);\n\n                if (!versionOwner.IsConcurrencyTargetVersionCurrent(targetVersion))\n                    continue;\n\n                if (_waitingCount == 0 && _active < _permitLimit)\n                {\n                    _active++;\n\n                    // Close the version-check -> counter-mutation window while still holding the\n                    // state lock. Roll back the unexposed counter directly rather than disposing a\n                    // lease and recursively entering the same lock.\n                    if (!versionOwner.IsConcurrencyTargetVersionCurrent(targetVersion))\n                    {\n                        _active--;\n                        continue;\n                    }\n\n                    immediateLease = new ConcurrencyLease(this, targetVersion);\n                }\n                else\n                {\n                    // Queue membership itself is policy-neutral and survives target changes. The\n                    // eventual grant is version-tagged and atomically authorized below.\n                    waiter = new Waiter(this, cancellationToken);\n                    EnqueueWaiterLocked(waiter);\n                }\n            }\n\n            if (immediateLease is not null)\n                return ValueTask.FromResult(immediateLease);\n\n            if (waiter is null)\n                continue;\n\n            if (cancellationToken.CanBeCanceled)\n            {\n                var registration = cancellationToken.UnsafeRegister(\n                    static state => ((Waiter)state!).Owner.CancelWaiter((Waiter)state!),\n                    waiter);\n                waiter.SetRegistration(registration);\n            }\n            return new ValueTask<RateLimitLease>(waiter.Task);\n        }\n    }\n'''
          new_async = '''    internal ValueTask<RateLimitLease> AcquireAsyncForAdmission(\n        bool captureTargetVersion,\n        CancellationToken cancellationToken)\n    {\n        if (!captureTargetVersion || _targetVersionOwner is null)\n            return AcquireAsyncUnversioned(cancellationToken);\n        return AcquireAsyncVersioned(cancellationToken);\n    }\n\n    protected override ValueTask<RateLimitLease> AcquireAsyncCore(\n        int permitCount,\n        CancellationToken cancellationToken)\n    {\n        ValidatePermitCount(permitCount);\n        return _targetVersionOwner is null\n            ? AcquireAsyncUnversioned(cancellationToken)\n            : AcquireAsyncVersioned(cancellationToken);\n    }\n\n    private ValueTask<RateLimitLease> AcquireAsyncVersioned(CancellationToken cancellationToken)\n    {\n        if (cancellationToken.IsCancellationRequested)\n            return ValueTask.FromCanceled<RateLimitLease>(cancellationToken);\n\n        var versionOwner = _targetVersionOwner ??\n            throw new InvalidOperationException("Versioned admission acquisition requires a target owner.");\n        while (true)\n        {\n            var targetVersion = versionOwner.ReadStableConcurrencyTargetVersion();\n            Waiter? waiter = null;\n            RateLimitLease? immediateLease = null;\n\n            lock (_gate)\n            {\n                if (_disposed != 0)\n                    return ValueTask.FromResult<RateLimitLease>(FailedLease.Instance);\n\n                if (!versionOwner.IsConcurrencyTargetVersionCurrent(targetVersion))\n                    continue;\n\n                if (_waitingCount == 0 && _active < _permitLimit)\n                {\n                    _active++;\n                    if (!versionOwner.IsConcurrencyTargetVersionCurrent(targetVersion))\n                    {\n                        _active--;\n                        continue;\n                    }\n                    immediateLease = new VersionedConcurrencyLease(this, targetVersion);\n                }\n                else\n                {\n                    waiter = new Waiter(this, cancellationToken, captureTargetVersion: true);\n                    EnqueueWaiterLocked(waiter);\n                }\n            }\n\n            if (immediateLease is not null)\n                return ValueTask.FromResult(immediateLease);\n            if (waiter is null)\n                continue;\n\n            if (cancellationToken.CanBeCanceled)\n            {\n                var registration = cancellationToken.UnsafeRegister(\n                    static state => ((Waiter)state!).Owner.CancelWaiter((Waiter)state!),\n                    waiter);\n                waiter.SetRegistration(registration);\n            }\n            return new ValueTask<RateLimitLease>(waiter.Task);\n        }\n    }\n'''
          text = replace_once(text, old_async, new_async, 'async versioned path')

          text = replace_once(text,
          '''                return ValueTask.FromResult<RateLimitLease>(\n                    new ConcurrencyLease(this, UnversionedTarget));\n''',
          '''                return ValueTask.FromResult<RateLimitLease>(new ConcurrencyLease(this));\n''', 'unversioned immediate lease')
          text = replace_once(text,
          '''            waiter = new Waiter(this, cancellationToken);\n            EnqueueWaiterLocked(waiter);\n''',
          '''            waiter = new Waiter(this, cancellationToken, captureTargetVersion: false);\n            EnqueueWaiterLocked(waiter);\n''', 'unversioned waiter')

          text = text.replace('GrantWaitersLocked(UnversionedTarget)', 'GrantWaitersLocked()')
          text = text.replace('GrantWaitersLocked(targetVersion)', 'GrantWaitersLocked()')
          text = text.replace('CompleteGranted(granted);', 'CompleteGranted(granted, UnversionedTarget);')
          text = replace_once(text,
          '''            CompleteGranted(granted, UnversionedTarget);\n            return;\n        }\n\n        while (true)\n''',
          '''            CompleteGranted(granted, UnversionedTarget);\n            return;\n        }\n\n        while (true)\n''', 'unversioned grant completion')
          # The versioned stable-grant call needs the real version, not the unversioned sentinel.
          marker = '''            if (retry)\n                continue;\n\n            CompleteGranted(granted, UnversionedTarget);\n            return;\n'''
          text = replace_once(text, marker,
          '''            if (retry)\n                continue;\n\n            CompleteGranted(granted, targetVersion);\n            return;\n''', 'versioned grant completion')

          text = replace_once(text,
          '''    private Waiter? GrantWaitersLocked(long targetVersion)\n    {\n''',
          '''    private Waiter? GrantWaitersLocked()\n    {\n''', 'grant signature')
          text = replace_once(text,
          '''            var waiter = DequeueWaiterLocked();\n            waiter.GrantTargetVersion = targetVersion;\n            _active++;\n''',
          '''            var waiter = DequeueWaiterLocked();\n            _active++;\n''', 'grant target storage')

          text = replace_once(text,
          '''    private void CompleteGranted(Waiter? granted)\n    {\n        while (granted is not null)\n        {\n            var next = granted.Next;\n            granted.Next = null;\n            granted.CompleteGranted(this, granted.GrantTargetVersion);\n            granted = next;\n        }\n    }\n''',
          '''    private void CompleteGranted(Waiter? granted, long targetVersion)\n    {\n        while (granted is not null)\n        {\n            var next = granted.Next;\n            granted.Next = null;\n            granted.CompleteGranted(this, targetVersion);\n            granted = next;\n        }\n    }\n''', 'complete granted')

          text = replace_once(text,
          '''    private sealed class Waiter(\n        ResizableConcurrencyState owner,\n        CancellationToken cancellationToken)\n        : TaskCompletionSource<RateLimitLease>(TaskCreationOptions.RunContinuationsAsynchronously)\n''',
          '''    private sealed class Waiter(\n        ResizableConcurrencyState owner,\n        CancellationToken cancellationToken,\n        bool captureTargetVersion)\n        : TaskCompletionSource<RateLimitLease>(TaskCreationOptions.RunContinuationsAsynchronously)\n''', 'waiter ctor')
          text = replace_once(text,
          '''        internal bool IsQueued { get; set; }\n        internal long GrantTargetVersion { get; set; } = UnversionedTarget;\n''',
          '''        internal bool IsQueued { get; set; }\n        internal bool CaptureTargetVersion { get; } = captureTargetVersion;\n''', 'waiter version field')
          text = replace_once(text,
          '''            _registration.Dispose();\n            TrySetResult(new ConcurrencyLease(state, targetVersion));\n''',
          '''            _registration.Dispose();\n            TrySetResult(CaptureTargetVersion\n                ? new VersionedConcurrencyLease(state, targetVersion)\n                : new ConcurrencyLease(state));\n''', 'waiter completion lease')

          old_lease = '''    private sealed class ConcurrencyLease(\n        ResizableConcurrencyState state,\n        long targetVersion) : RateLimitLease\n    {\n        private ResizableConcurrencyState? _owner = state;\n\n        internal ResizableConcurrencyState State { get; } = state;\n        internal long TargetVersion { get; } = targetVersion;\n\n        public override bool IsAcquired => true;\n\n        public override IEnumerable<string> MetadataNames => [];\n\n        public override bool TryGetMetadata(string metadataName, out object? metadata)\n        {\n            metadata = null;\n            return false;\n        }\n\n        protected override void Dispose(bool disposing)\n            => Interlocked.Exchange(ref _owner, null)?.ReleasePermit();\n    }\n'''
          new_lease = '''    private sealed class ConcurrencyLease(ResizableConcurrencyState state) : RateLimitLease\n    {\n        private ResizableConcurrencyState? _owner = state;\n\n        public override bool IsAcquired => true;\n\n        public override IEnumerable<string> MetadataNames => [];\n\n        public override bool TryGetMetadata(string metadataName, out object? metadata)\n        {\n            metadata = null;\n            return false;\n        }\n\n        protected override void Dispose(bool disposing)\n            => Interlocked.Exchange(ref _owner, null)?.ReleasePermit();\n    }\n\n    private sealed class VersionedConcurrencyLease(\n        ResizableConcurrencyState state,\n        long targetVersion) : RateLimitLease\n    {\n        private ResizableConcurrencyState? _owner = state;\n\n        internal ResizableConcurrencyState? State => Volatile.Read(ref _owner);\n        internal long TargetVersion { get; } = targetVersion;\n\n        public override bool IsAcquired => true;\n\n        public override IEnumerable<string> MetadataNames => [];\n\n        public override bool TryGetMetadata(string metadataName, out object? metadata)\n        {\n            metadata = null;\n            return false;\n        }\n\n        protected override void Dispose(bool disposing)\n            => Interlocked.Exchange(ref _owner, null)?.ReleasePermit();\n    }\n'''
          text = replace_once(text, old_lease, new_lease, 'lease classes')

          # Ensure no stale call shape remains.
          if 'new ConcurrencyLease(this,' in text or 'GrantTargetVersion' in text or 'GrantWaitersLocked(' not in text:
              raise SystemExit('stale limiter versioned allocation shape remains')
          limiter_path.write_text(text)

          controller_path = Path('src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs')
          text = controller_path.read_text()

          text = replace_once(text,
          '''                RateLimitLease waitedLease;\n                try\n                {\n                    waitedLease = await failedSlot.Limiter\n                        .AcquireAsync(1, waitCancellation.Token)\n                        .ConfigureAwait(false);\n                }\n''',
          '''                RateLimitLease waitedLease;\n                try\n                {\n                    waitedLease = failedSlot.Limiter is ResizableConcurrencyState concurrency\n                        ? await concurrency.AcquireAsyncForAdmission(\n                            request.TracksConcurrencyTargetVersion,\n                            waitCancellation.Token).ConfigureAwait(false)\n                        : await failedSlot.Limiter\n                            .AcquireAsync(1, waitCancellation.Token)\n                            .ConfigureAwait(false);\n                }\n''', 'controller queued acquire')

          text = replace_once(text,
          '''    private readonly bool _tracksConcurrencyTargetVersion =\n        HasVersionedConcurrencySlot(slots, slotCount);\n''',
          '''    private readonly bool _tracksConcurrencyTargetVersion =\n        HasMultipleVersionedConcurrencySlots(slots, slotCount);\n\n    internal bool TracksConcurrencyTargetVersion => _tracksConcurrencyTargetVersion;\n''', 'request tracking predicate')

          old_helper = '''    private static bool HasVersionedConcurrencySlot(AdmissionLimiterSlot[] slots, int slotCount)\n    {\n        for (var index = 0; index < slotCount; index++)\n        {\n            if (slots[index].Limiter is ResizableConcurrencyState { TracksTargetVersion: true })\n                return true;\n        }\n        return false;\n    }\n'''
          new_helper = '''    private static bool HasMultipleVersionedConcurrencySlots(\n        AdmissionLimiterSlot[] slots,\n        int slotCount)\n    {\n        var count = 0;\n        for (var index = 0; index < slotCount; index++)\n        {\n            if (slots[index].Limiter is not ResizableConcurrencyState { TracksTargetVersion: true })\n                continue;\n            if (++count > 1)\n                return true;\n        }\n        return false;\n    }\n'''
          text = replace_once(text, old_helper, new_helper, 'request target helper')
          controller_path.write_text(text)
          PY

          git diff --check
          git diff -- src/SharpLink.Server/Admission/AdmissionLimiterState.cs src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs

      - name: Validate formatting and unit suite
        shell: bash
        run: |
          set -euxo pipefail
          dotnet restore Sharplink.slnx
          dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal
          dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release

      - name: Commit tested product patch and remove helper workflow
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue331-perf-fix.yml
          git add src/SharpLink.Server/Admission/AdmissionLimiterState.cs src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs
          git diff --cached --check
          git commit -m 'Reduce dynamic admission epoch hot-path overhead'
          git push origin HEAD:issue-331-dynamic-admission-update
