name: Method Facts 3.0 Integration Validation

on:
  push:
    branches: [validate/754-integrate-dev-3.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      TUNIT_MAX_PARALLEL_TESTS: '8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7589962637b66768bab0adf7bb51abe2a147b1c6
      - name: Record exact validation source
        run: |
          mkdir -p artifacts/public-api
          git rev-parse HEAD > artifacts/public-api/source-commit.txt
          git rev-parse HEAD^{tree} > artifacts/public-api/source-tree.txt
      - uses: ./.github/actions/setup-dotnet
      - name: Restore and build combined contract
        id: build
        run: |
          dotnet restore Sharplink.slnx
          dotnet build Sharplink.slnx --no-restore -c Release -v minimal
      - name: Export candidate public API for explicit review
        run: |
          dotnet pack Sharplink.slnx --no-build --no-restore -c Release -o artifacts/nuget -v minimal
          dotnet build eng/SharpLink.PublicApi/SharpLink.PublicApi.csproj -c Release -v minimal
          python3 eng/verify-public-api.py artifacts/nuget --version 3.0.0 --baseline artifacts/public-api/candidate --update
          python3 eng/verify-release-versions.py
      - name: Verify formatting and maintainability
        run: |
          dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal
          bash eng/check-maintainability.sh
      - name: Unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build
      - name: Generator tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build
      - name: Integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run -c Release --no-build --project test/SharpLink.IntegrationTests -- --maximum-parallel-tests 1
      - name: Verify reviewed public API baseline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 eng/verify-public-api.py artifacts/nuget --version 3.0.0
      - name: Preserve candidate API and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: method-facts-combined-contract
          path: |
            artifacts/public-api
            artifacts/maintainability
          if-no-files-found: warn

  combined-package-trim-aot:
    needs: combined-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7589962637b66768bab0adf7bb51abe2a147b1c6
      - uses: ./.github/actions/setup-dotnet
      - name: Verify exact combined ABI source
        run: |
          git rev-parse HEAD
          python3 eng/verify-release-versions.py
          grep -F 'AbiIdentity = "sharplink-3.0-api5-v1"' src/SharpLink.Abstractions/SharpLinkGeneratedAssemblyManifest.cs
      - name: Build and pack
        run: |
          dotnet restore Sharplink.slnx
          dotnet build Sharplink.slnx --no-restore -c Release -v minimal
          dotnet pack Sharplink.slnx --no-build --no-restore -c Release -o artifacts/nuget -v minimal
      - name: Source full and partial trim
        env:
          SHARPLINK_TRIM_RID: linux-x64
        run: bash eng/run-project-reference-trim-smoke.sh
      - name: Isolated NativeAOT
        env:
          SHARPLINK_AOT_RID: linux-x64
          SHARPLINK_AOT_OUTPUT: ${{ github.workspace }}/artifacts/combined-aot-smoke
        run: bash eng/run-shared-memory-aot-process-smoke.sh
      - name: Verify reviewed shipping API and package contracts
        run: bash eng/verify-public-api.sh
      - uses: ./.github/actions/verify-packages
      - name: Package full and partial trim, late trim, and AOT consumers
        uses: ./.github/actions/package-smoke

  combined-mobile:
    needs: combined-contract
    uses: ./.github/workflows/codec-mobile-compatibility.yml
