name: Issue 775 fixed bridge independent confirmation
on:
  push:
    branches: [prototype/775-static-session-binding]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  confirm:
    if: contains(github.event.head_commit.message, '[issue775-bridge-confirm]')
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5487a21f020e16c2b036b439b8d7efd896267422
          path: experiment
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6cfb09e7dd6b68695f92d28f726340bc8eb39e1d
          path: old
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6cfb09e7dd6b68695f92d28f726340bc8eb39e1d
          path: candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: candidate/global.json
      - name: Check frozen builder and confirmation reader
        run: |
          python3 -m unittest discover -s driver/eng/issue775 -p test_bridge_confirm.py -v
          python3 -m unittest discover -s experiment/eng/issue775 -p test_bridge.py -v
          python3 -m unittest discover -s experiment/eng/issue775 -p test_attribution.py -v
      - name: Fixed paired run, same-binary AA, then separate Unary JIT
        run: |
          python3 driver/eng/issue775/bridge_confirm.py --candidate candidate --old old \
            --experiment experiment --replicate '${{ matrix.replicate }}' --output confirmation
      - name: Retain identities and unfavorable or failed observations
        if: always()
        run: |
          mkdir -p confirmation
          git -C driver rev-parse HEAD > confirmation/confirmation-driver-sha.txt
          git -C driver archive HEAD | gzip > confirmation/confirmation-driver-source.tar.gz
          if test -f confirmation/measurements/summary.md; then cat confirmation/measurements/summary.md | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if test -f confirmation/confirmation-failures.json; then cat confirmation/confirmation-failures.json; fi
          if test -f confirmation/unary-jit/coverage.json; then cat confirmation/unary-jit/coverage.json; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue775-bridge-confirm-${{ matrix.replicate }}-${{ github.run_id }}
          path: confirmation/
          retention-days: 30
          if-no-files-found: error
