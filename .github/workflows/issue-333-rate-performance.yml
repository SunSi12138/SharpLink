name: Issue 333 Rate Performance Evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  rate-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      BASE_SHA: b2ee472d98946e428d69ee18a0c0be6f72deb57c
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Prepare exact base with identical benchmark harness
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "head_sha=${HEAD_SHA}" | tee performance-head.txt
          echo "base_sha=${BASE_SHA}" | tee performance-base.txt
          git worktree add ../issue333-base "${BASE_SHA}"
          cp test/SharpLink.Benchmarks/AdmissionBenchmarks.cs ../issue333-base/test/SharpLink.Benchmarks/AdmissionBenchmarks.cs
          cp test/SharpLink.Benchmarks/AdmissionFreshRateRpcBenchmarks.cs ../issue333-base/test/SharpLink.Benchmarks/AdmissionFreshRateRpcBenchmarks.cs
          dotnet --info > performance-dotnet-info.txt
          lscpu > performance-cpu.txt

      - name: Run reviewed base rate hot-path benchmarks
        shell: bash
        run: |
          set -euo pipefail
          cd ../issue333-base
          dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release -- \
            --filter '*AdmissionFreshRateRpcBenchmarks*' '*AdmissionRateControllerBenchmarks*' '*AdmissionControllerBenchmarks*' \
            --artifacts "${GITHUB_WORKSPACE}/artifacts/issue333/base"

      - name: Run issue 333 head rate hot-path benchmarks
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release -- \
            --filter '*AdmissionFreshRateRpcBenchmarks*' '*AdmissionRateControllerBenchmarks*' '*AdmissionControllerBenchmarks*' \
            --artifacts "${GITHUB_WORKSPACE}/artifacts/issue333/head"

      - name: Run issue 333 dynamic-rate steady-state benchmarks
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-restore -- \
            --filter '*AdmissionRpcBenchmarks*' \
            --artifacts "${GITHUB_WORKSPACE}/artifacts/issue333/dynamic"

      - name: Upload rate performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue333-rate-performance-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/issue333
            performance-head.txt
            performance-base.txt
            performance-dotnet-info.txt
            performance-cpu.txt
          if-no-files-found: warn
          retention-days: 30
