name: Historical API5 binary rejection

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/api5-binary-compatibility.yml'
      - '.github/actions/setup-dotnet/**'
      - 'eng/api5-binary-replay/**'
      - 'eng/verify-package-identities.py'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.Config'
      - 'nuget.config'
      - 'src/**'
  workflow_dispatch:

jobs:
  historical-api5-replay:
    name: Linux API5 to API6 registration boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout immutable historical API5 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d5665d057e18f9b39fe80bcc5911900eb4663ce2
          path: artifacts/api5-source-old

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Verify same-generation controls and old-binary rejection
        shell: bash
        run: >-
          python3 eng/api5-binary-replay/verify-real-api5-binary.py
          artifacts/api5-source-old . artifacts/api5-replay
          "$(git rev-parse HEAD)"

      - name: Preserve source, host, restore and compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-api5-binary-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/api5-replay/*.log
            artifacts/api5-replay/result.json
            artifacts/api5-replay/*/feed/*nupkg
            artifacts/api5-replay/*/NuGet.config
            artifacts/api5-replay/*/Plugin/Source.cs
            artifacts/api5-replay/*/Plugin/*.csproj
            artifacts/api5-replay/*/Plugin/obj/project.assets.json
            artifacts/api5-replay/*/Plugin/obj/generated
            artifacts/api5-replay/*/Plugin/bin/Release/net10.0
            artifacts/api5-replay/*/Host/Source.cs
            artifacts/api5-replay/*/Host/*.csproj
            artifacts/api5-replay/*/Host/obj/project.assets.json
            artifacts/api5-replay/*/Host/obj/generated
            artifacts/api5-replay/*/Host/bin/Release/net10.0
          if-no-files-found: warn
          retention-days: 30
