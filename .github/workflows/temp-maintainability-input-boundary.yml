name: Temporary maintainability input-boundary validation

permissions:
  contents: write

on:
  pull_request:
    branches:
      - dev

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'issue-350-maintainability-report'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DEV_REF: '00e2f18c6384c785d232bd59902102d3af7ad3da'
    steps:
      - name: Checkout head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Apply scanner and documentation fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('eng/SharpLink.Maintainability/Program.cs')
          text = path.read_text()
          old = '''    var domainRoot = Path.Combine(repoRoot, directoryName);\n    var paths = Directory.EnumerateFiles(domainRoot, "*.cs", SearchOption.AllDirectories)\n        .Select(path => new'''
          new = '''    var domainRoot = Path.Combine(repoRoot, directoryName);\n    var enumerationOptions = new EnumerationOptions\n    {\n        RecurseSubdirectories = true,\n        IgnoreInaccessible = false,\n        AttributesToSkip = FileAttributes.ReparsePoint,\n    };\n    var paths = Directory.EnumerateFiles(domainRoot, "*.cs", enumerationOptions)\n        .Select(path => new'''
          if old not in text:
              raise SystemExit('expected enumeration block not found')
          path.write_text(text.replace(old, new, 1))

          doc = Path('eng/maintainability.md')
          text = doc.read_text()
          old = 'The report scans C# files under `src/` and `test/` separately. It records physical file LOC, method count, maximum method LOC, maximum cyclomatic-complexity estimate, and distinct non-global `using` targets as a lightweight coupling proxy.'
          new = 'The report scans C# files under `src/` and `test/` separately and does not follow symbolic links or other reparse-point entries. It records physical file LOC, method count, maximum method LOC, maximum cyclomatic-complexity estimate, and distinct non-global `using` targets as a lightweight coupling proxy.'
          if old not in text:
              raise SystemExit('expected scan documentation sentence not found')
          text = text.replace(old, new, 1)
          old = 'When `SHARPLINK_MAINTAINABILITY_SOURCE_REF` is set, the command resolves that commit and verifies that the current `src/` and `test/` contents, including ignored untracked `.cs` files that the analyzer would scan, match it before generating the report. Without an explicit ref, clean `src/` and `test/` contents are attributed to `HEAD`; otherwise the report uses `working-tree` instead of incorrectly attributing modified content to a commit.'
          new = 'When `SHARPLINK_MAINTAINABILITY_SOURCE_REF` is set, the command resolves that commit, materializes it in a temporary detached Git worktree, disables sparse checkout there, hard-resets it to the resolved commit, and scans that isolated tree. Current working-tree changes, untracked paths, path quoting, sparse checkout, and index skip bits therefore cannot alter a named snapshot. Without an explicit ref, the command scans the current checkout and labels the report `working-tree` rather than attributing it to a commit.'
          if old not in text:
              raise SystemExit('expected named snapshot documentation paragraph not found')
          doc.write_text(text.replace(old, new, 1))

      - name: Validate formatting and build
        shell: bash
        run: |
          dotnet restore Sharplink.slnx
          dotnet format Sharplink.slnx --no-restore --verify-no-changes
          dotnet build eng/SharpLink.Maintainability/SharpLink.Maintainability.csproj -c Release --no-restore

      - name: Generate reference named snapshot
        shell: bash
        run: |
          SHARPLINK_MAINTAINABILITY_SOURCE_REF="$DEV_REF" bash eng/report-maintainability.sh artifacts/reference
          cmp artifacts/reference/report.md eng/maintainability/dev-baseline.md
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/reference/report.json').read_text())
          assert report['sourceRef'] == '00e2f18c6384c785d232bd59902102d3af7ad3da'
          assert report['summary']['source']['files'] > 0
          assert report['summary']['test']['files'] > 0
          PY

      - name: Validate special and non-ASCII untracked paths cannot affect named snapshot
        shell: bash
        run: |
          special_file='src/SharpLink.Runtime/临时 文件.cs'
          printf '%s\n' 'namespace SharpLink.Runtime; internal static class ReviewUnicodeLeak { }' > "$special_file"
          SHARPLINK_MAINTAINABILITY_SOURCE_REF="$DEV_REF" bash eng/report-maintainability.sh artifacts/unicode
          cmp artifacts/reference/report.json artifacts/unicode/report.json
          cmp artifacts/reference/report.md artifacts/unicode/report.md
          rm "$special_file"

      - name: Validate sparse and index skip bits cannot affect named snapshot
        shell: bash
        run: |
          tracked_file="$(git ls-files src | grep '\.cs$' | head -1)"
          test -n "$tracked_file"

          git update-index --skip-worktree "$tracked_file"
          rm "$tracked_file"
          SHARPLINK_MAINTAINABILITY_SOURCE_REF="$DEV_REF" bash eng/report-maintainability.sh artifacts/skip-worktree
          cmp artifacts/reference/report.json artifacts/skip-worktree/report.json
          git update-index --no-skip-worktree "$tracked_file"
          git checkout -- "$tracked_file"

          git update-index --assume-unchanged "$tracked_file"
          printf '%s\n' '// review assume-unchanged mutation' >> "$tracked_file"
          SHARPLINK_MAINTAINABILITY_SOURCE_REF="$DEV_REF" bash eng/report-maintainability.sh artifacts/assume-unchanged
          cmp artifacts/reference/report.json artifacts/assume-unchanged/report.json
          git update-index --no-assume-unchanged "$tracked_file"
          git checkout -- "$tracked_file"

      - name: Validate symlink targets are not scanned
        shell: bash
        run: |
          external_dir="$(mktemp -d)"
          printf '%s\n' 'namespace Outside; internal static class ExternalMaintainabilityLeak { }' > "$external_dir/ExternalMaintainabilityLeak.cs"
          ln -s "$external_dir" src/review-external-directory
          ln -s "$external_dir/ExternalMaintainabilityLeak.cs" src/review-external-file.cs

          bash eng/report-maintainability.sh artifacts/working-tree-symlink
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/working-tree-symlink/report.json').read_text())
          assert report['sourceRef'] == 'working-tree'
          serialized = Path('artifacts/working-tree-symlink/report.json').read_text()
          assert 'ExternalMaintainabilityLeak' not in serialized
          assert 'review-external-directory' not in serialized
          assert 'review-external-file.cs' not in serialized
          PY

          SHARPLINK_MAINTAINABILITY_SOURCE_REF="$DEV_REF" bash eng/report-maintainability.sh artifacts/named-symlink
          cmp artifacts/reference/report.json artifacts/named-symlink/report.json
          rm src/review-external-directory src/review-external-file.cs
          rm -rf "$external_dir"

      - name: Commit input-boundary fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eng/SharpLink.Maintainability/Program.cs eng/maintainability.md
          git commit -m "Harden maintainability report input boundaries"
          git push
