name: SDK Security Validation
'on':
  push:
    branches:
    - validation/sdk-security-10.0.114-20261104
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      TUNIT_MAX_PARALLEL_TESTS: '8'
      DOTNET_ROLL_FORWARD: LatestPatch
    steps:
    - name: Checkout exact validation commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Setup patched SDK
      uses: ./.github/actions/setup-dotnet
    - name: Verify exact patched SDK and bundled runtime
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_IDENTITY'
        import json,pathlib,os
        p=pathlib.Path('global.json'); d=json.loads(p.read_text())
        assert d['sdk']['version']=='10.0.114'
        d['sdk']['rollForward']='disable'
        (pathlib.Path(os.environ['RUNNER_TEMP'])/'global.json').write_text(json.dumps(d,indent=2)+'\n')
        PY_IDENTITY
        echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
        [[ "$(dotnet --version)" == "10.0.114" ]]
        [[ "$(sed -nE 's#.*<BundledNETCoreAppPackageVersion[^>]*>([^<]+)</BundledNETCoreAppPackageVersion>.*#\1#p' "$DOTNET_ROOT/sdk/10.0.114/Microsoft.NETCoreSdk.BundledVersions.props" | head -n 1)" == "10.0.14" ]]
        dotnet --list-runtimes | grep -Fq 'Microsoft.NETCore.App 10.0.14 ['
        echo "Validated SDK 10.0.114 / bundled runtime 10.0.14"
    - name: Restore
      shell: bash
      run: |
        set -euo pipefail
        log="$RUNNER_TEMP/sdk-validation-fast-01.log"
        script="$RUNNER_TEMP/sdk-validation-fast-01.sh"
        cat > "$script" <<'SDK_VALIDATION_SCRIPT'
        set -euo pipefail
        dotnet restore Sharplink.slnx
        SDK_VALIDATION_SCRIPT
        if bash "$script" >"$log" 2>&1; then
          echo "SDK_VALIDATION_STEP_PASS fast-01"
        else
          echo "::error::SDK_VALIDATION_STEP_FAILED fast-01; raw output retained only on disposable runner."
          python3 - "$log" <<'PY_DIAGNOSTICS'
        import pathlib,re,sys
        text=pathlib.Path(sys.argv[1]).read_text(errors='replace')
        codes=sorted(set(re.findall(r'\b(?:CS|NU|NETSDK|MSB|IL|TUNIT)\d{3,5}\b',text)))
        print('Diagnostic codes: '+(','.join(codes) if codes else 'none'))
        PY_DIAGNOSTICS
          exit 1
        fi
    - name: Production Project Reference Boundary Guard
