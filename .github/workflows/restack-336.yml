name: Restack 336

on:
  push:
    branches:
      - issue-335-dynamic-admission-partition-update

permissions:
  contents: write

jobs:
  restack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Merge exact #336 slice onto latest dev
        shell: bash
        run: |
          set -euo pipefail
          target_branch='issue-335-dynamic-admission-partition-update'
          base_sha='46c1285d25b8445d26d050256e8ad590859b541b'
          slice_sha='d1d5562ef2f96e0f015043eb113f80d93bba368a'
          target_head="$(git rev-parse HEAD)"
          git fetch origin dev:refs/remotes/origin/dev
          dev_sha="$(git rev-parse refs/remotes/origin/dev)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          overlaps=(
            'doc/admission-control.md'
            'src/SharpLink.Server/Admission/AdmissionStateKernel.cs'
            'src/SharpLink.Server/SharpLinkServer.AdmissionProgram.cs'
            'test/SharpLink.UnitTests/Server/AdmissionDynamicUpdateTests.cs'
          )
          additions=(
            'test/SharpLink.Benchmarks/AdmissionPartitionBenchmarks.cs'
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionGenerationCaptureTests.cs'
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionRateTransitionTests.cs'
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionTransactionalTests.cs'
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionUpdateAdvancedTests.cs'
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionUpdateTests.cs'
          )
          controller='src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs'

          git reset --hard "$dev_sha"
          mkdir -p /tmp/restack336/base /tmp/restack336/ours /tmp/restack336/theirs
          for path in "${overlaps[@]}"; do
            mkdir -p "/tmp/restack336/base/$(dirname "$path")" "/tmp/restack336/ours/$(dirname "$path")" "/tmp/restack336/theirs/$(dirname "$path")" "$(dirname "$path")"
            git show "$base_sha:$path" > "/tmp/restack336/base/$path"
            git show "$dev_sha:$path" > "/tmp/restack336/ours/$path"
            git show "$slice_sha:$path" > "/tmp/restack336/theirs/$path"
            git merge-file -p "/tmp/restack336/ours/$path" "/tmp/restack336/base/$path" "/tmp/restack336/theirs/$path" > "$path"
          done

          mkdir -p "/tmp/restack336/base/$(dirname "$controller")" "/tmp/restack336/ours/$(dirname "$controller")" "/tmp/restack336/theirs/$(dirname "$controller")" "$(dirname "$controller")"
          git show "$base_sha:$controller" > "/tmp/restack336/base/$controller"
          git show "$dev_sha:$controller" > "/tmp/restack336/ours/$controller"
          git show "$slice_sha:$controller" > "/tmp/restack336/theirs/$controller"
          git merge-file -p "/tmp/restack336/ours/$controller" "/tmp/restack336/base/$controller" "/tmp/restack336/theirs/$controller" > "$controller.merged" || true

          python3 <<'PY'
          from pathlib import Path

          path = Path('src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs')
          merged = Path(str(path) + '.merged').read_text()
          theirs = (Path('/tmp/restack336/theirs') / path).read_text()
          start_marker = 'internal sealed class AdmissionPartitionPool : IDisposable'
          ms = merged.index(start_marker)
          ts = theirs.index(start_marker)
          prefix = merged[:ms]
          section = theirs[ts:]

          # The current request/lease path keeps dev's deadline/queue behavior, but the
          # partition handle itself is #336's generation-aware lease.
          if prefix.count('AdmissionPartitionEntry?') < 5:
              raise RuntimeError('partition lease boundary anchor mismatch')
          prefix = prefix.replace('AdmissionPartitionEntry?', 'AdmissionPartitionLease?')
          old_release = '''        var partition = Interlocked.Exchange(ref _partition, null);\n        partition?.Owner.Release(partition);'''
          if prefix.count(old_release) != 2:
              raise RuntimeError('partition release boundary anchor mismatch')
          prefix = prefix.replace(old_release, '        Interlocked.Exchange(ref _partition, null)?.Dispose();')

          replacements = [
              (
                  '''    private readonly AdmissionStateKernel _kernel;\n    private readonly Lock _gate = new();''',
                  '''    private readonly AdmissionStateKernel _kernel;\n    private readonly bool _ownsKernel;\n    private readonly Lock _gate = new();''',
                  'kernel ownership field'),
              (
                  '''    private AdmissionPartitionPolicyGeneration _currentPolicy;\n    private List<AdmissionPartitionPolicyGeneration> _policies;\n    private int _disposed;''',
                  '''    private AdmissionPartitionPolicyGeneration _currentPolicy;\n    private List<AdmissionPartitionPolicyGeneration> _policies;\n    private bool _hasIdleExpiryHint;\n    private long _earliestIdleSince;\n    private long _reclaimScanCount;\n    private long _reclaimEntriesVisited;\n    private int _disposed;''',
                  'reclaim fields'),
              (
                  '''    internal AdmissionPartitionPool(\n        Func<SharpLinkAdmissionContext, string?> selector,\n        SharpLinkPartitionAdmissionOptions options,\n        TimeProvider timeProvider,\n        AdmissionStateKernel kernel)\n    {\n        _selector = selector;\n        _options = options.CloneValidated();\n        _timeProvider = timeProvider;\n        _kernel = kernel;\n        _currentPolicy = new AdmissionPartitionPolicyGeneration(this, _options, sequence: 1);\n        _policies = [_currentPolicy];\n    }''',
                  '''    internal AdmissionPartitionPool(\n        Func<SharpLinkAdmissionContext, string?> selector,\n        SharpLinkPartitionAdmissionOptions options,\n        TimeProvider timeProvider)\n        : this(selector, options, queueLimit: 0, timeProvider)\n    {\n    }\n\n    internal AdmissionPartitionPool(\n        Func<SharpLinkAdmissionContext, string?> selector,\n        SharpLinkPartitionAdmissionOptions options,\n        int queueLimit,\n        TimeProvider timeProvider)\n        : this(selector, options, timeProvider, new AdmissionStateKernel(timeProvider), ownsKernel: true)\n    {\n        _ = queueLimit;\n    }\n\n    internal AdmissionPartitionPool(\n        Func<SharpLinkAdmissionContext, string?> selector,\n        SharpLinkPartitionAdmissionOptions options,\n        TimeProvider timeProvider,\n        AdmissionStateKernel kernel)\n        : this(selector, options, timeProvider, kernel, ownsKernel: false)\n    {\n    }\n\n    private AdmissionPartitionPool(\n        Func<SharpLinkAdmissionContext, string?> selector,\n        SharpLinkPartitionAdmissionOptions options,\n        TimeProvider timeProvider,\n        AdmissionStateKernel kernel,\n        bool ownsKernel)\n    {\n        _selector = selector;\n        _options = options.CloneValidated();\n        _timeProvider = timeProvider;\n        _kernel = kernel;\n        _ownsKernel = ownsKernel;\n        _currentPolicy = new AdmissionPartitionPolicyGeneration(this, _options, sequence: 1);\n        _policies = [_currentPolicy];\n    }''',
                  'constructors'),
              (
                  '''    internal AdmissionPartitionLease? TryAcquire(\n        SharpLinkAdmissionContext context,\n        AdmissionPartitionPolicyGeneration requestedPolicy)''',
                  '''    internal AdmissionPartitionLease? TryAcquire(SharpLinkAdmissionContext context)\n        => TryAcquire(context, CurrentPolicyForBinding);\n\n    internal AdmissionPartitionLease? TryAcquire(\n        SharpLinkAdmissionContext context,\n        AdmissionPartitionPolicyGeneration requestedPolicy)''',
                  'acquire overload'),
              (
                  '''                    CollectIdleEntriesLocked(\n                        _timeProvider.GetTimestamp(),\n                        stopAfterOne: true,\n                        ref dispose);''',
                  '''                    CollectIdleEntriesIfDueLocked(\n                        _timeProvider.GetTimestamp(),\n                        stopAfterOne: true,\n                        ref dispose);''',
                  'acquire reclaim'),
              (
                  '''    internal void Release(AdmissionPartitionRuntimeGeneration generation)\n    {''',
                  '''    internal void Release(AdmissionPartitionLease lease)\n    {\n        ArgumentNullException.ThrowIfNull(lease);\n        lease.Dispose();\n    }\n\n    internal void Release(AdmissionPartitionRuntimeGeneration generation)\n    {''',
                  'release overload'),
              (
                  '''            CollectRetiredGenerationsLocked(entry, ref dispose);\n            CollectRetiredPoliciesLocked();\n            if (entry.References == 0)\n            {\n                entry.IdleSince = _timeProvider.GetTimestamp();\n                entry.IsIdle = true;\n            }\n            CollectIdleEntriesLocked(\n                _timeProvider.GetTimestamp(),\n                stopAfterOne: true,\n                ref dispose);''',
                  '''            CollectRetiredGenerationsLocked(entry, ref dispose);\n            CollectRetiredPoliciesLocked();\n            var now = _timeProvider.GetTimestamp();\n            if (entry.References == 0)\n            {\n                entry.IdleSince = now;\n                entry.IsIdle = true;\n                if (!_hasIdleExpiryHint)\n                {\n                    _earliestIdleSince = now;\n                    _hasIdleExpiryHint = true;\n                }\n            }\n            CollectIdleEntriesIfDueLocked(\n                now,\n                stopAfterOne: true,\n                ref dispose);''',
                  'release reclaim'),
              (
                  '''    private void CollectIdleEntriesLocked(\n        long now,\n        bool stopAfterOne,\n        ref List<IDisposable>? dispose)\n    {\n        List<AdmissionPartitionKey>? keys = null;\n        foreach (var pair in _entries)\n        {\n            if (pair.Value.References != 0 ||\n                !pair.Value.IsIdle ||\n                _timeProvider.GetElapsedTime(pair.Value.IdleSince, now) < _options.IdleTimeout)\n            {\n                continue;\n            }\n\n            (keys ??= []).Add(pair.Key);\n            if (stopAfterOne)\n                break;\n        }\n        if (keys is null)\n            return;\n\n        foreach (var key in keys)\n        {\n            var entry = _entries[key];\n            CollectAllEntryStateLocked(entry, ref dispose);\n            _entries.Remove(key);\n            SharpLinkTelemetry.AddAdmissionActivePartitions(-1);\n        }\n    }''',
                  '''    private void CollectIdleEntriesIfDueLocked(\n        long now,\n        bool stopAfterOne,\n        ref List<IDisposable>? dispose)\n    {\n        if (!_hasIdleExpiryHint ||\n            _timeProvider.GetElapsedTime(_earliestIdleSince, now) < _options.IdleTimeout)\n        {\n            return;\n        }\n        CollectIdleEntriesLocked(now, stopAfterOne, ref dispose);\n    }\n\n    private void CollectIdleEntriesLocked(\n        long now,\n        bool stopAfterOne,\n        ref List<IDisposable>? dispose)\n    {\n        _reclaimScanCount++;\n        List<AdmissionPartitionKey>? keys = null;\n        foreach (var pair in _entries)\n        {\n            _reclaimEntriesVisited++;\n            if (pair.Value.References != 0 ||\n                !pair.Value.IsIdle ||\n                _timeProvider.GetElapsedTime(pair.Value.IdleSince, now) < _options.IdleTimeout)\n            {\n                continue;\n            }\n            (keys ??= []).Add(pair.Key);\n            if (stopAfterOne)\n                break;\n        }\n        if (keys is not null)\n        {\n            foreach (var key in keys)\n            {\n                var entry = _entries[key];\n                CollectAllEntryStateLocked(entry, ref dispose);\n                _entries.Remove(key);\n                SharpLinkTelemetry.AddAdmissionActivePartitions(-1);\n            }\n        }\n        RecomputeIdleExpiryHintLocked(now);\n    }\n\n    private void RecomputeIdleExpiryHintLocked(long now)\n    {\n        var hasIdle = false;\n        var earliestIdleSince = 0L;\n        var longestElapsed = TimeSpan.Zero;\n        foreach (var entry in _entries.Values)\n        {\n            if (entry.References != 0 || !entry.IsIdle)\n                continue;\n            var elapsed = _timeProvider.GetElapsedTime(entry.IdleSince, now);\n            if (!hasIdle || elapsed > longestElapsed)\n            {\n                hasIdle = true;\n                earliestIdleSince = entry.IdleSince;\n                longestElapsed = elapsed;\n            }\n        }\n        _hasIdleExpiryHint = hasIdle;\n        _earliestIdleSince = hasIdle ? earliestIdleSince : 0;\n    }''',
                  'reclaim methods'),
              (
                  '''    internal int RuntimeGenerationCount\n    {''',
                  '''    internal long ReclaimScanCount\n    {\n        get\n        {\n            lock (_gate)\n                return _reclaimScanCount;\n        }\n    }\n\n    internal long ReclaimEntriesVisited\n    {\n        get\n        {\n            lock (_gate)\n                return _reclaimEntriesVisited;\n        }\n    }\n\n    internal int RuntimeGenerationCount\n    {''',
                  'diagnostics'),
              (
                  '''            var count = _entries.Count;\n            _entries.Clear();\n            if (count != 0)''',
                  '''            var count = _entries.Count;\n            _entries.Clear();\n            _hasIdleExpiryHint = false;\n            _earliestIdleSince = 0;\n            if (count != 0)''',
                  'dispose hints'),
              (
                  '''        DisposeStates(dispose);\n    }\n\n    private PreparedEntryTransition PrepareEntryTransitionLocked''',
                  '''        DisposeStates(dispose);\n        if (_ownsKernel)\n            _kernel.DisposeAsync().AsTask().GetAwaiter().GetResult();\n    }\n\n    private PreparedEntryTransition PrepareEntryTransitionLocked''',
                  'owned kernel disposal'),
              (
                  '''    private AdmissionPartitionPool? _owner = owner;\n    internal AdmissionRuleRuntime Runtime => generation.Runtime;''',
                  '''    private AdmissionPartitionPool? _owner = owner;\n    internal AdmissionRuleRuntime Runtime => generation.Runtime;\n    internal int References => generation.Entry?.References ?? 0;''',
                  'lease references diagnostic'),
          ]
          for old, new, label in replacements:
              count = section.count(old)
              if count != 1:
                  raise RuntimeError(f'partition {label} anchor mismatch: count={count}')
              section = section.replace(old, new, 1)

          resolved = prefix + section
          if any(marker in resolved for marker in ('<<<<<<<', '=======', '>>>>>>>')):
              raise RuntimeError('unresolved conflict marker remains')
          path.write_text(resolved)
          Path(str(path) + '.merged').unlink()
          PY

          for path in "${additions[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$slice_sha:$path" > "$path"
          done

          python3 <<'PY'
          from pathlib import Path

          # Keep the expanded #336 benchmark evidence without colliding with the benchmark
          # class already present on current dev.
          benchmark = Path('test/SharpLink.Benchmarks/AdmissionPartitionBenchmarks.cs')
          text = benchmark.read_text()
          if text.count('public class AdmissionPartitionControllerBenchmarks') != 1:
              raise RuntimeError('benchmark class anchor mismatch')
          text = text.replace(
              'public class AdmissionPartitionControllerBenchmarks',
              'public class AdmissionPartitionUpdateBenchmarks',
              1)
          benchmark.write_text(text)

          # #334/dev now expose the six-field admission context. These old #336 helpers each
          # carry exactly one obsolete trailing null.
          context_files = [
              benchmark,
              Path('test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionGenerationCaptureTests.cs'),
              Path('test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionRateTransitionTests.cs'),
              Path('test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionTransactionalTests.cs'),
              Path('test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionUpdateAdvancedTests.cs'),
              Path('test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionUpdateTests.cs'),
          ]
          for file in context_files:
              text = file.read_text()
              count = text.count(', null, null, null)')
              if count != 1:
                  raise RuntimeError(f'{file}: expected one seven-field context helper, got {count}')
              file.write_text(text.replace(', null, null, null)', ', null, null)', 1))

          advanced = Path('test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionUpdateAdvancedTests.cs')
          text = advanced.read_text()
          if 'using System.Linq;' not in text:
              anchor = 'using System.Collections.Concurrent;\n'
              if text.count(anchor) != 1:
                  raise RuntimeError('advanced LINQ using anchor mismatch')
              text = text.replace(anchor, anchor + 'using System.Linq;\n', 1)
          advanced.write_text(text)

          # Current-dev ownership tests are intentionally retained. Adapt only their assertions
          # that depended on the old entry handle identity/type; the new lease owns the same runtime
          # generation and reference count.
          ownership = Path('test/SharpLink.UnitTests/Server/AdmissionPartitionOwnershipTests.cs')
          text = ownership.read_text()
          old = 'Ensure(ReferenceEquals(firstEntry, secondEntry), "same key should reuse the entry");'
          new = 'Ensure(ReferenceEquals(firstEntry.Runtime, secondEntry.Runtime), "same key should reuse the entry runtime");'
          if text.count(old) != 1:
              raise RuntimeError('ownership first identity anchor mismatch')
          text = text.replace(old, new, 1)
          old = 'Ensure(ReferenceEquals(heldEntry, candidateEntry), "same key should reuse the resident entry");'
          new = 'Ensure(ReferenceEquals(heldEntry.Runtime, candidateEntry.Runtime), "same key should reuse the resident runtime");'
          if text.count(old) != 1:
              raise RuntimeError('ownership second identity anchor mismatch')
          ownership.write_text(text.replace(old, new, 1))

          pool_tests = Path('test/SharpLink.UnitTests/Server/AdmissionPartitionPoolTests.cs')
          text = pool_tests.read_text()
          old = 'AdmissionPartitionEntry? replacement = null;'
          if text.count(old) != 1:
              raise RuntimeError('pool race handle type anchor mismatch')
          pool_tests.write_text(text.replace(old, 'AdmissionPartitionLease? replacement = null;', 1))
          PY

          git add -A
          python3 <<'PY'
          import subprocess
          allowed = {
            'doc/admission-control.md',
            'src/SharpLink.Server/Admission/AdmissionStateKernel.cs',
            'src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs',
            'src/SharpLink.Server/SharpLinkServer.AdmissionProgram.cs',
            'test/SharpLink.Benchmarks/AdmissionPartitionBenchmarks.cs',
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionGenerationCaptureTests.cs',
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionRateTransitionTests.cs',
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionTransactionalTests.cs',
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionUpdateAdvancedTests.cs',
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionUpdateTests.cs',
            'test/SharpLink.UnitTests/Server/AdmissionDynamicUpdateTests.cs',
            'test/SharpLink.UnitTests/Server/AdmissionPartitionOwnershipTests.cs',
            'test/SharpLink.UnitTests/Server/AdmissionPartitionPoolTests.cs',
          }
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only','HEAD'], text=True).splitlines())
          print('changed files:', *sorted(changed), sep='\n  ')
          if changed != allowed:
              raise RuntimeError(f'exact 13-file scope mismatch: missing={sorted(allowed-changed)} extra={sorted(changed-allowed)}')
          PY

          dotnet restore Sharplink.slnx
          dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal
          dotnet build Sharplink.slnx -c Debug --no-restore --nologo

          tree_sha="$(git write-tree)"
          final_commit="$(printf '%s\n' 'chore(stack): restack #336 onto latest dev' | git commit-tree "$tree_sha" -p "$target_head" -p "$dev_sha")"
          echo "tree_sha=$tree_sha"
          echo "final_commit=$final_commit"
          git push origin "$final_commit:refs/heads/$target_branch"
