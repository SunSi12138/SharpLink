name: Restack 336

on:
  push:
    branches:
      - issue-335-dynamic-admission-partition-update

permissions:
  contents: write

jobs:
  restack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Merge exact #336 slice onto latest dev
        shell: bash
        run: |
          set -euo pipefail
          target_branch='issue-335-dynamic-admission-partition-update'
          base_sha='46c1285d25b8445d26d050256e8ad590859b541b'
          slice_sha='d1d5562ef2f96e0f015043eb113f80d93bba368a'
          target_head="$(git rev-parse HEAD)"
          git fetch origin dev:refs/remotes/origin/dev
          dev_sha="$(git rev-parse refs/remotes/origin/dev)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          overlaps=(
            'doc/admission-control.md'
            'src/SharpLink.Server/Admission/AdmissionStateKernel.cs'
            'src/SharpLink.Server/SharpLinkServer.AdmissionProgram.cs'
            'test/SharpLink.UnitTests/Server/AdmissionDynamicUpdateTests.cs'
          )
          additions=(
            'test/SharpLink.Benchmarks/AdmissionPartitionBenchmarks.cs'
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionGenerationCaptureTests.cs'
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionRateTransitionTests.cs'
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionTransactionalTests.cs'
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionUpdateAdvancedTests.cs'
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionUpdateTests.cs'
          )
          controller='src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs'

          git reset --hard "$dev_sha"
          mkdir -p /tmp/restack336/base /tmp/restack336/ours /tmp/restack336/theirs
          for path in "${overlaps[@]}"; do
            mkdir -p "/tmp/restack336/base/$(dirname "$path")" "/tmp/restack336/ours/$(dirname "$path")" "/tmp/restack336/theirs/$(dirname "$path")" "$(dirname "$path")"
            git show "$base_sha:$path" > "/tmp/restack336/base/$path"
            git show "$dev_sha:$path" > "/tmp/restack336/ours/$path"
            git show "$slice_sha:$path" > "/tmp/restack336/theirs/$path"
            git merge-file -p "/tmp/restack336/ours/$path" "/tmp/restack336/base/$path" "/tmp/restack336/theirs/$path" > "$path"
          done

          mkdir -p "/tmp/restack336/base/$(dirname "$controller")" "/tmp/restack336/ours/$(dirname "$controller")" "/tmp/restack336/theirs/$(dirname "$controller")" "$(dirname "$controller")"
          git show "$base_sha:$controller" > "/tmp/restack336/base/$controller"
          git show "$dev_sha:$controller" > "/tmp/restack336/ours/$controller"
          git show "$slice_sha:$controller" > "/tmp/restack336/theirs/$controller"
          git merge-file -p "/tmp/restack336/ours/$controller" "/tmp/restack336/base/$controller" "/tmp/restack336/theirs/$controller" > "$controller.merged" || true
          grep -n -E 'AdmissionPartitionPool|AdmissionDecision|AdmissionLease|AdmissionLimiterSlot' "$controller.merged" | tail -40 || true

          python3 <<'PY'
          from pathlib import Path

          path = Path('src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs')
          merged = Path(str(path) + '.merged').read_text()
          theirs = (Path('/tmp/restack336/theirs') / path).read_text()
          start_marker = 'internal sealed class AdmissionPartitionPool : IDisposable'
          ms = merged.index(start_marker)
          ts = theirs.index(start_marker)
          marker = None
          me = te = -1
          for candidate in (
              'internal readonly record struct AdmissionDecision',
              'internal sealed class AdmissionLease : IDisposable'):
              candidate_me = merged.find(candidate, ms)
              candidate_te = theirs.find(candidate, ts)
              if candidate_me >= 0 and candidate_te >= 0:
                  marker = candidate
                  me = candidate_me
                  te = candidate_te
                  break
          if marker is None:
              raise RuntimeError('partition section end marker not found')
          print(f'partition splice marker={marker!r} merged=[{ms},{me}) theirs=[{ts},{te})')
          section = theirs[ts:te]

          replacements = []
          replacements.append((
          '''    private AdmissionPartitionPolicyGeneration _currentPolicy;\n    private List<AdmissionPartitionPolicyGeneration> _policies;\n    private int _disposed;''',
          '''    private AdmissionPartitionPolicyGeneration _currentPolicy;\n    private List<AdmissionPartitionPolicyGeneration> _policies;\n    private bool _hasIdleExpiryHint;\n    private long _earliestIdleSince;\n    private long _reclaimScanCount;\n    private long _reclaimEntriesVisited;\n    private int _disposed;''', 'fields'))
          replacements.append((
          '''                    CollectIdleEntriesLocked(\n                        _timeProvider.GetTimestamp(),\n                        stopAfterOne: true,\n                        ref dispose);''',
          '''                    CollectIdleEntriesIfDueLocked(\n                        _timeProvider.GetTimestamp(),\n                        stopAfterOne: true,\n                        ref dispose);''', 'acquire reclaim'))
          replacements.append((
          '''            CollectRetiredGenerationsLocked(entry, ref dispose);\n            CollectRetiredPoliciesLocked();\n            if (entry.References == 0)\n            {\n                entry.IdleSince = _timeProvider.GetTimestamp();\n                entry.IsIdle = true;\n            }\n            CollectIdleEntriesLocked(\n                _timeProvider.GetTimestamp(),\n                stopAfterOne: true,\n                ref dispose);''',
          '''            CollectRetiredGenerationsLocked(entry, ref dispose);\n            CollectRetiredPoliciesLocked();\n            var now = _timeProvider.GetTimestamp();\n            if (entry.References == 0)\n            {\n                entry.IdleSince = now;\n                entry.IsIdle = true;\n                if (!_hasIdleExpiryHint)\n                {\n                    _earliestIdleSince = now;\n                    _hasIdleExpiryHint = true;\n                }\n            }\n            CollectIdleEntriesIfDueLocked(\n                now,\n                stopAfterOne: true,\n                ref dispose);''', 'release reclaim'))
          replacements.append((
          '''    private void CollectIdleEntriesLocked(\n        long now,\n        bool stopAfterOne,\n        ref List<IDisposable>? dispose)\n    {\n        List<AdmissionPartitionKey>? keys = null;\n        foreach (var pair in _entries)\n        {\n            if (pair.Value.References != 0 ||\n                !pair.Value.IsIdle ||\n                _timeProvider.GetElapsedTime(pair.Value.IdleSince, now) < _options.IdleTimeout)\n            {\n                continue;\n            }\n\n            (keys ??= []).Add(pair.Key);\n            if (stopAfterOne)\n                break;\n        }\n        if (keys is null)\n            return;\n\n        foreach (var key in keys)\n        {\n            var entry = _entries[key];\n            CollectAllEntryStateLocked(entry, ref dispose);\n            _entries.Remove(key);\n            SharpLinkTelemetry.AddAdmissionActivePartitions(-1);\n        }\n    }''',
          '''    private void CollectIdleEntriesIfDueLocked(\n        long now,\n        bool stopAfterOne,\n        ref List<IDisposable>? dispose)\n    {\n        if (!_hasIdleExpiryHint ||\n            _timeProvider.GetElapsedTime(_earliestIdleSince, now) < _options.IdleTimeout)\n        {\n            return;\n        }\n        CollectIdleEntriesLocked(now, stopAfterOne, ref dispose);\n    }\n\n    private void CollectIdleEntriesLocked(\n        long now,\n        bool stopAfterOne,\n        ref List<IDisposable>? dispose)\n    {\n        _reclaimScanCount++;\n        List<AdmissionPartitionKey>? keys = null;\n        foreach (var pair in _entries)\n        {\n            _reclaimEntriesVisited++;\n            if (pair.Value.References != 0 ||\n                !pair.Value.IsIdle ||\n                _timeProvider.GetElapsedTime(pair.Value.IdleSince, now) < _options.IdleTimeout)\n            {\n                continue;\n            }\n            (keys ??= []).Add(pair.Key);\n            if (stopAfterOne)\n                break;\n        }\n        if (keys is not null)\n        {\n            foreach (var key in keys)\n            {\n                var entry = _entries[key];\n                CollectAllEntryStateLocked(entry, ref dispose);\n                _entries.Remove(key);\n                SharpLinkTelemetry.AddAdmissionActivePartitions(-1);\n            }\n        }\n        RecomputeIdleExpiryHintLocked(now);\n    }\n\n    private void RecomputeIdleExpiryHintLocked(long now)\n    {\n        var hasIdle = false;\n        var earliestIdleSince = 0L;\n        var longestElapsed = TimeSpan.Zero;\n        foreach (var entry in _entries.Values)\n        {\n            if (entry.References != 0 || !entry.IsIdle)\n                continue;\n            var elapsed = _timeProvider.GetElapsedTime(entry.IdleSince, now);\n            if (!hasIdle || elapsed > longestElapsed)\n            {\n                hasIdle = true;\n                earliestIdleSince = entry.IdleSince;\n                longestElapsed = elapsed;\n            }\n        }\n        _hasIdleExpiryHint = hasIdle;\n        _earliestIdleSince = hasIdle ? earliestIdleSince : 0;\n    }''', 'reclaim methods'))
          replacements.append((
          '''    internal int RuntimeGenerationCount\n    {''',
          '''    internal long ReclaimScanCount\n    {\n        get\n        {\n            lock (_gate)\n                return _reclaimScanCount;\n        }\n    }\n\n    internal long ReclaimEntriesVisited\n    {\n        get\n        {\n            lock (_gate)\n                return _reclaimEntriesVisited;\n        }\n    }\n\n    internal int RuntimeGenerationCount\n    {''', 'diagnostics'))
          replacements.append((
          '''            var count = _entries.Count;\n            _entries.Clear();\n            if (count != 0)''',
          '''            var count = _entries.Count;\n            _entries.Clear();\n            _hasIdleExpiryHint = false;\n            _earliestIdleSince = 0;\n            if (count != 0)''', 'dispose hints'))

          for old, new, label in replacements:
              if section.count(old) != 1:
                  raise RuntimeError(f'partition {label} anchor mismatch: count={section.count(old)}')
              section = section.replace(old, new, 1)

          resolved = merged[:ms] + section + merged[me:]
          if any(marker in resolved for marker in ('<<<<<<<', '=======', '>>>>>>>')):
              raise RuntimeError('unresolved conflict marker remains after partition splice')
          path.write_text(resolved)
          Path(str(path) + '.merged').unlink()
          PY

          for path in "${additions[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$slice_sha:$path" > "$path"
          done

          git add -A
          python3 <<'PY'
          import subprocess
          allowed = {
            'doc/admission-control.md',
            'src/SharpLink.Server/Admission/AdmissionStateKernel.cs',
            'src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs',
            'src/SharpLink.Server/SharpLinkServer.AdmissionProgram.cs',
            'test/SharpLink.Benchmarks/AdmissionPartitionBenchmarks.cs',
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionGenerationCaptureTests.cs',
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionRateTransitionTests.cs',
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionTransactionalTests.cs',
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionUpdateAdvancedTests.cs',
            'test/SharpLink.UnitTests/Server/AdmissionDynamicPartitionUpdateTests.cs',
            'test/SharpLink.UnitTests/Server/AdmissionDynamicUpdateTests.cs',
          }
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only','HEAD'], text=True).splitlines())
          print('changed files:', *sorted(changed), sep='\n  ')
          if changed != allowed:
              raise RuntimeError(f'exact 11-file scope mismatch: missing={sorted(allowed-changed)} extra={sorted(changed-allowed)}')
          PY
          dotnet restore Sharplink.slnx
          dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal
          dotnet build Sharplink.slnx -c Debug --no-restore --nologo
          tree_sha="$(git write-tree)"
          final_commit="$(printf '%s\n' 'chore(stack): restack #336 onto latest dev' | git commit-tree "$tree_sha" -p "$target_head" -p "$dev_sha")"
          echo "tree_sha=$tree_sha"
          echo "final_commit=$final_commit"
          git push origin "$final_commit:refs/heads/$target_branch"
