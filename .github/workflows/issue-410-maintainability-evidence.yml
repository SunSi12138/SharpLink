name: Issue 410 maintainability evidence

on:
  push:
    branches:
      - tmp/issue-410-maintainability-evidence-20260906

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Generate baseline and candidate reports
        shell: bash
        env:
          BASELINE_SHA: 51e3f2c66a24615abf738f76a2380f223d72f2ab
          CANDIDATE_SHA: 723da9b5fa47f6ef77eaeaa1c5f941b9f4167baf
        run: |
          set -euo pipefail
          mkdir -p artifacts/issue410-maintainability/baseline artifacts/issue410-maintainability/candidate
          SHARPLINK_MAINTAINABILITY_SOURCE_REF="$BASELINE_SHA" \
            bash eng/report-maintainability.sh artifacts/issue410-maintainability/baseline
          SHARPLINK_MAINTAINABILITY_SOURCE_REF="$CANDIDATE_SHA" \
            bash eng/report-maintainability.sh artifacts/issue410-maintainability/candidate

      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-410-maintainability-${{ github.sha }}
          path: artifacts/issue410-maintainability
          if-no-files-found: error
          retention-days: 30
