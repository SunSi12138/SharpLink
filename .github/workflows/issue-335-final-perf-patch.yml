name: Issue 335 Final Perf Patch

on:
  push:
    branches:
      - evidence/issue-335-bdn-60b7206c

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply guarded hot-path patch
        shell: bash
        run: |
          git fetch origin issue-335-dynamic-admission-partition-update
          git checkout -B issue-335-dynamic-admission-partition-update origin/issue-335-dynamic-admission-partition-update
          test "$(git rev-parse HEAD)" = "43f82776b503d5141ae96c5d7b2e80009460d643"
          echo '' | base64 -d > "$RUNNER_TEMP/issue335-perf-patch.py"
          test "$(sha256sum "$RUNNER_TEMP/issue335-perf-patch.py" | cut -d' ' -f1)" = "a2e361bca83ccfe4845f2890d997aa36eecef6ebd4552bc5193b13505cfabcb4"
          python "$RUNNER_TEMP/issue335-perf-patch.py"
          git diff --check
          git diff --stat
          git diff -- src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs
          git commit -m "perf(admission): reduce partition request overhead"
          git push origin HEAD:issue-335-dynamic-admission-partition-update
