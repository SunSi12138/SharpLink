name: Issue 335 Final Perf Patch

on:
  push:
    branches:
      - evidence/issue-335-bdn-60b7206c

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply guarded hot-path patch
        shell: bash
        run: |
          git fetch origin issue-335-dynamic-admission-partition-update
          git checkout -B issue-335-dynamic-admission-partition-update origin/issue-335-dynamic-admission-partition-update
          test "$(git rev-parse HEAD)" = "60b7206c997aa58734c46043eba03a435a6a46b9"
          python - <<'PY'
          from pathlib import Path

          path = Path('src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs')
          text = path.read_text()
          old_find = "        AdmissionPartitionPolicyGeneration policy)\n    {\n        foreach (var generation in entry.Generations)"
          new_find = "        AdmissionPartitionPolicyGeneration policy)\n    {\n        if (ReferenceEquals(entry.Current.Policy, policy))\n            return entry.Current;\n        foreach (var generation in entry.Generations)"
          old_runtime = '    internal AdmissionRuleRuntime Runtime { get; } = generation.Runtime;\n'
          new_runtime = '    internal AdmissionRuleRuntime Runtime => generation.Runtime;\n'

          if text.count(old_find) != 1:
              raise SystemExit(f'expected one generation lookup anchor, found {text.count(old_find)}')
          if text.count(old_runtime) != 1:
              raise SystemExit(f'expected one lease Runtime property, found {text.count(old_runtime)}')

          path.write_text(text.replace(old_find, new_find).replace(old_runtime, new_runtime))
          PY
          git diff --check
          git diff -- src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs
          git commit -m "perf(admission): trim partition generation hot path"
          git push origin HEAD:issue-335-dynamic-admission-partition-update
