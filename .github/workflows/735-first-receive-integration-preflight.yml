name: 735 First Receive Source Recovery

on:
  push:
    branches: ['perf/735-preflight-flags']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct the validated candidate without changing its sources
        run: |
          set -euo pipefail
          python3 eng/preflight-735-first-receive-apply.py
          python3 - <<'PY'
          import pathlib, json
          root=pathlib.Path('.')
          files=['src/SharpLink.Runtime/StreamManager.FirstReceive.cs','src/SharpLink.Runtime/RpcSession.FirstReceive.cs','src/SharpLink.Runtime/StreamFlowController.ReceiveAdmission.cs']
          for name in files:
              print('SOURCE_BEGIN',name,flush=True)
              for i,line in enumerate((root/name).read_text().splitlines(),1): print(f'{i:04}: {line}',flush=True)
              print('SOURCE_END',name,flush=True)
          patch=(root/'artifacts/first-receive-integration/candidate.patch').read_text()
          print('PATCH_BEGIN',flush=True)
          print(patch,flush=True)
          print('PATCH_END',flush=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: 735-first-receive-source-recovery-${{ github.sha }}
          path: artifacts/first-receive-integration
          if-no-files-found: error
          retention-days: 30
