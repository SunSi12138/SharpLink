name: 735 Receive Allocation Attribution

on:
  push:
    branches: ['perf/735-preflight-flags']
permissions:
  contents: read
concurrency:
  group: 735-receive-allocation-attribution
  cancel-in-progress: false

jobs:
  allocation-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOTNET_PROCESSOR_COUNT: '4'
      CONTROL_SHA: e834d3c28c87ad496989af925515cf21babd308d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Reconstruct the same already-tested runtime, with no new production optimization
        run: |
          set -euo pipefail
          python3 eng/preflight-735-first-receive-apply.py
          cp eng/preflight-735-first-await-tests.cs test/SharpLink.UnitTests/Runtime/StreamManagerFirstReceiveAwaitAllocationTests.cs
          python3 eng/preflight-735-first-await-apply.py
          test "$(git hash-object src/SharpLink.Runtime/StreamManager.FirstReceive.cs)" = 5275251ea976ce2bf57575930e13ff4e7212af95
          test "$(git hash-object src/SharpLink.Runtime/StreamManager.cs)" = c60defe06f14079d862a9efb73b0fb39daa4ae8f
          git worktree add --detach "$RUNNER_TEMP/allocation-control" "$CONTROL_SHA"
          echo "CONTROL_ROOT=$RUNNER_TEMP/allocation-control" >> "$GITHUB_ENV"
          mkdir -p artifacts/allocation-attribution
          cp artifacts/first-receive-integration/provenance.json artifacts/allocation-attribution/runtime-provenance.json
          cp artifacts/first-receive-integration/candidate.patch artifacts/allocation-attribution/runtime-candidate.patch
          dotnet --info > artifacts/allocation-attribution/dotnet.txt
          lscpu > artifacts/allocation-attribution/cpu.txt
          python3 -m py_compile eng/preflight-735-allocation-profile.py
      - name: Build the pinned standalone trace reader and install the pinned trace collector
        run: |
          set -euo pipefail
          out="$PWD/artifacts/allocation-attribution"
          tools="$RUNNER_TEMP/allocation-tools"
          mkdir -p "$tools/parser"
          cp eng/preflight-735-allocation-parser.cs "$tools/parser/Program.cs"
          cat > "$tools/parser/AllocationParser.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><Nullable>enable</Nullable><TreatWarningsAsErrors>true</TreatWarningsAsErrors></PropertyGroup>
            <ItemGroup><PackageReference Include="Microsoft.Diagnostics.Tracing.TraceEvent" Version="3.2.8" /></ItemGroup>
          </Project>
          XML
          dotnet build "$tools/parser" -c Release > "$out/parser-build.log" 2>&1 || { cat "$out/parser-build.log"; exit 1; }
          cat "$out/parser-build.log"
          dotnet tool install dotnet-trace --version 10.0.745401 --tool-path "$tools/bin" > "$out/trace-install.log" 2>&1 || { cat "$out/trace-install.log"; exit 1; }
          "$tools/bin/dotnet-trace" --version | tee "$out/trace-version.txt"
          echo "TRACE=$tools/bin/dotnet-trace" >> "$GITHUB_ENV"
          echo "PARSER=$tools/parser/bin/Release/net10.0/AllocationParser.dll" >> "$GITHUB_ENV"
          cp "$tools/parser/AllocationParser.csproj" "$out/AllocationParser.csproj"
          cp eng/preflight-735-allocation-parser.cs "$out/parser.cs"
      - name: Prove trace reader excludes allocations outside the marked interval
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/allocation-calibration"
          out="$PWD/artifacts/allocation-attribution/calibration"
          mkdir -p "$fixture" "$out"
          cp eng/preflight-735-allocation-window.cs "$fixture/Window.cs"
          cat > "$fixture/Calibration.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><TreatWarningsAsErrors>true</TreatWarningsAsErrors></PropertyGroup></Project>
          XML
          cat > "$fixture/Program.cs" <<'CS'
          using SharpLink.Benchmarks;
          for (var i = 0; i < 64; i++) GC.KeepAlive(new OutsideWindow[32768]);
          AllocationWindow735.Log.WindowBegin();
          var before = GC.GetTotalAllocatedBytes(true);
          for (var i = 0; i < 256; i++) GC.KeepAlive(new InsideWindow[32768]);
          var allocated = GC.GetTotalAllocatedBytes(true) - before;
          AllocationWindow735.Log.WindowEnd(256, 256, allocated);
          for (var i = 0; i < 64; i++) GC.KeepAlive(new OutsideWindow[32768]);
          File.WriteAllText(args[0], "{\"operations\":256,\"itemCount\":1,\"validationFailures\":0,\"commit\":\"calibration\",\"transport\":\"none\",\"scenario\":\"window-exclusion\"}");
          internal sealed class InsideWindow { }
          internal sealed class OutsideWindow { }
          CS
          dotnet build "$fixture" -c Release > "$out/build.log" 2>&1 || { cat "$out/build.log"; exit 1; }
          "$TRACE" collect --profile gc-verbose --providers SharpLink-735-AllocationWindow:0xffff:4 --output "$out/calibration.nettrace" -- dotnet "$fixture/bin/Release/net10.0/Calibration.dll" "$out/rpc.json" > "$out/collect.log" 2>&1 || { cat "$out/collect.log"; exit 1; }
          dotnet "$PARSER" "$out/calibration.nettrace" "$out/rpc.json" "$out/types.json" | tee "$out/parse.log"
          python3 - <<'PY'
          import json,pathlib
          row=json.loads(pathlib.Path('artifacts/allocation-attribution/calibration/types.json').read_text())
          assert row['eventsLost']==0 and row['allocationTickSamples']>=100,row
          assert any('InsideWindow' in t['type'] for t in row['types']),row
          assert not any('OutsideWindow' in t['type'] for t in row['types']),row
          print('PASS: only inside-window allocation type survives marker filtering.')
          PY
      - name: Add identical boundary markers to both original RPC harnesses
        run: |
          set -euo pipefail
          python3 eng/preflight-735-allocation-profile.py prepare "$CONTROL_ROOT" "$PWD" artifacts/allocation-attribution
          dotnet build "$CONTROL_ROOT/test/SharpLink.Benchmarks" -c Release -p:Platform=AnyCPU -p:PublishAot=false -p:TreatWarningsAsErrors=true > artifacts/allocation-attribution/control-build.log 2>&1 || { cat artifacts/allocation-attribution/control-build.log; exit 1; }
          dotnet build test/SharpLink.Benchmarks -c Release -p:Platform=AnyCPU -p:PublishAot=false -p:TreatWarningsAsErrors=true > artifacts/allocation-attribution/candidate-build.log 2>&1 || { cat artifacts/allocation-attribution/candidate-build.log; exit 1; }
          tail -n 7 artifacts/allocation-attribution/control-build.log
          tail -n 7 artifacts/allocation-attribution/candidate-build.log
      - name: Collect fixed allocation-type diagnostics, not performance acceptance samples
        run: |
          set -euo pipefail
          python3 eng/preflight-735-allocation-profile.py measure "$CONTROL_ROOT" "$PWD" artifacts/allocation-attribution "$TRACE" "$PARSER" 2>&1 | tee artifacts/allocation-attribution/profile-driver.log
      - name: Verify production-runtime sources were not altered by profiling
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          p=json.loads(pathlib.Path('artifacts/allocation-attribution/runtime-provenance.json').read_text())
          for name,expected in p['source_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',name],text=True).strip()
              assert actual==expected,(name,actual,expected)
          print('All previously validated runtime/test blobs remain unchanged.')
          PY
      - name: Retain raw traces, window calibration and every diagnostic outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 735-receive-allocation-attribution-${{ github.sha }}
          path: artifacts/allocation-attribution
          if-no-files-found: error
          retention-days: 30
