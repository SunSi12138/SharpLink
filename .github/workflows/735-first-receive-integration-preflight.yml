name: 735 Actual Native First Receive RPC Evidence

on:
  push:
    branches: ['perf/735-preflight-flags']
permissions:
  contents: read
concurrency:
  group: 735-actual-native-first-receive-rpc
  cancel-in-progress: false

jobs:
  native-rpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOTNET_PROCESSOR_COUNT: '4'
      CONTROL_SHA: e834d3c28c87ad496989af925515cf21babd308d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Reconstruct exactly the runtime already validated in single-await preflight
        run: |
          set -euo pipefail
          python3 eng/preflight-735-first-receive-apply.py
          cp eng/preflight-735-first-await-tests.cs test/SharpLink.UnitTests/Runtime/StreamManagerFirstReceiveAwaitAllocationTests.cs
          python3 eng/preflight-735-first-await-apply.py
          test "$(git hash-object src/SharpLink.Runtime/StreamManager.FirstReceive.cs)" = 5275251ea976ce2bf57575930e13ff4e7212af95
          test "$(git hash-object src/SharpLink.Runtime/StreamManager.cs)" = c60defe06f14079d862a9efb73b0fb39daa4ae8f
          git worktree add --detach "$RUNNER_TEMP/native-first-receive-control" "$CONTROL_SHA"
          echo "CONTROL_ROOT=$RUNNER_TEMP/native-first-receive-control" >> "$GITHUB_ENV"
          dotnet --info > artifacts/first-receive-integration/dotnet.txt
          lscpu > artifacts/first-receive-integration/cpu.txt
          python3 -m py_compile eng/preflight-735-prepare-native-rpc.py eng/preflight-735-native-rpc.py
      - name: Preserve service, contracts, transport and timed loop on both revisions
        run: |
          set -euo pipefail
          python3 eng/preflight-735-prepare-native-rpc.py "$CONTROL_ROOT" "$PWD" artifacts/first-receive-integration
      - name: Compile both minimal hosts before native publication
        run: |
          set -euo pipefail
          out=artifacts/first-receive-integration
          dotnet build "$CONTROL_ROOT/test/SharpLink.FirstReceiveRpcEvidence" -c Release -p:Platform=AnyCPU -p:PublishAot=false -p:TreatWarningsAsErrors=true > "$out/native-control-managed-build.log" 2>&1 || { cat "$out/native-control-managed-build.log"; exit 1; }
          dotnet build test/SharpLink.FirstReceiveRpcEvidence -c Release -p:Platform=AnyCPU -p:PublishAot=false -p:TreatWarningsAsErrors=true > "$out/native-candidate-managed-build.log" 2>&1 || { cat "$out/native-candidate-managed-build.log"; exit 1; }
          tail -n 6 "$out/native-control-managed-build.log"
          tail -n 6 "$out/native-candidate-managed-build.log"
      - name: Publish both actual NativeAOT binaries with original package and warning policies
        run: |
          set -euo pipefail
          out=artifacts/first-receive-integration
          dotnet publish "$CONTROL_ROOT/test/SharpLink.FirstReceiveRpcEvidence" -c Release -r linux-x64 -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true -o "$PWD/artifacts/native-rpc/control" > "$out/native-control-publish.log" 2>&1 || { cat "$out/native-control-publish.log"; exit 1; }
          dotnet publish test/SharpLink.FirstReceiveRpcEvidence -c Release -r linux-x64 -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true -o "$PWD/artifacts/native-rpc/candidate" > "$out/native-candidate-publish.log" 2>&1 || { cat "$out/native-candidate-publish.log"; exit 1; }
          tail -n 8 "$out/native-control-publish.log"
          tail -n 8 "$out/native-candidate-publish.log"
          file artifacts/native-rpc/control/SharpLink.Benchmarks artifacts/native-rpc/candidate/SharpLink.Benchmarks | tee "$out/native-binary-formats.txt"
          sha256sum artifacts/native-rpc/control/SharpLink.Benchmarks artifacts/native-rpc/candidate/SharpLink.Benchmarks > "$out/native-binary-sha256.txt"
      - name: Verify runtime source identity after publication
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path('artifacts/first-receive-integration')
          p=json.loads((root/'provenance.json').read_text())
          for name,sha in p['source_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',name],text=True).strip()
              assert actual==sha,(name,actual,sha)
          print('All eight previously validated source/test blobs remain unchanged.')
          PY
      - name: Measure real short and long generated RPC on both native revisions exactly once
        run: |
          set -euo pipefail
          python3 eng/preflight-735-native-rpc.py artifacts/native-rpc/control/SharpLink.Benchmarks artifacts/native-rpc/candidate/SharpLink.Benchmarks "$(cat artifacts/first-receive-integration/candidate-tree.txt)" artifacts/first-receive-integration/native-e2e 2>&1 | tee artifacts/first-receive-integration/native-rpc-driver.log
      - name: Retain source provenance, publication logs and all native timing outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 735-first-receive-actual-native-rpc-${{ github.sha }}
          path: artifacts/first-receive-integration
          if-no-files-found: error
          retention-days: 30
