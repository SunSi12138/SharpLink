name: 735 Consumer Wait Reuse Preflight

on:
  push:
    branches: ['perf/735-preflight-flags']
permissions:
  contents: read
concurrency:
  group: 735-consumer-wait-reuse-preflight
  cancel-in-progress: false

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOTNET_PROCESSOR_COUNT: '4'
      TUNIT_MAX_PARALLEL_TESTS: '8'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Reconstruct unchanged first-receive integration and install the same wait controls
        run: |
          set -euo pipefail
          python3 eng/preflight-735-first-receive-apply.py
          cp eng/preflight-735-first-await-tests.cs test/SharpLink.UnitTests/Runtime/StreamManagerFirstReceiveAwaitAllocationTests.cs
          python3 eng/preflight-735-first-await-apply.py
          test "$(git hash-object eng/preflight-735-consumer-wait-tests.cs)" = 72528915f81552239d30cd8f63d5d2493cfb6c69
          cp eng/preflight-735-consumer-wait-tests.cs test/SharpLink.UnitTests/Runtime/PooledDispatcherSlowWaitTests.cs
          mkdir -p artifacts/consumer-wait
          dotnet --info > artifacts/consumer-wait/dotnet.txt
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true > artifacts/consumer-wait/prior-build.log 2>&1 || { cat artifacts/consumer-wait/prior-build.log; exit 1; }
          tail -n 7 artifacts/consumer-wait/prior-build.log
      - name: Require the old allocation cost without weakening cancellation and lifetime controls
        run: |
          export SHARPLINK_SLOW_WAIT_EVIDENCE="$PWD/artifacts/consumer-wait/prior"
          set +e
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU -- --treenode-filter '/*/*/PooledDispatcherSlowWaitTests/*' > artifacts/consumer-wait/prior-checks.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('artifacts/consumer-wait/prior-checks.log').read_text()
          text=re.sub(r'\x1b\[[0-9;]*m','',text)
          print(text)
          assert re.search(r'total:\s+5\b',text),text
          assert re.search(r'failed:\s+1\b',text),text
          assert re.search(r'succeeded:\s+4\b',text),text
          assert 'suspended MoveNext still allocates one fresh wrapper for every item' in text,text
          PY
      - name: Change only the lower consumer async builder
        run: |
          set -euo pipefail
          python3 eng/preflight-735-consumer-wait-apply.py
          touch artifacts/consumer-wait/applied
      - name: Rebuild and test pending allocation, exceptions, old results and reference retention
        run: |
          set -euo pipefail
          export SHARPLINK_SLOW_WAIT_EVIDENCE="$PWD/artifacts/consumer-wait/candidate"
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true > artifacts/consumer-wait/candidate-build.log 2>&1 || { cat artifacts/consumer-wait/candidate-build.log; exit 1; }
          tail -n 7 artifacts/consumer-wait/candidate-build.log
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU -- --treenode-filter '/*/*/PooledDispatcherSlowWaitTests/*' 2>&1 | tee artifacts/consumer-wait/candidate-checks.log
          python3 - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('artifacts/consumer-wait')
          values={}
          for mode in ('prior','candidate'):
              with (root/mode/'pending-read.csv').open() as f: rows=list(csv.DictReader(f))
              assert len(rows)==1 and int(rows[0]['count'])==512,rows
              values[mode]=int(rows[0]['allocated_bytes'])/512
          assert values['candidate']<=16 and values['prior']-values['candidate']>=64,values
          (root/'allocation.json').write_text(json.dumps(values,indent=2)+'\n')
          print('EXACT_PENDING_START_BYTES',values)
          PY
      - name: Preserve original engineering gates and complete default runtime tests
        run: |
          set -euo pipefail
          dotnet format whitespace test/SharpLink.UnitTests/SharpLink.UnitTests.csproj --no-restore --verify-no-changes --include src/SharpLink.Runtime/PooledAsyncStreamDispatcher.cs test/SharpLink.UnitTests/Runtime/PooledDispatcherSlowWaitTests.cs 2>&1 | tee artifacts/consumer-wait/format.log
          python3 eng/check-project-reference-boundaries.py 2>&1 | tee artifacts/consumer-wait/references.log
          bash eng/check-maintainability.sh 2>&1 | tee artifacts/consumer-wait/maintainability.log
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU 2>&1 | tee artifacts/consumer-wait/default-unit.log
      - name: Complete experimental runtime and actual writer checks independently
        if: always()
        run: |
          set -euo pipefail
          test -f artifacts/consumer-wait/applied
          python3 eng/test-ready-writer.py
          python3 eng/test-ready-writer-budget.py
          python3 eng/test-ready-writer-collection.py
          python3 eng/test-ready-writer-native.py
          python3 eng/prepare-ready-writer.py --apply
          dotnet build test/SharpLink.Benchmarks -c Release -p:ReadyWriterExperiment=true -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true > artifacts/consumer-wait/writer-build.log 2>&1 || { cat artifacts/consumer-wait/writer-build.log; exit 1; }
          dotnet test/SharpLink.Benchmarks/bin/Release/net10.0/SharpLink.Benchmarks.dll --ready-writer-self-test 2>&1 | tee artifacts/consumer-wait/writer-checks.log
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true > artifacts/consumer-wait/experimental-build.log 2>&1 || { cat artifacts/consumer-wait/experimental-build.log; exit 1; }
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU 2>&1 | tee artifacts/consumer-wait/experimental-unit.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: 735-consumer-wait-correctness-${{ github.sha }}
          path: |
            artifacts/consumer-wait
            artifacts/first-receive-integration
          if-no-files-found: error
          retention-days: 30

  rpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime: [jit-pgo0, jit-pgo1, native]
    env:
      DOTNET_PROCESSOR_COUNT: '4'
      CONTROL_SHA: e834d3c28c87ad496989af925515cf21babd308d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Construct three source-pinned runtime arms without diagnostic instrumentation
        run: |
          set -euo pipefail
          mkdir -p artifacts/consumer-wait-rpc
          git worktree add --detach "$RUNNER_TEMP/consumer-published" "$CONTROL_SHA"
          git worktree add --detach "$RUNNER_TEMP/consumer-prior" HEAD
          echo "PUBLISHED=$RUNNER_TEMP/consumer-published" >> "$GITHUB_ENV"
          echo "PRIOR=$RUNNER_TEMP/consumer-prior" >> "$GITHUB_ENV"
          (
            cd "$RUNNER_TEMP/consumer-prior"
            python3 eng/preflight-735-first-receive-apply.py
            cp eng/preflight-735-first-await-tests.cs test/SharpLink.UnitTests/Runtime/StreamManagerFirstReceiveAwaitAllocationTests.cs
            python3 eng/preflight-735-first-await-apply.py
          )
          python3 eng/preflight-735-first-receive-apply.py
          cp eng/preflight-735-first-await-tests.cs test/SharpLink.UnitTests/Runtime/StreamManagerFirstReceiveAwaitAllocationTests.cs
          python3 eng/preflight-735-first-await-apply.py
          cp eng/preflight-735-consumer-wait-tests.cs test/SharpLink.UnitTests/Runtime/PooledDispatcherSlowWaitTests.cs
          python3 eng/preflight-735-consumer-wait-apply.py
          cp "$RUNNER_TEMP/consumer-prior/artifacts/first-receive-integration/provenance.json" artifacts/consumer-wait-rpc/prior-runtime.json
          cp artifacts/first-receive-integration/provenance.json artifacts/consumer-wait-rpc/candidate-runtime.json
          dotnet --info > artifacts/consumer-wait-rpc/dotnet.txt
          lscpu > artifacts/consumer-wait-rpc/cpu.txt
          python3 -m py_compile eng/preflight-735-consumer-wait-rpc.py
      - name: Build identical uninstrumented JIT hosts
        if: matrix.runtime != 'native'
        run: |
          set -euo pipefail
          for label in published prior candidate; do
            source="$PWD"; if [[ "$label" == published ]]; then source="$PUBLISHED"; fi; if [[ "$label" == prior ]]; then source="$PRIOR"; fi
            cmp test/SharpLink.Benchmarks/GeneratedAbiStreamingEvidenceRunner.cs "$source/test/SharpLink.Benchmarks/GeneratedAbiStreamingEvidenceRunner.cs"
            dotnet build "$source/test/SharpLink.Benchmarks" -c Release -p:Platform=AnyCPU -p:PublishAot=false -p:TreatWarningsAsErrors=true > "artifacts/consumer-wait-rpc/$label-build.log" 2>&1 || { cat "artifacts/consumer-wait-rpc/$label-build.log"; exit 1; }
            tail -n 7 "artifacts/consumer-wait-rpc/$label-build.log"
          done
      - name: Build identical actual NativeAOT generated RPC hosts
        if: matrix.runtime == 'native'
        run: |
          set -euo pipefail
          python3 eng/preflight-735-prepare-native-rpc.py "$PUBLISHED" "$PRIOR" artifacts/consumer-wait-rpc/native-prior-host
          python3 eng/preflight-735-prepare-native-rpc.py "$PUBLISHED" "$PWD" artifacts/consumer-wait-rpc/native-candidate-host
          for label in published prior candidate; do
            source="$PWD"; if [[ "$label" == published ]]; then source="$PUBLISHED"; fi; if [[ "$label" == prior ]]; then source="$PRIOR"; fi
            dotnet publish "$source/test/SharpLink.FirstReceiveRpcEvidence" -c Release -r linux-x64 -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true -o "$source/artifacts/consumer-native" > "artifacts/consumer-wait-rpc/$label-native-build.log" 2>&1 || { cat "artifacts/consumer-wait-rpc/$label-native-build.log"; exit 1; }
            tail -n 8 "artifacts/consumer-wait-rpc/$label-native-build.log"
          done
      - name: Run every short and long three-arm comparison once
        run: |
          set -euo pipefail
          python3 eng/preflight-735-consumer-wait-rpc.py "$PUBLISHED" "$PRIOR" "$PWD" artifacts/consumer-wait-rpc/results --runtime '${{ matrix.runtime }}' 2>&1 | tee artifacts/consumer-wait-rpc/driver.log
      - name: Verify no profiler or unintended runtime change entered the measured arms
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,os
          for root in (pathlib.Path.cwd(),pathlib.Path(os.environ['PRIOR'])):
              p=json.loads((root/'artifacts/first-receive-integration/provenance.json').read_text())
              for name,expected in p['source_blobs'].items():
                  actual=subprocess.check_output(['git','hash-object',name],cwd=root,text=True).strip()
                  assert actual==expected,(root,name,actual,expected)
          print('Measured runtime/test source identities unchanged.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: 735-consumer-wait-rpc-${{ matrix.runtime }}-${{ github.sha }}
          path: |
            artifacts/consumer-wait-rpc
            artifacts/first-receive-integration
          if-no-files-found: error
          retention-days: 30
