name: Issue 311 review fixes

on:
  push:
    branches:
      - fix/311-codec-scope-routing
    paths:
      - .github/workflows/issue-311-review-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/311-codec-scope-routing
          fetch-depth: 0
      - name: Apply review fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              'src/SharpLink.Runtime/Codec/RpcManifestCodecProvider.cs',
              'registration.GetCodec((RpcCodecProvider)_owner.BaseProvider)',
              'registration.GetCodec(this)')

          replace(
              'src/SharpLink.Abstractions/SharpLinkGeneratedAssemblyManifest.cs',
              'public const int Api = 3;',
              'public const int Api = 4;')

          replace(
              'src/SharpLink.Generator/RpcGenerator.ContractManifest.cs',
              '''WireType = GetContractWireType(typeName, parameter.IsStream\n                            ? parameter.StreamItemEnumUnderlyingType\n                            : parameter.EnumUnderlyingType),''',
              '''WireType = !parameter.IsStream && !parameter.IsBlittable\n                            ? "LengthDelimited"\n                            : GetContractWireType(typeName, parameter.IsStream\n                                ? parameter.StreamItemEnumUnderlyingType\n                                : parameter.EnumUnderlyingType),''')

          replace(
              'test/SharpLink.UnitTests/Client/SharpClientBuilderTests.cs',
              '''Ensure(SharpLinkGeneratedManifestVersions.Api == 3,\n            "Codec Adapter metadata requires generated manifest API 3");''',
              '''Ensure(SharpLinkGeneratedManifestVersions.Api == 4,\n            "owner-scoped generated Codec binding requires generated manifest API 4");''')

          replace(
              'test/SharpLink.UnitTests/Client/SharpClientBuilderTests.cs',
              'public int ApiVersion => 1;',
              'public int ApiVersion => 3;')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SharpLink.Runtime/Codec/RpcManifestCodecProvider.cs \
                  src/SharpLink.Abstractions/SharpLinkGeneratedAssemblyManifest.cs \
                  src/SharpLink.Generator/RpcGenerator.ContractManifest.cs \
                  test/SharpLink.UnitTests/Client/SharpClientBuilderTests.cs
          git commit -m "Address owner-scoped codec review findings"
          git push origin HEAD:fix/311-codec-scope-routing
