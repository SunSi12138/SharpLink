name: Issue 311 contract codec binding refactor v5

on:
  pull_request:
    paths:
      - .github/workflows/issue-311-contract-binding-v5.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/311-codec-scope-routing
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Apply refactor and align tests
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/issue-311-contract-binding-v4.yml').read_text()
          marker = "          python - <<'PYRUN'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PYRUN\n", start)
          raw = source[start:end]
          lines = raw.splitlines()
          first = next(line for line in lines if line.strip())
          indent = len(first) - len(first.lstrip())
          prefix = ' ' * indent
          script = '\n'.join(line[indent:] if line.startswith(prefix) else line for line in lines)
          exec(compile(script, 'issue-311-contract-binding-v4.py', 'exec'), {'__name__': '__main__'})

          path = Path('test/SharpLink.Generator.Tests/RpcCodecRouteOwnerBindingTests.cs')
          text = path.read_text()
          text = text.replace(
              '        Ensure(generated.Contains("ManifestScopedCodecTargets", StringComparison.Ordinal),\n            "route-selected targets must be marked manifest scoped");\n',
              '        Ensure(generated.Contains("ContractCodecs => __readOnlyContractCodecs", StringComparison.Ordinal),\n            "route-selected targets must be emitted into the Contract-owned binding table");\n')
          text = text.replace(
              '        Ensure(generated.Contains("RpcGeneratedCodecResolver.GetProvider", StringComparison.Ordinal),\n            "generated proxies must bind the Contract owner\'s Codec provider at construction");\n        Ensure(generated.Contains("public void BindCodecProvider(IRpcCodecProvider codecs)", StringComparison.Ordinal),\n            "generated stubs must accept a construction-time owner Codec provider");\n',
              '        Ensure(generated.Contains("static (channel, codecs) =>", StringComparison.Ordinal),\n            "the generated proxy factory must receive the Contract owner Codec provider from registration");\n        Ensure(generated.Contains("static codecs => new", StringComparison.Ordinal),\n            "the generated stub factory must receive the Contract owner Codec provider from registration");\n        Ensure(generated.Contains("internal IOwnerRouteContract_Stub(IRpcCodecProvider codecs)", StringComparison.Ordinal),\n            "generated stubs must bind owner Codecs during construction rather than through a later mutation");\n')
          path.write_text(text)

          path = Path('test/SharpLink.Generator.Tests/ContractManifestGeneratorTests.cs')
          text = path.read_text()
          old = '            "\\\"version\\\": 1", "\\\"version\\\": 99", StringComparison.Ordinal);'
          if old not in text:
              raise RuntimeError('baseline version fixture not found')
          path.write_text(text.replace(
              old,
              '            "\\\"version\\\": 2", "\\\"version\\\": 99", StringComparison.Ordinal);',
              1))
          PY

      - name: Format changed files
        run: dotnet format Sharplink.slnx whitespace

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Build
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Generator tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build

      - name: Unit tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Commit refactor
        run: |
          git config user.name "SunSi12138"
          git config user.email "54728594+SunSi12138@users.noreply.github.com"
          git add src test
          git diff --cached --check
          git commit -m "Separate Contract codec bindings from global codecs"
          git push origin HEAD:fix/311-codec-scope-routing
