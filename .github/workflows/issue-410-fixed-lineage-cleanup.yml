name: Issue 410 FixedWindow lineage promotion

on:
  push:
    branches:
      - tmp/issue-410-fixed-lineage-cleanup-20260906

permissions:
  contents: write

concurrency:
  group: issue-410-fixed-lineage-promote
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet
      - name: Apply lineage-only cleanup
        run: python3 .github/issue410-fixed-lineage-cleanup.py
      - name: Restore
        run: dotnet restore Sharplink.slnx
      - name: Format
        run: dotnet format whitespace Sharplink.slnx --no-restore
      - name: Maintainability
        run: bash eng/check-maintainability.sh
      - name: Build Release
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal
      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build
      - name: Commit clean lineage cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/issue410-fixed-lineage-cleanup.py
          rm .github/issue410-fixed-sequence-cleanup.py
          rm .github/workflows/issue-410-fixed-lineage-cleanup.yml
          rm .github/workflows/issue-410-fixed-state-performance.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(admission): detach fixed window from legacy lineage'
          git push origin HEAD:tmp/issue-410-fixed-lineage-cleanup-20260906
