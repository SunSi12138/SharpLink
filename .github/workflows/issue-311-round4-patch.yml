          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_exact(path, old, new, count=1):
              text = read(path)
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} exact matches, found {actual}")
              write(path, text.replace(old, new, count))

          def replace_regex(path, pattern, replacement, count=1):
              text = read(path)
              rx = re.compile(pattern, re.S)
              new_text, actual = rx.subn(lambda _: replacement, text, count=count)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} regex matches, found {actual}")
              write(path, new_text)

          # Generator: all actual override selection goes through one precedence entrypoint.
