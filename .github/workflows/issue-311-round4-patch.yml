name: Issue 311 round 4 patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('src/SharpLink.Runtime/Codec/RpcCodecProvider.cs')
          text = path.read_text()
          old = 'internal IRpcCodec GetCodec(IRpcCodecProvider provider)'
          new = 'internal IRpcCodec GetCodec(IRpcCodecProvider provider)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one concrete GetCodec signature, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          files = [
              'src/SharpLink.Abstractions/IRpcChannel.cs',
              'src/SharpLink.Client/SharpLinkClient.RpcChannel.cs',
              'src/SharpLink.Generator/RpcGenerator.CodecRoutes.cs',
              'src/SharpLink.Generator/RpcGenerator.ContractManifest.cs',
              'src/SharpLink.Generator/RpcGenerator.DtoAnalysis.cs',
              'src/SharpLink.Runtime/Codec/RpcCodecProvider.cs',
              'src/SharpLink.Runtime/Codec/RpcManifestCodecProvider.cs',
              'src/SharpLink.Runtime/SharpLinkRuntimeContext.cs',
              'src/SharpLink.Server/SharpLinkServer.Assemblies.cs',
              'test/SharpLink.Generator.Tests/RpcCodecRouteContractManifestTests.cs',
              'test/SharpLink.Generator.Tests/RpcCodecRouteTests.cs',
              'test/SharpLink.UnitTests/Runtime/RpcManifestCodecProviderTests.cs',
          ]
          subprocess.run(
              ['dotnet', 'format', 'Sharplink.slnx', 'whitespace', '--include', *files],
              check=True)
          PY
