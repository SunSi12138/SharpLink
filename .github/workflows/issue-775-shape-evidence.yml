name: Issue 775 fixed shape candidate evidence
on:
  push:
    branches: [prototype/775-static-session-binding]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  evidence:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[issue775-shape-paired]')
    strategy:
      fail-fast: false
      matrix:
        comparison: [original-dev, previous-static]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8f1a81e2c3bfc2c0cfc4734b658684631aa2954e
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.comparison == 'original-dev' && '1a54993d3550911f5979a7b4d3f9f5f63ee86a64' || '8810547756d1c16367bba8d81f6707018b9d7e5d' }}
          path: comparator
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: candidate/global.json
      - name: Verify existing reader and frozen wrapper
        run: |
          python3 -m unittest discover -s driver/eng/issue775 -p test_attribution.py -v
          PYTHONPATH=driver/eng/issue775 python3 - <<'PY'
          import os, shape_pair
          runner = shape_pair.configure()
          assert runner.COMMITS == shape_pair.COMMITS
          assert runner.ORDER == ('old','candidate','candidate','old','candidate','old','old','candidate')
          assert len(runner.CASES) == 8
          assert not any(k.startswith(('DOTNET_', 'COMPlus_', 'CORECLR_', 'COR_')) and any(s in k.lower() for s in ('jit','tier','profiler','processor_count')) for k in os.environ)
          PY
      - name: Original baseline ABBA and BAAB with unchanged runner
        if: matrix.comparison == 'original-dev'
        run: |
          python3 candidate/eng/issue775/run.py --base-root comparator --head-root candidate \
            --expected-head 8f1a81e2c3bfc2c0cfc4734b658684631aa2954e --output evidence
      - name: Previous static ABBA and BAAB with explicit identities
        if: matrix.comparison == 'previous-static'
        run: |
          python3 driver/eng/issue775/shape_pair.py --old comparator --candidate candidate --output evidence
      - name: Retain exact source and every result
        if: always()
        run: |
          mkdir -p evidence
          git -C driver rev-parse HEAD > evidence/driver-sha.txt
          git -C candidate archive HEAD | gzip > evidence/candidate-source.tar.gz
          if test -f evidence/summary.md; then cat evidence/summary.md | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if test -f evidence/execution-failures.json; then cat evidence/execution-failures.json; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue775-shape-${{ matrix.comparison }}-8f1a81e2-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
