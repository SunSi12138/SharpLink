name: Issue 331 Perf Fix V4

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.ref == 'issue-331-dynamic-admission-update'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Keep test hook off exhausted reject path
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/SharpLink.Server/Admission/AdmissionLimiterState.cs')
          text = path.read_text()
          old = '''        ValidatePermitCount(permitCount);\n        BeforeAttemptAcquireForTests?.Invoke();\n\n        // The complete AdmissionRequest owns the reader-visible target-version transaction. Keep\n'''
          new = '''        ValidatePermitCount(permitCount);\n\n        // The complete AdmissionRequest owns the reader-visible target-version transaction. Keep\n'''
          if old not in text:
              raise SystemExit('attempt hook source pattern missing')
          text = text.replace(old, new, 1)
          old = '''        if (Volatile.Read(ref _disposed) != 0 ||\n            Volatile.Read(ref _active) >= Volatile.Read(ref _permitLimit))\n        {\n            return FailedLease.Instance;\n        }\n\n        lock (_gate)\n'''
          new = '''        if (Volatile.Read(ref _disposed) != 0 ||\n            Volatile.Read(ref _active) >= Volatile.Read(ref _permitLimit))\n        {\n            return FailedLease.Instance;\n        }\n\n        // The deterministic publication-race hook is needed only once an immediate attempt can\n        // still reach the state lock. Exhausted rejection is already final and must stay on the\n        // minimal production fast path.\n        BeforeAttemptAcquireForTests?.Invoke();\n\n        lock (_gate)\n'''
          if old not in text:
              raise SystemExit('fast reject source pattern missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Validate formatting and full unit suite
        shell: bash
        run: |
          set -euxo pipefail
          dotnet restore SharpLink.slnx
          dotnet format SharpLink.slnx --no-restore --verify-no-changes
          dotnet test test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Debug --no-restore --logger 'console;verbosity=minimal'

      - name: Commit tested patch and remove helper
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/workflows/issue331-perf-fix-v4.yml
          git add src/SharpLink.Server/Admission/AdmissionLimiterState.cs .github/workflows/issue331-perf-fix-v4.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep exhausted admission rejection on fast path'
          git push origin HEAD:issue-331-dynamic-admission-update
