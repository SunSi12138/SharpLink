name: PR742 B3 integration toolchain export

on:
  push:
    branches: ['research/742-b3-integration-20261010']
    paths: ['.github/workflows/742-b3-integration-validation.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export-verified-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the unmodified completed baseline evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: SunSi12138/SharpLink
        run: |
          set -euo pipefail
          gh run download 38049064667 --name pr742-b3-offline-toolchain-38049064667 --dir artifacts/b3-integration
          ls -lh artifacts/b3-integration
          mkdir -p artifacts/metadata
          cp artifacts/b3-integration/*.txt artifacts/b3-integration/*.log artifacts/b3-integration/SHA256SUMS artifacts/b3-integration/source.tar.gz artifacts/metadata/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr742-b3-source-and-baseline
          path: artifacts/metadata
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr742-b3-dotnet-toolchain
          path: artifacts/b3-integration/dotnet-toolchain.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr742-b3-nuget-packages
          path: artifacts/b3-integration/nuget-packages.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
