name: Issue 406 current-head NativeAOT evidence

on:
  push:
    branches:
      - tmp/issue-406-handoff-stage

permissions:
  contents: read

jobs:
  nativeaot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-14
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c124a5003dbe21fab7337b9afe33283bef4a690f

      - name: Verify exact target
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "c124a5003dbe21fab7337b9afe33283bef4a690f"
          echo "NativeAOT target: $actual"

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Run NativeAOT Transport and Topology Smoke
        shell: bash
        env:
          SHARPLINK_AOT_RID: ${{ matrix.rid }}
          SHARPLINK_AOT_OUTPUT: ${{ github.workspace }}/artifacts/aot
        run: ./eng/run-shared-memory-aot-process-smoke.sh
