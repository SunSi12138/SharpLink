name: Issue 739 DEV SendPump net10 controls
on:
  push:
    branches: ['validation/issue739-dev-sendpump-net10-20261010']
    paths: ['eng/validation/issue739/**', '.github/workflows/issue739-dev-sendpump-net10.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  ISSUE739_SOURCE_SHA: eb99fe887cf2129d9b88441245ca0a4a6406b6c2
  ISSUE739_RUNTIME_VERSION: '10.0.12'
  ISSUE739_SDK_VERSION: '10.0.112'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_TieredPGO: '1'
  DOTNET_TieredCompilation: '1'
  DOTNET_gcServer: '0'
jobs:
  sendpump-net10:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.112'
      - name: Verify pinned dev and toolchain
        run: |
          test -z "$(git diff "$ISSUE739_SOURCE_SHA" -- src Directory.Build.props Directory.Packages.props global.json)"
          test "$(dotnet --version)" = "$ISSUE739_SDK_VERSION"
          dotnet --list-runtimes | grep -F "Microsoft.NETCore.App $ISSUE739_RUNTIME_VERSION ["
      - name: Run reviewed eight-case source controls
        run: python3 eng/validation/issue739/sendpump/run.py --stage net10 --dotnet dotnet --output artifacts/issue739/sendpump-net10 --work-root "$RUNNER_TEMP/issue739-sendpump-net10-work" --budget-seconds 840
      - name: Preserve raw results and proof including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue739-dev-sendpump-net10-${{ github.sha }}
          path: artifacts/issue739/sendpump-net10
          if-no-files-found: error
