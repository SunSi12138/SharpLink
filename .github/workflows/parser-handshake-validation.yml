name: Twenty-three ordinary parser and handshake fixture validation
permissions:
  contents: read
on:
  push:
    branches: ['validation/parser-handshake-fixtures-20261105']
    paths:
      - '.github/workflows/parser-handshake-validation.yml'
      - 'eng/run-parser-handshake-validation.py'
      - 'eng/tests/test_parser_handshake_validation.py'
      - 'eng/rebase-three-fixture-census.py'
      - 'eng/tests/test_three_fixture_census.py'
      - 'eng/three-fixture-census-rebase.json'
      - 'eng/fixture-migration-baseline/**'
      - 'eng/unit-census.json'
      - 'eng/unit-execution-results.py'
      - 'test/SharpLink.UnitTests/Protocol/ProtocolV2Tests.cs'
      - 'test/SharpLink.UnitTests/Protocol/ProtocolV2NegotiatorTests.cs'
      - 'test/SharpLink.UnitTests/Protocol/ProtocolV2ErrorCompatibilityTests.cs'
      - 'test/SharpLink.UnitTests/Runtime/SendPumpProgressIsolationTests.cs'
      - 'src/SharpLink.Runtime/OwnedFrame.cs'
      - 'test/SharpLink.UnitTests/Runtime/Stack13FrameClearTests.cs'
concurrency:
  group: parser-handshake-fixture-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-twenty-three:
    runs-on: ubuntu-24.04
    # Original preparation3600; twenty-three-case phase1500; overall5100 seconds.
    timeout-minutes: 110
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup isolated pinned SDK
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/parser-handshake-fixtures-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.114'
      - name: Verify bound candidate product and tests
        shell: bash
        run: |
          test "$(git rev-parse HEAD:src)" = "c3a94c896418a5d5ec62646461f17c67dc89bc96"
          test "$(git rev-parse HEAD:test)" = "226e6404e69879868bc2f98037624ec357529f49"
      - name: One build, two metadata discoveries, twenty-three fresh exact UIDs
        run: python3 eng/run-parser-handshake-validation.py --configuration Release
