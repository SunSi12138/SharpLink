name: Issue 333 Integration Isolation

on:
  pull_request:

permissions:
  contents: read

jobs:
  integration-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      BASE_SHA: b2ee472d98946e428d69ee18a0c0be6f72deb57c
      HEAD_SHA: 161374ebf004907834e85ad3094f69b78343dd04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Prepare exact base and head worktrees
        shell: bash
        run: |
          set -euo pipefail
          git worktree add ../issue333-isolation-base "${BASE_SHA}"
          git worktree add ../issue333-isolation-head "${HEAD_SHA}"
          for repo in ../issue333-isolation-base ../issue333-isolation-head; do
            dotnet restore "${repo}/test/SharpLink.IntegrationTests/SharpLink.IntegrationTests.csproj"
            dotnet build "${repo}/test/SharpLink.IntegrationTests/SharpLink.IntegrationTests.csproj" -c Release --no-restore -v minimal
          done

      - name: Base integration attempt 1
        continue-on-error: true
        working-directory: ../issue333-isolation-base
        run: dotnet run -c Release --no-build --project test/SharpLink.IntegrationTests -- --maximum-parallel-tests 1 --timeout 120s

      - name: Head integration attempt 1
        continue-on-error: true
        working-directory: ../issue333-isolation-head
        run: dotnet run -c Release --no-build --project test/SharpLink.IntegrationTests -- --maximum-parallel-tests 1 --timeout 120s

      - name: Base integration attempt 2
        continue-on-error: true
        working-directory: ../issue333-isolation-base
        run: dotnet run -c Release --no-build --project test/SharpLink.IntegrationTests -- --maximum-parallel-tests 1 --timeout 120s

      - name: Head integration attempt 2
        continue-on-error: true
        working-directory: ../issue333-isolation-head
        run: dotnet run -c Release --no-build --project test/SharpLink.IntegrationTests -- --maximum-parallel-tests 1 --timeout 120s
