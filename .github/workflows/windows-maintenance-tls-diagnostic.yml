name: Windows maintenance TLS storage diagnostic

on:
  push:
    branches: [validation/windows-maintenance-tls-diagnostic-20261030]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      TUNIT_MAX_PARALLEL_TESTS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Record exact provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/maintenance-tls | Out-Null
          git rev-parse HEAD | Set-Content artifacts/maintenance-tls/source.txt
          git rev-parse 'HEAD^{tree}' | Add-Content artifacts/maintenance-tls/source.txt
          dotnet --info | Set-Content artifacts/maintenance-tls/dotnet-info.txt
      - name: Build unchanged product and diagnostic fixture
        run: dotnet build test/SharpLink.IntegrationTests/SharpLink.IntegrationTests.csproj -c Release -v minimal
      - name: Same certificate storage comparison and independent TLS controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $filters = @{
            'storage-comparison' = '/*/*/RuntimeAssemblyIntegrationTests/CooperativeMaintenanceCertificateStorageDiagnostic'
            'tls-authentication-controls' = '/*/*/TlsTransportIntegrationTests/*'
          }
          $failed = $false
          foreach ($name in @('storage-comparison', 'tls-authentication-controls')) {
            dotnet run -c Release --no-build --project test/SharpLink.IntegrationTests -- --treenode-filter $filters[$name] --maximum-parallel-tests 1 --timeout 120s --output Detailed --github-reporter-style full --no-progress --results-directory "artifacts/maintenance-tls/$name" --diagnostic --diagnostic-verbosity Trace --diagnostic-output-directory "artifacts/maintenance-tls/$name" 2>&1 | Tee-Object "artifacts/maintenance-tls/$name.log"
            $code = $LASTEXITCODE
            $code | Set-Content "artifacts/maintenance-tls/$name.exit-code.txt"
            if ($code -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Preserve original failures and server diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-maintenance-tls-${{ github.sha }}
          path: artifacts/maintenance-tls
          if-no-files-found: error
          retention-days: 7
