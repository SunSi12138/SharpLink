name: Issue 311 final codec binding refactor v2

on:
  push:
    branches: [fix/311-codec-scope-routing]
    paths:
      - '.github/workflows/issue-311-final-codec-binding-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/issue-311-final-codec-binding-v2.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'fix/311-codec-scope-routing'
    runs-on: ubuntu-24.04
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/311-codec-scope-routing
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Apply final ownership and direct Codec binding refactor
        shell: bash
        run: |
          python - <<'PYRUN'
          from pathlib import Path

          source = Path('.github/workflows/issue-311-contract-diff-fix.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          raw = source[start:end]
          lines = raw.splitlines()
          first = next(line for line in lines if line.strip())
          indent = len(first) - len(first.lstrip())
          prefix = ' ' * indent
          script = '\n'.join(line[indent:] if line.startswith(prefix) else line for line in lines)

          section_start = script.index('# Explicit selection is disabled only for the ContractDefault view.')
          section_end = script.index('# Resolve explicit attributes as either registered adapter or direct closed IRpcCodec<T>.', section_start)
          replacement = r'''# Explicit selection is disabled only for the ContractDefault view.
replace_block(
    path,
    '            var hasSelectedOverride = _contractMode',
    '            if (IsBuiltin(type))',
''' + "'''" + r'''            ExplicitCodecSelection? selectedCodec = null;
            var hasSelectedOverride = _mode switch
            {
                DtoAnalysisMode.ContractPolicy => TrySelectContractCodecOverride(type, out selectedCodec),
                DtoAnalysisMode.Standalone => TrySelectExplicitCodec(type, out selectedCodec),
                _ => false
            };
            if (hasSelectedOverride)
            {
                if (selectedCodec is not null)
                    AddExplicitCodecModel(type, typeName, selectedCodec);
                return;
            }

''' + "'''" + r''')
p = Path(path)
text = p.read_text().replace(
    'GetCodecName(typeName, _contractMode)',
    'GetCodecName(typeName, _mode == DtoAnalysisMode.ContractPolicy)')
p.write_text(text)

'''
          script = script[:section_start] + replacement + script[section_end:]

          # The correct ownership model keeps a default generated global Codec graph even when
          # an explicit Contract binding exists. Update the older regression to assert owner-table
          # publication instead of requiring the entire global table to be empty.
          test_patch = r'''
p = Path('test/SharpLink.Generator.Tests/RpcCodecRouteTests.cs')
text = p.read_text()
old = ''' + "'''" + r'''        var manifest = RunGeneratorAndGetSources(source).Single(static item =>
            item.Contains("ISharpLinkGeneratedAssemblyManifest", StringComparison.Ordinal));
        var globalSection = manifest.Substring(
            manifest.IndexOf("__codecs =", StringComparison.Ordinal),
            manifest.IndexOf("__contractCodecs =", StringComparison.Ordinal) - manifest.IndexOf("__codecs =", StringComparison.Ordinal));
        Ensure(!globalSection.Contains("new __SharpLinkGeneratedCodec_", StringComparison.Ordinal),
            "a Contract-reachable explicit binding must not be published to the global Codec registry");
''' + "'''" + r'''
new = ''' + "'''" + r'''        var manifest = RunGeneratorAndGetSources(source).Single(static item =>
            item.Contains("ISharpLinkGeneratedAssemblyManifest", StringComparison.Ordinal));
        var contractSection = manifest.Substring(
            manifest.IndexOf("__contractCodecs =", StringComparison.Ordinal));
        Ensure(contractSection.Contains("new __SharpLinkGeneratedCodec_", StringComparison.Ordinal),
            "a Contract-reachable explicit binding must be published into the Contract-owned Codec table");
''' + "'''" + r'''
if old not in text:
    raise RuntimeError('explicit owner-scope regression block not found')
p.write_text(text.replace(old, new, 1))
'''
          script += test_patch
          exec(compile(script, 'issue-311-final-codec-binding.py', 'exec'), {'__name__': '__main__'})
          PYRUN
      - name: Format
        run: dotnet format Sharplink.slnx whitespace
      - name: Restore
        run: dotnet restore Sharplink.slnx
      - name: Build
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal
      - name: Generator tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build
      - name: Unit tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build
      - name: Integration tests
        run: dotnet run -c Release --no-build --project test/SharpLink.IntegrationTests -- --maximum-parallel-tests 1 --timeout 120s
      - name: Commit refactor
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "SunSi12138"
          git config user.email "54728594+SunSi12138@users.noreply.github.com"
          git add src/SharpLink.Abstractions/Sdk/RpcCodecAdapterAttribute.cs \
                  src/SharpLink.Generator/RpcGenerator.DtoAnalysis.cs \
                  src/SharpLink.Generator/RpcGenerator.CodecRoutes.cs \
                  src/SharpLink.Generator/RpcGenerator.Models.cs \
                  src/SharpLink.Generator/RpcGenerator.DtoEmitter.cs \
                  src/SharpLink.Generator/RpcGenerator.cs \
                  test/SharpLink.Generator.Tests/RpcCodecRouteTests.cs \
                  test/SharpLink.Generator.Tests/RpcDirectCodecBindingTests.cs
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Contract codec binding ownership"
          git push origin HEAD:fix/311-codec-scope-routing
