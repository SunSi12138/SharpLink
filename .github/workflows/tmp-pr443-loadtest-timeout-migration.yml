name: tmp-pr443-loadtest-timeout-migration

on:
  push:
    branches:
      - fix/282-explicit-timeout-policy
    paths:
      - .github/workflows/tmp-pr443-loadtest-timeout-migration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/282-explicit-timeout-policy
      - name: Select recommended timeout for load-test defaults
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/SharpLink.LoadTestBase/Transport/LoadTestTransportFactory.cs')
          s = p.read_text()
          old1 = '''        if (disableRequestTimeout)\n            builder.DisableRequestTimeout();\n        else if (requestTimeout is { } timeout)\n            builder.UseRequestTimeout(timeout);\n\n        return transport switch\n'''
          new1 = '''        if (disableRequestTimeout)\n            builder.DisableRequestTimeout();\n        else if (requestTimeout is { } timeout)\n            builder.UseRequestTimeout(timeout);\n        else\n            builder.UseRequestTimeout();\n\n        return transport switch\n'''
          old2 = '''        if (disableRequestTimeout)\n            clientAnonymous.DisableRequestTimeout();\n        else if (requestTimeout is { } timeout)\n            clientAnonymous.UseRequestTimeout(timeout);\n\n        return new LocalHarness(serverAnonymous, clientAnonymous.Build(), static () => { });\n'''
          new2 = '''        if (disableRequestTimeout)\n            clientAnonymous.DisableRequestTimeout();\n        else if (requestTimeout is { } timeout)\n            clientAnonymous.UseRequestTimeout(timeout);\n        else\n            clientAnonymous.UseRequestTimeout();\n\n        return new LocalHarness(serverAnonymous, clientAnonymous.Build(), static () => { });\n'''
          assert old1 in s and old2 in s
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/SharpLink.LoadTestBase/Transport/LoadTestTransportFactory.cs
          git diff --cached --quiet && exit 0
          git commit -m 'test(load): select recommended default request timeout'
          git push origin HEAD:fix/282-explicit-timeout-policy
