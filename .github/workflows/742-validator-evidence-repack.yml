      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.repack.outputs.part7 == 'true'
        with:
          name: 742-validator-evidence-part-07-${{ github.sha }}
          path: artifacts/review/part-07
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.repack.outputs.part8 == 'true'
        with:
