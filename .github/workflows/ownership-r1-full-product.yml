name: Ownership R1 Full Product Diagnostic

on:
  pull_request:
    types: [opened]
    branches: [codex/931-client-ablation-tools]
    paths:
      - '.github/workflows/ownership-r1-full-product.yml'
      - 'eng/physical-ownership-probes/paired_r1.py'

permissions:
  contents: read

jobs:
  full-product:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/931-r1-full-product-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
    steps:
      - name: Checkout reviewed PR head, not merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: tools
          persist-credentials: false
      - name: Checkout exact unchanged R1 product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 94adeae886c4ddfd0c02ec2dcb700cd97e9cad80
          path: sources/r1
          persist-credentials: false
      - name: Checkout exact original baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cc7c458b559295e0fc61ec0062bb220faf880a76
          path: sources/baseline
          persist-credentials: false
      - name: Configure isolated paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r1-full-product/runtime-install"
          {
            echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/r1-sdk"
            echo "PRIVATE_RUNTIME=$RUNNER_TEMP/r1-runtime"
            echo "R1_ROOT=$RUNNER_TEMP/r1-full-product"
          } >> "$GITHUB_ENV"
      - name: Install exact build SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.102
      - name: Install SHA512-verified official private frameworks
        shell: bash
        run: |
          set -euo pipefail
          cd "$R1_ROOT/runtime-install"
          curl --fail --silent --show-error --location https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json --output releases.json
          curl --fail --silent --show-error --location https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.13/dotnet-runtime-10.0.13-linux-x64.tar.gz --output dotnet.tar.gz
          curl --fail --silent --show-error --location https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.13/aspnetcore-runtime-10.0.13-linux-x64.tar.gz --output aspnetcore.tar.gz
          {
            echo '9574d95364110409416735e7842796f8d614c21d74cb25d204a3e4cfd11b2c05efdf19ca89b8069650a04f64add2705967dcb04b8665a36d7a3f30a5d8c05afe  dotnet.tar.gz'
            echo '7b20d4164f097e1cf616d8174b6a64be100e6f30dc4e028b16e551e8b0c86dff0ef424bb4bf52d1ff0ecca38e102d3fa80814e06cb85a32d6eee4c3b99764f79  aspnetcore.tar.gz'
          } | sha512sum --check | tee framework-verification.log
          mkdir "$PRIVATE_RUNTIME"
          tar -xzf dotnet.tar.gz -C "$PRIVATE_RUNTIME"
          tar -xzf aspnetcore.tar.gz -C "$PRIVATE_RUNTIME"
      - name: Fixed original-contract full-product comparison
        shell: bash
        working-directory: tools
        env:
          REVIEWED_TOOL_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_TOOL_SHA"
          test "$EXPECTED_BASE_SHA" = 51f5bd0ec3f600196f2e26ea48a466ec2cea62d8
          {
            echo "tool=$REVIEWED_TOOL_SHA"
            echo 'baseline=cc7c458b559295e0fc61ec0062bb220faf880a76'
            echo 'r1=94adeae886c4ddfd0c02ec2dcb700cd97e9cad80'
            echo "run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner=$RUNNER_OS/$RUNNER_ARCH image=${ImageOS:-unknown}/${ImageVersion:-unknown}"
            echo 'Diagnostic only: no outcome alone lifts #931 NoGo or authorizes product merge. Separate predeclared acceptance contract and candidate gates required.'
          } > "$R1_ROOT/source-identities.txt"
          python3 eng/physical-ownership-probes/paired_r1.py \
            --baseline "$GITHUB_WORKSPACE/sources/baseline" \
            --candidate "$GITHUB_WORKSPACE/sources/r1" \
            --build-dotnet "$DOTNET_INSTALL_DIR/dotnet" \
            --runtime-dotnet "$PRIVATE_RUNTIME/dotnet" \
            --output "$R1_ROOT/evidence" 2>&1 | tee "$R1_ROOT/driver.log"
      - name: Retain all diagnostics and failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ownership-r1-full-product-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r1-full-product
          if-no-files-found: error
          retention-days: 30
