name: Issue 331 P2 Volatile Shape Probe

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      V7_SHA: c76dc2adb5bd13d69763291890bc847a02e48349
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Benchmark V7 and P2 head on same runner
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$PWD"
          V7_DIR="${RUNNER_TEMP}/issue331-v7"
          rm -rf "$V7_DIR" "$ROOT/artifacts/p2-probe"
          mkdir -p "$ROOT/artifacts/p2-probe/v7" "$ROOT/artifacts/p2-probe/head"
          git worktree add --detach "$V7_DIR" "$V7_SHA"

          cd "$V7_DIR"
          dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          dotnet run -c Release --no-restore --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -- \
            --filter "*AdmissionControllerBenchmarks.ImmediateRejection*" \
            --artifacts "$ROOT/artifacts/p2-probe/v7" \
            | tee "$ROOT/artifacts/p2-probe/v7.log"

          cd "$ROOT"
          dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          dotnet run -c Release --no-restore --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -- \
            --filter "*AdmissionControllerBenchmarks.ImmediateRejection*" \
            --artifacts "$ROOT/artifacts/p2-probe/head" \
            | tee "$ROOT/artifacts/p2-probe/head.log"

          printf 'V7_SHA=%s\nHEAD_SHA=%s\n' "$V7_SHA" "$(git rev-parse HEAD)" > "$ROOT/artifacts/p2-probe/shas.txt"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue331-p2-v7-comparison-${{ github.event.pull_request.head.sha }}
          path: artifacts/p2-probe
          if-no-files-found: error
          retention-days: 7
