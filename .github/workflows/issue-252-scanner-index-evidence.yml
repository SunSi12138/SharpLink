name: Issue 252 Scanner-Owned Index Evidence

permissions:
  contents: read

on:
  push:
    branches:
      - agent/i252-scanner-index-evidence
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Verify evidence branch has no production diff
        run: git diff --exit-code 9b6f627954ec5a0eaca31b4cea5accdd4a6d79c9 HEAD -- src/

      - name: Run paired combined-workload and maintenance gates
        run: bash .github/issue252-scanner-index-evidence.sh

      - name: Upload evidence results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-252-scanner-index-evidence
          path: artifacts/issue-252-scanner-index
          if-no-files-found: warn
