name: Temporary maintainability review refresh

permissions:
  contents: write

on:
  pull_request:
    branches:
      - dev

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'issue-350-maintainability-report'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      SHARPLINK_MAINTAINABILITY_SOURCE_REF: '00e2f18c6384c785d232bd59902102d3af7ad3da'
    steps:
      - name: Checkout head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Refresh checked-in baseline
        run: |
          bash eng/report-maintainability.sh
          cp artifacts/maintainability/report.md eng/maintainability/dev-baseline.md

      - name: Commit refreshed baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eng/maintainability/dev-baseline.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh maintainability baseline after review"
          git push
