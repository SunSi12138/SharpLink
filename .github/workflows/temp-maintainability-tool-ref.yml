name: Temporary maintainability tool revision validation

permissions:
  contents: write

on:
  pull_request:
    branches:
      - dev

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'issue-350-maintainability-report'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DEV_REF: '00e2f18c6384c785d232bd59902102d3af7ad3da'
    steps:
      - name: Checkout head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Apply pinned tool revision fix
        shell: python
        run: |
          from pathlib import Path

          script = Path('eng/report-maintainability.sh')
          script.write_text(r'''#!/usr/bin/env bash
          set -euo pipefail

          repo_root="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          output_dir="${1:-$repo_root/artifacts/maintainability}"
          requested_source_ref="${SHARPLINK_MAINTAINABILITY_SOURCE_REF:-}"
          pinned_tool_ref="${SHARPLINK_MAINTAINABILITY_PINNED_TOOL_REF:-}"
          scan_root="$repo_root"
          temp_parent=""
          temp_worktree=""

          case "$output_dir" in
            /*) ;;
            *) output_dir="$repo_root/$output_dir" ;;
          esac

          cleanup() {
            if [[ -n "$temp_worktree" ]]; then
              git -C "$repo_root" worktree remove --force "$temp_worktree" >/dev/null 2>&1 || true
            fi
            if [[ -n "$temp_parent" ]]; then
              rm -rf "$temp_parent"
            fi
          }
          trap cleanup EXIT

          if [[ -n "$requested_source_ref" && -z "$pinned_tool_ref" ]]; then
            tool_ref="$(git -C "$repo_root" log -1 --format=%H -- \
              eng/report-maintainability.sh \
              eng/SharpLink.Maintainability \
              Directory.Build.props \
              Directory.Build.targets \
              Directory.Packages.props \
              global.json \
              NuGet.config \
              NuGet.Config)"
            if [[ -z "$tool_ref" ]]; then
              echo "Unable to resolve maintainability tool revision." >&2
              exit 2
            fi

            temp_parent="$(mktemp -d "${TMPDIR:-/tmp}/sharplink-maintainability-tool.XXXXXX")"
            temp_worktree="$temp_parent/tool"
            git -C "$repo_root" worktree add --detach "$temp_worktree" "$tool_ref" >/dev/null
            git -C "$temp_worktree" sparse-checkout disable >/dev/null
            git -C "$temp_worktree" reset --hard "$tool_ref" >/dev/null

            set +e
            SHARPLINK_MAINTAINABILITY_PINNED_TOOL_REF="$tool_ref" \
              SHARPLINK_MAINTAINABILITY_SOURCE_REF="$requested_source_ref" \
              bash "$temp_worktree/eng/report-maintainability.sh" "$output_dir"
            status=$?
            set -e
            exit "$status"
          fi

          if [[ -n "$requested_source_ref" ]]; then
            if ! source_ref="$(git -C "$repo_root" rev-parse --verify "${requested_source_ref}^{commit}" 2>/dev/null)"; then
              echo "Unable to resolve maintainability source ref: $requested_source_ref" >&2
              exit 2
            fi
            if [[ -z "$pinned_tool_ref" ]]; then
              echo "Named snapshot requires a pinned maintainability tool revision." >&2
              exit 2
            fi

            temp_parent="$(mktemp -d "${TMPDIR:-/tmp}/sharplink-maintainability-source.XXXXXX")"
            temp_worktree="$temp_parent/source"
            git -C "$repo_root" worktree add --detach "$temp_worktree" "$source_ref" >/dev/null
            git -C "$temp_worktree" sparse-checkout disable >/dev/null
            git -C "$temp_worktree" reset --hard "$source_ref" >/dev/null
            scan_root="$temp_worktree"
            tool_ref="$pinned_tool_ref"
          else
            source_ref="working-tree"
            tool_ref="working-tree"
          fi

          args=(--root "$scan_root" --output "$output_dir" --source-ref "$source_ref" --tool-ref "$tool_ref")

          dotnet run \
            --project "$repo_root/eng/SharpLink.Maintainability/SharpLink.Maintainability.csproj" \
            --configuration Release \
            -- "${args[@]}"
          '''.replace('          ', '', 1))

          path = Path('eng/SharpLink.Maintainability/Program.cs')
          text = path.read_text()
          text = text.replace('using System.Diagnostics;\n', '', 1)
          text = text.replace(
              'var sourceRef = options.SourceRef ?? TryGetGitHead(repoRoot) ?? "working-tree";\n',
              'var sourceRef = options.SourceRef ?? "working-tree";\nvar toolRef = options.ToolRef ?? "working-tree";\n',
              1)
          text = text.replace(
              '    SchemaVersion: 1,\n    SourceRef: sourceRef,\n',
              '    SchemaVersion: 2,\n    SourceRef: sourceRef,\n    ToolRef: toolRef,\n',
              1)
          text = text.replace(
              '    string? sourceRef = null;\n',
              '    string? sourceRef = null;\n    string? toolRef = null;\n',
              1)
          text = text.replace(
              '            case "--source-ref" when i + 1 < args.Length:\n                sourceRef = args[++i];\n                break;\n',
              '            case "--source-ref" when i + 1 < args.Length:\n                sourceRef = args[++i];\n                break;\n            case "--tool-ref" when i + 1 < args.Length:\n                toolRef = args[++i];\n                break;\n',
              1)
          text = text.replace(
              '    return new Options(root, output, sourceRef);\n',
              '    return new Options(root, output, sourceRef, toolRef);\n',
              1)
          text = text.replace(
              '    builder.Append("Source ref: `").Append(report.SourceRef).AppendLine("`");\n    builder.AppendLine();\n',
              '    builder.Append("Source ref: `").Append(report.SourceRef).AppendLine("`");\n    builder.Append("Tool ref: `").Append(report.ToolRef).AppendLine("`");\n    builder.AppendLine();\n',
              1)
          start = text.find('static string? TryGetGitHead(string repoRoot)')
          end = text.find('sealed record Options(', start)
          if start >= 0 and end > start:
              text = text[:start] + text[end:]
          text = text.replace(
              'sealed record Options(string Root, string OutputDirectory, string? SourceRef);',
              'sealed record Options(string Root, string OutputDirectory, string? SourceRef, string? ToolRef);',
              1)
          text = text.replace(
              '    int SchemaVersion,\n    string SourceRef,\n    Definitions Definitions,',
              '    int SchemaVersion,\n    string SourceRef,\n    string ToolRef,\n    Definitions Definitions,',
              1)
          required = [
              'SchemaVersion: 2',
              'ToolRef: toolRef',
              'case "--tool-ref"',
              'Tool ref: `',
              'string ToolRef,',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing Program.cs patch marker: {marker}')
          path.write_text(text)

          doc = Path('eng/maintainability.md')
          text = doc.read_text()
          old = 'When `SHARPLINK_MAINTAINABILITY_SOURCE_REF` is set, the command resolves that commit, materializes it in a temporary detached Git worktree, disables sparse checkout there, hard-resets it to the resolved commit, and scans that isolated tree. Current working-tree changes, untracked paths, path quoting, sparse checkout, and index skip bits therefore cannot alter a named snapshot. Without an explicit ref, the command scans the current checkout and labels the report `working-tree` rather than attributing it to a commit.'
          new = 'When `SHARPLINK_MAINTAINABILITY_SOURCE_REF` is set, the command pins the maintainability wrapper/analyzer and its repository-level build inputs to their latest committed tool revision, re-runs the clean wrapper from a detached tool worktree, then materializes the requested source commit in a second detached worktree and scans that isolated source tree. The report records both `sourceRef` and `toolRef`. Uncommitted changes to `src/`/`test/`, the analyzer, the wrapper, or its tracked build inputs cannot alter that named snapshot; a later committed tool change intentionally produces a different `toolRef`. Without an explicit source ref, the command scans the current checkout and labels both refs `working-tree`.'
          if old not in text:
              raise SystemExit('expected named snapshot documentation paragraph not found')
          doc.write_text(text.replace(old, new, 1))

      - name: Validate formatting and build
        shell: bash
        run: |
          dotnet restore Sharplink.slnx
          dotnet format Sharplink.slnx --no-restore --verify-no-changes
          dotnet build eng/SharpLink.Maintainability/SharpLink.Maintainability.csproj -c Release --no-restore

      - name: Commit tool revision implementation locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eng/report-maintainability.sh eng/SharpLink.Maintainability/Program.cs eng/maintainability.md
          if ! git diff --cached --quiet; then
            git commit -m "Pin maintainability analyzer revision"
          fi

      - name: Validate pinned analyzer and regenerate baseline
        shell: bash
        run: |
          tool_ref="$(git log -1 --format=%H -- eng/report-maintainability.sh eng/SharpLink.Maintainability Directory.Build.props Directory.Build.targets Directory.Packages.props global.json NuGet.config NuGet.Config)"
          test -n "$tool_ref"

          SHARPLINK_MAINTAINABILITY_SOURCE_REF="$DEV_REF" bash eng/report-maintainability.sh artifacts/reference
          python - "$DEV_REF" "$tool_ref" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path('artifacts/reference/report.json').read_text())
          assert report['schemaVersion'] == 2
          assert report['sourceRef'] == sys.argv[1]
          assert report['toolRef'] == sys.argv[2]
          assert report['summary']['source']['files'] > 0
          assert report['summary']['test']['files'] > 0
          PY

          python - <<'PY'
          from pathlib import Path
          path = Path('eng/SharpLink.Maintainability/Program.cs')
          text = path.read_text()
          old = 'const int LargeMethodLocThreshold = 80;'
          if old not in text:
              raise SystemExit('threshold marker not found')
          path.write_text(text.replace(old, 'const int LargeMethodLocThreshold = 81;', 1))
          PY
          SHARPLINK_MAINTAINABILITY_SOURCE_REF="$DEV_REF" bash eng/report-maintainability.sh artifacts/dirty-analyzer
          cmp artifacts/reference/report.json artifacts/dirty-analyzer/report.json
          cmp artifacts/reference/report.md artifacts/dirty-analyzer/report.md
          git checkout -- eng/SharpLink.Maintainability/Program.cs

          printf '%s\n' 'namespace SharpLink.Runtime; internal static class DirtySourceLeak { }' > src/SharpLink.Runtime/review-dirty-source.cs
          SHARPLINK_MAINTAINABILITY_SOURCE_REF="$DEV_REF" bash eng/report-maintainability.sh artifacts/dirty-source
          cmp artifacts/reference/report.json artifacts/dirty-source/report.json
          cmp artifacts/reference/report.md artifacts/dirty-source/report.md
          rm src/SharpLink.Runtime/review-dirty-source.cs

          cp artifacts/reference/report.md eng/maintainability/dev-baseline.md
          git add eng/maintainability/dev-baseline.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh maintainability baseline tool revision"
          fi

      - name: Push validated commits
        shell: bash
        run: git push
