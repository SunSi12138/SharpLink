name: Issue 322 Patch Harness

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'issue-322-admission-program-generation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-322-admission-program-generation
          fetch-depth: 0

      - name: Patch reflection harness exactly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('test/SharpLink.UnitTests/Server/SharpLinkServerInvocationTests.cs')
          lines = path.read_text().splitlines(keepends=True)
          starts = [
              i for i, line in enumerate(lines)
              if 'return (ValueTask)DispatchMethod.Invoke(Server,' in line
          ]
          if len(starts) != 1:
              raise SystemExit(f'expected one dispatch reflection call, found {len(starts)}')
          start = starts[0]
          end = next(
              (i for i in range(start, min(start + 32, len(lines))) if '])!;' in lines[i]),
              None)
          if end is None:
              raise SystemExit('dispatch reflection call terminator not found')
          matches = [
              i for i in range(start, end + 1)
              if lines[i].strip() == 'CancellationToken.None,'
          ]
          if len(matches) != 1:
              raise SystemExit(f'expected one serverLoopToken argument, found {len(matches)}')
          index = matches[0]
          if lines[index + 1].strip() != 'null,':
              raise SystemExit('expected existing admittedCallState null after serverLoopToken')
          indent = lines[index + 1][:-len(lines[index + 1].lstrip())]
          lines[index + 1:index + 1] = [f'{indent}null,\n', f'{indent}null,\n']
          path.write_text(''.join(lines))
          PY

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/issue-322-patch-harness.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/SharpLink.UnitTests/Server/SharpLinkServerInvocationTests.cs .github/workflows/issue-322-patch-harness.yml
          git commit -m "test(server): pass captured admission generation in dispatch harness"
          git push origin HEAD:issue-322-admission-program-generation
