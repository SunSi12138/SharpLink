name: Method Facts Paired Terminal Credit Regression
on:
  push:
    branches: [validate/754-oneway-drain-paired]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-drain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: dev-baseline
            source: a1f9ee2a7addfdf2bc86ae0598d99d5e5596cfe5
          - label: combined-fixed
            source: b04bb868b7aa1503674c1a6bf373c37cc25b43b4
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: definition
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source }}
          path: source
      - uses: ./source/.github/actions/setup-dotnet
      - name: Apply independently reviewed deterministic regression
        run: |
          patch="$GITHUB_WORKSPACE/definition/.github/diagnostics/754-terminal-credit-regression.patch"
          echo "eeced7b86e5e458662c7c808ddd36cfd96e10ca7551511f7a6a4dabb132ed1de  $patch" | sha256sum -c -
          fixture=test/SharpLink.IntegrationTests/IntegrationBehaviorTests.TerminalStreamCredit.cs
          if [ -f "$fixture" ]; then
            echo "98c6221374177e5661b4237e5ec0d1dcd9092b0552f4bf41bce8065c6956d2eb  $fixture" | sha256sum -c -
          else
            git apply --check "$patch"
            git apply "$patch"
          fi
          if git diff --name-only | grep -v '^test/SharpLink.IntegrationTests/'; then exit 1; fi
      - name: Build pinned integration source
        run: |
          git rev-parse HEAD
          dotnet build test/SharpLink.IntegrationTests/SharpLink.IntegrationTests.csproj -c Release -v minimal
      - name: Five independent processes without timeout changes
        shell: bash
        run: |
          mkdir -p artifacts/paired-drain
          git rev-parse HEAD > artifacts/paired-drain/source.txt
          sha256sum "$GITHUB_WORKSPACE/definition/.github/diagnostics/754-terminal-credit-regression.patch" > artifacts/paired-drain/patch.sha256
          echo 'Mapper-gated credit-preservation regression on pinned sources. Original race test and production sources unchanged.' > artifacts/paired-drain/README.txt
          status=0
          for method in QueuedOneWayStubFailureShouldDrainReservedStreams QueuedOneWayStubFailureShouldPreserveCreditWhileExceptionMapperIsBlocked; do
            for attempt in 1 2 3 4 5; do
              set +e
              dotnet run -c Release --no-build --project test/SharpLink.IntegrationTests -- --treenode-filter "/*/*/IntegrationBehaviorTests/$method" --maximum-parallel-tests 1 2>&1 | tee "artifacts/paired-drain/$method-$attempt.log"
              result=${PIPESTATUS[0]}
              set -e
              echo "$method,$attempt,$result" >> artifacts/paired-drain/results.csv
              if [ "$result" != 0 ]; then status=1; fi
            done
          done
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: method-facts-terminal-credit-${{ matrix.label }}
          path: source/artifacts/paired-drain
          if-no-files-found: warn
