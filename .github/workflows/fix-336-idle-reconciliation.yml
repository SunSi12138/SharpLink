name: Fix 336 Idle Reconciliation

on:
  push:
    branches:
      - issue-335-dynamic-admission-partition-update

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Repair due reconciliation and publish clean tree
        shell: bash
        run: |
          set -euo pipefail
          target_branch='issue-335-dynamic-admission-partition-update'
          product_head='c426cb07f6ce832c2de91b10f46258f8dadc8787'
          helper_head="$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git reset --hard "$product_head"

          python3 <<'PY'
          from pathlib import Path

          path = Path('src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs')
          text = path.read_text()
          needle = 'stopAfterOne: true,'
          if text.count(needle) != 2:
              raise RuntimeError(f'expected exactly two due-reconciliation stopAfterOne callsites, got {text.count(needle)}')
          text = text.replace(needle, 'stopAfterOne: false,')
          path.write_text(text)
          PY

          changed="$(git diff --name-only "$product_head")"
          if [[ "$changed" != 'src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs' ]]; then
            echo "unexpected repair scope:"
            printf '%s\n' "$changed"
            exit 1
          fi

          dotnet restore Sharplink.slnx
          dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal
          dotnet build Sharplink.slnx -c Debug --no-restore --nologo

          git add src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs
          tree_sha="$(git write-tree)"
          final_commit="$(printf '%s\n' 'fix(admission): reclaim all expired partitions in due scan' | git commit-tree "$tree_sha" -p "$helper_head" -p "$product_head")"
          echo "tree_sha=$tree_sha"
          echo "final_commit=$final_commit"
          git push origin "$final_commit:refs/heads/$target_branch"
