name: Frozen Allocator Capture Evidence
on:
  push:
    branches: [validation/hosting-frozen-allocator-capture]
permissions:
  contents: read
jobs:
  deterministic-capture-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      TUNIT_MAX_PARALLEL_TESTS: '8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Verify deterministic capture arbitration and exact clean product
        run: python3 eng/anonymous-pipe-frozen-validation/run.py
      - name: Retain all evidence including failures and instrumentation patches
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-allocator-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/anonymous-pipe-frozen-capture
          if-no-files-found: error
          retention-days: 30
