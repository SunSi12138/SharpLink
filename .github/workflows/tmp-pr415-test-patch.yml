name: Temporary PR 415 Test Patch

on:
  push:
    branches:
      - tmp/pr415-utf16-test-patch

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'test: align exact string sizing with utf16 wire'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/pr415-utf16-test-patch
          fetch-depth: 1
      - name: Apply exact UTF-16 test updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/SharpLink.Generator.Tests/RpcAnalyzerTests.cs')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'public Task DirectStringDtosShouldCacheExactUtf8SizesAndPreReserveOnce()',
                  'public Task DirectStringDtosShouldCacheExactUtf16SizesAndPreReserveOnce()',
                  1,
              ),
              (
                  '__SharpLinkGeneratedUtf8',
                  '__SharpLinkGeneratedUtf16',
                  7,
              ),
              (
                  '"one assembly-private UTF-8 helper must be shared by all eligible generated Codecs"',
                  '"one assembly-private UTF-16 helper must be shared by all eligible generated Codecs"',
                  1,
              ),
              (
                  '"each direct string must be counted once in the direct reservation path"',
                  '"each direct string must compute its exact UTF-16 byte count once in the direct reservation path"',
                  1,
              ),
              (
                  'Ensure(CountOccurrences(generated, "StrictEncoding.GetByteCount(") == 1,\n            "the known-size write helper must never traverse UTF-16 again");',
                  'Ensure(CountOccurrences(generated, "checked(value.Length * sizeof(char))") == 1,\n            "the known-size helper must compute UTF-16 bytes in O(1) without an encoding traversal");',
                  1,
              ),
              (
                  '"eligible DTOs must not call the byte-counting public string primitive after pre-sizing"',
                  '"eligible DTOs must not call the public string primitive after pre-sizing"',
                  1,
              ),
              (
                  'Ensure(generated.Contains("new global::System.Text.UTF8Encoding(false, true)", StringComparison.Ordinal),\n            "the generated helper must preserve strict UTF-8 encoder semantics");',
                  'Ensure(!generated.Contains("UTF8Encoding", StringComparison.Ordinal) &&\n               !generated.Contains("StrictEncoding.GetByteCount", StringComparison.Ordinal),\n            "generated DTO string sizing must not transcode or traverse UTF-8");',
                  1,
              ),
              (
                  'Ensure(generated.Contains("global::System.Buffers.Binary.BinaryPrimitives.WriteUInt32LittleEndian", StringComparison.Ordinal) &&\n               generated.Contains("var payload = writer.GetSpan(byteCount);", StringComparison.Ordinal),\n            "known-size writes must preserve the little-endian prefix and separate payload request");',
                  'Ensure(generated.Contains("global::System.Buffers.Binary.BinaryPrimitives.WriteInt32LittleEndian", StringComparison.Ordinal) &&\n               generated.Contains("value.AsSpan().CopyTo(global::System.Runtime.InteropServices.MemoryMarshal.Cast<byte, char>(payload));", StringComparison.Ordinal),\n            "known-size writes must preserve the Int32 little-endian prefix and raw UTF-16 code-unit payload");',
                  1,
              ),
          ]

          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'expected {expected} occurrence(s) of {old!r}, got {actual}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- test/SharpLink.Generator.Tests/RpcAnalyzerTests.cs
      - name: Commit exact test update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/SharpLink.Generator.Tests/RpcAnalyzerTests.cs
          git commit -m 'test: align exact string sizing with utf16 wire'
          git push origin HEAD:tmp/pr415-utf16-test-patch
