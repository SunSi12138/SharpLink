name: Issue 335 Transactional Patch

on:
  push:
    branches:
      - issue-335-dynamic-admission-partition-update

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply reviewed transactional patch
        run: python eng/issue-335-transactional-patch.py

      - name: Verify patch
        run: git diff --check

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs
          git commit -m "fix(admission): preallocate partition commit state"
          git push origin HEAD:issue-335-dynamic-admission-partition-update
