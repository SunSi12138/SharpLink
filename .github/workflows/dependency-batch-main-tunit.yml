name: Dependency Batch Main TUnit Verification
on:
  push:
    branches: [validation/deps-844-848-main-tunit-20261011]
permissions:
  contents: read
jobs:
  exact-main-tunit-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      TUNIT_MAX_PARALLEL_TESTS: '8'
    steps:
      - name: Checkout exact dependency-only main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9dbc313a80ace0ecce6f031b031fc7159e8be8d2
      - name: Verify exact tested source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9dbc313a80ace0ecce6f031b031fc7159e8be8d2"
          test "$(git rev-parse HEAD^{tree})" = "aadd8ce4d61e6d74a13528b7d144a177d15dd475"
          echo "Tested source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Tested source tree: $(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
          grep 'VersionPrefix' Directory.Build.props
          grep 'Include="TUnit"' Directory.Packages.props
      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet
      - name: Restore and build all main projects
        run: |
          dotnet restore Sharplink.slnx
          dotnet build Sharplink.slnx --no-restore -c Release -v minimal
      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build
      - name: Generator Tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build
      - name: Load Test Tests
        run: dotnet test --project test/SharpLink.LoadTest.Tests/SharpLink.LoadTest.Tests.csproj -c Release --no-build
      - name: Stream Load Test Tests
        run: dotnet run -c Release --no-build --project test/SharpLink.StreamLoadTest.Tests -- --maximum-parallel-tests 8 --timeout 120s --no-progress
      - name: Integration Tests using required direct executable route
        run: dotnet run -c Release --no-build --project test/SharpLink.IntegrationTests -- --maximum-parallel-tests 1 --timeout 120s --output Detailed --github-reporter-style full --no-progress
