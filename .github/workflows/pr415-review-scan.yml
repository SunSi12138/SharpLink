name: PR415 Review Scan
on:
  push:
    branches: [feature/issue-396-deterministic-rpc-identity]
    paths: [.github/workflows/pr415-review-scan.yml]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate review markers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DateTimeOffsetRaw ==='
          git grep -n -C 8 'DateTimeOffsetRaw' -- test/SharpLink.CodecCompatibility || true
          echo '=== stale docs ==='
          git grep -n -C 5 -E 'RpcCodecImplementationAttribute|SchemaId|WireFormatId' -- doc || true
          echo '=== DTO string helper ==='
          git grep -n -C 6 -E '__SharpLinkGeneratedUtf16|AppendGeneratedUtf16Helper|WriteInt32LittleEndian.*byteCount' -- src/SharpLink.Generator || true
          echo '=== enum resolution helpers ==='
          git grep -n -C 5 -E 'TryResolveReachableType|GetFixedMemberSemanticIdentity|TypeKind == TypeKind.Enum' -- src/SharpLink.Generator/RpcGenerator.CodecIdentity.cs || true
          echo '=== generated wire string ==='
          git grep -n -C 12 'ReadString\|WriteString' -- src/SharpLink.Abstractions/RpcGeneratedCodecWire.cs || true
