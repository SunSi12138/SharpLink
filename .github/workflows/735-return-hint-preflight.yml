name: 735 Helper Boundary Acceptance Preflight
on:
  push:
    branches: ['perf/735-preflight-flags']
    paths:
      - '.github/workflows/735-return-hint-preflight.yml'
      - 'eng/preflight-735-hint-*'
      - 'eng/preflight-735-native-return-hint.patch'
permissions:
  contents: read
concurrency:
  group: 735-helper-boundary-acceptance
  cancel-in-progress: false
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOTNET_PROCESSOR_COUNT: '4'
      TUNIT_MAX_PARALLEL_TESTS: '8'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Reconstruct the verified candidate then isolate only the consumer changes
        run: |
          set -euo pipefail
          python3 eng/preflight-735-first-receive-apply.py
          cp eng/preflight-735-first-await-tests.cs test/SharpLink.UnitTests/Runtime/StreamManagerFirstReceiveAwaitAllocationTests.cs
          python3 eng/preflight-735-first-await-apply.py
          cp eng/preflight-735-consumer-wait-tests.cs test/SharpLink.UnitTests/Runtime/PooledDispatcherSlowWaitTests.cs
          python3 eng/preflight-735-consumer-wait-apply.py
          python3 eng/preflight-735-single-consumption-apply.py
          python3 eng/preflight-735-wait-isolation.py
          python3 eng/preflight-735-hint-apply.py
          mkdir -p artifacts/wait-isolation
          dotnet --info > artifacts/wait-isolation/dotnet.txt
          python3 -m py_compile eng/preflight-735-hint-apply.py eng/preflight-735-hint-rpc.py
      - name: Original wrappers must still fail the six completed-source controls
        run: |
          set -euo pipefail
          out=artifacts/wait-isolation
          targets='src/SharpLink.Client/SharpLinkClient.Invokers.cs src/SharpLink.Client/SharpLinkClient.Telemetry.cs'
          trap 'git restore --worktree -- $targets' EXIT
          for target in $targets; do git show e834d3c28c87ad496989af925515cf21babd308d:"$target" > "$target"; done
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true > "$out/original-wrapper-build.log" 2>&1 || { cat "$out/original-wrapper-build.log"; exit 1; }
          set +e
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU -- --treenode-filter '/*/*/ClientStreamValueTaskConsumptionTests/*' > "$out/wrapper-negative.log" 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          python3 - <<'PY'
          import pathlib,re
          text=re.sub(r'\x1b\[[0-9;]*m','',pathlib.Path('artifacts/wait-isolation/wrapper-negative.log').read_text())
          print(text)
          assert re.search(r'total:\s+12\b',text),text
          assert re.search(r'failed:\s+6\b',text),text
          assert re.search(r'succeeded:\s+6\b',text),text
          PY
      - name: Original consumer builder must fail only the pending allocation control
        run: |
          set -euo pipefail
          out=artifacts/wait-isolation
          target=src/SharpLink.Runtime/PooledAsyncStreamDispatcher.cs
          trap 'git restore --worktree -- "$target"' EXIT
          git show e834d3c28c87ad496989af925515cf21babd308d:"$target" > "$target"
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true > "$out/original-wait-build.log" 2>&1 || { cat "$out/original-wait-build.log"; exit 1; }
          export SHARPLINK_SLOW_WAIT_EVIDENCE="$PWD/$out/original"
          set +e
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU -- --treenode-filter '/*/*/PooledDispatcherSlowWaitTests/*' > "$out/wait-negative.log" 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          python3 - <<'PY'
          import pathlib,re
          text=re.sub(r'\x1b\[[0-9;]*m','',pathlib.Path('artifacts/wait-isolation/wait-negative.log').read_text())
          print(text)
          assert re.search(r'total:\s+6\b',text),text
          assert re.search(r'failed:\s+1\b',text),text
          assert re.search(r'succeeded:\s+5\b',text),text
          assert 'suspended MoveNext still allocates one fresh wrapper for every item' in text,text
          PY
      - name: Restore exact source, build and run focused ownership and allocation checks
        run: |
          set -euo pipefail
          out=artifacts/wait-isolation
          git diff --exit-code -- src
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true > "$out/final-build.log" 2>&1 || { cat "$out/final-build.log"; exit 1; }
          tail -n 7 "$out/final-build.log"
          export SHARPLINK_SLOW_WAIT_EVIDENCE="$PWD/$out/isolated"
          for suite in ClientStreamValueTaskConsumptionTests PooledDispatcherSlowWaitTests StreamFlowControllerTests; do
            dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU -- --treenode-filter "/*/*/$suite/*" 2>&1 | tee "$out/$suite.log"
          done
          python3 - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('artifacts/wait-isolation'); values={}
          for mode in ('original','isolated'):
              with (root/mode/'pending-read.csv').open() as f: rows=list(csv.DictReader(f))
              assert len(rows)==1,rows
              row=rows[0]; values[mode]=int(row['allocated_bytes'])/int(row['count'])
          assert values['isolated']<=16 and values['isolated']<values['original'],values
          (root/'allocation.json').write_text(json.dumps(values,indent=2)+'\n')
          print(values)
          PY
      - name: Original engineering and complete default runtime gates
        run: |
          set -euo pipefail
          out=artifacts/wait-isolation
          dotnet format whitespace test/SharpLink.UnitTests/SharpLink.UnitTests.csproj --no-restore --verify-no-changes --include test/SharpLink.UnitTests/Runtime/StreamFlowControllerTests.ResolvedStateLease.cs src/SharpLink.Runtime/StreamFlowController.cs src/SharpLink.Runtime/PooledAsyncStreamDispatcher.cs src/SharpLink.Client/SharpLinkClient.Invokers.cs src/SharpLink.Client/SharpLinkClient.Telemetry.cs test/SharpLink.UnitTests/Client/ClientStreamValueTaskConsumptionTests.cs test/SharpLink.UnitTests/Runtime/PooledDispatcherSlowWaitTests.cs 2>&1 | tee "$out/format.log"
          python3 eng/check-project-reference-boundaries.py 2>&1 | tee "$out/references.log"
          bash eng/check-maintainability.sh 2>&1 | tee "$out/maintainability.log"
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU 2>&1 | tee "$out/default-unit.log"
      - name: Original deterministic allocation gate on the candidate
        run: |
          set -euo pipefail
          dotnet build test/SharpLink.Benchmarks -c Release -p:Platform=AnyCPU -p:PublishAot=false -p:TreatWarningsAsErrors=true > artifacts/wait-isolation/benchmark-build.log 2>&1 || { cat artifacts/wait-isolation/benchmark-build.log; exit 1; }
          SHARPLINK_ALLOCATION_OUTPUT=artifacts/wait-isolation/allocation-gate.json bash eng/run-allocation-gate.sh 2>&1 | tee artifacts/wait-isolation/allocation-gate.log
      - name: Original writer checks and complete experimental runtime suite
        run: |
          set -euo pipefail
          out=artifacts/wait-isolation
          python3 eng/test-ready-writer.py
          python3 eng/test-ready-writer-budget.py
          python3 eng/test-ready-writer-collection.py
          python3 eng/test-ready-writer-native.py
          python3 eng/prepare-ready-writer.py --apply
          dotnet build test/SharpLink.Benchmarks -c Release -p:ReadyWriterExperiment=true -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true > "$out/writer-build.log" 2>&1 || { cat "$out/writer-build.log"; exit 1; }
          dotnet test/SharpLink.Benchmarks/bin/Release/net10.0/SharpLink.Benchmarks.dll --ready-writer-self-test 2>&1 | tee "$out/writer-checks.log"
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true > "$out/experimental-build.log" 2>&1 || { cat "$out/experimental-build.log"; exit 1; }
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU 2>&1 | tee "$out/experimental-unit.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: 735-hint-correctness-${{ github.sha }}
          path: |
            artifacts/wait-isolation
            artifacts/first-receive-integration
          if-no-files-found: error
          retention-days: 30


  rpc-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime: [jit-pgo0, jit-pgo1, native]
    env:
      DOTNET_PROCESSOR_COUNT: '4'
      CONTROL_SHA: e834d3c28c87ad496989af925515cf21babd308d
      CONSUMER_RECIPE_SHA: c35355af6e3ba2df8c6a30cb6a3e233a1e0358ab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Reconstruct all three declared runtime arms without changing the published control
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/wait-published" "$CONTROL_SHA"
          git worktree add --detach "$RUNNER_TEMP/wait-consumer" "$CONSUMER_RECIPE_SHA"
          echo "PUBLISHED_ROOT=$RUNNER_TEMP/wait-published" >> "$GITHUB_ENV"
          echo "CONSUMER_ROOT=$RUNNER_TEMP/wait-consumer" >> "$GITHUB_ENV"
          for root in "$RUNNER_TEMP/wait-consumer" "$PWD"; do
            (
              cd "$root"
              python3 eng/preflight-735-first-receive-apply.py
              cp eng/preflight-735-first-await-tests.cs test/SharpLink.UnitTests/Runtime/StreamManagerFirstReceiveAwaitAllocationTests.cs
              python3 eng/preflight-735-first-await-apply.py
              cp eng/preflight-735-consumer-wait-tests.cs test/SharpLink.UnitTests/Runtime/PooledDispatcherSlowWaitTests.cs
              python3 eng/preflight-735-consumer-wait-apply.py
              python3 eng/preflight-735-single-consumption-apply.py
              python3 eng/preflight-735-wait-isolation.py
            )
          done
          python3 eng/preflight-735-hint-apply.py
          mkdir -p artifacts/wait-isolation-rpc
          cp "$RUNNER_TEMP/wait-consumer/artifacts/first-receive-integration/provenance.json" artifacts/wait-isolation-rpc/consumer-provenance.json
          dotnet --info > artifacts/wait-isolation-rpc/dotnet.txt
          lscpu > artifacts/wait-isolation-rpc/cpu.txt
      - name: Build identical uninstrumented measurement hosts
        run: |
          set -euo pipefail
          out="$PWD/artifacts/wait-isolation-rpc"
          if [[ '${{ matrix.runtime }}' == native ]]; then
            python3 eng/preflight-735-prepare-native-rpc.py "$PUBLISHED_ROOT" "$CONSUMER_ROOT" "$out/consumer-native-host"
            python3 eng/preflight-735-prepare-native-rpc.py "$PUBLISHED_ROOT" "$PWD" "$out/candidate-native-host"
            for root in "$PUBLISHED_ROOT" "$CONSUMER_ROOT" "$PWD"; do
              label=candidate; [[ "$root" == "$PUBLISHED_ROOT" ]] && label=published; [[ "$root" == "$CONSUMER_ROOT" ]] && label=consumer
              dotnet publish "$root/test/SharpLink.FirstReceiveRpcEvidence" -c Release -r linux-x64 -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true -o "$root/artifacts/consumer-native" > "$out/$label-build.log" 2>&1 || { cat "$out/$label-build.log"; exit 1; }
              tail -n 7 "$out/$label-build.log"
            done
          else
            cmp test/SharpLink.Benchmarks/GeneratedAbiStreamingEvidenceRunner.cs "$PUBLISHED_ROOT/test/SharpLink.Benchmarks/GeneratedAbiStreamingEvidenceRunner.cs"
            cmp test/SharpLink.Benchmarks/GeneratedAbiStreamingEvidenceRunner.cs "$CONSUMER_ROOT/test/SharpLink.Benchmarks/GeneratedAbiStreamingEvidenceRunner.cs"
            for root in "$PUBLISHED_ROOT" "$CONSUMER_ROOT" "$PWD"; do
              label=candidate; [[ "$root" == "$PUBLISHED_ROOT" ]] && label=published; [[ "$root" == "$CONSUMER_ROOT" ]] && label=consumer
              dotnet build "$root/test/SharpLink.Benchmarks" -c Release -p:Platform=AnyCPU -p:PublishAot=false -p:TreatWarningsAsErrors=true > "$out/$label-build.log" 2>&1 || { cat "$out/$label-build.log"; exit 1; }
              tail -n 7 "$out/$label-build.log"
            done
          fi
      - name: Preserve the fixed 36-process population and every negative delta
        run: |
          set -euo pipefail
          python3 eng/preflight-735-hint-rpc.py "$PUBLISHED_ROOT" "$CONSUMER_ROOT" "$PWD" artifacts/wait-isolation-rpc/results --runtime '${{ matrix.runtime }}' 2>&1 | tee artifacts/wait-isolation-rpc/driver.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: 735-hint-rpc-${{ matrix.runtime }}-${{ github.sha }}
          path: |
            artifacts/wait-isolation-rpc
            artifacts/first-receive-integration
          if-no-files-found: error
          retention-days: 30


  receive-validation-hint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: [jit-pgo0, jit-pgo1, native]
    env:
      DOTNET_PROCESSOR_COUNT: '4'
      TUNIT_MAX_PARALLEL_TESTS: '8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Pin unchanged e834 control and plain-return and hinted candidates
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/inline-control"
          plain="$RUNNER_TEMP/plain-candidate"
          candidate="$RUNNER_TEMP/inline-candidate"
          git worktree add --detach "$control" e834d3c28c87ad496989af925515cf21babd308d
          git worktree add --detach "$plain" e834d3c28c87ad496989af925515cf21babd308d
          git worktree add --detach "$candidate" e834d3c28c87ad496989af925515cf21babd308d
          echo 'affb4b795a6143a946fc91edc6105ff2badff29db6477cafb828d23828bb5617  eng/preflight-735-native-return.patch' | sha256sum -c -
          echo '4cd837ca55dfdc08a3e1cfe3951071d33760bcc2cbd46ae9733a7501f680b456  eng/preflight-735-native-return-hint.patch' | sha256sum -c -
          git -C "$plain" apply "$PWD/eng/preflight-735-native-return.patch"
          git -C "$candidate" apply --check "$PWD/eng/preflight-735-native-return-hint.patch"
          git -C "$candidate" apply "$PWD/eng/preflight-735-native-return-hint.patch"
          echo "INLINE_PLAIN=$plain" >> "$GITHUB_ENV"
          echo "INLINE_CONTROL=$control" >> "$GITHUB_ENV"
          echo "INLINE_CANDIDATE=$candidate" >> "$GITHUB_ENV"
          mkdir -p artifacts/native-inline-evidence
          git -C "$candidate" diff > artifacts/native-inline-evidence/candidate.patch
          sha256sum "$control/test/SharpLink.Benchmarks/ResolvedFlowStateEvidenceRunner.cs" "$candidate/test/SharpLink.Benchmarks/ResolvedFlowStateEvidenceRunner.cs" > artifacts/native-inline-evidence/harness.sha256
          dotnet --info > artifacts/native-inline-evidence/dotnet.txt
          lscpu > artifacts/native-inline-evidence/cpu.txt
      - name: Build identical hosts and retain native codegen
        run: |
          set -euo pipefail
          out="$PWD/artifacts/native-inline-evidence"
          for root in "$INLINE_CONTROL" "$INLINE_PLAIN" "$INLINE_CANDIDATE"; do
            label=control; [[ "$root" == "$INLINE_PLAIN" ]] && label=plain; [[ "$root" == "$INLINE_CANDIDATE" ]] && label=candidate
            if [[ '${{ matrix.runtime }}' == native ]]; then
              dotnet publish "$root/test/SharpLink.ResolvedFlowStateAotEvidence" -c Release -r linux-x64 -p:PublishAot=true -p:StripSymbols=false -o "$root/artifacts/native-inline" > "$out/$label-build.log" 2>&1 || { cat "$out/$label-build.log"; exit 1; }
              objdump -dC "$root/artifacts/native-inline/SharpLink.Benchmarks" > "$out/$label-native-disassembly.txt"
              nm -C "$root/artifacts/native-inline/SharpLink.Benchmarks" > "$out/$label-native-symbols.txt"
            else
              dotnet build "$root/test/SharpLink.Benchmarks" -c Release -p:PublishAot=false -p:TreatWarningsAsErrors=true > "$out/$label-build.log" 2>&1 || { cat "$out/$label-build.log"; exit 1; }
            fi
            tail -n 7 "$out/$label-build.log"
          done
      - name: Original full population, balanced revisions and all negative results
        run: |
          set -euo pipefail
          python3 eng/preflight-735-hint-micro.py "$INLINE_CONTROL" "$INLINE_PLAIN" "$INLINE_CANDIDATE" artifacts/native-inline-evidence/results --runtime '${{ matrix.runtime }}' 2>&1 | tee artifacts/native-inline-evidence/driver.log
      - name: Complete correctness on inline candidate
        if: matrix.runtime == 'jit-pgo1'
        run: |
          set -euo pipefail
          dotnet build "$INLINE_CANDIDATE/test/SharpLink.UnitTests" -c Release -p:TreatWarningsAsErrors=true > artifacts/native-inline-evidence/unit-build.log 2>&1 || { cat artifacts/native-inline-evidence/unit-build.log; exit 1; }
          dotnet test --project "$INLINE_CANDIDATE/test/SharpLink.UnitTests" -c Release --no-build 2>&1 | tee artifacts/native-inline-evidence/unit-tests.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: 735-native-hint-${{ matrix.runtime }}-${{ github.sha }}
          path: artifacts/native-inline-evidence
          if-no-files-found: error
          retention-days: 30

  production-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASELINE_SHA: 0fe26024b114bb6e78411a9b86276086c045d03d
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ROOT: ${{ github.workspace }}/artifacts/performance/resolved-flow-state

    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Prepare exact baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"/{micro,aot,counters,e2e,env,logs}

          cpu_count="$(nproc)"
          if (( cpu_count >= 4 )); then
            cpu_list="0-3"
          elif (( cpu_count >= 2 )); then
            cpu_list="0-1"
          else
            cpu_list="0"
          fi
          echo "CPU_LIST=$cpu_list" >> "$GITHUB_ENV"

          baseline="$RUNNER_TEMP/sharplink-flow-baseline"
          candidate="$RUNNER_TEMP/sharplink-flow-candidate"
          git worktree add --detach "$baseline" "$BASELINE_SHA"
          git worktree add --detach "$candidate" "$CANDIDATE_SHA"
          (
            cd "$candidate"
            python3 eng/preflight-735-first-receive-apply.py
            cp eng/preflight-735-first-await-tests.cs test/SharpLink.UnitTests/Runtime/StreamManagerFirstReceiveAwaitAllocationTests.cs
            python3 eng/preflight-735-first-await-apply.py
            cp eng/preflight-735-consumer-wait-tests.cs test/SharpLink.UnitTests/Runtime/PooledDispatcherSlowWaitTests.cs
            python3 eng/preflight-735-consumer-wait-apply.py
            python3 eng/preflight-735-single-consumption-apply.py
            python3 eng/preflight-735-wait-isolation.py
            python3 eng/preflight-735-hint-apply.py
          )
          printf 'preflight_recipe=%s\n' "$CANDIDATE_SHA" > "$ROOT/env/recipe.txt"
          CANDIDATE_SHA="$(git -C "$candidate" write-tree)"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          cp "$candidate/artifacts/first-receive-integration/provenance.json" "$ROOT/env/candidate-provenance.json"
          cp "$candidate/artifacts/first-receive-integration/candidate.patch" "$ROOT/env/candidate.patch"
          # Keep the measurement harness identical while linking it against each revision.
          cp "$candidate/test/SharpLink.Benchmarks/GeneratedAbiStreamingEvidenceRunner.cs" "$baseline/test/SharpLink.Benchmarks/GeneratedAbiStreamingEvidenceRunner.cs"
          cp "$candidate/test/SharpLink.StreamLoadTest/Program.cs" "$baseline/test/SharpLink.StreamLoadTest/Program.cs"
          sha256sum "$candidate/test/SharpLink.StreamLoadTest/Program.cs" > "$ROOT/env/stream-load-harness.sha256"
          echo "BASELINE_ROOT=$baseline" >> "$GITHUB_ENV"
          echo "CANDIDATE_ROOT=$candidate" >> "$GITHUB_ENV"

          printf 'baseline=%s\ncandidate=%s\n' "$BASELINE_SHA" "$CANDIDATE_SHA"             > "$ROOT/env/revisions.txt"
          dotnet --info > "$ROOT/env/dotnet-info.txt"
          uname -a > "$ROOT/env/uname.txt"
          lscpu > "$ROOT/env/cpu.txt"

      - name: Build benchmark hosts
        shell: bash
        run: |
          set -euo pipefail
          for root in "$BASELINE_ROOT" "$CANDIDATE_ROOT"; do
            project="$root/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj"
            dotnet restore "$project"
            dotnet build "$project" -c Release --no-restore -p:PublishAot=false -m:1 /nodeReuse:false -v minimal

            stream_project="$root/test/SharpLink.StreamLoadTest/SharpLink.StreamLoadTest.csproj"
            dotnet restore "$stream_project"
            dotnet build "$stream_project" -c Release --no-restore -p:PublishAot=false -m:1 /nodeReuse:false -v minimal
          done

      - name: Build NativeAOT evidence host
        shell: bash
        run: |
          set -euo pipefail
          project="$CANDIDATE_ROOT/test/SharpLink.ResolvedFlowStateAotEvidence/SharpLink.ResolvedFlowStateAotEvidence.csproj"
          dotnet publish "$project" -c Release -r linux-x64 -p:PublishAot=true -p:StripSymbols=false -o "$ROOT/aot/bin" -v minimal

      # Both microkernel modes run inside the candidate; this is not a revision A/B.
      - name: Run candidate-internal keyed/resolved microkernel
        shell: bash
        run: |
          set -euo pipefail
          project="$CANDIDATE_ROOT/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj"

          for pgo in 0 1; do
            for repetition in 1 2 3; do
              output="$ROOT/micro/pgo${pgo}-r${repetition}.json"
              log="$ROOT/logs/micro-pgo${pgo}-r${repetition}.log"
              (
                cd "$CANDIDATE_ROOT"
                env                   DOTNET_ReadyToRun=0                   DOTNET_TieredCompilation=1                   DOTNET_TieredPGO="$pgo"                   DOTNET_TC_QuickJitForLoops=1                   taskset -c "$CPU_LIST" dotnet run                     -c Release --no-build --no-restore                     -p:PublishAot=false                     --project "$project" --                     --resolved-flow-state-evidence                     --repetitions 3                     --contention-items 20000                     --output "$output" > "$log"
              )
            done
          done

      - name: Summarize microkernel
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import statistics

          root = pathlib.Path("artifacts/performance/resolved-flow-state")
          out = {}
          lines = ["# Candidate-internal keyed vs resolved microkernel", "",
                   "Both API modes use the same candidate runtime; these are not dev-to-candidate binary gains.", ""]

          for pgo in (1, 0):
              per_case = {}
              for path in sorted((root / "micro").glob(f"pgo{pgo}-r*.json")):
                  rows = json.loads(path.read_text())
                  by_key = {}
                  for row in rows:
                      key = (row["Scenario"], row["ActiveStreams"], row["ItemsPerStream"])
                      by_key.setdefault(key, {})[row["Mode"]] = row
                  for key, pair in by_key.items():
                      if "key" not in pair or "resolved" not in pair:
                          continue
                      old = pair["key"]["NanosecondsPerItem"]
                      new = pair["resolved"]["NanosecondsPerItem"]
                      gain = (old - new) * 100.0 / old
                      alloc_delta = (
                          pair["resolved"]["AllocatedBytesPerItem"] -
                          pair["key"]["AllocatedBytesPerItem"]
                      )
                      lock_delta = (
                          pair["resolved"]["LockContentionsPerItem"] -
                          pair["key"]["LockContentionsPerItem"]
                      )
                      per_case.setdefault(key, []).append((gain, alloc_delta, lock_delta))

              medians = {
                  key: (
                      statistics.median(v[0] for v in values),
                      statistics.median(v[1] for v in values),
                      statistics.median(v[2] for v in values),
                  )
                  for key, values in per_case.items()
              }

              def vals(pred):
                  return [gain for key, (gain, _, _) in medians.items() if pred(key)]

              scenario_summary = {}
              for scenario in (
                  "send-no-wait",
                  "send-periodic-window-update",
                  "send-starved-control",
                  "receive-accept",
                  "receive-consume",
                  "receive-pair",
                  "short-stream-control",
                  "send-contention",
                  "receive-pair-contention",
              ):
                  data = vals(lambda k, s=scenario: k[0] == s)
                  if data:
                      scenario_summary[scenario] = statistics.median(data)

              long_lived = vals(lambda k: k[2] >= 1000 and k[0] != "short-stream-control")
              short = vals(lambda k: k[2] == 1 or k[0] == "short-stream-control")
              alloc_deltas = [delta for _, delta, _ in medians.values()]
              lock_deltas = [delta for _, _, delta in medians.values()]
              out[str(pgo)] = {
                  "scenarioMedianGainPct": scenario_summary,
                  "longLivedMedianGainPct": statistics.median(long_lived),
                  "shortControlMedianGainPct": statistics.median(short),
                  "maxAllocationDeltaBytesPerItem": max(alloc_deltas),
                  "maxLockContentionDeltaPerItem": max(lock_deltas),
              }

              lines += [
                  f"## Dynamic PGO {'ON' if pgo else 'OFF'}",
                  "",
                  f"- long-lived median ns/item improvement: {out[str(pgo)]['longLivedMedianGainPct']:+.2f}%",
                  f"- short/control median improvement: {out[str(pgo)]['shortControlMedianGainPct']:+.2f}%",
                  f"- max allocation delta B/item: {out[str(pgo)]['maxAllocationDeltaBytesPerItem']:+.3f}",
                  f"- max lock-contention delta/item: {out[str(pgo)]['maxLockContentionDeltaPerItem']:+.6f}",
                  "",
                  "| Scenario | Median ns/item improvement | Lock contention delta/item |",
                  "|---|---:|---:|",
              ]
              for scenario, value in scenario_summary.items():
                  lock_values = [
                      lock_delta
                      for key, (_, _, lock_delta) in medians.items()
                      if key[0] == scenario
                  ]
                  lines.append(
                      f"| {scenario} | {value:+.2f}% | {statistics.median(lock_values):+.6f} |"
                  )
              lines.append("")

          (root / "micro-summary.json").write_text(json.dumps(out, indent=2) + "\n")
          (root / "micro-summary.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Run candidate-internal NativeAOT keyed/resolved microkernel
        shell: bash
        run: |
          set -euo pipefail
          taskset -c "$CPU_LIST" "$ROOT/aot/bin/SharpLink.Benchmarks" --repetitions 3 --contention-items 20000 --output "$ROOT/aot/micro.json" > "$ROOT/logs/micro-nativeaot.log"

      - name: Summarize NativeAOT microkernel
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import statistics

          root = pathlib.Path("artifacts/performance/resolved-flow-state")
          rows = json.loads((root / "aot" / "micro.json").read_text())
          by_key = {}
          for row in rows:
              key = (row["Scenario"], row["ActiveStreams"], row["ItemsPerStream"])
              by_key.setdefault(key, {})[row["Mode"]] = row

          medians = {}
          for key, pair in by_key.items():
              if "key" not in pair or "resolved" not in pair:
                  continue
              old = pair["key"]["NanosecondsPerItem"]
              new = pair["resolved"]["NanosecondsPerItem"]
              medians[key] = (
                  (old - new) * 100.0 / old,
                  pair["resolved"]["AllocatedBytesPerItem"] - pair["key"]["AllocatedBytesPerItem"],
                  pair["resolved"]["LockContentionsPerItem"] - pair["key"]["LockContentionsPerItem"],
              )

          scenarios = (
              "send-no-wait",
              "send-periodic-window-update",
              "send-starved-control",
              "receive-accept",
              "receive-consume",
              "receive-pair",
              "short-stream-control",
              "send-contention",
              "receive-pair-contention",
          )
          lines = [
              "# NativeAOT resolved flow-state microkernel",
              "",
              "| Scenario | Median ns/item improvement | Lock contention delta/item |",
              "|---|---:|---:|",
          ]
          summary = {}
          for scenario in scenarios:
              values = [v for key, v in medians.items() if key[0] == scenario]
              if not values:
                  continue
              gain = statistics.median(v[0] for v in values)
              lock_delta = statistics.median(v[2] for v in values)
              summary[scenario] = {
                  "gainPct": gain,
                  "lockContentionDeltaPerItem": lock_delta,
              }
              lines.append(f"| {scenario} | {gain:+.2f}% | {lock_delta:+.6f} |")

          long_lived = [
              gain
              for key, (gain, _, _) in medians.items()
              if key[2] >= 1000 and key[0] != "short-stream-control"
          ]
          alloc_deltas = [delta for _, delta, _ in medians.values()]
          lines += [
              "",
              f"- long-lived median ns/item improvement: {statistics.median(long_lived):+.2f}%",
              f"- max allocation delta B/item: {max(alloc_deltas):+.3f}",
              "",
          ]
          (root / "aot-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          (root / "aot-summary.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Capture instruction and branch attribution
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v valgrind >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq valgrind
          fi

          jit_dll="$CANDIDATE_ROOT/test/SharpLink.Benchmarks/bin/Release/net10.0/SharpLink.Benchmarks.dll"
          aot_bin="$ROOT/aot/bin/SharpLink.Benchmarks"

          run_callgrind() {
            local runtime="$1"
            local mode="$2"
            local output="$ROOT/counters/callgrind-$runtime-$mode.out"
            local result="$ROOT/counters/$runtime-$mode.json"
            local log="$ROOT/logs/counter-$runtime-$mode.log"
            local status=0

            set +e
            if [[ "$runtime" == "jit" ]]; then
              valgrind --tool=callgrind --branch-sim=yes --callgrind-out-file="$output" \
                dotnet "$jit_dll" --resolved-flow-state-evidence \
                --scenario receive-pair --mode "$mode" --active-streams 32 \
                --items-per-stream 1000 --repetitions 2 --skip-contention \
                --output "$result" > "$log" 2>&1
              status=$?
            else
              valgrind --tool=callgrind --branch-sim=yes --callgrind-out-file="$output" \
                "$aot_bin" --scenario receive-pair --mode "$mode" --active-streams 32 \
                --items-per-stream 1000 --repetitions 2 --skip-contention \
                --output "$result" > "$log" 2>&1
              status=$?
            fi
            set -e

            if (( status != 0 )); then
              printf 'Callgrind unavailable for %s/%s (exit %d); continuing with n/a counters.\n' \
                "$runtime" "$mode" "$status" | tee -a "$log"
              rm -f "$output"
            fi
          }

          run_callgrind jit key
          run_callgrind jit resolved
          run_callgrind aot key
          run_callgrind aot resolved

          python3 - <<'PY'
          import pathlib

          root = pathlib.Path("artifacts/performance/resolved-flow-state")
          # Runner executes one warm-up operation plus two measured repetitions.
          items = 3 * 32 * 1000

          def load(path):
              if not path.exists():
                  return None
              events = None
              summary = None
              try:
                  for line in path.read_text().splitlines():
                      if line.startswith("events: "):
                          events = line.split()[1:]
                      elif line.startswith("summary: "):
                          summary = [int(value) for value in line.split()[1:]]
              except (OSError, ValueError):
                  return None
              if events is None or summary is None:
                  return None
              values = dict(zip(events, summary))
              if "Ir" not in values or "Bc" not in values or "Bi" not in values:
                  return None
              return values

          data = {}
          for runtime in ("jit", "aot"):
              for mode in ("key", "resolved"):
                  data[(runtime, mode)] = load(
                      root / "counters" / f"callgrind-{runtime}-{mode}.out"
                  )

          lines = [
              "# Receive-pair c32 instruction/branch attribution",
              "",
              "GitHub-hosted runners do not expose the hardware PMU. CI attempts "
              "Valgrind/Callgrind simulation; unsupported runtime/image combinations "
              "are reported as n/a and do not block the production A/B evidence.",
              "",
              "| Runtime | Mode | Instructions/item | Branches/item | Branch mispredicts/item |",
              "|---|---|---:|---:|---:|",
          ]
          for runtime in ("jit", "aot"):
              for mode in ("key", "resolved"):
                  row = data[(runtime, mode)]
                  if row is None:
                      lines.append(f"| {runtime} | {mode} | n/a | n/a | n/a |")
                      continue
                  branches = row["Bc"] + row["Bi"]
                  misses = row.get("Bcm", 0) + row.get("Bim", 0)
                  lines.append(
                      f"| {runtime} | {mode} | "
                      f"{row['Ir'] / items:.2f} | "
                      f"{branches / items:.2f} | "
                      f"{misses / items:.4f} |"
                  )

          lines += [
              "",
              "Static hot-path lookup attribution for receive-pair:",
              "",
              "- keyed path: 2 stream-state dictionary lookups/item; 2 flow-controller gate entries/item",
              "- resolved path: 0 stream-state dictionary lookups/item after one lifecycle resolve; 2 flow-controller gate entries/item",
              "",
          ]
          (root / "counter-summary.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Run end-to-end TCP and SharedMemory streaming A/B
        shell: bash
        run: |
          set -euo pipefail

          scenarios=(
            Server1x16
            Server100x16
            Server100x4096
            Client100x16
            Client100x4096
            Duplex100x16
            Duplex100x4096
          )
          transports=(tcp sharedmemory)

          run_one() {
            local label="$1"
            local root="$2"
            local sha="$3"
            local repetition="$4"
            local scenario="$5"
            local transport="$6"
            local output="$ROOT/e2e/$transport-$label-r$repetition-$scenario.json"
            local log="$ROOT/logs/e2e-$transport-$label-r$repetition-$scenario.log"
            (
              cd "$root"
              env SHARPLINK_BENCHMARK_SHA="$sha" DOTNET_ReadyToRun=0 DOTNET_TieredCompilation=1 DOTNET_TieredPGO=1 DOTNET_TC_QuickJitForLoops=1 taskset -c "$CPU_LIST" dotnet run -c Release --no-build --no-restore -p:PublishAot=false --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -- --generated-abi-streaming-evidence "$scenario" 30 5 200000 "$output" "$transport" > "$log"
            )
          }

          for repetition in 1 2 3; do
            if (( repetition % 2 == 1 )); then
              revisions=(
                "baseline:$BASELINE_ROOT:$BASELINE_SHA"
                "candidate:$CANDIDATE_ROOT:$CANDIDATE_SHA"
              )
              order=("${scenarios[@]}")
            else
              revisions=(
                "candidate:$CANDIDATE_ROOT:$CANDIDATE_SHA"
                "baseline:$BASELINE_ROOT:$BASELINE_SHA"
              )
              order=(
                Duplex100x4096 Duplex100x16
                Client100x4096 Client100x16
                Server100x4096 Server100x16 Server1x16
              )
            fi

            for transport in "${transports[@]}"; do
              for scenario in "${order[@]}"; do
                for spec in "${revisions[@]}"; do
                  IFS=: read -r label root sha <<< "$spec"
                  run_one "$label" "$root" "$sha" "$repetition" "$scenario" "$transport"
                done
              done
            done
          done

      - name: Summarize end-to-end A/B
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import statistics

          root = pathlib.Path("artifacts/performance/resolved-flow-state")
          scenarios = (
              "Server1x16",
              "Server100x16",
              "Server100x4096",
              "Client100x16",
              "Client100x4096",
              "Duplex100x16",
              "Duplex100x4096",
          )
          transports = ("tcp", "sharedmemory")

          def load(label, transport, scenario):
              rows = [
                  json.loads(path.read_text())
                  for path in sorted((root / "e2e").glob(f"{transport}-{label}-r*-{scenario}.json"))
              ]
              if len(rows) != 3:
                  raise SystemExit(
                      f"expected 3 {transport}/{label}/{scenario} rows, got {len(rows)}"
                  )
              if any(row["validationFailures"] != 0 for row in rows):
                  raise SystemExit(f"validation failure in {transport}/{label}/{scenario}")
              return rows

          def med(rows, key):
              return statistics.median(row[key] for row in rows)

          summary = {}
          lines = [
              "# Latest dev vs resolved flow-state candidate",
              "",
              "| Transport | Scenario | Items/s | CPU efficiency | P50 | P99 | Alloc/item |",
              "|---|---|---:|---:|---:|---:|---:|",
          ]
          primary = {transport: [] for transport in transports}

          for transport in transports:
              for scenario in scenarios:
                  base = load("baseline", transport, scenario)
                  cand = load("candidate", transport, scenario)
                  b_items = med(base, "throughputItemsPerSecond")
                  c_items = med(cand, "throughputItemsPerSecond")
                  b_cpu = med(base, "cpuUsPerOperation")
                  c_cpu = med(cand, "cpuUsPerOperation")
                  b_p50 = med(base, "p50Us")
                  c_p50 = med(cand, "p50Us")
                  b_p99 = med(base, "p99Us")
                  c_p99 = med(cand, "p99Us")
                  b_alloc = med(base, "allocatedBytesPerItem")
                  c_alloc = med(cand, "allocatedBytesPerItem")

                  row = {
                      "itemsPct": (c_items / b_items - 1.0) * 100.0,
                      "cpuEfficiencyPct": (b_cpu / c_cpu - 1.0) * 100.0,
                      "p50Pct": (c_p50 / b_p50 - 1.0) * 100.0,
                      "p99Pct": (c_p99 / b_p99 - 1.0) * 100.0,
                      "allocItemDelta": c_alloc - b_alloc,
                  }
                  summary[f"{transport}/{scenario}"] = row
                  if scenario != "Server1x16":
                      primary[transport].append(row["itemsPct"])
                  lines.append(
                      f"| {transport} | {scenario} | {row['itemsPct']:+.2f}% | "
                      f"{row['cpuEfficiencyPct']:+.2f}% | {row['p50Pct']:+.2f}% | "
                      f"{row['p99Pct']:+.2f}% | {row['allocItemDelta']:+.2f} B |"
                  )

          lines += [""]
          for transport in transports:
              lines.append(
                  f"- {transport} median throughput delta across 100-item scenarios: "
                  f"{statistics.median(primary[transport]):+.2f}%"
              )
          lines.append("")

          (root / "e2e-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          (root / "e2e-summary.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Run bounded-window c8 stream-load A/B
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/c8"
          # Int32 items use byte credits, while the dispatcher also has a 4096-item cap.
          # The default 1 MiB window can overflow that cap on either revision. Measure
          # long streams with identical explicit windows; do not raise the runtime cap.

          run_one() {
            local label="$1"
            local root="$2"
            local sha="$3"
            local repetition="$4"
            local transport="$5"
            local stream_size="$6"
            local output="$ROOT/c8/$transport-size$stream_size-$label-r$repetition.json"
            local log="$ROOT/logs/c8-$transport-size$stream_size-$label-r$repetition.log"
            (
              cd "$root"
              env SHARPLINK_COMMIT="$sha" DOTNET_ReadyToRun=0 DOTNET_TieredCompilation=1 DOTNET_TieredPGO=1 DOTNET_TC_QuickJitForLoops=1                 taskset -c "$CPU_LIST" dotnet run -c Release --no-build --no-restore -p:PublishAot=false                 --project test/SharpLink.StreamLoadTest/SharpLink.StreamLoadTest.csproj --                 --mode local --transport "$transport" --operation all                 --stream-size "$stream_size" --concurrency 8                 --stream-receive-window-bytes 8192 --connection-receive-window-bytes 65536                 --warmup 1 --duration 2 --recording off --json-output "$output" > "$log"
            )
          }

          for repetition in 1 2 3; do
            if (( repetition % 2 == 1 )); then
              revisions=(
                "baseline:$BASELINE_ROOT:$BASELINE_SHA"
                "candidate:$CANDIDATE_ROOT:$CANDIDATE_SHA"
              )
            else
              revisions=(
                "candidate:$CANDIDATE_ROOT:$CANDIDATE_SHA"
                "baseline:$BASELINE_ROOT:$BASELINE_SHA"
              )
            fi

            for transport in tcp sharedmemory; do
              for stream_size in 1 10000; do
                for spec in "${revisions[@]}"; do
                  IFS=: read -r label root sha <<< "$spec"
                  run_one "$label" "$root" "$sha" "$repetition" "$transport" "$stream_size"
                done
              done
            done
          done

      - name: Summarize bounded-window c8 stream-load A/B
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import math
          import os
          import pathlib
          import statistics

          root = pathlib.Path("artifacts/performance/resolved-flow-state")
          transports = ("tcp", "sharedmemory")
          sizes = (1, 10000)
          operations = ("c2s", "s2c", "duplex")

          def load(label, transport, size):
              expected_sha = os.environ["BASELINE_SHA" if label == "baseline" else "CANDIDATE_SHA"]
              paths = sorted((root / "c8").glob(f"{transport}-size{size}-{label}-r*.json"))
              if len(paths) != 3:
                  raise SystemExit(
                      f"expected 3 {transport}/size{size}/{label} reports, got {len(paths)}"
                  )
              by_operation = {operation: [] for operation in operations}
              for path in paths:
                  report = json.loads(path.read_text())
                  if report.get("SourceCommit") != expected_sha:
                      raise SystemExit(
                          f"source commit mismatch in {path}: "
                          f"expected {expected_sha}, got {report.get('SourceCommit')}"
                      )
                  configuration = report["Configuration"]
                  if (configuration.get("StreamReceiveWindowBytes") != 8192 or
                          configuration.get("ConnectionReceiveWindowBytes") != 65536 or
                          configuration.get("StreamSize") != size or
                          configuration.get("ConcurrencyConfig") != [8]):
                      raise SystemExit(f"c8 workload configuration mismatch in {path}")
                  seen_operations = set()
                  for row in report["Results"]:
                      operation = row["Operation"]
                      if operation not in by_operation:
                          continue
                      if operation in seen_operations:
                          raise SystemExit(f"duplicate stream-load operation in {path}: {operation}")
                      seen_operations.add(operation)
                      if (row["Failure"] != 0 or row["ValidationFailure"] != 0 or
                              row["Cancelled"] != 0):
                          raise SystemExit(
                              f"stream-load failure in {path}: {operation}"
                          )
                      if row["Success"] <= 0 or not math.isfinite(row["Qps"]) or row["Qps"] <= 0:
                          raise SystemExit(f"invalid stream-load sample in {path}: {operation}")
                      by_operation[operation].append(row)
                  if seen_operations != set(operations):
                      raise SystemExit(f"missing stream-load operations in {path}")
              return by_operation

          lines = [
              "# Bounded-window stream-load c8 A/B",
              "",
              "Production runtime with explicit 8 KiB stream / 64 KiB connection windows; not a default-window result.",
              "",
              "| Transport | Items/stream | Shape | Streams/s delta |",
              "|---|---:|---|---:|",
          ]
          summary = {}
          for transport in transports:
              for size in sizes:
                  base = load("baseline", transport, size)
                  cand = load("candidate", transport, size)
                  for operation in operations:
                      b = statistics.median(row["Qps"] for row in base[operation])
                      c = statistics.median(row["Qps"] for row in cand[operation])
                      delta = (c / b - 1.0) * 100.0
                      key = f"{transport}/size{size}/{operation}"
                      summary[key] = delta
                      lines.append(
                          f"| {transport} | {size} | {operation} | {delta:+.2f}% |"
                      )

          (root / "c8-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          (root / "c8-summary.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Publish evidence summary
        shell: bash
        run: |
          cat "$ROOT/micro-summary.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$ROOT/aot-summary.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$ROOT/counter-summary.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$ROOT/e2e-summary.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$ROOT/c8-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved-flow-state-${{ github.sha }}
          path: artifacts/performance/resolved-flow-state
          if-no-files-found: error
          retention-days: 30
