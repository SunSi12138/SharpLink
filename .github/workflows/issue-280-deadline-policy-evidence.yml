name: Issue 280 Deadline Policy Evidence

permissions:
  contents: read

on:
  push:
    branches:
      - agent/issue-280-policy-aware-deadline-evidence
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Prove production source is unchanged
        run: git diff --exit-code origin/dev...HEAD -- src/

      - name: Restore evidence project
        run: dotnet restore test/SharpLink.DeadlinePolicyEvidence/SharpLink.DeadlinePolicyEvidence.csproj

      - name: Build evidence project
        run: dotnet build test/SharpLink.DeadlinePolicyEvidence/SharpLink.DeadlinePolicyEvidence.csproj -c Release --no-restore -v minimal

      - name: Run deterministic correctness and paired evidence
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.DeadlinePolicyEvidence/SharpLink.DeadlinePolicyEvidence.csproj
          --
          --correctness
          --benchmark
          --primary-rounds 3
          --boundary-rounds 1
          --warmup-seconds 1
          --duration-seconds 2
          --json artifacts/issue-280/deadline-policy-evidence.json

      - name: Publish evidence summary
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/issue-280/deadline-policy-evidence.json")
          if not path.exists():
              raise SystemExit(0)
          report = json.loads(path.read_text())
          evidence = report.get("Evidence")
          correctness = report.get("Correctness")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Issue #280 policy-aware deadline evidence\n\n")
              if correctness:
                  out.write(f"Correctness: **{correctness['Total'] - correctness['Failed']}/{correctness['Total']} passed**.\n\n")
              if not evidence:
                  raise SystemExit(0)
              guard = evidence["ZeroDeadlineAllocationGuardrail"]
              probe = evidence["ExecutionContextProbe"]
              out.write(
                  f"Zero-deadline guardrail: {guard['AllocatedBytesPerOperation']:.3f} B/op; "
                  f"runtime timer creates={guard['RuntimeTimerCreates']}; callbacks={guard['RuntimeTimerCallbacks']}.  \n"
              )
              out.write(f"TimeProvider.System timer ExecutionContext captured: `{probe['Captured']}`.\n\n")
              out.write("| Scenario | Priority | density | expiry | capacity | QPS Δ per-call | CPU Δ per-call | alloc Δ B/op | shared p99 ms | per-call p99 ms |\n")
              out.write("|---|---|---:|---:|---:|---:|---:|---:|---:|---:|\n")
              for row in evidence["Summaries"]:
                  out.write(
                      f"| {row['Scenario']} | {row['Priority']} | {row['DeadlineDensityPercent']:.2f}% | "
                      f"{row['ExpiryPercentOfDeadlineCalls']:.2f}% | {row['Capacity']:,} | "
                      f"{row['PerCallQpsDeltaPercent']:+.2f}% | {row['PerCallCpuDeltaPercent']:+.2f}% | "
                      f"{row['PerCallAllocationDeltaBytesPerOperation']:+.2f} | "
                      f"{row['SharedMedianP99LatenessMilliseconds']:.3f} | "
                      f"{row['PerCallMedianP99LatenessMilliseconds']:.3f} |\n"
                  )

      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-280-deadline-policy-evidence
          path: artifacts/issue-280/deadline-policy-evidence.json
          if-no-files-found: warn
