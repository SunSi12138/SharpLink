name: Issue 305 Admission Partition Lease Evidence

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Record environment
        shell: bash
        run: |
          mkdir -p artifacts/issue-305/baseline artifacts/issue-305/candidate
          git rev-parse HEAD | tee artifacts/issue-305/baseline/git-sha.txt
          dotnet --info | tee artifacts/issue-305/baseline/dotnet-info.txt
          lscpu | tee artifacts/issue-305/baseline/cpu.txt

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Baseline partition benchmarks
        shell: bash
        run: |
          dotnet run -c Release --no-restore --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -- \
            --filter '*AdmissionPartitionReleaseBenchmarks*' '*AdmissionPartitionControllerBenchmarks*' '*AdmissionPartitionRpcBenchmarks*' \
            --artifacts artifacts/issue-305/baseline/bdn

      - name: Apply Candidate A2 in workspace
        shell: bash
        run: |
          python3 .github/scripts/issue-305-apply.py
          python3 .github/scripts/issue-305-adapt-tests.py
          git add -N test/SharpLink.UnitTests/Server/AdmissionPartitionOwnershipTests.cs
          git diff -- src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs \
            test/SharpLink.Benchmarks/AdmissionPartitionBenchmarks.cs \
            test/SharpLink.UnitTests/Server/AdmissionPartitionPoolTests.cs \
            test/SharpLink.UnitTests/Server/AdmissionPartitionOwnershipTests.cs \
            > artifacts/issue-305/candidate/candidate.patch

      - name: Candidate correctness
        shell: bash
        run: |
          dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj \
            --configuration Release --no-restore \
            --filter 'FullyQualifiedName~AdmissionControlTests|FullyQualifiedName~AdmissionPartitionPoolTests|FullyQualifiedName~AdmissionPartitionOwnershipTests'

      - name: Candidate partition benchmarks
        shell: bash
        run: |
          dotnet run -c Release --no-restore --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -- \
            --filter '*AdmissionPartitionReleaseBenchmarks*' '*AdmissionPartitionControllerBenchmarks*' '*AdmissionPartitionRpcBenchmarks*' \
            --artifacts artifacts/issue-305/candidate/bdn

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-305-evidence-${{ github.sha }}
          path: artifacts/issue-305
          if-no-files-found: warn
          retention-days: 30
