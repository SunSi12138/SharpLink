name: PR443 Changelog Cleanup

on:
  push:
    branches:
      - fix/282-explicit-timeout-policy

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/282-explicit-timeout-policy
          fetch-depth: 0
      - name: Restore unrelated historical changelog text
        shell: python
        run: |
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '`LogEvents.Client.ResolverUpdateFailed` is an additive public event ID': '`LogEvents.Client.ResolverUpdateFailed` is an additive event ID',
              'Named Pipe、SharedMemory 和既有 Anonymous Pipe': 'Named Pipe、Shared Memory 和既有 Anonymous Pipe',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected changelog text not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - run: git diff --check
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md
          git commit -m "docs: keep timeout migration changelog focused"
          git push origin HEAD:fix/282-explicit-timeout-policy
