name: Unit postgate diagnosis only (no TCP, no uploads)

on:
  push:
    branches: [validation/server-call-pin-unit-postgate-diag-20261029]
    paths: ['eng/server-call-pin-tcp/UNIT_DIAGNOSTIC_REQUEST.json']

permissions:
  contents: read

concurrency:
  group: server-call-pin-unit-postgate-DIAG1
  cancel-in-progress: false

jobs:
  unit-postgate-diagnosis:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/validation/server-call-pin-unit-postgate-diag-20261029' && github.run_attempt == 1 && github.event.head_commit.message == 'run: server call pin unit postgate diagnosis DIAG1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Initialize failure-retaining evidence paths
        shell: bash
        run: |
          set -euo pipefail
          export DOTNET_INSTALL_DIR="$RUNNER_TEMP/server-call-pin-tcp-sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export DOTNET_CLI_HOME="$RUNNER_TEMP/server-call-pin-tcp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/cli-home"
          export CORRECTNESS_RUNTIME="$RUNNER_TEMP/server-call-pin-correctness-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export PRIVATE_RUNTIME="$RUNNER_TEMP/server-call-pin-tcp-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export DIAGNOSTIC_ROOT="$RUNNER_TEMP/server-call-pin-tcp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "DOTNET_INSTALL_DIR=$DOTNET_INSTALL_DIR"
            echo "DOTNET_CLI_HOME=$DOTNET_CLI_HOME"
            echo "PRIVATE_RUNTIME=$PRIVATE_RUNTIME"
            echo "CORRECTNESS_RUNTIME=$CORRECTNESS_RUNTIME"
            echo "NUGET_HTTP_CACHE_PATH=$DIAGNOSTIC_ROOT/http-cache"
            echo "NUGET_SCRATCH=$DIAGNOSTIC_ROOT/scratch"
            echo "XDG_DATA_HOME=$DIAGNOSTIC_ROOT/xdg"
            echo "XDG_CACHE_HOME=$DIAGNOSTIC_ROOT/xdg-cache"
            echo "NUGET_PACKAGES=$DIAGNOSTIC_ROOT/packages"
            echo "DIAGNOSTIC_ROOT=$DIAGNOSTIC_ROOT"
          } >> "$GITHUB_ENV"
          test ! -e "$DIAGNOSTIC_ROOT" && test ! -L "$DIAGNOSTIC_ROOT"
          mkdir -p "$DIAGNOSTIC_ROOT/runtime-install" "$DOTNET_CLI_HOME" "$DIAGNOSTIC_ROOT/http-cache" "$DIAGNOSTIC_ROOT/scratch" "$DIAGNOSTIC_ROOT/xdg" "$DIAGNOSTIC_ROOT/xdg-cache" "$DIAGNOSTIC_ROOT/packages"
          printf 'request=%s\nrun=%s\nattempt=%s\nrunner=%s/%s\nimage=%s/%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" "$RUNNER_ARCH" \
            "${ImageOS:-unknown}" "${ImageVersion:-unknown}" > "$DIAGNOSTIC_ROOT/launch-environment.txt"
      - name: Checkout bounded request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tools
          fetch-depth: 2
          persist-credentials: false
      - name: Verify single request, exact review identity and explicit root release
        id: request
        working-directory: tools
        shell: bash
        run: |
          set -euo pipefail
          cp eng/server-call-pin-tcp/UNIT_DIAGNOSTIC_REQUEST.json "$DIAGNOSTIC_ROOT/submitted-request.json"
          cp "$GITHUB_EVENT_PATH" "$DIAGNOSTIC_ROOT/push-event.json"
          python3 eng/server-call-pin-tcp/verify_unit_diagnostic_request.py \
            --record "$DIAGNOSTIC_ROOT/verified-request.json" > "$DIAGNOSTIC_ROOT/request-gate.log" 2>&1
      - name: Pin all subsequent tools and workflow bytes to reviewed request parent
        id: pin
        working-directory: tools
        env:
          REVIEWED_TOOL_SHA: ${{ steps.request.outputs.reviewed_tool_sha }}
          REVIEWED_TOOL_TREE: ${{ steps.request.outputs.reviewed_tool_tree }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$REVIEWED_TOOL_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_TOOL_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$REVIEWED_TOOL_TREE"
          test -z "$(git status --porcelain)"
          cp .github/workflows/server-call-pin-unit-postgate-diagnostic.yml "$DIAGNOSTIC_ROOT/reviewed-workflow.yml"
          printf '%s\n' "$REVIEWED_TOOL_SHA" > "$DIAGNOSTIC_ROOT/reviewed-tool-sha.txt"
      - name: Checkout exact fixed baseline product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.request.outputs.baseline_source }}
          path: sources/baseline
          persist-credentials: false
      - name: Checkout exact independently reviewed candidate product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.request.outputs.candidate_source }}
          path: sources/candidate
          persist-credentials: false
      - name: Install exact separate SDK102 and runtime14 with SHA512 verification
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$DOTNET_INSTALL_DIR" && test ! -L "$DOTNET_INSTALL_DIR"
          test ! -e "$PRIVATE_RUNTIME" && test ! -L "$PRIVATE_RUNTIME"
          test ! -e "$CORRECTNESS_RUNTIME" && test ! -L "$CORRECTNESS_RUNTIME"
          cd "$DIAGNOSTIC_ROOT/runtime-install"
          curl --fail --silent --show-error --location https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.102/dotnet-sdk-10.0.102-linux-x64.tar.gz --output sdk.tar.gz
          curl --fail --silent --show-error --location https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.14/dotnet-runtime-10.0.14-linux-x64.tar.gz --output dotnet.tar.gz
          curl --fail --silent --show-error --location https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.14/aspnetcore-runtime-10.0.14-linux-x64.tar.gz --output aspnetcore.tar.gz
          {
            echo '7adf40e8e5547970391cfbe474c3874c6918ce3575ac398f376c78502134e1c8a2fa3da9aca281fdaeda81671f56c851ebe9e74c5b57c5a298bd45deba63565d  sdk.tar.gz'
            echo '634326028645f38731c8c4e71a68356e4ca0d6b6607139a234ab760687f742063edaf33a1f20dda615742d2dc8300ca2ff857619d51fbb38090383b71334af89  dotnet.tar.gz'
            echo 'dd024fd2616926a555b75cbf7a836f6dce998199f0596d9d75676dca2b9d59c8ee8673c6ac23473c0f1a4bdd59eb5cd02fe9ab097eeaf2dd8c8bd117c85e7031  aspnetcore.tar.gz'
          } | sha512sum --check
          mkdir "$DOTNET_INSTALL_DIR" "$PRIVATE_RUNTIME" "$CORRECTNESS_RUNTIME"
          tar -xzf sdk.tar.gz -C "$DOTNET_INSTALL_DIR"
          tar -xzf dotnet.tar.gz -C "$PRIVATE_RUNTIME"
          tar -xzf dotnet.tar.gz -C "$CORRECTNESS_RUNTIME"
          tar -xzf aspnetcore.tar.gz -C "$PRIVATE_RUNTIME"
          {
            echo "DOTNET_ROOT=$DOTNET_INSTALL_DIR"
            echo "DOTNET_ROOT_X64=$DOTNET_INSTALL_DIR"
            echo "DOTNET_HOST_PATH=$DOTNET_INSTALL_DIR/dotnet"
          } >> "$GITHUB_ENV"
          echo "$DOTNET_INSTALL_DIR" >> "$GITHUB_PATH"
          test "$("$DOTNET_INSTALL_DIR/dotnet" --list-sdks)" = "10.0.102 [$DOTNET_INSTALL_DIR/sdk]"
          test -z "$("$PRIVATE_RUNTIME/dotnet" --list-sdks)"
          echo 'HOST_INSTALL sdk=10.0.102 private-runtime=10.0.14 sha512=PASS'
      - name: Exercise offline protocol and negative controls
        working-directory: tools
        shell: bash
        run: |
          set -euo pipefail
          if python3 -m unittest discover -s eng/server-call-pin-tcp -p 'test_*.py' > "$DIAGNOSTIC_ROOT/offline-controls.log" 2>&1; then
            echo 'OFFLINE_CONTROLS_PASS'
          else
            echo 'OFFLINE_CONTROLS_FAIL no test logs uploaded'
            exit 1
          fi
      - name: Build each arm once, freeze common products and prove compiled identities
        working-directory: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 eng/server-call-pin-tcp/prepare.py \
            --baseline-source "$GITHUB_WORKSPACE/sources/baseline" \
            --candidate-source "$GITHUB_WORKSPACE/sources/candidate" \
            --dependency-cache "$DIAGNOSTIC_ROOT/packages" \
            --dotnet "$DOTNET_INSTALL_DIR/dotnet" \
            --output "$DIAGNOSTIC_ROOT/prepared" > "$DIAGNOSTIC_ROOT/preparation.log" 2>&1
      - name: Diagnose both ordinary postgates and actual dynamic module-retirement; stop here
        id: unit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/eng/server-call-pin-tcp/unit_gate/run.py \
            --prepared "$DIAGNOSTIC_ROOT/prepared" \
            --runtime-dotnet "$CORRECTNESS_RUNTIME/dotnet" \
            --output "$DIAGNOSTIC_ROOT/unit"
      - name: Bounded diagnostic outcome; original failure remains unchanged
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          case "$UNIT_OUTCOME" in
            success) echo 'POSTGATE_DIAG_NOT_REPRODUCED originalRun=40974725311 originalFailureUnchanged=true TCP=0 acceptedMetrics=0' ;;
            failure) echo 'POSTGATE_DIAG_FAILED originalRun=40974725311 originalFailureUnchanged=true TCP=0 acceptedMetrics=0' ;;
            *) echo 'POSTGATE_DIAG_INCOMPLETE originalRun=40974725311 originalFailureUnchanged=true TCP=0 acceptedMetrics=0' ;;
          esac
      # No TCP driver, timing, performance validation, raw upload, or continuation.
