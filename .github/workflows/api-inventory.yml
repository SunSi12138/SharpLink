name: API Inventory

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/api-inventory.yml'
      - '.github/workflows/release-gate.yml'
      - '.github/actions/setup-dotnet/**'
      - 'eng/SharpLink.ApiInventory/**'
      - 'eng/run-api-inventory.py'
      - 'eng/api-inventory/**'
      - 'eng/tests/test_api_inventory.py'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'Sharplink.slnx'
      - 'NuGet.Config'
      - 'nuget.config'
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: api-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Roslyn API inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      # The wrapper builds only its tool and each discovered project/TFM.
      # Do not add a redundant whole-solution restore/build here.
      - name: Verify inventory fixtures and failure controls
        run: python3 -m unittest discover -s eng/tests -p 'test_api_inventory.py' -v

      - name: Inventory actual production project declarations
        run: python3 eng/run-api-inventory.py --output artifacts/api-inventory/pr

      - name: Upload raw inventory and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/api-inventory/pr
            artifacts/api-inventory-fixtures
          if-no-files-found: warn
          retention-days: 30
