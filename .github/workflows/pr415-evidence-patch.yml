name: PR415 Evidence Patch

permissions:
  contents: write

on:
  push:
    branches:
      - feature/issue-396-deterministic-rpc-identity

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/issue-396-deterministic-rpc-identity
          fetch-depth: 0

      - name: Align DateTimeOffset integration evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/SharpLink.IntegrationTests/IntegrationBehaviorTests.cs')
          text = path.read_text()

          value_marker = '            CreateDateTimeOffsetWithPoisonedPadding()), writer);'
          if text.count(value_marker) != 1:
              raise SystemExit('expected poisoned DateTimeOffset value exactly once')
          text = text.replace(
              value_marker,
              '            new DateTimeOffset(2026, 7, 27, 12, 34, 56, TimeSpan.FromHours(8))), writer);')

          helper_start = text.index('    private static DateTimeOffset CreateDateTimeOffsetWithPoisonedPadding()')
          helper_end = text.index('    private static (int Offset, int Length, RpcGeneratedWireType WireType) FindGeneratedSemanticField(', helper_start)
          text = text[:helper_start] + text[helper_end:]

          padding_marker = '        var paddingIsCanonical = field.WireType == RpcGeneratedWireType.Fixed16 && field.Length == 16 &&'
          if text.count(padding_marker) != 1:
              raise SystemExit('expected DateTimeOffset padding assertion exactly once')
          text = text.replace(
              padding_marker,
              '        var paddingFailure = DeserializeMutatedGeneratedSemantic(7, static (payload, offset, _) =>\n'
              '            payload[offset + sizeof(short)] = 0xA5);\n\n'
              + padding_marker)

          ensure_marker = '               malformedFailure is SharpLinkException { Code: SharpLinkErrorCode.DataLoss },\n            "generated DateTimeOffset must clear native padding and reject invalid ticks");'
          if text.count(ensure_marker) != 1:
              raise SystemExit('expected DateTimeOffset validation assertion exactly once')
          text = text.replace(
              ensure_marker,
              '               malformedFailure is SharpLinkException { Code: SharpLinkErrorCode.DataLoss } &&\n'
              '               paddingFailure is SharpLinkException { Code: SharpLinkErrorCode.DataLoss },\n'
              '            "generated DateTimeOffset must emit canonical padding and reject malformed ticks or padding");')

          path.write_text(text)
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/pr415-evidence-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/SharpLink.IntegrationTests/IntegrationBehaviorTests.cs .github/workflows/pr415-evidence-patch.yml
          git commit -m "test: align DateTimeOffset integration evidence with canonical wire"
          git push origin HEAD:feature/issue-396-deterministic-rpc-identity
