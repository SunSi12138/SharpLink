name: Issue 410 dynamic fixed window prototype

on:
  push:
    branches:
      - tmp/issue-410-dynamic-fixed-window-20260906

permissions:
  contents: read

concurrency:
  group: issue-410-dynamic-fixed-window
  cancel-in-progress: true

env:
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Record environment
        shell: bash
        run: |
          mkdir -p artifacts/issue410-dynamic-fixed/environment
          git rev-parse HEAD > artifacts/issue410-dynamic-fixed/environment/head-sha.txt
          git merge-base HEAD origin/dev > artifacts/issue410-dynamic-fixed/environment/base-sha.txt
          dotnet --info > artifacts/issue410-dynamic-fixed/environment/dotnet-info.txt
          lscpu > artifacts/issue410-dynamic-fixed/environment/cpu.txt

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Verify formatting
        run: dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Maintainability gate
        run: |
          python3 eng/test-verify-maintainability.py
          bash eng/check-maintainability.sh

      - name: Build Release
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Unit tests including Dynamic FixedWindow prototype
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Direct FixedWindow hot-path benchmark
        run: |
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-build -- \
            --filter '*DynamicFixedWindowPrototypeBenchmarks*' \
            --launchCount 1 --warmupCount 3 --iterationCount 10 \
            --artifacts artifacts/issue410-dynamic-fixed/hotpath

      - name: FixedWindow update-control benchmark
        run: |
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-build -- \
            --filter '*DynamicFixedWindowUpdatePrototypeBenchmarks*' \
            --launchCount 1 --warmupCount 3 --iterationCount 10 \
            --artifacts artifacts/issue410-dynamic-fixed/update

      - name: Record prototype diff
        if: always()
        shell: bash
        run: |
          base="$(git merge-base HEAD origin/dev)"
          git diff "$base"...HEAD -- \
            src/SharpLink.Server/Admission/DynamicFixedWindowRateLimiter.cs \
            test/SharpLink.UnitTests/Server/DynamicFixedWindowRateLimiterPrototypeTests.cs \
            test/SharpLink.Benchmarks/DynamicFixedWindowPrototypeBenchmarks.cs \
            > artifacts/issue410-dynamic-fixed/prototype.patch
          git diff --stat "$base"...HEAD > artifacts/issue410-dynamic-fixed/prototype-stat.txt

      - name: Upload prototype evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-410-dynamic-fixed-window-${{ github.sha }}
          path: artifacts/issue410-dynamic-fixed
          if-no-files-found: warn
          retention-days: 30
