name: Issue 775 Exact-Source Allocation and Optional OneWay Evidence

permissions:
  contents: read

on:
  push:
    branches: ["validation/775-exact-3aedcfc"]
  workflow_dispatch:

concurrency:
  group: issue775-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  allocation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3aedcfc71e85a43fa71a266b7fd0e6d18939d4ff

      - name: Verify exact issue 775 source and canonical workflow bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3aedcfc71e85a43fa71a266b7fd0e6d18939d4ff"
          test -z "$(git status --porcelain)"
          python3 - <<'CANONICAL_SHA256'
          import hashlib, subprocess
          expected = {'.github/workflows/pr-quick.yml': '147e80457dbb7d521264521cfbe2e4dd048663276e6cf80a0b9e8c994e8d39fc', '.github/workflows/pr-extended.yml': '2490d2239113a02cd0ed8da45d63b9eacffa573f7f13ec6e62f7552bec271d35', '.github/workflows/codec-compatibility.yml': '750d773a930f4357314700e17bda0df78894bc372aeb9bec606694b01d67cec4', '.github/workflows/pr-fast.yml': '5908d85ddc3f233a54f7f57d4f2266f6d1ed7c7665885d7b2a15eeefc5492cca'}
          for path, expected_digest in expected.items():
              blob = subprocess.check_output(["git", "show", "HEAD:" + path])
              actual_digest = hashlib.sha256(blob).hexdigest()
              if actual_digest != expected_digest:
                  raise SystemExit(f"{path}: canonical blob SHA256 mismatch: {actual_digest}")
              print(f"{path}: canonical blob SHA256 OK")
          CANONICAL_SHA256
          printf 'source_sha=%s\nvalidation_event_sha=%s\nworkflow_ref=%s\n' "3aedcfc71e85a43fa71a266b7fd0e6d18939d4ff" "$GITHUB_SHA" "$GITHUB_WORKFLOW_REF"

      - name: Record exact allocation artifact provenance
        shell: bash
        run: |
          mkdir -p artifacts/perf/allocation-gate
          printf 'source_sha=%s\nvalidation_event_sha=%s\n' "3aedcfc71e85a43fa71a266b7fd0e6d18939d4ff" "$GITHUB_SHA" > artifacts/perf/allocation-gate/source-provenance.txt

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Deterministic managed-allocation gate
        uses: ./.github/actions/allocation-gate
        with:
          artifact-directory: artifacts/perf/allocation-gate
          negative-control: 'true'

      - name: Upload allocation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allocation-gate-${{ github.sha }}
          path: artifacts/perf/allocation-gate
          if-no-files-found: error
          retention-days: 30

  oneway-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_SHA: eb99fe887cf2129d9b88441245ca0a4a6406b6c2
      PRODUCTION_SHA: 3aedcfc71e85a43fa71a266b7fd0e6d18939d4ff
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3aedcfc71e85a43fa71a266b7fd0e6d18939d4ff

      - name: Verify exact issue 775 source and canonical workflow bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3aedcfc71e85a43fa71a266b7fd0e6d18939d4ff"
          test -z "$(git status --porcelain)"
          python3 - <<'CANONICAL_SHA256'
          import hashlib, subprocess
          expected = {'.github/workflows/pr-quick.yml': '147e80457dbb7d521264521cfbe2e4dd048663276e6cf80a0b9e8c994e8d39fc', '.github/workflows/pr-extended.yml': '2490d2239113a02cd0ed8da45d63b9eacffa573f7f13ec6e62f7552bec271d35', '.github/workflows/codec-compatibility.yml': '750d773a930f4357314700e17bda0df78894bc372aeb9bec606694b01d67cec4', '.github/workflows/pr-fast.yml': '5908d85ddc3f233a54f7f57d4f2266f6d1ed7c7665885d7b2a15eeefc5492cca'}
          for path, expected_digest in expected.items():
              blob = subprocess.check_output(["git", "show", "HEAD:" + path])
              actual_digest = hashlib.sha256(blob).hexdigest()
              if actual_digest != expected_digest:
                  raise SystemExit(f"{path}: canonical blob SHA256 mismatch: {actual_digest}")
              print(f"{path}: canonical blob SHA256 OK")
          CANONICAL_SHA256
          printf 'source_sha=%s\nvalidation_event_sha=%s\nworkflow_ref=%s\n' "3aedcfc71e85a43fa71a266b7fd0e6d18939d4ff" "$GITHUB_SHA" "$GITHUB_WORKFLOW_REF"

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Prepare exact revisions and record machine
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/artifacts/validation/issue775-oneway"
          mkdir -p "$output"
          git fetch --no-tags origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/issue775-oneway-base" "$BASE_SHA"
          test "$(git -C "$RUNNER_TEMP/issue775-oneway-base" rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git -C "$RUNNER_TEMP/issue775-oneway-base" status --porcelain)"
          git diff --exit-code "$BASE_SHA" "$PRODUCTION_SHA" -- \
            test/SharpLink.Benchmarks eng/perf eng/run-generated-abi-performance-evidence.sh
          printf 'base_sha=%s\nproduction_sha=%s\nvalidation_event_sha=%s\nworkflow_ref=%s\n' \
            "$BASE_SHA" "$PRODUCTION_SHA" "$GITHUB_SHA" "$GITHUB_WORKFLOW_REF" > "$output/provenance.txt"
          dotnet --info > "$output/dotnet-info.txt"
          uname -a > "$output/uname.txt"
          lscpu > "$output/cpu.txt"
          cpu_list="$(python3 -c 'import os; cpus=sorted(os.sched_getaffinity(0))[:2]; print(",".join(str(cpu) for cpu in cpus))')"
          cpu_count="$(python3 -c 'import os; print(min(2,len(os.sched_getaffinity(0))))')"
          echo "ISSUE775_CPU_LIST=$cpu_list" >> "$GITHUB_ENV"
          echo "DOTNET_PROCESSOR_COUNT=$cpu_count" >> "$GITHUB_ENV"
          printf 'cpu_affinity=%s\nDOTNET_PROCESSOR_COUNT=%s\n' "$cpu_list" "$cpu_count" >> "$output/provenance.txt"

      - name: Build both exact benchmark revisions
        shell: bash
        run: |
          set -euo pipefail
          for label in base head; do
            root="$GITHUB_WORKSPACE"
            sha="$PRODUCTION_SHA"
            if [[ "$label" == base ]]; then root="$RUNNER_TEMP/issue775-oneway-base"; sha="$BASE_SHA"; fi
            output="$GITHUB_WORKSPACE/artifacts/validation/issue775-oneway/$label"
            mkdir -p "$output"
            (
              cd "$root"
              test "$(git rev-parse HEAD)" = "$sha"
              test -z "$(git status --porcelain)"
              printf 'commit=%s\n' "$sha" > "$output/build-commit.txt"
              printf '%s\n' 'dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj' \
                'dotnet build test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-restore -m:1 /nodeReuse:false -v minimal' > "$output/build-commands.txt"
              dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj 2>&1 | tee "$output/restore.log"
              dotnet build test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-restore -m:1 /nodeReuse:false -v minimal 2>&1 | tee "$output/build.log"
              sha256sum test/SharpLink.Benchmarks/UnaryBenchmarks.cs \
                test/SharpLink.Benchmarks/BenchmarkEnvironment.cs \
                test/SharpLink.Benchmarks/bin/Release/net10.0/SharpLink.Benchmarks.dll > "$output/input-output-sha256.txt"
            )
          done

      - name: Measure bounded canonical-batch OneWay send path on both revisions
        shell: bash
        run: |
          set -euo pipefail
          for label in base head; do
            root="$GITHUB_WORKSPACE"
            sha="$PRODUCTION_SHA"
            if [[ "$label" == base ]]; then root="$RUNNER_TEMP/issue775-oneway-base"; sha="$BASE_SHA"; fi
            output="$GITHUB_WORKSPACE/artifacts/validation/issue775-oneway/$label"
            (
              cd "$root"
              export SHARPLINK_BENCHMARK_SHA="$sha"
              command=(timeout 600s taskset -c "$ISSUE775_CPU_LIST" dotnet run
                --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
                -c Release --no-build --no-restore --
                --filter '*UnaryBenchmarks.Rpc_OnewayPublish*'
                --launchCount 3 --warmupCount 6 --iterationCount 15 --invocationCount 4096
                --exporters json --artifacts "$output/bdn" --keepFiles --buildTimeout 300)
              printf '%q ' "${command[@]}" > "$output/measurement-command.txt"
              printf '\n' >> "$output/measurement-command.txt"
              set +e
              "${command[@]}" 2>&1 | tee "$output/benchmark.log"
              status=${PIPESTATUS[0]}
              set -e
              printf '%s\n' "$status" > "$output/process-exit-code.txt"
              # Check both sides even when the first fails. The following step
              # rejects nonzero exits, empty/partial exports, and zero execution.
            )
          done

      - name: Require completed OneWay measurements, including both parameter rows
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math, os
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'artifacts/validation/issue775-oneway'
          summary=[]
          for label in ('base','head'):
              d=root/label
              if (d/'process-exit-code.txt').read_text().strip() != '0':
                  raise SystemExit(f'{label}: benchmark process failed or timed out')
              reports=list((d/'bdn/results').glob('*UnaryBenchmarks-report-full*.json'))
              if len(reports)!=1:
                  raise SystemExit(f'{label}: expected exactly one full JSON report, got {len(reports)}')
              data=json.loads(reports[0].read_text())
              rows=[r for r in data.get('Benchmarks',[]) if r.get('Method')=='Rpc_OnewayPublish']
              if {r.get('Parameters') for r in rows}!={'PayloadSize=16','PayloadSize=256'} or len(rows)!=2:
                  raise SystemExit(f'{label}: missing or duplicate OneWay parameter rows')
              for row in rows:
                  stats=row.get('Statistics') or {}; memory=row.get('Memory') or {}
                  measurements=row.get('Measurements') or []
                  finite=lambda x:isinstance(x,(int,float)) and not isinstance(x,bool) and math.isfinite(x)
                  if not finite(stats.get('Mean')) or stats['Mean']<=0 or not finite(stats.get('N')) or stats['N']<=0:
                      raise SystemExit(f'{label}: missing completed timing samples')
                  if not finite(memory.get('BytesAllocatedPerOperation')) or memory['BytesAllocatedPerOperation']<0 or memory.get('TotalOperations',0)<=0:
                      raise SystemExit(f'{label}: missing allocation/operation evidence')
                  if not measurements:
                      raise SystemExit(f'{label}: zero raw measurements (exit zero is not success)')
                  summary.append({'revision':label,'parameters':row['Parameters'],'meanNs':stats['Mean'],'sampleCount':stats['N'],'allocationBPerOp':memory['BytesAllocatedPerOperation'],'statistics':stats})
          (root/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload raw OneWay evidence and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue775-oneway-3aedcfc71e85a43fa71a266b7fd0e6d18939d4ff-${{ github.run_attempt }}
          path: artifacts/validation/issue775-oneway
          if-no-files-found: error
          retention-days: 30
