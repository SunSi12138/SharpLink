name: Issue 438 Allocation Baseline

on:
  push:
    branches:
      - tmp/issue-438-allocation-baseline

permissions:
  contents: read

jobs:
  allocation-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout dev control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d86458ec2adcbb151d493c91c55aaa4668344b99

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Deterministic managed-allocation gate
        uses: ./.github/actions/allocation-gate
        with:
          artifact-directory: artifacts/perf/allocation-gate
          negative-control: 'true'

      - name: Upload allocation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-438-allocation-baseline
          path: artifacts/perf/allocation-gate
          if-no-files-found: error
          retention-days: 30
