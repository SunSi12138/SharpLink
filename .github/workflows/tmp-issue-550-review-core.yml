name: Temporary Issue 550 Review Core

permissions:
  contents: read

on:
  push:
    branches:
      - tmp/issue-550-validation-gpt

concurrency:
  group: tmp-issue-550-review-core
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout control branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply review follow-up on latest dev
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import textwrap
          text = Path('.github/workflows/tmp-issue-550-runner.yml').read_text()
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n\n      - name: Setup .NET CI environment"
          if start not in text or end not in text:
              raise SystemExit('review follow-up script markers not found')
          body = text.split(start, 1)[1].split(end, 1)[0]
          Path('/tmp/apply_issue_550_review.py').write_text(textwrap.dedent(body) + '\n')
          PYTHON
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin dev fix/issue-550-dynamic-compression-policy
          git checkout -B issue-550-review origin/fix/issue-550-dynamic-compression-policy
          git rebase origin/dev
          python3 /tmp/apply_issue_550_review.py
          python3 - <<'PYTHON'
          from pathlib import Path

          client_path = Path('src/SharpLink.Client/SharpClientBuilder.cs')
          client = client_path.read_text()
          client = client.replace('public class SharpClientBuilder\n{', 'public partial class SharpClientBuilder\n{', 1)
          client = client.replace(
              '    private SharpLinkCompressionSendPolicy _requestCompressionPolicy = new();\n'
              '    private Func<CancellationToken, ValueTask>? _beforeReadyPublicationTestHook;\n',
              '', 1)
          client_block = '''    /// <summary>Configures the initial Client Request compression send policy.</summary>\n    public SharpClientBuilder UseRequestCompressionPolicy(SharpLinkCompressionSendPolicy policy)\n    {\n        Configure(() =>\n        {\n            ArgumentNullException.ThrowIfNull(policy);\n            _ = CompressionSendPolicySnapshot.CreateValidated(policy);\n            _requestCompressionPolicy = policy;\n        });\n        return this;\n    }\n\n    internal SharpClientBuilder UseBeforeReadyPublicationTestHook(Func<CancellationToken, ValueTask> hook)\n    {\n        Configure(() => _beforeReadyPublicationTestHook = hook ?? throw new ArgumentNullException(nameof(hook)));\n        return this;\n    }\n\n'''
          runtime_block = '''    /// <summary>Configures instance-scoped runtime behavior.</summary>\n    public SharpClientBuilder UseRuntime(Action<SharpLinkRuntimeOptions> configure)\n    {\n        _runtimeContextBuilder.Configure(configure);\n        return this;\n    }\n\n'''
          if client_block not in client or runtime_block not in client:
              raise SystemExit('client builder split block missing')
          client_path.write_text(client.replace(client_block, '', 1).replace(runtime_block, '', 1))
          Path('src/SharpLink.Client/SharpClientBuilder.Compression.cs').write_text('''namespace SharpLink.Client;\n\npublic partial class SharpClientBuilder\n{\n    private SharpLinkCompressionSendPolicy _requestCompressionPolicy = new();\n    private Func<CancellationToken, ValueTask>? _beforeReadyPublicationTestHook;\n\n    /// <summary>Configures instance-scoped runtime capability and behavior.</summary>\n    public SharpClientBuilder UseRuntime(Action<SharpLinkRuntimeOptions> configure)\n    {\n        _runtimeContextBuilder.Configure(configure);\n        return this;\n    }\n\n    /// <summary>Configures the initial Client Request compression send policy.</summary>\n    public SharpClientBuilder UseRequestCompressionPolicy(SharpLinkCompressionSendPolicy policy)\n    {\n        Configure(() =>\n        {\n            ArgumentNullException.ThrowIfNull(policy);\n            _ = CompressionSendPolicySnapshot.CreateValidated(policy);\n            _requestCompressionPolicy = policy;\n        });\n        return this;\n    }\n\n    internal SharpClientBuilder UseBeforeReadyPublicationTestHook(Func<CancellationToken, ValueTask> hook)\n    {\n        Configure(() => _beforeReadyPublicationTestHook = hook ?? throw new ArgumentNullException(nameof(hook)));\n        return this;\n    }\n}\n''')

          server_path = Path('src/SharpLink.Server/SharpLinkServerBuilder.cs')
          server = server_path.read_text()
          server = server.replace('public class SharpLinkServerBuilder : ISharpLinkServerBuilder\n{', 'public partial class SharpLinkServerBuilder : ISharpLinkServerBuilder\n{', 1)
          server = server.replace('    private SharpLinkCompressionSendPolicy _responseCompressionPolicy = new();\n', '', 1)
          server_block = '''    /// <summary>Configures the initial Server Response compression send policy.</summary>\n    public SharpLinkServerBuilder UseResponseCompressionPolicy(SharpLinkCompressionSendPolicy policy)\n    {\n        Configure(() =>\n        {\n            ArgumentNullException.ThrowIfNull(policy);\n            _ = CompressionSendPolicySnapshot.CreateValidated(policy);\n            _responseCompressionPolicy = policy;\n        });\n        return this;\n    }\n\n'''
          if server_block not in server:
              raise SystemExit('server compression builder block missing')
          server_path.write_text(server.replace(server_block, '', 1))
          Path('src/SharpLink.Server/SharpLinkServerBuilder.Compression.cs').write_text('''namespace SharpLink.Server;\n\npublic partial class SharpLinkServerBuilder\n{\n    private SharpLinkCompressionSendPolicy _responseCompressionPolicy = new();\n\n    /// <summary>Configures the initial Server Response compression send policy.</summary>\n    public SharpLinkServerBuilder UseResponseCompressionPolicy(SharpLinkCompressionSendPolicy policy)\n    {\n        Configure(() =>\n        {\n            ArgumentNullException.ThrowIfNull(policy);\n            _ = CompressionSendPolicySnapshot.CreateValidated(policy);\n            _responseCompressionPolicy = policy;\n        });\n        return this;\n    }\n}\n''')
          PYTHON

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Restore and format
        shell: bash
        run: |
          dotnet restore Sharplink.slnx
          dotnet format whitespace Sharplink.slnx --no-restore --verbosity minimal

      - name: Quality gates
        shell: bash
        run: |
          python3 eng/check-project-reference-boundaries.py
          python3 eng/test-verify-maintainability.py
          bash eng/check-maintainability.sh

      - name: Build Release
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Integration Tests
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.IntegrationTests
          --
          --maximum-parallel-tests 1
          --timeout 120s

      - name: Diff check
        shell: bash
        run: |
          git diff --check
          git status --short
