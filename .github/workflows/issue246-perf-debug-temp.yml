name: Issue 246 Perf Harness Debug (temporary)

permissions:
  contents: read

on:
  pull_request:
    branches: [dev]

jobs:
  debug:
    if: github.event.pull_request.number == 257
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Extract and build harness visibly
        shell: bash
        run: |
          set -euo pipefail
          mkdir harness
          python3 - <<'PY'
          import re, textwrap
          from pathlib import Path
          src=Path('head/.github/workflows/issue246-perf-temp.yml').read_text()
          for name in ('Issue246Perf.csproj','Program.cs'):
              m=re.search(rf"cat > harness/{re.escape(name)} <<'EOF'\n(.*?)\n          EOF",src,re.S)
              if not m: raise SystemExit(f'cannot extract {name}')
              Path('harness',name).write_text(textwrap.dedent(m.group(1)))
          PY
          for v in base head; do
            mkdir -p "$v/artifacts/issue246-perf"
            cp harness/* "$v/artifacts/issue246-perf/"
            echo "===== BUILD $v ====="
            dotnet restore "$v/artifacts/issue246-perf/Issue246Perf.csproj"
            dotnet build "$v/artifacts/issue246-perf/Issue246Perf.csproj" -c Release --no-restore -v minimal
          done
