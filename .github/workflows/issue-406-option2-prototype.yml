name: Issue 406 semantic option 2 prototype

on:
  push:
    branches:
      - tmp/issue-406-semantic-option2

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
      - name: Apply real source prototype in runner workspace
        run: |
          python3 eng/tmp-issue-406-option2.py
          python3 eng/tmp-issue-406-option2-fix.py
          git diff --check
          git status --short
          git diff --stat
      - name: Restore
        run: dotnet restore Sharplink.slnx
      - name: Build Release
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal
      - name: Full integration characterization
        continue-on-error: true
        run: dotnet test --project test/SharpLink.IntegrationTests/SharpLink.IntegrationTests.csproj -c Release --no-build
      - name: Unit tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build
      - name: NativeAOT transport and topology smoke
        env:
          SHARPLINK_AOT_RID: linux-x64
        run: ./eng/run-shared-memory-aot-process-smoke.sh
