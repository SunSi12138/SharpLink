name: Issue 287 full unit diagnostics

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  full-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-287-call-control-cleanup
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Apply current issue patch
        run: bash .github/issue-287-apply-current.sh
      - name: Restore
        run: dotnet restore Sharplink.slnx
      - name: Build
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal
      - name: Full Unit serial
        run: >-
          timeout 9m dotnet test
          --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj
          --no-build -c Release --
          --maximum-parallel-tests 1
          --output Detailed
      - name: Full Unit default parallelism
        run: >-
          timeout 9m dotnet test
          --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj
          --no-build -c Release --
          --output Detailed
