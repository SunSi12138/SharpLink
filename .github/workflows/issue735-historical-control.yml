name: Issue735 Historical Unchanged Control Matrix

on:
  push:
    branches: ['research/735-production-architecture-20261012-f8ba891']
    paths:
      - '.github/workflows/issue735-historical-control.yml'
      - 'eng/issue735/historical_control_matrix.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-control-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      TUNIT_MAX_PARALLEL_TESTS: '8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-dotnet
      - name: Fixed H/G and G/H full suites without retries
        run: python3 eng/issue735/historical_control_matrix.py --repo "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/artifacts/issue735/historical-control" --scratch "$RUNNER_TEMP/issue735-historical-control"
      - name: Preserve the entire matrix including every failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue735-historical-control-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: artifacts/issue735/historical-control
          if-no-files-found: error
          retention-days: 30
