name: PR415 Review Runner
on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/pr415-review-run.yml
      - .github/workflows/pr415-review-scan.yml
permissions:
  contents: write
jobs:
  run-review-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Execute validated patch script
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/SharpLink.Generator/RpcGenerator.CodecIdentity.cs')
          text = p.read_text()
          replacement = '''        private string GetFixedMemberSemanticIdentity(GeneratedMemberModel member)
          {
              var typeName = member.FixedTypeName ?? member.TypeName;
              if (string.Equals(typeName, "System.DateTimeOffset", StringComparison.Ordinal) ||
                  string.Equals(typeName, "global::System.DateTimeOffset", StringComparison.Ordinal))
              {
                  return "datetime-offset/dto-offset-minutes-i16le-padding6-utc-ticks-i64le/v1";
              }

              if (member.EnumUnderlyingType is not null &&
                  TryResolveReachableType(member.TypeName, out var fixedMemberType) &&
                  fixedMemberType is INamedTypeSymbol { TypeKind: TypeKind.Enum } enumType)
              {
                  return string.Join(
                      ":",
                      "fixed/v1",
                      member.FixedSize.ToString(InvariantCulture),
                      GetEnumDeclarationSemanticIdentity(enumType));
              }

              return string.Join(
                  ":",
                  "fixed/v1",
                  member.FixedSize.ToString(InvariantCulture),
                  member.EnumUnderlyingType ?? typeName);
          }

          private static string GetEnumDeclarationSemanticIdentity(INamedTypeSymbol enumType)
          {
              var parts = new List<string>
              {
                  "enum-declaration/v1",
                  enumType.ToDisplayString(SymbolDisplayFormat.FullyQualifiedFormat),
                  enumType.EnumUnderlyingType!.ToDisplayString(SymbolDisplayFormat.FullyQualifiedFormat)
              };
              foreach (var field in enumType.GetMembers()
                           .OfType<IFieldSymbol>()
                           .Where(static field => field.HasConstantValue)
                           .OrderBy(static field => field.Name, StringComparer.Ordinal))
              {
                  parts.Add(field.Name + "=" + Convert.ToString(field.ConstantValue, InvariantCulture));
              }
              return string.Join("|", parts);
          }

'''
          pattern = r'        private static string GetFixedMemberSemanticIdentity\(GeneratedMemberModel member\)\n        \{.*?\n        \}\n\n(?=        private bool TryGetFrameworkPrimitiveCodecHash)'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'fixed-member regex count={count}')
          old = '''                hash = Hashing.GetSemanticHash(
                      "codec/v1",
                      "enum",
                      GetFinalCodecHash(enumUnderlying, cache, stack).ToHex());'''
          new = '''                hash = Hashing.GetSemanticHash(
                      "codec/v1",
                      "enum",
                      GetFinalCodecHash(enumUnderlying, cache, stack).ToHex(),
                      GetEnumDeclarationSemanticIdentity((INamedTypeSymbol)type));'''
          if text.count(old) != 1:
              raise SystemExit(f'direct enum marker count={text.count(old)}')
          p.write_text(text.replace(old, new))

          Path('test/SharpLink.UnitTests/Protocol/ProtocolV2WireGenerationBoundaryTests.cs').write_text(r'''namespace SharpLink.UnitTests.Protocol;

public class ProtocolV2WireGenerationBoundaryTests
{
    [Test]
    public void PreviousMinorShouldBeRejectedDuringHandshake()
    {
        Ensure(
            ProtocolV2Constants.MinimumCompatibleMinorVersion == ProtocolV2Constants.MinorVersion,
            "the intentional DTO wire break must advance the current minor and compatibility floor together");
        var previousMinor = checked((ushort)(ProtocolV2Constants.MinimumCompatibleMinorVersion - 1));
        var policy = ProtocolV2Negotiator.CreateImplementedPolicy(
            SharpLinkProtocolOptions.MinMaxFramePayloadBytes,
            1024,
            2048,
            Array.Empty<SharpLinkCompressionProviderBinding>());
        var offer = ProtocolV2Negotiator.CreateClientOffer(
            policy,
            ProtocolV2Capabilities.None,
            ReadOnlyMemory<byte>.Empty);

        var serverFailure = Capture(() => ProtocolV2Negotiator.NegotiateServer(
            offer with { MinorVersion = previousMinor },
            policy));
        Ensure(
            serverFailure.Code == SharpLinkErrorCode.Unimplemented,
            "the server must reject a previous wire-generation offer during handshake");

        var response = new ProtocolV2HandshakeResponse(
            offer.MinorVersion,
            ProtocolV2Capabilities.None,
            offer.MaxFramePayloadBytes,
            offer.StreamReceiveWindowBytes,
            offer.ConnectionReceiveWindowBytes);
        var clientFailure = Capture(() => ProtocolV2Negotiator.ValidateServerResponse(
            offer,
            response with { MinorVersion = previousMinor },
            policy));
        Ensure(
            clientFailure.Code == SharpLinkErrorCode.Unimplemented,
            "the client must reject a previous wire-generation response during handshake");
    }

    private static SharpLinkException Capture(Action action)
    {
        try
        {
            action();
        }
        catch (SharpLinkException exception)
        {
            return exception;
        }
        throw new InvalidOperationException("Expected SharpLinkException.");
    }

    private static void Ensure(bool condition, string message)
    {
        if (!condition)
            throw new InvalidOperationException(message);
    }
}
''')

          script = Path('.github/workflows/pr415-review-scan.yml').read_text()
          marker = re.search(r'^        run: \|\n(?P<body>.*)\Z', script, flags=re.M | re.S)
          if marker is None:
              raise SystemExit('cannot extract source run block')
          body = marker.group('body')
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'
          body, count = re.subn(
              r'\n# Enum semantic identity:.*?\n# Release-scoped',
              '\n# Release-scoped',
              body,
              count=1,
              flags=re.S)
          if count != 1:
              raise SystemExit(f'cannot remove source enum block count={count}')
          Path('/tmp/pr415-review.sh').write_text(body)
          PY
          bash /tmp/pr415-review.sh
