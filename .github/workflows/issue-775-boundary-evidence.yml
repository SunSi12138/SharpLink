name: Issue 775 fixed boundary candidate evidence
on:
  push:
    branches: [prototype/775-static-session-binding]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  evidence:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[issue775-paired]')
    strategy:
      fail-fast: false
      matrix:
        comparison: [original-dev, old-static]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4e16bf4c7ae18edf206f3e9bf1eb369c549f860e
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.comparison == 'original-dev' && '1a54993d3550911f5979a7b4d3f9f5f63ee86a64' || 'a473f5d3a50d3b23874f8b1bb72f46e65ff939d1' }}
          path: comparator
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: candidate/global.json
      - name: Verify reader and no diagnostic environment
        run: |
          python3 -m unittest discover -s driver/eng/issue775 -p test_attribution.py -v
          python3 - <<'PY'
          import os
          assert not any(k.startswith(('DOTNET_', 'COMPlus_', 'CORECLR_', 'COR_')) and any(s in k.lower() for s in ('jit','tier','profiler','processor_count')) for k in os.environ)
          PY
      - name: Original dev acceptance experiment with unchanged runner
        if: matrix.comparison == 'original-dev'
        run: |
          python3 candidate/eng/issue775/run.py --base-root comparator --head-root candidate \
            --expected-head 4e16bf4c7ae18edf206f3e9bf1eb369c549f860e --output evidence
      - name: Old static candidate comparison without baseline substitution
        if: matrix.comparison == 'old-static'
        run: |
          python3 driver/eng/issue775/boundary_pair.py --old comparator --candidate candidate --output evidence
      - name: Preserve source identity and all results
        if: always()
        run: |
          mkdir -p evidence
          git -C driver rev-parse HEAD > evidence/driver-sha.txt
          git -C candidate archive HEAD | gzip > evidence/candidate-source.tar.gz
          if test -f evidence/summary.md; then cat evidence/summary.md | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if test -f evidence/execution-failures.json; then cat evidence/execution-failures.json; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue775-boundary-${{ matrix.comparison }}-4e16bf4c-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
