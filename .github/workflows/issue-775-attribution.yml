name: Issue 775 static path attribution
on:
  push:
    branches: [prototype/775-static-session-binding]
  workflow_dispatch:
    inputs:
      profiles_only:
        description: Run only the separate diagnostic job; never repeat timing to select samples
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  attribution:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[issue775-attribution]') ||
      contains(github.event.head_commit.message, '[issue775-profiles]')
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON((inputs.profiles_only || contains(github.event.head_commit.message, '[issue775-profiles]')) && '["profiles"]' || '["timing","profiles"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Verify diagnostic reader and unchanged project boundaries
        run: |
          python3 -m unittest discover -s eng/issue775 -p test_attribution.py -v
          python3 eng/check-project-reference-boundaries.py
      - name: Create isolated fixed-source checkouts
        run: |
          mkdir -p "$RUNNER_TEMP/issue775-attribution"
          git worktree add --detach "$RUNNER_TEMP/issue775-attribution/A" 1a54993d3550911f5979a7b4d3f9f5f63ee86a64
          git worktree add --detach "$RUNNER_TEMP/issue775-attribution/B" d2cb248b5e4b573d448092f7f152c2f2dd281e30
          git worktree add --detach "$RUNNER_TEMP/issue775-attribution/C" d2cb248b5e4b573d448092f7f152c2f2dd281e30
      - name: Execute predeclared attribution plan
        run: |
          python3 eng/issue775/attribution.py --driver "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/issue775-attribution" \
            --mode '${{ matrix.mode }}' --output "$GITHUB_WORKSPACE/attribution-${{ matrix.mode }}"
      - name: Publish diagnosis without declaring performance acceptance
        if: always()
        run: |
          out="attribution-${{ matrix.mode }}"
          if test -f "$out/summary.md"; then cat "$out/summary.md" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if test -f "$out/execution-failures.json"; then cat "$out/execution-failures.json"; fi
          if test -f "$out/diagnostic-notes.json"; then cat "$out/diagnostic-notes.json" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue775-attribution-${{ matrix.mode }}-${{ github.sha }}
          path: |
            attribution-${{ matrix.mode }}/
            !attribution-${{ matrix.mode }}/tools/
          retention-days: 30
          if-no-files-found: error
