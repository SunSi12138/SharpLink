name: Issue 252 Churn Evidence

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      CANDIDATE_SHA: ${{ github.sha }}
      EVIDENCE_ROOT: ${{ github.workspace }}/artifacts/issue252-churn-evidence
      TMPDIR: ${{ runner.temp }}/issue252-gcdump-tmp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install heap snapshot tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          dotnet tool install --global dotnet-gcdump
          dotnet-gcdump --version

      - name: Prepare current dev baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          git fetch --no-tags origin dev
          BASE_SHA="$(git rev-parse origin/dev)"
          printf '%s\n' "$BASE_SHA" > "$EVIDENCE_ROOT/base-sha.txt"
          printf '%s\n' "$CANDIDATE_SHA" > "$EVIDENCE_ROOT/candidate-sha.txt"

          git worktree add --detach "$RUNNER_TEMP/issue252-base" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/issue252-candidate" "$CANDIDATE_SHA"

          cp "$RUNNER_TEMP/issue252-candidate/test/SharpLink.Benchmarks/PendingRequestSegmentationEvidenceRunner.cs" \
             "$RUNNER_TEMP/issue252-base/test/SharpLink.Benchmarks/PendingRequestSegmentationEvidenceRunner.cs"
          cp "$RUNNER_TEMP/issue252-candidate/test/SharpLink.Benchmarks/Program.cs" \
             "$RUNNER_TEMP/issue252-base/test/SharpLink.Benchmarks/Program.cs"

      - name: Collect fixed-environment benchmark evidence
        shell: bash
        run: |
          set -euo pipefail

          run_variant() {
            local name="$1"
            local root="$2"
            local out="$EVIDENCE_ROOT/$name"
            local project="$root/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj"
            mkdir -p "$out"

            echo "=== $name: build ==="
            dotnet build "$project" -c Release -v minimal
            dotnet --info > "$out/dotnet-info.txt"

            echo "=== $name: construction ==="
            dotnet run --project "$project" -c Release --no-build -- \
              --pending-request-segmentation-evidence construction --connections 1000 \
              | tee "$out/construction.jsonl"

            for active in 0 1 8; do
              echo "=== $name: fresh retained memory active=$active ==="
              dotnet run --project "$project" -c Release --no-build -- \
                --pending-request-segmentation-evidence memory --active "$active" --connections 1000 \
                | tee "$out/memory-active-$active.jsonl"
            done

            for active in 0 1; do
              echo "=== $name: full-cycle churn retained memory active=$active ==="
              dotnet run --project "$project" -c Release --no-build -- \
                --pending-request-segmentation-evidence churn-memory --active "$active" --connections 100 \
                | tee "$out/churn-memory-active-$active.jsonl"
            done

            echo "=== $name: sparse scan active=8 deadlines=2 ==="
            dotnet run --project "$project" -c Release --no-build -- \
              --pending-request-segmentation-evidence scan --active 8 --deadlines 2 --iterations 20000 \
              | tee "$out/scan-8-2.jsonl"

            echo "=== $name: post-churn sparse scan active=1 deadline=1 ==="
            dotnet run --project "$project" -c Release --no-build -- \
              --pending-request-segmentation-evidence churn-scan --active 1 --deadlines 1 --iterations 20000 \
              | tee "$out/churn-scan-1-1.jsonl"

            echo "=== $name: timer lateness ==="
            dotnet run --project "$project" -c Release --no-build -- \
              --pending-request-segmentation-evidence lateness --iterations 40 --deadline-ms 20 \
              | tee "$out/lateness.jsonl"

            echo "=== $name: post-churn timer lateness ==="
            dotnet run --project "$project" -c Release --no-build -- \
              --pending-request-segmentation-evidence churn-lateness --iterations 40 --deadline-ms 20 \
              | tee "$out/churn-lateness.jsonl"

            echo "=== $name: PendingRegisterAndComplete ==="
            (
              cd "$root"
              dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-build -- \
                --filter '*RuntimeHotPathBenchmarks.PendingRegisterAndComplete*' \
                --artifacts "$out/bdn" \
                --exporters json
            ) | tee "$out/pending-register-and-complete.log"
          }

          run_variant baseline "$RUNNER_TEMP/issue252-base"
          run_variant candidate "$RUNNER_TEMP/issue252-candidate"

      - name: Collect object-level GC heap snapshots
        shell: bash
        run: |
          set -euo pipefail

          snapshot() {
            local variant="$1"
            local root="$2"
            local active="$3"
            local churn="$4"
            local label="$variant-active$active-churn$churn"
            local out="$EVIDENCE_ROOT/heap/$label"
            local dll="$root/test/SharpLink.Benchmarks/bin/Release/net10.0/SharpLink.Benchmarks.dll"
            mkdir -p "$out"

            dotnet "$dll" --pending-request-segmentation-evidence heap-hold \
              --active "$active" --connections 100 --churn "$churn" --hold-seconds 120 \
              > "$out/process.jsonl" 2> "$out/process.err" &
            local pid=$!

            for attempt in $(seq 1 120); do
              if grep -q '"mode":"heap-hold"' "$out/process.jsonl"; then
                break
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "$out/process.err"
                exit 1
              fi
              sleep 1
            done

            grep '"mode":"heap-hold"' "$out/process.jsonl"
            dotnet-gcdump collect -p "$pid" -o "$out/heap.gcdump"
            dotnet-gcdump report "$out/heap.gcdump" > "$out/heapstat.txt"
            grep -E 'SharpLink\.Client\.PendingCall|SegmentedSlotTable' "$out/heapstat.txt" \
              | tee "$out/pending-slot-heapstat.txt" || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }

          snapshot baseline "$RUNNER_TEMP/issue252-base" 0 0
          snapshot candidate "$RUNNER_TEMP/issue252-candidate" 0 0
          snapshot candidate "$RUNNER_TEMP/issue252-candidate" 1 0
          snapshot candidate "$RUNNER_TEMP/issue252-candidate" 8 0
          snapshot candidate "$RUNNER_TEMP/issue252-candidate" 0 1
          snapshot candidate "$RUNNER_TEMP/issue252-candidate" 1 1

      - name: Upload issue 252 churn evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue252-churn-evidence-${{ github.event.pull_request.head.sha }}
          path: artifacts/issue252-churn-evidence
          if-no-files-found: error
          retention-days: 30
