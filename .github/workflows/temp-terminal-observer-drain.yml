name: Temporary terminal observer public control
on:
  push:
    branches: ['codex/temp-terminal-observer-baseline-20261115', 'codex/temp-terminal-observer-candidate-20261115']
permissions:
  contents: read
jobs:
  public-control:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      TUNIT_MAX_PARALLEL_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.115'
      - name: Record exact source, environment and frozen plan
        shell: bash
        run: |
          mkdir -p artifacts/terminal-observer-drain
          { git rev-parse HEAD; git log -1 --format=fuller; uname -a; dotnet --info; } > artifacts/terminal-observer-drain/environment.txt
          cp doc/terminal-observer-drain-validation.md artifacts/terminal-observer-drain/PLAN.md
      - name: Build real public RPC controls
        shell: bash
        run: dotnet build test/SharpLink.IntegrationTests/SharpLink.IntegrationTests.csproj -c Release -v minimal | tee artifacts/terminal-observer-drain/build.log
      - name: Run public TCP controls (baseline product failure is retained)
        shell: bash
        run: |
          set +e
          timeout 90s dotnet exec --fx-version 10.0.15 test/SharpLink.IntegrationTests/bin/Release/net10.0/SharpLink.IntegrationTests.dll --treenode-filter '/*/*/TerminalObserverDrainIntegrationTests/*' --output Detailed > artifacts/terminal-observer-drain/public.log 2>&1
          code=$?
          printf '%s\n' "$code" > artifacts/terminal-observer-drain/exit-code.txt
          cat artifacts/terminal-observer-drain/public.log
          exit "$code"
      - name: Retain raw evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: terminal-observer-public-${{ github.sha }}
          path: |
            artifacts/terminal-observer-drain/
            test/SharpLink.IntegrationTests/bin/Release/net10.0/TestResults/*report.html
          if-no-files-found: error
          retention-days: 14
