name: Issue 331 Perf Fix V3

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.ref == 'issue-331-dynamic-admission-update'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore exact single-slot hot path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs')
          text = p.read_text()

          old = '''    private readonly bool _tracksConcurrencyTargetVersion =\n        HasMultipleVersionedConcurrencySlots(slots, slotCount);\n'''
          new = '''    private readonly bool _tracksConcurrencyTargetVersion =\n        slotCount > 1 && HasMultipleVersionedConcurrencySlots(slots, slotCount);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'tracking init expected 1 match, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        // Preserve the allocation-free one-slot path while validating one request-visible epoch\n        // around the whole decision. The final version read is the linearization point: an update\n        // beginning afterward sees this permit as a legitimate pre-update holder.\n        if (slotCount == 1 && retainedLeases is null && suppliedLease is null)\n        {\n            while (true)\n            {\n                var targetVersion = _tracksConcurrencyTargetVersion\n                    ? owner.ReadStableConcurrencyTargetVersion()\n                    : 0;\n                var singleLease = slots[0].Limiter.AttemptAcquire(1);\n                if (_tracksConcurrencyTargetVersion &&\n                    !owner.IsConcurrencyTargetVersionCurrent(targetVersion))\n                {\n                    singleLease.Dispose();\n                    continue;\n                }\n\n                if (!singleLease.IsAcquired)\n                {\n                    singleLease.Dispose();\n                    admissionLease = null;\n                    failedSlot = slots[0];\n                    return false;\n                }\n\n                admissionLease = new AdmissionLease(\n                    owner,\n                    singleLease,\n                    Interlocked.Exchange(ref _partition, null));\n                failedSlot = default;\n                return true;\n            }\n        }\n'''
          new = '''        // A one-slot request cannot combine concurrency permits from different scopes, so keep\n        // the original hot path completely free of target-epoch bookkeeping. Multi-scope requests\n        // take the transaction-wide epoch path below.\n        if (slotCount == 1 && retainedLeases is null && suppliedLease is null)\n        {\n            var singleLease = slots[0].Limiter.AttemptAcquire(1);\n            if (!singleLease.IsAcquired)\n            {\n                singleLease.Dispose();\n                admissionLease = null;\n                failedSlot = slots[0];\n                return false;\n            }\n\n            admissionLease = new AdmissionLease(\n                owner,\n                singleLease,\n                Interlocked.Exchange(ref _partition, null));\n            failedSlot = default;\n            return true;\n        }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'single-slot block expected 1 match, found {text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          git diff --check
          git diff -- src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs

      - name: Validate formatting and full unit suite
        shell: bash
        run: |
          set -euxo pipefail
          dotnet restore Sharplink.slnx
          dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal
          dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release

      - name: Commit tested patch and remove helper
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue331-perf-fix-v3.yml
          git add src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs
          git diff --cached --check
          git commit -m 'Restore admission single-slot fast path'
          git push origin HEAD:issue-331-dynamic-admission-update
