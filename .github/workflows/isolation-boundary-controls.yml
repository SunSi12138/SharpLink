name: Sixteen isolation boundary controls

# Ordinary Unit graph, not all Unit bodies. No secrets, release, or raw artifacts.
permissions:
  contents: read
on:
  push:
    branches: ['wip/775-code-recovery-20261102']
    paths:
      - '.github/workflows/isolation-boundary-controls.yml'
      - 'eng/run-isolation-boundary-controls.py'
      - 'eng/retirement-results.py'
      - 'eng/isolation-boundary-controls.json'
      - 'eng/package-smoke-process.py'
      - 'eng/tests/test_retirement_results.py'
      - 'eng/tests/test_isolation_boundary_catalog.py'
      - 'src/**'
      - 'test/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
concurrency:
  group: isolation-boundary-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  selected-unit-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup repository SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build ordinary Unit and validate sixteen isolated actual UIDs
        run: python3 eng/run-isolation-boundary-controls.py
