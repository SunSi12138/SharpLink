name: Issue 322 Remove Use Allocation

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'issue-322-admission-program-generation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-322-admission-program-generation
          fetch-depth: 0

      - name: Apply zero-allocation ownership patch
        run: python eng/issue322-zeroalloc-patch.py

      - name: Commit patch and remove helpers
        run: |
          rm eng/issue322-zeroalloc-patch.py
          rm .github/workflows/issue-322-remove-use-allocation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/SharpLink.Server test/SharpLink.UnitTests/Server/SharpLinkServerInvocationTests.cs eng/issue322-zeroalloc-patch.py .github/workflows/issue-322-remove-use-allocation.yml
          git commit -m "perf(server): remove admission generation use allocation"
          git push origin HEAD:issue-322-admission-program-generation
