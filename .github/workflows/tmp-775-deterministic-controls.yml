name: Temporary 775 deterministic controls
on:
  push:
    branches: [codex/775-control-validate-20261113]
permissions:
  contents: read
jobs:
  functional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-dotnet
      - name: Record subject and unchanged ordinary-compilation evidence
        shell: pwsh
        run: |
          New-Item -Force -ItemType Directory artifacts/775-slice | Out-Null
          "subject=$env:GITHUB_SHA" | Set-Content artifacts/775-slice/subject.txt
          python eng/775-slice/verify-default-profile.py 2>&1 | Tee-Object artifacts/775-slice/default-evidence-status.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest eng/tests/test_admitted_dispatch_parity.py 2>&1 | Tee-Object artifacts/775-slice/source-parity.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Basic ordinary build without rerunning unchanged Unit failure
        shell: pwsh
        run: |
          dotnet build test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --disable-build-servers -m:1 -p:UseSharedCompilation=false -v:minimal 2>&1 | Tee-Object artifacts/775-slice/default-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build nonshipping scoped slice
        shell: pwsh
        run: |
          dotnet build eng/775-slice/Probe/SharpLink.BindingSlice.csproj -c Release -p:SharpLink775StaticSlice=true --disable-build-servers -m:1 -p:UseSharedCompilation=false -v:minimal 2>&1 | Tee-Object artifacts/775-slice/slice-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise frozen real TCP and SharedMemory controls
        shell: pwsh
        run: |
          foreach ($transport in @('tcp', 'sharedmemory')) {
            dotnet eng/775-slice/Probe/bin/Release/net10.0/SharpLink.BindingSlice.dll $transport 2>&1 | Tee-Object "artifacts/775-slice/$transport.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python eng/775-slice/verify.py artifacts/775-slice $env:GITHUB_SHA 2>&1 | Tee-Object artifacts/775-slice/validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain original evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deterministic-bind-${{ matrix.os }}-${{ github.run_attempt }}
          path: artifacts/775-slice
          if-no-files-found: error
          retention-days: 14

