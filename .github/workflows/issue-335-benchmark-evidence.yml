name: Issue 335 Comparable Partition Benchmark Evidence

on:
  push:
    branches:
      - evidence/issue-335-bdn-60b7206c

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Write shared partition benchmark
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/Issue335ComparablePartitionBenchmarks.cs" <<'CS'
          using System;
          using System.Threading;
          using System.Threading.Tasks;
          using BenchmarkDotNet.Attributes;
          using BenchmarkDotNet.Diagnosers;
          using BenchmarkDotNet.Engines;
          using SharpLink.Abstractions;
          using SharpLink.Server;

          namespace SharpLink.Benchmarks;

          [MemoryDiagnoser]
          [ThreadingDiagnoser]
          [SimpleJob(RunStrategy.Throughput, launchCount: 1, warmupCount: 3, iterationCount: 10)]
          public class Issue335ComparablePartitionBenchmarks
          {
              private static readonly Func<SharpLinkAdmissionContext, string?> Selector =
                  static context => context.ConnectionId;

              private SharpLinkAdmissionController _permit = null!;
              private SharpLinkAdmissionController _reject = null!;
              private SharpLinkAdmissionController _queue = null!;
              private AdmissionLease _rejectBlocker = null!;
              private SharpLinkAdmissionContext _hotContext = null!;

              [GlobalSetup]
              public async Task Setup()
              {
                  _hotContext = Context("hot-key");
                  _permit = CreatePartitionController(1024);
                  AcquireAndDispose(_permit, _hotContext);

                  _reject = CreatePartitionController(1);
                  _rejectBlocker = (await _reject.AcquireAsync(
                      _hotContext, 1, false, CancellationToken.None)).Lease!;

                  _queue = CreatePartitionController(1, queue: true);
              }

              [GlobalCleanup]
              public async Task Cleanup()
              {
                  _rejectBlocker.Dispose();
                  await _permit.DisposeAsync();
                  await _reject.DisposeAsync();
                  await _queue.DisposeAsync();
              }

              [Benchmark(Baseline = true)]
              public void ExistingPartitionKeyImmediatePermit()
                  => AcquireAndDispose(_permit, _hotContext);

              [Benchmark]
              public bool ExistingPartitionKeyImmediateReject()
                  => _reject.AcquireAsync(
                      _hotContext, 1, false, CancellationToken.None).Result.IsAcquired;

              [Benchmark(OperationsPerInvoke = 64)]
              public void NewPartitionKeyCreationBatch()
              {
                  var controller = CreatePartitionController(1);
                  try
                  {
                      for (var index = 0; index < 64; index++)
                          AcquireAndDispose(controller, Context($"new-key-{index}"));
                  }
                  finally
                  {
                      controller.DisposeAsync().AsTask().GetAwaiter().GetResult();
                  }
              }

              [Benchmark]
              public async ValueTask QueueAndReleaseOnPartitionLimiter()
              {
                  var blocker = (await _queue.AcquireAsync(
                      _hotContext, 1, true, CancellationToken.None)).Lease!;
                  var pending = _queue.AcquireAsync(
                      _hotContext, 1, true, CancellationToken.None);
                  blocker.Dispose();
                  var admitted = await pending.ConfigureAwait(false);
                  admitted.Lease!.Dispose();
              }

              private static SharpLinkAdmissionController CreatePartitionController(
                  int concurrency,
                  bool queue = false)
              {
                  var options = new SharpLinkAdmissionControlOptions();
                  options.UsePartition(Selector, partition =>
                  {
                      partition.MaxPartitions = 64;
                      partition.IdleTimeout = TimeSpan.FromHours(1);
                      partition.UseConcurrency(concurrency);
                  });
                  if (queue)
                  {
                      options.MaxQueuedCalls = 64;
                      options.MaxQueuedBytes = 64 * 1024;
                      options.MaxQueueDelay = TimeSpan.FromSeconds(5);
                  }
                  return SharpLinkAdmissionController.Create(options, []);
              }

              private static SharpLinkAdmissionContext Context(string connectionId)
                  => new(1, 2, RpcMethodKind.Unary, connectionId, null, null, null);

              private static void AcquireAndDispose(
                  SharpLinkAdmissionController controller,
                  SharpLinkAdmissionContext context)
              {
                  var decision = controller.AcquireAsync(
                      context, 1, false, CancellationToken.None).Result;
                  decision.Lease!.Dispose();
              }
          }
          CS

      - name: Benchmark reviewed base partition paths
        shell: bash
        run: |
          git checkout 46c1285d25b8445d26d050256e8ad590859b541b
          cp "$RUNNER_TEMP/Issue335ComparablePartitionBenchmarks.cs" test/SharpLink.Benchmarks/
          dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          mkdir -p "$RUNNER_TEMP/issue335-partition/base"
          dotnet run -c Release --no-restore --project test/SharpLink.Benchmarks -- \
            --filter '*Issue335ComparablePartitionBenchmarks*' \
            --artifacts "$RUNNER_TEMP/issue335-partition/base/artifacts" \
            | tee "$RUNNER_TEMP/issue335-partition/base/console.log"

      - name: Benchmark optimized exact head partition paths
        shell: bash
        run: |
          git clean -fdx
          git checkout b4b142a5afbcc13c54d60eb9c7f4c1acae2f4d6c
          cp "$RUNNER_TEMP/Issue335ComparablePartitionBenchmarks.cs" test/SharpLink.Benchmarks/
          dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          mkdir -p "$RUNNER_TEMP/issue335-partition/head"
          dotnet run -c Release --no-restore --project test/SharpLink.Benchmarks -- \
            --filter '*Issue335ComparablePartitionBenchmarks*' \
            --artifacts "$RUNNER_TEMP/issue335-partition/head/artifacts" \
            | tee "$RUNNER_TEMP/issue335-partition/head/console.log"

      - name: Record environment
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/issue335-partition/environment"
          dotnet --info > "$RUNNER_TEMP/issue335-partition/environment/dotnet-info.txt"
          uname -a > "$RUNNER_TEMP/issue335-partition/environment/uname.txt"
          lscpu > "$RUNNER_TEMP/issue335-partition/environment/cpu.txt"

      - name: Upload comparable partition evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-335-partition-comparable-b4b142a5
          path: ${{ runner.temp }}/issue335-partition
          if-no-files-found: error
          retention-days: 30
