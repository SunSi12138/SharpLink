name: Issue 410 generation-scoped prototype

on:
  push:
    branches:
      - tmp/issue-410-prototype-20260906

permissions:
  contents: read

jobs:
  prototype-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Apply generation-scoped rate prototype in workspace only
        shell: bash
        run: |
          python3 .github/issue410-prototype.py
          mkdir -p artifacts/issue410
          git diff --stat > artifacts/issue410/prototype-stat.txt
          git diff --numstat > artifacts/issue410/prototype-numstat.txt
          git diff -- \
            src/SharpLink.Server/Admission/AdmissionDynamicRateState.cs \
            src/SharpLink.Server/Admission/AdmissionLimiterState.cs \
            src/SharpLink.Server/Admission/AdmissionStateKernel.cs \
            > artifacts/issue410/prototype.patch
          {
            echo "migration symbols after prototype:"
            grep -R -n -E 'transitionDebt|AdmissionRateTransitionLineage|InitializeTransitionLocked|RecordLegacyGrantLocked' \
              src/SharpLink.Server/Admission || true
          } > artifacts/issue410/symbol-audit.txt

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Build Release
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Upload prototype evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-410-prototype-build-${{ github.sha }}
          path: artifacts/issue410
          if-no-files-found: warn
          retention-days: 14
