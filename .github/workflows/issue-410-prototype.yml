name: Issue 410 generation-scoped prototype

on:
  push:
    branches:
      - tmp/issue-410-prototype-20260906

permissions:
  contents: read

jobs:
  prototype-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Apply serious generation-scoped candidate in workspace only
        shell: bash
        run: |
          python3 .github/issue410-prototype.py
          set +e
          cleanup_output="$(python3 .github/issue410-cleanup.py 2>&1)"
          cleanup_status=$?
          set -e
          if [ "$cleanup_status" -ne 0 ]; then
            printf '%s\n' "$cleanup_output"
            if ! grep -Fq 'src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs: migration symbol remains: CommitTransitionTo' <<< "$cleanup_output"; then
              exit "$cleanup_status"
            fi
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs')
          text = path.read_text(encoding='utf-8')
          old_create = '                    createdRate = AdmissionRateState.Create(target, _timeProvider, source.Rate);\n'
          new_create = '                    createdRate = AdmissionRateState.Create(target, _timeProvider);\n'
          if text.count(old_create) != 1:
              raise RuntimeError(f'partition generation create: expected one match, found {text.count(old_create)}')
          text = text.replace(old_create, new_create, 1)
          start_marker = '        if (transition.Source.Rate is { } sourceRate &&\n'
          end_marker = '        if (transition.ResizePermitLimit is { } permitLimit)\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          mkdir -p artifacts/issue410
          git diff --stat > artifacts/issue410/candidate-stat.txt
          git diff --numstat > artifacts/issue410/candidate-numstat.txt
          git diff -- \
            src/SharpLink.Server/Admission/AdmissionDynamicRateState.cs \
            src/SharpLink.Server/Admission/AdmissionLimiterState.cs \
            src/SharpLink.Server/Admission/AdmissionStateKernel.cs \
            src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs \
            src/SharpLink.Server/SharpLinkServer.AdmissionProgram.cs \
            > artifacts/issue410/candidate.patch
          {
            echo "rate migration symbols after full candidate transform:"
            grep -R -n -E 'AdmissionRateTransitionLineage|AdmissionRateTransition|transitionDebt|TransitionDebt|transitionSource|RetainedLineageAnchor|RecordPublishedRateLineage|CommitTransitionTo|InitializeTransitionLocked|RecordLegacyGrantLocked' \
              src/SharpLink.Server/Admission \
              src/SharpLink.Server/SharpLinkServer.AdmissionProgram.cs || true
          } > artifacts/issue410/symbol-audit.txt
          if grep -q -E 'AdmissionRateTransitionLineage|AdmissionRateTransition|transitionDebt|TransitionDebt|transitionSource|RetainedLineageAnchor|RecordPublishedRateLineage|CommitTransitionTo|InitializeTransitionLocked|RecordLegacyGrantLocked' artifacts/issue410/symbol-audit.txt; then
            cat artifacts/issue410/symbol-audit.txt
            exit 1
          fi

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Build Release with unchanged baseline tests
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-410-clean-candidate-${{ github.sha }}
          path: artifacts/issue410
          if-no-files-found: warn
          retention-days: 14
