name: Issue 410 same-runner performance

on:
  push:
    branches:
      - tmp/issue-410-prototype-20260906

permissions:
  contents: read

concurrency:
  group: issue-410-performance
  cancel-in-progress: true

env:
  ISSUE410_BASE: 21fd5afbd192f0e200a8c749e53d98b1f525ee90
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  same-runner-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout temporary evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Save validation inputs outside worktree
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/issue410-input"
          perf="$RUNNER_TEMP/issue410-performance"
          rm -rf "$input" "$perf"
          mkdir -p "$input" "$perf/environment" "$perf/baseline" "$perf/candidate"
          cp .github/issue410-prototype.py "$input/"
          cp .github/issue410-cleanup.py "$input/"
          cp .github/issue410-partition.py "$input/"
          cp .github/issue410-benchmarks.cs "$input/Issue410Benchmarks.cs"
          printf '%s\n' "$ISSUE410_BASE" > "$perf/environment/base-sha.txt"
          printf '%s\n' "${{ github.sha }}" > "$perf/environment/evidence-sha.txt"

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Record runner environment
        shell: bash
        run: |
          set -euo pipefail
          perf="$RUNNER_TEMP/issue410-performance"
          dotnet --info > "$perf/environment/dotnet-info.txt"
          uname -a > "$perf/environment/uname.txt"
          lscpu > "$perf/environment/cpu.txt"

      - name: Checkout exact dev baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$ISSUE410_BASE"
          git checkout --detach --force "$ISSUE410_BASE"
          git clean -ffdx
          cp "$RUNNER_TEMP/issue410-input/Issue410Benchmarks.cs" test/SharpLink.Benchmarks/Issue410Benchmarks.cs

      - name: Build exact dev benchmark baseline
        run: |
          dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          dotnet build test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj --no-restore -c Release -v minimal

      - name: Run exact dev baseline matrix
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/issue410-performance/baseline"
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-build -- \
            --filter '*AdmissionFreshRateRpcBenchmarks*' --launchCount 1 --warmupCount 2 --iterationCount 5 --artifacts "$root/fresh-rate-rpc"
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-build -- \
            --filter '*AdmissionRateControllerBenchmarks*' --launchCount 1 --warmupCount 2 --iterationCount 5 --artifacts "$root/rate-controller"
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-build -- \
            --filter '*AdmissionRpcBenchmarks*' --launchCount 1 --warmupCount 2 --iterationCount 5 --artifacts "$root/admission-rpc"
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-build -- \
            --filter '*Issue410*' --artifacts "$root/issue410-extra"

      - name: Reset exact base and apply candidate in workspace only
        shell: bash
        run: |
          set -euo pipefail
          perf="$RUNNER_TEMP/issue410-performance"
          input="$RUNNER_TEMP/issue410-input"
          git reset --hard "$ISSUE410_BASE"
          git clean -ffdx
          python3 "$input/issue410-prototype.py"
          set +e
          cleanup_output="$(python3 "$input/issue410-cleanup.py" 2>&1)"
          cleanup_status=$?
          set -e
          if [ "$cleanup_status" -ne 0 ]; then
            printf '%s\n' "$cleanup_output" > "$perf/candidate/cleanup-output.txt"
            if ! grep -Fq 'src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs: migration symbol remains: CommitTransitionTo' <<< "$cleanup_output"; then
              cat "$perf/candidate/cleanup-output.txt"
              exit "$cleanup_status"
            fi
          fi
          python3 "$input/issue410-partition.py"
          cp "$input/Issue410Benchmarks.cs" test/SharpLink.Benchmarks/Issue410Benchmarks.cs
          git diff -- \
            src/SharpLink.Server \
            eng/maintainability/baseline.json \
            > "$perf/candidate/product.patch"
          git diff --stat -- \
            src/SharpLink.Server \
            eng/maintainability/baseline.json \
            > "$perf/candidate/product-stat.txt"
          sha256sum "$perf/candidate/product.patch" > "$perf/environment/candidate-patch-sha256.txt"
          grep -R -n -E 'AdmissionRateTransitionLineage|AdmissionRateTransition|transitionDebt|TransitionDebt|transitionSource|RetainedLineageAnchor|RecordPublishedRateLineage|CommitTransitionTo|InitializeTransitionLocked|RecordLegacyGrantLocked' \
            src/SharpLink.Server/Admission \
            src/SharpLink.Server/SharpLinkServer.AdmissionProgram.cs \
            > "$perf/candidate/migration-symbols.txt" || true
          test ! -s "$perf/candidate/migration-symbols.txt"

      - name: Build candidate benchmarks
        run: |
          dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          dotnet build test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj --no-restore -c Release -v minimal

      - name: Run same-runner candidate matrix
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/issue410-performance/candidate"
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-build -- \
            --filter '*AdmissionFreshRateRpcBenchmarks*' --launchCount 1 --warmupCount 2 --iterationCount 5 --artifacts "$root/fresh-rate-rpc"
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-build -- \
            --filter '*AdmissionRateControllerBenchmarks*' --launchCount 1 --warmupCount 2 --iterationCount 5 --artifacts "$root/rate-controller"
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-build -- \
            --filter '*AdmissionRpcBenchmarks*' --launchCount 1 --warmupCount 2 --iterationCount 5 --artifacts "$root/admission-rpc"
          dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-build -- \
            --filter '*Issue410*' --artifacts "$root/issue410-extra"

      - name: Verify A/B result presence
        shell: bash
        run: |
          set -euo pipefail
          perf="$RUNNER_TEMP/issue410-performance"
          find "$perf/baseline" -type f | sort > "$perf/environment/baseline-files.txt"
          find "$perf/candidate" -type f | sort > "$perf/environment/candidate-files.txt"
          test -s "$perf/environment/baseline-files.txt"
          test -s "$perf/environment/candidate-files.txt"
          test "$(find "$perf/baseline" -path '*/results/*.csv' | wc -l)" -ge 4
          test "$(find "$perf/candidate" -path '*/results/*.csv' | wc -l)" -ge 4

      - name: Upload same-runner A/B evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-410-same-runner-performance-${{ github.sha }}
          path: ${{ runner.temp }}/issue410-performance
          if-no-files-found: error
          retention-days: 30
