name: Issue 331 Final Admission Benchmark Evidence

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  admission-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      BASE_SHA: c1c68580e3337bf640c5c677cce829cae592f423
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Record exact SHAs
        shell: bash
        run: |
          set -euxo pipefail
          echo "HEAD_SHA=$(git rev-parse HEAD)" | tee benchmark-shas.txt
          echo "BASE_SHA=$BASE_SHA" | tee -a benchmark-shas.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git cat-file -e "$BASE_SHA^{commit}"

      - name: Benchmark reviewed 330 base and 331 head on same runner
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$PWD"
          BASE_DIR="${RUNNER_TEMP}/issue331-base"
          rm -rf "$BASE_DIR" "$ROOT/artifacts/issue331-final-benchmark"
          mkdir -p "$ROOT/artifacts/issue331-final-benchmark/base" "$ROOT/artifacts/issue331-final-benchmark/head"
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"

          cd "$BASE_DIR"
          dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          dotnet run -c Release --no-restore --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -- \
            --filter "*AdmissionRpcBenchmarks*" "*AdmissionControllerBenchmarks*" \
            --artifacts "$ROOT/artifacts/issue331-final-benchmark/base" \
            | tee "$ROOT/artifacts/issue331-final-benchmark/base.log"

          cd "$ROOT"
          dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
          dotnet run -c Release --no-restore --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -- \
            --filter "*AdmissionRpcBenchmarks*" "*AdmissionControllerBenchmarks*" \
            --artifacts "$ROOT/artifacts/issue331-final-benchmark/head" \
            | tee "$ROOT/artifacts/issue331-final-benchmark/head.log"

          cp benchmark-shas.txt "$ROOT/artifacts/issue331-final-benchmark/benchmark-shas.txt"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue331-final-admission-benchmark-${{ github.event.pull_request.head.sha }}
          path: artifacts/issue331-final-benchmark
          if-no-files-found: error
          retention-days: 30

# Refresh after restoring the exact single-slot admission fast path.
