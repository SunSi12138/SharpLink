name: Issue 438 Temporary Source Patch

on:
  push:
    branches:
      - tmp/issue-438-source-patch

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/issue-438-sendpump-mailbox
          fetch-depth: 0
      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet
      - name: Apply stop-crossing patch locally
        run: >-
          python3 -c "from pathlib import Path; p=Path('src/SharpLink.Runtime/RpcSession.SendPump.cs'); s=p.read_text(); old='                _wakeup.ConsumeLatched();\\n                if (HasProgressFrames() || HasNormalFrames())\\n                    return true;\\n'; new='                _wakeup.ConsumeLatched();\\n                if (Volatile.Read(ref _stopped) != 0)\\n                    return false;\\n                if (HasProgressFrames() || HasNormalFrames())\\n                    return true;\\n'; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Restore
        run: dotnet restore test/SharpLink.UnitTests/SharpLink.UnitTests.csproj
      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release
      - name: Commit verified source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SharpLink.Runtime/RpcSession.SendPump.cs
          git commit -m "fix(runtime): preserve stop wake across timed batching"
          git push origin HEAD:fix/issue-438-sendpump-mailbox
