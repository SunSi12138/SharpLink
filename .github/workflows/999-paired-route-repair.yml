name: 'SharpLink #999 isolated Linux single response slot screen (TCP c8 Unary)'

# Compare a test-qualified repair; this run is not a current-head release qualification.
on:
  push:
    branches: ['codex/999-perf-single-response-slot']

permissions:
  contents: read

jobs:
  steady:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      SHARPLINK_D6_ISOLATED_LINUX: '1'
      BASELINE_PRODUCT: 2948de82fff77d66fce51ecec9a5783b6ef3cb62
      BASELINE_OVERLAY: 6a8f6fea5719fb7b0b79370d015fd44528cf375f
      CANDIDATE_PRODUCT: e6875fdbc5d339c2aa7c4081fc6118d6a1012345
    steps:
      - name: Checkout the candidate workload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Checkout the baseline workload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASELINE_OVERLAY }}
          fetch-depth: 0
          path: baseline
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: candidate/global.json
      - name: Pair this operation on one runner
        run: >-
          python3 -B candidate/eng/native-version-negotiation-study/d6_run_steady.py tcp 8 --runtime jit --steady-operation unary32
          --baseline-dir baseline --candidate-dir candidate
          --baseline-overlay "$BASELINE_OVERLAY" --candidate-overlay "$GITHUB_SHA"
          --baseline-product "$BASELINE_PRODUCT" --candidate-product "$CANDIDATE_PRODUCT"
          --output "$RUNNER_TEMP/999-single-response-slot"
      - name: Retain raw evidence and decisions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: '999-single-response-slot-linux-tcp-c8-unary'
          path: '${{ runner.temp }}/999-single-response-slot'
          if-no-files-found: error
          retention-days: 30
