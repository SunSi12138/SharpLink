name: Issue 801 - dev dead-code semantic audit

on:
  push:
    branches:
      - audit/issue-801-dev-3x-deadcode
    paths:
      - .github/workflows/issue-801-dev-deadcode-audit.yml
      - eng/SharpLink.DeadCodeAudit/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-801-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      AUDIT_DEV_SHA: eb99fe887cf2129d9b88441245ca0a4a6406b6c2
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
      TUNIT_MAX_PARALLEL_TESTS: "8" # Match the repository PR Fast job to reduce runner-only timing noise.
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Checkout isolated dev-based audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up .NET SDK
        uses: ./.github/actions/setup-dotnet

      - name: SDK and checkout evidence
        run: |
          dotnet --info
          git rev-parse HEAD
          git status --short

      - name: Restore official solution and semantic auditor
        run: |
          dotnet restore Sharplink.slnx --verbosity minimal
          dotnet restore eng/SharpLink.DeadCodeAudit/SharpLink.DeadCodeAudit.csproj --verbosity minimal

      - name: Build solution and source generators
        run: dotnet build Sharplink.slnx --no-restore -c Release --verbosity minimal

      - name: Run Roslyn full-solution semantic index (including generator documents)
        run: |
          dotnet run --project eng/SharpLink.DeadCodeAudit/SharpLink.DeadCodeAudit.csproj \
            -c Release --no-restore -- \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/artifacts/issue-801-audit"

      - name: Ephemeral removal probe for unreferenced non-public methods
        id: probe
        run: |
          dotnet run --project eng/SharpLink.DeadCodeAudit/SharpLink.DeadCodeAudit.csproj \
            -c Release --no-restore -- \
            --probe-remove "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/artifacts/issue-801-audit"
          git diff --stat -- src/ > artifacts/issue-801-audit/removal-diff-stat.txt
          sed -n '1,100p' artifacts/issue-801-audit/removal-diff-stat.txt

      - name: Compile entire solution after ephemeral dead-method removal
        id: removal_build
        if: steps.probe.outcome == 'success'
        run: |
          set +e
          dotnet build Sharplink.slnx -c Release --no-restore -v minimal > artifacts/issue-801-audit/removal-build.log 2>&1
          code=$?
          set -e
          tail -n 100 artifacts/issue-801-audit/removal-build.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Unit tests after removal
        id: removal_unit
        if: steps.removal_build.outcome == 'success'
        run: |
          dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build \
            > artifacts/issue-801-audit/removal-unit-tests.log 2>&1 || {
              tail -n 120 artifacts/issue-801-audit/removal-unit-tests.log; exit 1;
            }
          tail -n 30 artifacts/issue-801-audit/removal-unit-tests.log

      - name: Retry removal Unit tests to identify nondeterministic failures
        id: removal_unit_retry
        if: always() && steps.removal_build.outcome == 'success' && steps.removal_unit.outcome == 'failure'
        continue-on-error: true
        run: |
          dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build \
            > artifacts/issue-801-audit/removal-unit-retry.log 2>&1 || {
              tail -n 100 artifacts/issue-801-audit/removal-unit-retry.log; exit 1;
            }
          tail -n 35 artifacts/issue-801-audit/removal-unit-retry.log

      - name: Generator tests after removal
        id: removal_generator
        if: always() && steps.removal_build.outcome == 'success'
        run: |
          dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj \
            -c Release --no-build > artifacts/issue-801-audit/removal-generator-tests.log 2>&1 || {
              tail -n 120 artifacts/issue-801-audit/removal-generator-tests.log; exit 1;
            }
          tail -n 30 artifacts/issue-801-audit/removal-generator-tests.log

      - name: Remove ephemeral production edits and record proof
        if: always()
        run: |
          {
            echo "# Issue 801 — ephemeral removal compilation proof"
            echo
            echo "- Audit baseline: $AUDIT_DEV_SHA"
            echo "- Removal candidates selected from Tier A: artifacts/issue-801-audit/removal-probe.json"
            echo "- Full solution compile result: ${{ steps.removal_build.outcome }}"
            echo "- Unit test result: ${{ steps.removal_unit.outcome }}"
            echo "- Generator test result: ${{ steps.removal_generator.outcome }}"
            echo
            echo "This is a non-committed experimental deletion, not a merged code change."
          } > artifacts/issue-801-audit/removal-validation.md
          git restore -- src/
          git status --short | head -n 50

      - name: Rebuild pristine baseline after restoring all src files
        id: clean_build
        if: always() && steps.probe.outcome == 'success'
        continue-on-error: true
        run: |
          dotnet build Sharplink.slnx -c Release --no-restore -v minimal \
            > artifacts/issue-801-audit/baseline-build.log 2>&1 || {
              tail -n 90 artifacts/issue-801-audit/baseline-build.log; exit 1;
            }
          tail -n 22 artifacts/issue-801-audit/baseline-build.log

      - name: Unit tests on unchanged baseline for comparison
        id: baseline_unit
        if: always() && steps.clean_build.outcome == 'success'
        continue-on-error: true
        run: |
          dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build \
            > artifacts/issue-801-audit/baseline-unit-tests.log 2>&1 || {
              tail -n 120 artifacts/issue-801-audit/baseline-unit-tests.log; exit 1;
            }
          tail -n 40 artifacts/issue-801-audit/baseline-unit-tests.log

      - name: Capture baseline comparison outcome
        if: always()
        run: |
          {
            echo '# Issue 801 — removed versus pristine baseline'
            echo
            echo "- Removal compile outcome: ${{ steps.removal_build.outcome }}"
            echo "- Removal unit outcome: ${{ steps.removal_unit.outcome }}"
            echo "- Removal unit retry: ${{ steps.removal_unit_retry.outcome }}"
            echo "- Removal generator outcome: ${{ steps.removal_generator.outcome }}"
            echo "- Pristine build outcome: ${{ steps.clean_build.outcome }}"
            echo "- Pristine unit outcome: ${{ steps.baseline_unit.outcome }}"
            echo
            echo 'Unit test logs are preserved for name-based failure comparison.'
          } > artifacts/issue-801-audit/baseline-validation.md

      - name: Add short summary to run details
        if: always()
        run: |
          if [ -f artifacts/issue-801-audit/report.md ]; then
            sed -n '1,120p' artifacts/issue-801-audit/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Semantic index did not complete; inspect build/restore/workspace logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload full JSON CSV and Markdown reference evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-801-dev-deadcode-reference-index
          path: artifacts/issue-801-audit
          if-no-files-found: warn
          retention-days: 30

      - name: Commit audit evidence on isolated branch
        if: always()
        continue-on-error: true
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f artifacts/issue-801-audit/report.json artifacts/issue-801-audit/report.md artifacts/issue-801-audit/tier-*.csv artifacts/issue-801-audit/removal-* artifacts/issue-801-audit/baseline-*
          if ! git diff --cached --quiet; then
            git commit -m "audit(issue-801): record dev semantic reachability evidence [skip ci]"
            git push origin HEAD:refs/heads/audit/issue-801-dev-3x-deadcode
          fi
