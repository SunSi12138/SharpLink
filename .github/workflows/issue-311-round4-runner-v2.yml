name: Issue 311 round 4 runner v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/311-codec-scope-routing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/311-codec-scope-routing
          fetch-depth: 0
      - name: Apply stored patch script
        shell: bash
        run: |
          python - <<'PYRUN'
          from pathlib import Path

          source = Path('.github/workflows/issue-311-round4-patch.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          raw = source[start:end]
          first = next(line for line in raw.splitlines() if line.strip())
          indent = len(first) - len(first.lstrip())
          prefix = ' ' * indent
          script = '\n'.join(line[indent:] if line.startswith(prefix) else line for line in raw.splitlines())
          script = script.replace(
              'SharpLink.Sdk.RpcCodecAdapterRegistration(typeof(Vendor.ExternalGraph), typeof(ExplicitAdapter))',
              'SharpLink.Sdk.RpcCodecAdapter(typeof(Vendor.ExternalGraph), typeof(ExplicitAdapter))')
          original_helper = '''def replace_exact(path, old, new, count=1):
    text = read(path)
    actual = text.count(old)
    if actual != count:
        raise SystemExit(f"{path}: expected {count} exact matches, found {actual}")
    write(path, text.replace(old, new, count))
'''
          tolerant_helper = '''def replace_exact(path, old, new, count=1):
    text = read(path)
    actual = text.count(old)
    if actual == count:
        write(path, text.replace(old, new, count))
        return
    parts = []
    for line in old.splitlines():
        stripped = line.strip()
        parts.append(r"\\s*" + re.escape(stripped) + r"\\s*" if stripped else r"\\s*")
    pattern = r"\\r?\\n".join(parts)
    new_text, actual = re.subn(pattern, lambda _: new, text, count=count)
    if actual != count:
        raise SystemExit(f"{path}: expected {count} whitespace-tolerant matches, found {actual}")
    write(path, new_text)
'''
          if original_helper not in script:
              raise SystemExit('replace_exact helper shape changed')
          script = script.replace(original_helper, tolerant_helper, 1)
          exec(compile(script, 'issue-311-round4-patch.py', 'exec'), {'__name__': '__main__'})
          PYRUN
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test
          git commit -m "Address codec routing review gaps"
          git push origin HEAD:fix/311-codec-scope-routing
