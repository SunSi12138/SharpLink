name: Temporary maintainability snapshot

permissions:
  contents: read

on:
  pull_request:
    branches:
      - dev

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      SHARPLINK_MAINTAINABILITY_SOURCE_REF: '00e2f18c6384c785d232bd59902102d3af7ad3da'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Generate maintainability snapshot twice
        run: |
          bash eng/report-maintainability.sh artifacts/maintainability-first
          bash eng/report-maintainability.sh artifacts/maintainability-second
          cmp artifacts/maintainability-first/report.json artifacts/maintainability-second/report.json
          cmp artifacts/maintainability-first/report.md artifacts/maintainability-second/report.md

      - name: Upload snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintainability-snapshot
          path: artifacts/maintainability-first/
          if-no-files-found: error
