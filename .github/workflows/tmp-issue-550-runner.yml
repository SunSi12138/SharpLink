name: Temporary Issue 550 Review Inventory

permissions:
  contents: read

on:
  push:
    branches:
      - tmp/issue-550-validation-gpt

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Inspect feature references
        shell: bash
        run: |
          git fetch origin fix/issue-550-dynamic-compression-policy dev
          git checkout --detach origin/fix/issue-550-dynamic-compression-policy
          echo '=== compression threshold references ==='
          git grep -n -E 'Compression\.(MinimumPayloadBytes|MinimumSavingsBytes|MinimumSavingsRatio)|MinimumPayloadBytes|MinimumSavingsBytes|MinimumSavingsRatio' -- ':!artifacts' || true
          echo '=== builder/compression references ==='
          git grep -n -E 'UseRuntime\(.*Compression|Compression\.Providers|UpdateRequestCompressionPolicy|UpdateResponseCompressionPolicy|SetResponseCompressionPreferenceAsync' -- src test demo doc || true
          echo '=== compression benchmark/evidence files ==='
          find test eng -type f | grep -Ei 'compression|benchmark|evidence|hot.?path' | sort || true
