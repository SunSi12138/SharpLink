name: Issue 311 contract codec binding refactor

on:
  pull_request:
    paths:
      - .github/workflows/issue-311-new-review-fixes-v3.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/311-codec-scope-routing
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Apply contract codec binding refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def rep(path, old, new, count=1):
              text = read(path)
              actual = text.count(old)
              if actual < count:
                  raise RuntimeError(f"{path}: expected at least {count} occurrences, found {actual}: {old[:120]!r}")
              write(path, text.replace(old, new, count))

          def sub(path, pattern, replacement, count=1, flags=0):
              text = read(path)
              updated, actual = re.subn(pattern, replacement, text, count=count, flags=flags)
              if actual != count:
                  raise RuntimeError(f"{path}: regex expected {count}, found {actual}: {pattern[:120]!r}")
              write(path, updated)

          # Generator: analyze standalone and Contract codec graphs independently.
          path = 'src/SharpLink.Generator/RpcGenerator.DtoAnalysis.cs'
          rep(path,
          '''    private static DtoGenerationResult AnalyzeGeneratedCodecs(\n        Compilation compilation,\n        CancellationToken cancellationToken)\n        => new DtoAnalysisState(compilation, cancellationToken).Analyze();\n''',
          '''    private static DtoGenerationResult AnalyzeGeneratedCodecs(\n        Compilation compilation,\n        CancellationToken cancellationToken)\n    {\n        var standalone = new DtoAnalysisState(compilation, cancellationToken, contractMode: false).Analyze();\n        var contract = new DtoAnalysisState(compilation, cancellationToken, contractMode: true).Analyze();\n        var diagnostics = standalone.Diagnostics\n            .Concat(contract.Diagnostics)\n            .GroupBy(static item => (item.Kind, item.TypeName, item.Detail))\n            .Select(static group => group.First())\n            .ToImmutableArray();\n        var enums = standalone.Enums\n            .Concat(contract.Enums)\n            .GroupBy(static item => item.TypeName, StringComparer.Ordinal)\n            .Select(static group => group.First())\n            .OrderBy(static item => item.TypeName, StringComparer.Ordinal)\n            .ToImmutableArray();\n        return new DtoGenerationResult(standalone.Codecs, contract.Codecs, diagnostics, enums);\n    }\n\n    private sealed record DtoAnalysisPassResult(\n        ImmutableArray<GeneratedCodecModel> Codecs,\n        ImmutableArray<DtoDiagnosticModel> Diagnostics,\n        ImmutableArray<GeneratedEnumModel> Enums);\n''')
          rep(path,
              '        private readonly CancellationToken _cancellationToken;\n',
              '        private readonly CancellationToken _cancellationToken;\n        private readonly bool _contractMode;\n')
          rep(path,
          '''        public DtoAnalysisState(Compilation compilation, CancellationToken cancellationToken)\n        {\n            _compilation = compilation;\n            _cancellationToken = cancellationToken;\n''',
          '''        public DtoAnalysisState(Compilation compilation, CancellationToken cancellationToken, bool contractMode)\n        {\n            _compilation = compilation;\n            _cancellationToken = cancellationToken;\n            _contractMode = contractMode;\n''')
          rep(path,
              '            CollectAssemblyRoutes();\n',
              '            if (_contractMode)\n                CollectAssemblyRoutes();\n')
          rep(path,
          '''            var roots = new Dictionary<string, ITypeSymbol>(StringComparer.Ordinal);\n            CollectCurrentAssemblyRoots(_compilation.Assembly.GlobalNamespace, roots);\n            CollectReferencedContractRoots(roots);\n\n            foreach (var root in roots.OrderBy(static pair => pair.Key, StringComparer.Ordinal))\n            {\n                _cancellationToken.ThrowIfCancellationRequested();\n                Visit(root.Value, [], 0);\n            }\n\n            return new DtoGenerationResult(\n                _models.Values.OrderBy(static model => model.TypeName, StringComparer.Ordinal).ToImmutableArray(),\n                _diagnostics.ToImmutableArray(),\n                _enums.Values.OrderBy(static item => item.TypeName, StringComparer.Ordinal).ToImmutableArray());\n''',
          '''            var roots = new Dictionary<string, ITypeSymbol>(StringComparer.Ordinal);\n            CollectCurrentAssemblyRoots(\n                _compilation.Assembly.GlobalNamespace,\n                roots,\n                includeSerializable: !_contractMode,\n                includeContracts: _contractMode);\n            if (_contractMode)\n                CollectReferencedContractRoots(roots);\n\n            foreach (var root in roots.OrderBy(static pair => pair.Key, StringComparer.Ordinal))\n            {\n                _cancellationToken.ThrowIfCancellationRequested();\n                Visit(root.Value, [], 0);\n            }\n\n            return new DtoAnalysisPassResult(\n                _models.Values.OrderBy(static model => model.TypeName, StringComparer.Ordinal).ToImmutableArray(),\n                _diagnostics.ToImmutableArray(),\n                _enums.Values.OrderBy(static item => item.TypeName, StringComparer.Ordinal).ToImmutableArray());\n''')
          rep(path,
          '''        private void CollectCurrentAssemblyRoots(\n            INamespaceSymbol namespaceSymbol,\n            Dictionary<string, ITypeSymbol> roots)\n        {\n            foreach (var type in namespaceSymbol.GetTypeMembers())\n                CollectCurrentAssemblyRoots(type, roots);\n            foreach (var nestedNamespace in namespaceSymbol.GetNamespaceMembers())\n                CollectCurrentAssemblyRoots(nestedNamespace, roots);\n        }\n\n        private void CollectCurrentAssemblyRoots(\n            INamedTypeSymbol type,\n            Dictionary<string, ITypeSymbol> roots)\n        {\n            if (HasAttribute(type, "SharpLink.Sdk", "RpcSerializableAttribute"))\n                AddRoot(roots, type);\n            if (type.TypeKind == TypeKind.Interface && HasRpcContractAttribute(type))\n                CollectContractPayloadRoots(type, roots);\n\n            foreach (var nested in type.GetTypeMembers())\n                CollectCurrentAssemblyRoots(nested, roots);\n        }\n''',
          '''        private void CollectCurrentAssemblyRoots(\n            INamespaceSymbol namespaceSymbol,\n            Dictionary<string, ITypeSymbol> roots,\n            bool includeSerializable,\n            bool includeContracts)\n        {\n            foreach (var type in namespaceSymbol.GetTypeMembers())\n                CollectCurrentAssemblyRoots(type, roots, includeSerializable, includeContracts);\n            foreach (var nestedNamespace in namespaceSymbol.GetNamespaceMembers())\n                CollectCurrentAssemblyRoots(nestedNamespace, roots, includeSerializable, includeContracts);\n        }\n\n        private void CollectCurrentAssemblyRoots(\n            INamedTypeSymbol type,\n            Dictionary<string, ITypeSymbol> roots,\n            bool includeSerializable,\n            bool includeContracts)\n        {\n            if (includeSerializable && HasAttribute(type, "SharpLink.Sdk", "RpcSerializableAttribute"))\n                AddRoot(roots, type);\n            if (includeContracts && type.TypeKind == TypeKind.Interface && HasRpcContractAttribute(type))\n                CollectContractPayloadRoots(type, roots);\n\n            foreach (var nested in type.GetTypeMembers())\n                CollectCurrentAssemblyRoots(nested, roots, includeSerializable, includeContracts);\n        }\n''')
          rep(path,
          '''            if (TrySelectContractCodecOverride(type, out var selectedAdapter))\n            {\n                if (selectedAdapter is not null)\n                    AddAdapterModel(type, typeName, selectedAdapter);\n                return;\n            }\n''',
          '''            var hasSelectedOverride = _contractMode\n                ? TrySelectContractCodecOverride(type, out var selectedAdapter)\n                : TrySelectAdapter(type, out selectedAdapter);\n            if (hasSelectedOverride)\n            {\n                if (selectedAdapter is not null)\n                    AddAdapterModel(type, typeName, selectedAdapter);\n                return;\n            }\n''')
          text = read(path).replace('GetCodecName(typeName),', 'GetCodecName(typeName, _contractMode),')
          text = text.replace(
              '        private static string GetCodecName(string typeName)\n            => "__SharpLinkGeneratedCodec_" + ComputeHash(typeName).ToString("X16", InvariantCulture);',
              '        private static string GetCodecName(string typeName, bool contractMode)\n            => "__SharpLinkGeneratedCodec_" + ComputeHash((contractMode ? "contract|" : "standalone|") + typeName).ToString("X16", InvariantCulture);')
          write(path, text)

          path = 'src/SharpLink.Generator/RpcGenerator.CodecRoutes.cs'
          rep(path,
              '        private readonly HashSet<ITypeSymbol> _manifestScopedSelections = new(SymbolEqualityComparer.Default);\n',
              '')
          rep(path, '            _manifestScopedSelections.Add(type);\n', '')
          text = read(path).replace('GetCodecName(typeName),', 'GetCodecName(typeName, _contractMode),')
          text = text.replace(',\n                IsManifestScoped: _manifestScopedSelections.Remove(type));', ');')
          write(path, text)

          path = 'src/SharpLink.Generator/RpcGenerator.Models.cs'
          rep(path,
          '''    ImmutableArray<string> AssemblyDependencies,\n    Location? Location,\n    bool IsManifestScoped = false);\n''',
          '''    ImmutableArray<string> AssemblyDependencies,\n    Location? Location);\n''')
          rep(path,
          '''internal sealed record DtoGenerationResult(\n    ImmutableArray<GeneratedCodecModel> Codecs,\n    ImmutableArray<DtoDiagnosticModel> Diagnostics,\n    ImmutableArray<GeneratedEnumModel> Enums);\n''',
          '''internal sealed record DtoGenerationResult(\n    ImmutableArray<GeneratedCodecModel> Codecs,\n    ImmutableArray<GeneratedCodecModel> ContractCodecs,\n    ImmutableArray<DtoDiagnosticModel> Diagnostics,\n    ImmutableArray<GeneratedEnumModel> Enums);\n''')
          rep(path,
              '        if (x is null || y is null || x.Codecs.Length != y.Codecs.Length ||\n            x.Diagnostics.Length != y.Diagnostics.Length || x.Enums.Length != y.Enums.Length)',
              '        if (x is null || y is null || x.Codecs.Length != y.Codecs.Length ||\n            x.ContractCodecs.Length != y.ContractCodecs.Length ||\n            x.Diagnostics.Length != y.Diagnostics.Length || x.Enums.Length != y.Enums.Length)')
          rep(path,
          '''        for (var index = 0; index < x.Diagnostics.Length; index++)\n''',
          '''        for (var index = 0; index < x.ContractCodecs.Length; index++)\n        {\n            if (!CodecEquals(x.ContractCodecs[index], y.ContractCodecs[index]))\n                return false;\n        }\n        for (var index = 0; index < x.Diagnostics.Length; index++)\n''')
          rep(path,
          '''            hash = unchecked(hash * 31 + StringComparer.Ordinal.GetHashCode(codec.SchemaId));\n            hash = unchecked(hash * 31 + codec.IsManifestScoped.GetHashCode());\n        }\n        foreach (var diagnostic in obj.Diagnostics)\n''',
          '''            hash = unchecked(hash * 31 + StringComparer.Ordinal.GetHashCode(codec.SchemaId));\n        }\n        foreach (var codec in obj.ContractCodecs)\n        {\n            hash = unchecked(hash * 31 + StringComparer.Ordinal.GetHashCode(codec.TypeName));\n            hash = unchecked(hash * 31 + StringComparer.Ordinal.GetHashCode(codec.SchemaId));\n        }\n        foreach (var diagnostic in obj.Diagnostics)\n''')
          rep(path, '            left.IsManifestScoped != right.IsManifestScoped ||\n', '')

          path = 'src/SharpLink.Generator/RpcGenerator.cs'
          rep(path,
          '''            if (!result.Codecs.IsDefaultOrEmpty)\n            {\n                spc.AddSource(\n                    "SharpLink.GeneratedCodecs.g.cs",\n                    SourceText.From(GenerateCodecs(result.Codecs), Encoding.UTF8));\n            }\n''',
          '''            if (!result.Codecs.IsDefaultOrEmpty || !result.ContractCodecs.IsDefaultOrEmpty)\n            {\n                spc.AddSource(\n                    "SharpLink.GeneratedCodecs.g.cs",\n                    SourceText.From(GenerateCodecs(result.Codecs.AddRange(result.ContractCodecs)), Encoding.UTF8));\n            }\n''')
          rep(path,
              '            var code = GenerateAssemblyManifest(value.Left.Left, value.Left.Right, value.Right.Codecs);',
              '            var code = GenerateAssemblyManifest(value.Left.Left, value.Left.Right, value.Right.Codecs, value.Right.ContractCodecs);')
          rep(path,
              '                value.Left.Right.Codecs,\n                value.Left.Right.Enums,',
              '                value.Left.Right.ContractCodecs,\n                value.Left.Right.Enums,')

          path = 'src/SharpLink.Generator/RpcGenerator.ManifestEmitter.cs'
          rep(path,
          '''        ImmutableArray<RpcServiceModel?> services,\n        ImmutableArray<GeneratedCodecModel> codecs)\n''',
          '''        ImmutableArray<RpcServiceModel?> services,\n        ImmutableArray<GeneratedCodecModel> codecs,\n        ImmutableArray<GeneratedCodecModel> contractCodecs)\n''')
          rep(path,
              '        if (contracts.Length == 0 && serviceModels.Length == 0 && codecs.IsDefaultOrEmpty)\n            return string.Empty;',
              '        if (contracts.Length == 0 && serviceModels.Length == 0 && codecs.IsDefaultOrEmpty && contractCodecs.IsDefaultOrEmpty)\n            return string.Empty;')
          rep(path,
          '''        var ownerType = contracts.Length != 0\n            ? contracts[0].FullName\n            : serviceModels.Length != 0 ? serviceModels[0].ServiceFullName : codecs[0].TypeName;\n''',
          '''        var ownerType = contracts.Length != 0\n            ? contracts[0].FullName\n            : serviceModels.Length != 0\n                ? serviceModels[0].ServiceFullName\n                : !codecs.IsDefaultOrEmpty ? codecs[0].TypeName : contractCodecs[0].TypeName;\n''')
          rep(path,
              '            .Concat(codecs.SelectMany(static codec => codec.AssemblyDependencies))\n',
              '            .Concat(codecs.SelectMany(static codec => codec.AssemblyDependencies))\n            .Concat(contractCodecs.SelectMany(static codec => codec.AssemblyDependencies))\n')
          rep(path,
              '        var compileTimeDescriptor = BuildCompileTimeDescriptor(contracts, serviceModels, codecs);',
              '        var compileTimeDescriptor = BuildCompileTimeDescriptor(contracts, serviceModels, codecs, contractCodecs);')
          rep(path,
          '''        AppendCodecManifestArray(sb, codecs);\n        AppendManifestScopedCodecTargets(sb, codecs);\n''',
          '''        AppendCodecManifestArray(sb, codecs);\n        AppendContractCodecManifestArray(sb, contractCodecs);\n''')
          rep(path,
          '''        sb.AppendLine("    private static readonly IReadOnlyList<IRpcGeneratedCodecFactory> __readOnlyCodecs = Array.AsReadOnly(__codecs);");\n        sb.AppendLine("    private static readonly IReadOnlyList<Type> __readOnlyManifestScopedCodecTargets = Array.AsReadOnly(__manifestScopedCodecTargets);");\n        sb.AppendLine("    private static readonly IReadOnlyList<string> __readOnlyDependencies = Array.AsReadOnly(__dependencies);");\n        sb.AppendLine("    public IReadOnlyList<SharpLinkGeneratedContractDescriptor> Contracts => __readOnlyContracts;");\n        sb.AppendLine("    public IReadOnlyList<SharpLinkGeneratedServiceDescriptor> Services => __readOnlyServices;");\n        sb.AppendLine("    public IReadOnlyList<IRpcGeneratedCodecFactory> Codecs => __readOnlyCodecs;");\n        sb.AppendLine("    public IReadOnlyList<Type> ManifestScopedCodecTargets => __readOnlyManifestScopedCodecTargets;");\n        sb.AppendLine("    public IReadOnlyList<string> Dependencies => __readOnlyDependencies;");\n''',
          '''        sb.AppendLine("    private static readonly IReadOnlyList<IRpcGeneratedCodecFactory> __readOnlyCodecs = Array.AsReadOnly(__codecs);");\n        sb.AppendLine("    private static readonly IReadOnlyList<IRpcGeneratedCodecFactory> __readOnlyContractCodecs = Array.AsReadOnly(__contractCodecs);");\n        sb.AppendLine("    private static readonly IReadOnlyList<string> __readOnlyDependencies = Array.AsReadOnly(__dependencies);");\n        sb.AppendLine("    public IReadOnlyList<SharpLinkGeneratedContractDescriptor> Contracts => __readOnlyContracts;");\n        sb.AppendLine("    public IReadOnlyList<SharpLinkGeneratedServiceDescriptor> Services => __readOnlyServices;");\n        sb.AppendLine("    public IReadOnlyList<IRpcGeneratedCodecFactory> Codecs => __readOnlyCodecs;");\n        sb.AppendLine("    public IReadOnlyList<IRpcGeneratedCodecFactory> ContractCodecs => __readOnlyContractCodecs;");\n        sb.AppendLine("    public IReadOnlyList<string> Dependencies => __readOnlyDependencies;");\n''')
          rep(path,
              '            sb.AppendLine($"            static channel => new {GetGeneratedContractTypeName(contract, "Proxy")}(channel),");\n            sb.AppendLine($"            static () => new {GetGeneratedContractTypeName(contract, "Stub")}()),");',
              '            sb.AppendLine($"            static (channel, codecs) => new {GetGeneratedContractTypeName(contract, "Proxy")}(channel, codecs),");\n            sb.AppendLine($"            static codecs => new {GetGeneratedContractTypeName(contract, "Stub")}(codecs)),");')
          sub(path,
              r'''    private static void AppendManifestScopedCodecTargets\(\n        StringBuilder sb,\n        ImmutableArray<GeneratedCodecModel> codecs\)\n    \{.*?\n    \}\n\n    private static string BuildCompileTimeDescriptor''',
              '''    private static void AppendContractCodecManifestArray(\n        StringBuilder sb,\n        ImmutableArray<GeneratedCodecModel> codecs)\n    {\n        sb.AppendLine("    private static readonly IRpcGeneratedCodecFactory[] __contractCodecs = new IRpcGeneratedCodecFactory[]");\n        sb.AppendLine("    {");\n        foreach (var codec in codecs.OrderBy(static codec => codec.TypeName, StringComparer.Ordinal))\n            sb.AppendLine($"        new {codec.CodecName}.Factory(),");\n        sb.AppendLine("    };");\n    }\n\n    private static string BuildCompileTimeDescriptor''',
              flags=re.S)
          rep(path,
          '''        RpcInterfaceModel[] contracts,\n        RpcServiceModel[] services,\n        ImmutableArray<GeneratedCodecModel> codecs)\n''',
          '''        RpcInterfaceModel[] contracts,\n        RpcServiceModel[] services,\n        ImmutableArray<GeneratedCodecModel> codecs,\n        ImmutableArray<GeneratedCodecModel> contractCodecs)\n''')
          rep(path,
          '''        foreach (var codec in codecs.OrderBy(static codec => codec.TypeName, StringComparer.Ordinal))\n            sb.Append("D:").Append(codec.TypeName).Append(':').Append(codec.SchemaId).Append(';');\n        return sb.ToString();\n''',
          '''        foreach (var codec in codecs.OrderBy(static codec => codec.TypeName, StringComparer.Ordinal))\n            sb.Append("D:").Append(codec.TypeName).Append(':').Append(codec.SchemaId).Append(';');\n        foreach (var codec in contractCodecs.OrderBy(static codec => codec.TypeName, StringComparer.Ordinal))\n            sb.Append("K:").Append(codec.TypeName).Append(':').Append(codec.SchemaId).Append(';');\n        return sb.ToString();\n''')

          # Generated manifest API: separate global and Contract codec bindings; factories receive owner provider.
          path = 'src/SharpLink.Abstractions/SharpLinkGeneratedAssemblyManifest.cs'
          rep(path,
          '''public sealed record SharpLinkGeneratedContractDescriptor(\n    Type ContractType,\n    string ContractName,\n    long ContractId,\n    string Fingerprint,\n    IReadOnlyList<SharpLinkGeneratedMethodDescriptor> Methods,\n    Func<IRpcChannel, object> ProxyFactory,\n    Func<IRpcStub> StubFactory);\n''',
          '''public sealed record SharpLinkGeneratedContractDescriptor(\n    Type ContractType,\n    string ContractName,\n    long ContractId,\n    string Fingerprint,\n    IReadOnlyList<SharpLinkGeneratedMethodDescriptor> Methods,\n    Func<IRpcChannel, IRpcCodecProvider, object> ProxyFactory,\n    Func<IRpcCodecProvider, IRpcStub> StubFactory)\n{\n    /// <summary>Compatibility constructor for descriptors that do not own a Contract-specific Codec graph.</summary>\n    public SharpLinkGeneratedContractDescriptor(\n        Type contractType,\n        string contractName,\n        long contractId,\n        string fingerprint,\n        IReadOnlyList<SharpLinkGeneratedMethodDescriptor> methods,\n        Func<IRpcChannel, object> proxyFactory,\n        Func<IRpcStub> stubFactory)\n        : this(\n            contractType,\n            contractName,\n            contractId,\n            fingerprint,\n            methods,\n            (channel, _) => proxyFactory(channel),\n            _ => stubFactory())\n    {\n    }\n}\n''')
          rep(path,
          '''    /// <summary>\n    /// Gets generated Codec targets selected by an assembly-level route. These targets are\n    /// resolved only for artifacts owned by this manifest and are not published as context-global bindings.\n    /// </summary>\n    IReadOnlyList<Type> ManifestScopedCodecTargets => Array.Empty<Type>();\n''',
          '''    /// <summary>\n    /// Gets Codec factories used only by RPC Contracts owned by this manifest. These bindings\n    /// are resolved through the Contract owner provider and are never published globally.\n    /// </summary>\n    IReadOnlyList<IRpcGeneratedCodecFactory> ContractCodecs => Array.Empty<IRpcGeneratedCodecFactory>();\n''')

          path = 'src/SharpLink.Abstractions/IRpcRuntimeContext.cs'
          rep(path, 'namespace SharpLink.Abstractions;\n', 'using System.Reflection;\n\nnamespace SharpLink.Abstractions;\n')
          rep(path,
          '''}\n\n/// <summary>Resolves codecs without relying on process-wide mutable configuration.</summary>\npublic interface IRpcCodecProvider\n''',
          '''}\n\n/// <summary>Resolves the immutable Codec provider owned by one generated RPC Contract assembly.</summary>\npublic interface IRpcContractCodecProviderResolver\n{\n    /// <summary>Gets the Codec provider bound to <paramref name="ownerAssembly"/>.</summary>\n    IRpcCodecProvider GetContractCodecProvider(Assembly ownerAssembly);\n}\n\n/// <summary>Resolves codecs without relying on process-wide mutable configuration.</summary>\npublic interface IRpcCodecProvider\n''')

          path = 'src/SharpLink.Abstractions/IRpcStub.cs'
          rep(path,
          '''    /// <summary>Binds the Codec provider selected for this generated Contract owner.</summary>\n    /// <param name="codecs">The construction-time Codec provider for this stub registration.</param>\n    void BindCodecProvider(IRpcCodecProvider codecs)\n    {\n    }\n\n''', '')

          path = 'src/SharpLink.Generator/RpcGenerator.ProxyEmitter.cs'
          rep(path,
          '''        sb.AppendLine($"    public {model.Name}_Proxy(IRpcChannel channel)");\n        sb.AppendLine("    {");\n        sb.AppendLine("        ArgumentNullException.ThrowIfNull(channel);");\n        sb.AppendLine("        _channel = channel;");\n        sb.AppendLine($"        var __codecs = RpcGeneratedCodecResolver.GetProvider(channel.RuntimeContext, typeof({model.FullName}).Assembly);");\n''',
          '''        sb.AppendLine($"    public {model.Name}_Proxy(IRpcChannel channel)");\n        sb.AppendLine($"        : this(channel, RpcGeneratedCodecResolver.GetProvider(channel.RuntimeContext, typeof({model.FullName}).Assembly))");\n        sb.AppendLine("    {");\n        sb.AppendLine("    }");\n        sb.AppendLine();\n        sb.AppendLine($"    internal {model.Name}_Proxy(IRpcChannel channel, IRpcCodecProvider __codecs)");\n        sb.AppendLine("    {");\n        sb.AppendLine("        ArgumentNullException.ThrowIfNull(channel);");\n        sb.AppendLine("        ArgumentNullException.ThrowIfNull(__codecs);");\n        sb.AppendLine("        _channel = channel;");\n''')

          path = 'src/SharpLink.Generator/RpcGenerator.StubEmitter.cs'
          rep(path, '        AppendStubCodecBinding(sb, model.Methods);\n', '        AppendStubCodecBinding(sb, model);\n')
          rep(path,
          '''    private static void AppendStubCodecBinding(StringBuilder sb, EquatableArray<RpcMethodModel> methods)\n    {\n        sb.AppendLine("    public void BindCodecProvider(IRpcCodecProvider codecs)");\n        sb.AppendLine("    {");\n        sb.AppendLine("        ArgumentNullException.ThrowIfNull(codecs);");\n        foreach (var method in methods)\n''',
          '''    private static void AppendStubCodecBinding(StringBuilder sb, RpcInterfaceModel model)\n    {\n        sb.AppendLine($"    internal {model.Name}_Stub(IRpcCodecProvider codecs)");\n        sb.AppendLine("    {");\n        sb.AppendLine("        ArgumentNullException.ThrowIfNull(codecs);");\n        foreach (var method in model.Methods)\n''')

          # Runtime registration: ContractCodecs is a separate map, never part of the global registry.
          path = 'src/SharpLink.Runtime/Codec/RpcCodecProvider.cs'
          rep(path,
              '        IReadOnlyDictionary<Type, RpcGeneratedCodecRegistration> allCodecs,\n        IReadOnlyDictionary<Type, RpcGeneratedCodecRegistration> codecs,',
              '        IReadOnlyDictionary<Type, RpcGeneratedCodecRegistration> contractCodecs,\n        IReadOnlyDictionary<Type, RpcGeneratedCodecRegistration> codecs,')
          rep(path, '        AllCodecs = allCodecs;\n', '        ContractCodecs = contractCodecs;\n')
          rep(path,
          '''    /// <summary>Gets every Codec owned by this manifest, including assembly-routed targets.</summary>\n    internal IReadOnlyDictionary<Type, RpcGeneratedCodecRegistration> AllCodecs { get; }\n''',
          '''    /// <summary>Gets Codec bindings visible only to RPC Contracts owned by this manifest.</summary>\n    internal IReadOnlyDictionary<Type, RpcGeneratedCodecRegistration> ContractCodecs { get; }\n''')
          rep(path,
              '    internal bool HasManifestScopedCodecs => Manifest.ManifestScopedCodecTargets.Count != 0;\n',
              '    internal bool HasContractCodecs => ContractCodecs.Count != 0;\n')
          rep(path, '            if (!HasManifestScopedCodecs)\n', '            if (!HasContractCodecs)\n')
          sub(path,
              r'''            var scopeByAdapterId = new Dictionary<string, AdapterScopeRegistration>\(StringComparer.Ordinal\);.*?            return registration;''',
          '''            var scopeByAdapterId = new Dictionary<string, AdapterScopeRegistration>(StringComparer.Ordinal);\n            var allFactories = manifest.Codecs.Concat(manifest.ContractCodecs).ToArray();\n            foreach (var factory in allFactories.OrderBy(static factory => factory.AdapterId, StringComparer.Ordinal)\n                         .ThenBy(static factory => factory.WireFormatId, StringComparer.Ordinal)\n                         .ThenBy(static factory => factory.TargetType.FullName, StringComparer.Ordinal))\n            {\n                ValidateFactory(factory);\n                if (factory.AdapterId is null)\n                    continue;\n\n                var adapter = factory.Adapter!;\n                ValidateAdapter(factory, adapter);\n                if (scopeByAdapterId.TryGetValue(factory.AdapterId, out var existing))\n                {\n                    if (existing.Adapter.GetType() != adapter.GetType() ||\n                        !string.Equals(existing.WireFormatId, factory.WireFormatId, StringComparison.Ordinal))\n                    {\n                        throw new InvalidOperationException(\n                            $"Adapter '{factory.AdapterId}' has inconsistent implementation or wire-format metadata in manifest '{manifest.OwnerAssembly.FullName}'.");\n                    }\n                    continue;\n                }\n\n                var scope = adapter.CreateScope() ?? throw new InvalidOperationException(\n                    $"Adapter '{factory.AdapterId}' returned a null scope.");\n                scopes.Add(scope);\n                scopeByAdapterId.Add(factory.AdapterId,\n                    new AdapterScopeRegistration(adapter, factory.WireFormatId, scope));\n            }\n\n            var ownerBox = new OwnerBox();\n            var publishedCodecs = CreateRegistrations(manifest.Codecs);\n            var contractCodecs = CreateRegistrations(manifest.ContractCodecs);\n            var registration = n