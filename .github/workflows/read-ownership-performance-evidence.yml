name: Read Ownership Notification-Cell Evidence

on:
  push:
    branches:
      - 'perf/pr753-read-ownership-*'
    paths:
      - '.github/workflows/read-ownership-performance-evidence.yml'
      - 'eng/perf/read-ownership-revisions.json'
      - 'eng/perf/read-ownership-method.md'
      - 'eng/perf/run-read-ownership.py'
      - 'eng/perf/summarize-read-ownership.py'
      - 'eng/perf/test-read-ownership-harness.py'
      - 'eng/perf/read-ownership-dispatch/**'
      - 'eng/perf/package-read-ownership.py'

permissions:
  contents: read

jobs:
  same-run-three-arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated evidence harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet

      - name: Verify harness acceptance and negative controls
        shell: bash
        run: |
          mkdir -p artifacts/read-ownership
          python3 eng/perf/test-read-ownership-harness.py 2>&1 | tee artifacts/read-ownership/harness-self-tests.log

      - name: Record runner environment
        shell: bash
        run: |
          mkdir -p artifacts/read-ownership
          dotnet --info > artifacts/read-ownership/dotnet-info.txt
          uname -a > artifacts/read-ownership/uname.txt
          lscpu > artifacts/read-ownership/cpu.txt
          free -b > artifacts/read-ownership/memory.txt
          ps -eo pid,comm,args > artifacts/read-ownership/processes-before.txt
          printf 'run=%s\nattempt=%s\nrunner=%s\nimage=%s\nimage_version=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_ENVIRONMENT" \
            "$ImageOS" "$ImageVersion" > artifacts/read-ownership/runner.txt
          git rev-parse HEAD > artifacts/read-ownership/harness-sha.txt
          mkdir -p artifacts/read-ownership/harness
          mkdir -p artifacts/read-ownership/harness/read-ownership-dispatch
          cp eng/perf/read-ownership-dispatch/* artifacts/read-ownership/harness/read-ownership-dispatch/
          cp eng/perf/*read-ownership*.py eng/perf/read-ownership-revisions.json \
            eng/perf/read-ownership-method.md .github/workflows/read-ownership-performance-evidence.yml \
            artifacts/read-ownership/harness/
          sha256sum eng/perf/run-read-ownership.py eng/perf/summarize-read-ownership.py \
            eng/perf/test-read-ownership-harness.py eng/perf/package-read-ownership.py \
            eng/perf/read-ownership-dispatch/* eng/perf/read-ownership-revisions.json \
            .github/workflows/read-ownership-performance-evidence.yml eng/perf/read-ownership-method.md > artifacts/read-ownership/harness-sha256.txt

      - name: Build all arms, then execute all six balanced orders
        shell: bash
        run: |
          python3 eng/perf/run-read-ownership.py \
            --manifest eng/perf/read-ownership-revisions.json \
            --output "$GITHUB_WORKSPACE/artifacts/read-ownership" \
            --work "$RUNNER_TEMP/read-ownership-arms"

      - name: Publish descriptive summary
        shell: bash
        run: cat artifacts/read-ownership/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package complete lossless transfer parts
        id: transfer
        if: always()
        shell: bash
        run: |
          python3 eng/perf/package-read-ownership.py artifacts/read-ownership artifacts/read-ownership-parts
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          size = sum(p.stat().st_size for p in Path('artifacts/read-ownership').rglob('*') if p.is_file())
          print('small=' + str(size <= 15 * 1024 * 1024).lower())
          PYCODE

      - name: Upload every raw observation and build log when below transfer cap
        if: always() && steps.transfer.outputs.small == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: read-ownership-performance-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/read-ownership
          if-no-files-found: error
          retention-days: 90

      - name: Upload transfer integrity index
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: read-ownership-transfer-index-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/read-ownership-parts/index.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload bounded transfer part 00 when present
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
