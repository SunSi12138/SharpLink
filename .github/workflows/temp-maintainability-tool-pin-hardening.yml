name: Temporary maintainability tool pin hardening validation

on:
  push:
    branches:
      - issue-350-maintainability-report

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore format build
        run: |
          dotnet restore Sharplink.slnx
          dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal
          dotnet build eng/SharpLink.Maintainability/SharpLink.Maintainability.csproj --no-restore -c Release -v minimal
      - name: Validate named snapshot and pin trust boundary
        env:
          SOURCE_REF: 00e2f18c6384c785d232bd59902102d3af7ad3da
        run: |
          set -euo pipefail
          normal="$RUNNER_TEMP/normal"
          SHARPLINK_MAINTAINABILITY_SOURCE_REF="$SOURCE_REF" bash eng/report-maintainability.sh "$normal"
          grep -F 'Source ref: `00e2f18c6384c785d232bd59902102d3af7ad3da`' "$normal/report.md"
          grep -F 'Tool ref: `5d4b9d9cf942aa4cc6c0dd7764189220fb9309c8`' "$normal/report.md"

          if SHARPLINK_MAINTAINABILITY_PINNED_TOOL_REF=deadbeef \
             SHARPLINK_MAINTAINABILITY_SOURCE_REF="$SOURCE_REF" \
             bash eng/report-maintainability.sh "$RUNNER_TEMP/spoof-deadbeef"; then
            echo 'spoofed unresolved pinned ref unexpectedly succeeded' >&2
            exit 1
          fi

          cp eng/SharpLink.Maintainability/Program.cs "$RUNNER_TEMP/Program.cs"
          sed -i 's/const int LargeMethodLocThreshold = 80;/const int LargeMethodLocThreshold = 81;/' eng/SharpLink.Maintainability/Program.cs
          if SHARPLINK_MAINTAINABILITY_PINNED_TOOL_REF="$(git rev-parse HEAD)" \
             SHARPLINK_MAINTAINABILITY_SOURCE_REF="$SOURCE_REF" \
             bash eng/report-maintainability.sh "$RUNNER_TEMP/spoof-dirty-tool"; then
            echo 'dirty analyzer with forged matching pinned ref unexpectedly succeeded' >&2
            exit 1
          fi
          mv "$RUNNER_TEMP/Program.cs" eng/SharpLink.Maintainability/Program.cs

          printf '\n# dirty wrapper probe\n' >> eng/report-maintainability.sh
          if SHARPLINK_MAINTAINABILITY_SOURCE_REF="$SOURCE_REF" \
             bash eng/report-maintainability.sh "$RUNNER_TEMP/dirty-wrapper"; then
            echo 'dirty wrapper unexpectedly selected a named tool revision' >&2
            exit 1
          fi
          git checkout -- eng/report-maintainability.sh

  macos-bash32:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate documented command with system Bash
        env:
          SOURCE_REF: 00e2f18c6384c785d232bd59902102d3af7ad3da
        run: |
          /bin/bash --version | head -1
          SHARPLINK_MAINTAINABILITY_SOURCE_REF="$SOURCE_REF" /bin/bash eng/report-maintainability.sh "$RUNNER_TEMP/macos-report"
          test -s "$RUNNER_TEMP/macos-report/report.json"
          test -s "$RUNNER_TEMP/macos-report/report.md"
