name: Issue 775 frozen method shape experiment
on:
  push:
    branches: [prototype/775-static-session-binding]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  codegen:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[issue775-shape]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8810547756d1c16367bba8d81f6707018b9d7e5d
          path: old
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: candidate/global.json
      - name: Validate existing diagnostic readers
        run: |
          python3 -m unittest discover -s candidate/eng/issue775 -p test_boundary.py -v
          python3 -m unittest discover -s candidate/eng/issue775 -p test_attribution.py -v
      - name: Same-host old and candidate with unchanged bounded diagnostic workload
        run: |
          python3 candidate/eng/issue775/shape_codegen.py --old old --candidate candidate \
            --expected-candidate '${{ github.sha }}' --output shape-codegen
      - name: Retain source and failures
        if: always()
        run: |
          mkdir -p shape-codegen
          git -C candidate archive HEAD | gzip > shape-codegen/source.tar.gz
          if test -f shape-codegen/execution-failures.json; then cat shape-codegen/execution-failures.json; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue775-shape-codegen-${{ github.sha }}
          path: shape-codegen/
          retention-days: 30
          if-no-files-found: error
