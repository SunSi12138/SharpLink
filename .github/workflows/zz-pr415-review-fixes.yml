name: One-off PR 415 review fixes

on:
  push:
    branches:
      - feature/issue-396-deterministic-rpc-identity

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: validate PR 415 review fixes' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/issue-396-deterministic-rpc-identity
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Apply review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('eng/apply-pr415-review-fixes.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '        var nativeSource = BuildSource("""\n',
              '        var nativeSource = BuildSource(\\"\\"\\"\n',
              1)
          text = text.replace(
              '\n""");\n        var fixed64Source',
              '\n\\"\\"\\");\n        var fixed64Source',
              1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 eng/apply-pr415-review-fixes.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/SharpLink.UnitTests/Runtime/RpcUnsafeBlitPlatformTests.cs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('public int Prefix;', 'public int Prefix { get; set; }')
          text = text.replace('public nint Handle;', 'public nint Handle { get; set; }')
          text = text.replace('public long Value;', 'public long Value { get; set; }')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Restore and format
        run: |
          dotnet restore Sharplink.slnx
          dotnet format whitespace Sharplink.slnx --no-restore

      - name: Validate focused suites
        run: |
          dotnet build Sharplink.slnx --no-restore -c Release -v minimal
          dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build
          dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Commit fixes
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test
          git commit -m "fix: address deterministic identity review gaps"
          git push origin HEAD:feature/issue-396-deterministic-rpc-identity
