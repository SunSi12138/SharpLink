name: Issue 311 new review fixes v2

on:
  push:
    branches:
      - fix/311-codec-scope-routing
    paths:
      - .github/workflows/issue-311-new-review-fixes-v2.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/311-codec-scope-routing
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Apply corrected patch script
        run: |
          python - <<'PYRUN'
          from pathlib import Path

          source = Path('.github/workflows/issue-311-new-review-fixes.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          raw = source[start:end]
          lines = raw.splitlines()
          first = next(line for line in lines if line.strip())
          indent = len(first) - len(first.lstrip())
          prefix = ' ' * indent
          script = '\n'.join(line[indent:] if line.startswith(prefix) else line for line in lines)
          script = script.replace(
              '    private sealed class ScopedPayload;',
              '    private sealed class ScopedPayload { }')
          exec(compile(script, 'issue-311-new-review-fixes.py', 'exec'), {'__name__': '__main__'})
          PYRUN

      - name: Format changed files
        run: >-
          dotnet format Sharplink.slnx whitespace --include
          src/SharpLink.Generator/RpcGenerator.DtoAnalysis.cs
          src/SharpLink.Generator/RpcGenerator.ContractManifest.cs
          src/SharpLink.Client/SharpLinkMultiClusterClientBuilder.cs
          test/SharpLink.Generator.Tests/RpcCodecRouteTests.cs
          test/SharpLink.Generator.Tests/RpcCodecRouteContractManifestTests.cs
          test/SharpLink.UnitTests/Client/RpcCodecRouteMultiClusterTests.cs

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Build
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Generator tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build

      - name: Unit tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Commit fixes
        run: |
          git config user.name "SunSi12138"
          git config user.email "54728594+SunSi12138@users.noreply.github.com"
          git add \
            src/SharpLink.Generator/RpcGenerator.DtoAnalysis.cs \
            src/SharpLink.Generator/RpcGenerator.ContractManifest.cs \
            src/SharpLink.Client/SharpLinkMultiClusterClientBuilder.cs \
            test/SharpLink.Generator.Tests/RpcCodecRouteTests.cs \
            test/SharpLink.Generator.Tests/RpcCodecRouteContractManifestTests.cs \
            test/SharpLink.UnitTests/Client/RpcCodecRouteMultiClusterTests.cs
          git diff --cached --check
          git commit -m "Address latest codec routing review feedback"
          git push origin HEAD:fix/311-codec-scope-routing
