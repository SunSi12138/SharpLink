name: Release Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-stop-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-dotnet
      - name: Frequent rolling restarts with failure dump capture
        shell: pwsh
        run: ./eng/run-windows-chaos-with-dump.ps1 -Attempts 1 -DurationSeconds 300 -RestartSeconds 1
      - name: Extract captured Windows wait diagnostics
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ChildItem artifacts/chaos/*.dmp | ForEach-Object {
            $tracePath = $_.FullName + '.waits.txt'
            & ./.tools/chaos-diagnostics/dotnet-dump.exe analyze $_.FullName `
              --command "threads" --command "clrstack -all" --command "syncblk" --command "dumpasync" --command "exit" `
              *> $tracePath
          }
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-stop-diagnostic-${{ matrix.repeat }}
          path: artifacts/chaos
          if-no-files-found: error
