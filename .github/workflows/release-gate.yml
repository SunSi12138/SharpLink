name: Release Gate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  matrix-build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Build
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Generator Tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build

      - name: Integration Tests
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.IntegrationTests
          --
          --timeout 60s
          --output Detailed
          --github-reporter-style full
          --no-progress
          --results-directory artifacts/test-results/integration-${{ runner.os }}
          --junit-output-path artifacts/test-results/integration-${{ runner.os }}/junit.xml
          --diagnostic
          --diagnostic-verbosity Trace
          --diagnostic-synchronous-write
          --diagnostic-output-directory artifacts/test-results/integration-${{ runner.os }}

      - name: Upload Integration Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ runner.os }}-diagnostics
          path: artifacts/test-results/integration-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 7

      - name: Pack
        run: dotnet pack Sharplink.slnx --no-build --no-restore -c Release -o artifacts/nuget -v minimal

      - name: Restore Package Smoke
        run: dotnet restore test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj --force --no-cache --configfile test/SharpLink.PackageSmoke/NuGet.config
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

      - name: Run Package Smoke
        run: dotnet run -c Release --no-restore --project test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

  aot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish AOT Smoke
        run: dotnet publish test/SharpLink.AotSmoke/SharpLink.AotSmoke.csproj -c Release -r linux-x64 /p:PublishAot=true -v minimal

      - name: Run AOT Smoke
        run: ./test/SharpLink.AotSmoke/bin/Release/net10.0/linux-x64/publish/SharpLink.AotSmoke

  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Pack
        run: dotnet pack Sharplink.slnx --no-restore -c Release -o artifacts/nuget -v minimal

      - name: Verify SDK Contains Generator
        run: unzip -l artifacts/nuget/SharpLink.Sdk.*.nupkg | grep -q 'analyzers/dotnet/cs/SharpLink.Generator.dll'

      - name: Restore Package Smoke
        run: dotnet restore test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj --force --no-cache --configfile test/SharpLink.PackageSmoke/NuGet.config
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

      - name: Run Package Smoke
        run: dotnet run -c Release --no-restore --project test/SharpLink.PackageSmoke/SharpLink.PackageSmoke.csproj
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget-package-smoke

      - name: Verify packages exist
        run: |
          ls -lah artifacts/nuget
          test -n "$(find artifacts/nuget -name '*.nupkg' -type f)"

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget/*.nupkg

  chaos-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run Release Chaos Smoke
        run: >-
          dotnet run -c Release
          --project test/SharpLink.ChaosTests
          --
          --duration-seconds 120
          --concurrency 32
          --restart-interval-seconds 10
          --json-output artifacts/chaos/release-smoke.json

      - name: Upload Chaos Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-release-smoke
          path: |
            artifacts/chaos/release-smoke.json
            artifacts/chaos/release-smoke.dmp
            artifacts/chaos/release-smoke.dmp.crashreport.json
          if-no-files-found: warn
          retention-days: 30

  release-summary:
    runs-on: ubuntu-latest
    needs: [matrix-build-test, aot-smoke, pack, chaos-smoke]
    if: ${{ success() }}
    steps:
      - name: Release gate passed
        run: echo "Release gate passed on all required checks."
