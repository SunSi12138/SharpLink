name: Release Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-stop-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-dotnet
      - name: Frequent rolling restarts with failure dump capture
        shell: pwsh
        run: ./eng/run-windows-chaos-with-dump.ps1 -Attempts 1 -DurationSeconds 300 -RestartSeconds 1
      - name: Extract failed Windows wait diagnostics
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path artifacts/chaos/release-smoke.dmp) {
            & ./.tools/chaos-diagnostics/dotnet-dump.exe analyze artifacts/chaos/release-smoke.dmp `
              --command "threads" --command "clrstack -all" --command "syncblk" --command "dumpasync" --command "exit" `
              *> artifacts/chaos/release-smoke-waits.txt
          }
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-stop-diagnostic-${{ matrix.repeat }}
          path: artifacts/chaos
          if-no-files-found: error
