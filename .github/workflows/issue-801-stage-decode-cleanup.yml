name: Issue 801 - Stage verified Decode compatibility queue removal
on:
  push:
    branches:
      - cleanup/issue-801-server-decode-queue
permissions:
  contents: write
jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'chore(issue-801)')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      TUNIT_MAX_PARALLEL_TESTS: '8'
    steps:
      - name: Checkout exact dev-based cleanup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Configure .NET 10
        uses: ./.github/actions/setup-dotnet
      - name: Get audited deterministic transformation
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/audit/issue-801-dev-3x-deadcode
          mkdir -p eng/issue801 artifacts/issue-801-decode-cleanup
          git show FETCH_HEAD:eng/issue801/remove-decode-compatibility.py > eng/issue801/remove-decode-compatibility.py
          python3 eng/issue801/remove-decode-compatibility.py artifacts/issue-801-decode-cleanup
          git diff --check
          git diff --stat -- src/SharpLink.Server/ServerDecodeExecutor.cs test/SharpLink.UnitTests/Server/ServerDecodeExecutorTests.cs test/SharpLink.UnitTests/Server/ServerDecodeExecutorSchedulerRaceTests.cs
      - name: Restore and build full Release
        run: |
          dotnet restore Sharplink.slnx -v minimal
          dotnet build Sharplink.slnx -c Release --no-restore -v minimal
      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build
      - name: Generator Tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build
      - name: Integration Tests
        run: dotnet run --project test/SharpLink.IntegrationTests -c Release --no-build --no-restore -- --maximum-parallel-tests 1 --timeout 120s
      - name: Commit only validated production/test cleanup and remove staging workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/SharpLink.Server/ServerDecodeExecutor.cs test/SharpLink.UnitTests/Server/ServerDecodeExecutorTests.cs test/SharpLink.UnitTests/Server/ServerDecodeExecutorSchedulerRaceTests.cs
          git rm -f .github/workflows/issue-801-stage-decode-cleanup.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "refactor(server): remove unused DecodeExecutor compatibility queue and migrate scheduler race tests (#801)"
          git push origin HEAD:refs/heads/cleanup/issue-801-server-decode-queue
