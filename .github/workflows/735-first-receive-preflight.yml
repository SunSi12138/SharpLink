name: 735 First Receive Admission Preflight

on:
  push:
    branches: ['perf/735-preflight-flags']

permissions:
  contents: read

concurrency:
  group: 735-first-receive-admission-preflight
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TUNIT_MAX_PARALLEL_TESTS: '8'
      DOTNET_PROCESSOR_COUNT: '4'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      CONTROL_SHA: e834d3c28c87ad496989af925515cf21babd308d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-dotnet
      - name: Pin unchanged production source and add isolated first-admission primitive
        run: |
          set -euo pipefail
          mkdir -p artifacts/first-receive
          git diff --exit-code "$CONTROL_SHA" -- src
          test "$(git hash-object eng/preflight-735-receive-admission.cs)" = 17f596f3f8348849e40557efa8d66092045c284d
          git rev-parse HEAD > artifacts/first-receive/preflight-head.txt
          printf '%s\n' "$CONTROL_SHA" > artifacts/first-receive/control.txt
          cp eng/preflight-735-receive-admission.cs src/SharpLink.Runtime/StreamFlowController.ReceiveAdmission.cs
          git add src/SharpLink.Runtime/StreamFlowController.ReceiveAdmission.cs
          git write-tree | tee artifacts/first-receive/candidate-tree.txt
          git diff --cached --binary > artifacts/first-receive/additive-prototype.patch
          dotnet --info > artifacts/first-receive/dotnet.txt
          lscpu > artifacts/first-receive/cpu.txt
      - name: Compile and run new first-receive contracts
        run: |
          set -euo pipefail
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true 2>&1 | tee artifacts/first-receive/default-build.log
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU -- --treenode-filter '/*/*/StreamFlowControllerFirstReceiveAdmissionTests/*' 2>&1 | tee artifacts/first-receive/new-contracts.log
      - name: Preserve complete runtime and original engineering gates
        run: |
          set -euo pipefail
          dotnet format whitespace test/SharpLink.UnitTests/SharpLink.UnitTests.csproj --no-restore --verify-no-changes --include src/SharpLink.Runtime/StreamFlowController.ReceiveAdmission.cs test/SharpLink.UnitTests/Runtime/StreamFlowControllerFirstReceiveAdmissionTests.cs 2>&1 | tee artifacts/first-receive/format.log
          python3 eng/check-project-reference-boundaries.py 2>&1 | tee artifacts/first-receive/references.log
          bash eng/check-maintainability.sh 2>&1 | tee artifacts/first-receive/maintainability.log
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU 2>&1 | tee artifacts/first-receive/full-unit.log
      - name: Reject deliberately split resolution and admission without changing old APIs
        run: |
          set -euo pipefail
          target=src/SharpLink.Runtime/StreamFlowController.ReceiveAdmission.cs
          trap 'cp eng/preflight-735-receive-admission.cs "$target"' EXIT
          python3 - <<'PY'
          import pathlib
          target=pathlib.Path('src/SharpLink.Runtime/StreamFlowController.ReceiveAdmission.cs')
          target.write_text('''namespace SharpLink.Runtime;
          internal sealed partial class StreamFlowController
          {
              internal ResolvedReceiveCreditLease AcceptReceivedCreditLease(long requestId, ushort streamId, int encodedBytes)
              {
                  var lease = ResolveReceiveCreditLease(requestId, streamId);
                  AcceptReceived(in lease, encodedBytes);
                  return lease;
              }
          }
          ''')
          pathlib.Path('artifacts/first-receive/split-negative-control.cs').write_text(target.read_text())
          PY
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true 2>&1 | tee artifacts/first-receive/negative-build.log
          set +e
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU -- --treenode-filter '/*/*/StreamFlowControllerFirstReceiveAdmissionTests/*' > artifacts/first-receive/negative-contracts.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('artifacts/first-receive/negative-contracts.log').read_text()
          text=re.sub(r'\x1b\[[0-9;]*m','',text)
          print(text)
          assert re.search(r'total:\s+9\b',text),text
          assert re.search(r'failed:\s+2\b',text),text
          assert re.search(r'succeeded:\s+7\b',text),text
          assert 'failed RejectedFirstReceiveMustNotConsumeStateCapacity' in text,text
          assert 'failed InvalidFirstFrameMustNotPublishState' in text,text
          PY
      - name: Restore exact candidate and rerun its contracts
        run: |
          set -euo pipefail
          test "$(git hash-object src/SharpLink.Runtime/StreamFlowController.ReceiveAdmission.cs)" = 17f596f3f8348849e40557efa8d66092045c284d
          git diff --exit-code -- src
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true 2>&1 | tee artifacts/first-receive/restored-build.log
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU -- --treenode-filter '/*/*/StreamFlowControllerFirstReceiveAdmissionTests/*' 2>&1 | tee artifacts/first-receive/restored-contracts.log
      - name: Build the same mechanism host for JIT and actual NativeAOT
        run: |
          set -euo pipefail
          dotnet build test/SharpLink.FirstReceiveAdmissionEvidence -c Release -p:Platform=AnyCPU -p:PublishAot=false -p:TreatWarningsAsErrors=true 2>&1 | tee artifacts/first-receive/jit-build.log
          dotnet test/SharpLink.FirstReceiveAdmissionEvidence/bin/Release/net10.0/SharpLink.Benchmarks.dll --self-test 2>&1 | tee artifacts/first-receive/jit-checks.log
          dotnet publish test/SharpLink.FirstReceiveAdmissionEvidence -c Release -r linux-x64 -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true -o artifacts/first-receive-native 2>&1 | tee artifacts/first-receive/native-build.log
          artifacts/first-receive-native/SharpLink.Benchmarks --self-test 2>&1 | tee artifacts/first-receive/native-checks.log
      - name: Fixed candidate-internal keyed versus separate versus fused mechanism controls
        run: |
          set -euo pipefail
          root="$PWD/artifacts/first-receive/measurements"
          mkdir -p "$root"
          printf 'runtime,launch,exit\n' > "$root/exits.csv"
          failures=0
          for launch in 0 1; do
            modes='jit-pgo0 native jit-pgo1'
            if [[ "$launch" == 1 ]]; then modes='jit-pgo1 native jit-pgo0'; fi
            for runtime in $modes; do
              set +e
              if [[ "$runtime" == native ]]; then
                taskset -c 0-3 artifacts/first-receive-native/SharpLink.Benchmarks "$root/$runtime-r$launch.csv" > "$root/$runtime-r$launch.log" 2>&1
              else
                pgo=0; if [[ "$runtime" == jit-pgo1 ]]; then pgo=1; fi
                env DOTNET_ReadyToRun=0 DOTNET_TieredCompilation=1 DOTNET_TieredPGO="$pgo" DOTNET_TC_QuickJitForLoops=1 taskset -c 0-3 dotnet test/SharpLink.FirstReceiveAdmissionEvidence/bin/Release/net10.0/SharpLink.Benchmarks.dll "$root/$runtime-r$launch.csv" > "$root/$runtime-r$launch.log" 2>&1
              fi
              code=$?
              set -e
              printf '%s,%s,%s\n' "$runtime" "$launch" "$code" >> "$root/exits.csv"
              if [[ "$code" != 0 ]]; then failures=$((failures+1)); fi
            done
          done
          test "$failures" = 0
      - name: Verify full population and report negatives without a performance acceptance shortcut
        if: always()
        run: |
          python3 - <<'PY'
          import csv,itertools,json,math,pathlib,statistics
          root=pathlib.Path('artifacts/first-receive/measurements')
          with (root/'exits.csv').open() as f: exits=list(csv.DictReader(f))
          assert len(exits)==6 and all(r['exit']=='0' for r in exits),exits
          results=[]
          for runtime in ('jit-pgo0','jit-pgo1','native'):
              groups={}
              for launch in (0,1):
                  with (root/f'{runtime}-r{launch}.csv').open() as f: rows=list(csv.DictReader(f))
                  expected=set(itertools.product(('Keyed','SeparateResolved','FusedFirst'),(1,32),(1,64),range(6)))
                  observed={(r['mode'],int(r['active_streams']),int(r['items_per_stream']),int(r['repeat'])) for r in rows}
                  assert len(rows)==72 and observed==expected,(runtime,launch,'population mismatch')
                  for row in rows:
                      assert int(row['items'])==262144 and int(row['checksum'])==4194304,row
                      assert math.isfinite(float(row['ns_per_item'])) and float(row['ns_per_item'])>0,row
                      assert float(row['allocated_bytes_per_item'])>=0,row
                  groups[launch]=rows
              for active in (1,32):
                  for length in (1,64):
                      values={mode:[r for rows in groups.values() for r in rows if r['mode']==mode and int(r['active_streams'])==active and int(r['items_per_stream'])==length] for mode in ('Keyed','SeparateResolved','FusedFirst')}
                      med=lambda mode,key:statistics.median(float(r[key]) for r in values[mode])
                      results.append(dict(runtime=runtime,active=active,items_per_stream=length,
                          keyed_ns=med('Keyed','ns_per_item'),separate_ns=med('SeparateResolved','ns_per_item'),fused_ns=med('FusedFirst','ns_per_item'),
                          fused_vs_separate_ns_improvement_pct=(1-med('FusedFirst','ns_per_item')/med('SeparateResolved','ns_per_item'))*100,
                          fused_vs_keyed_ns_improvement_pct=(1-med('FusedFirst','ns_per_item')/med('Keyed','ns_per_item'))*100,
                          keyed_b=med('Keyed','allocated_bytes_per_item'),separate_b=med('SeparateResolved','allocated_bytes_per_item'),fused_b=med('FusedFirst','allocated_bytes_per_item')))
          text=json.dumps(results,indent=2)
          (root/'summary.json').write_text(text+'\n')
          print(text)
          print('6/6 processes, 432/432 mechanism rows; NOT production RPC acceptance.')
          PY
      - name: Retain exact source, regressions and all mechanism samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 735-first-receive-preflight-${{ github.sha }}
          path: artifacts/first-receive
          if-no-files-found: error
          retention-days: 30
