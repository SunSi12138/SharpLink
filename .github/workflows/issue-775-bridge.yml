name: Issue 775 no-stream bridge experiment
on:
  push:
    branches: [prototype/775-static-session-binding]
    paths:
      - eng/issue775/bridge.patch
      - eng/issue775/bridge.py
      - eng/issue775/BridgeChecks.cs
      - eng/issue775/test_bridge.py
      - .github/workflows/issue-775-bridge.yml
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        mode: [default, codegen]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6cfb09e7dd6b68695f92d28f726340bc8eb39e1d
          path: old
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6cfb09e7dd6b68695f92d28f726340bc8eb39e1d
          path: candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: driver/global.json
      - name: Validate fixed experiment and existing readers
        run: |
          python3 -m unittest discover -s driver/eng/issue775 -p test_bridge.py -v
          python3 -m unittest discover -s driver/eng/issue775 -p test_client_send.py -v
          python3 -m unittest discover -s driver/eng/issue775 -p test_attribution.py -v
      - name: Check exact candidate semantics and actual generated caller
        run: |
          args=()
          if [[ '${{ matrix.mode }}' == 'default' ]]; then args+=(--default-only); fi
          python3 driver/eng/issue775/bridge.py --old old --candidate candidate \
            --driver driver --output bridge "${args[@]}"
      - name: Preserve source and every failure
        if: always()
        run: |
          mkdir -p bridge
          git -C driver rev-parse HEAD > bridge/driver-sha.txt
          git -C driver archive HEAD | gzip > bridge/driver-source.tar.gz
          if test -f bridge/candidate-identity.json; then cat bridge/candidate-identity.json | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if test -f bridge/execution-failures.json; then cat bridge/execution-failures.json; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue775-bridge-${{ matrix.mode }}-${{ github.sha }}
          path: |
            bridge/
            candidate/test/**/TestResults/
          retention-days: 30
          if-no-files-found: error
