name: Stream Nullability Investigation
on:
  push:
    branches: ['validation/731-stream-nullability']
    paths:
      - 'eng/perf/stream-nullability/**'
      - 'test/SharpLink.NullabilityEvidence/**'
      - '.github/workflows/stream-nullability-investigation.yml'
permissions:
  contents: read
jobs:
  bounded-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.112'
      - name: Paired JIT, TieredPGO, NativeAOT, stream regression, and ceiling control
        run: python3 eng/perf/stream-nullability/run.py --out artifacts/stream-nullability --rounds 3 --aot --full --ceiling
      - name: Package bounded evidence without executables or worktrees
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path('artifacts/stream-nullability');dest=pathlib.Path('artifacts/stream-nullability-evidence.zip')
          with zipfile.ZipFile(dest,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for f in sorted(root.glob('*')):
                  if f.is_file() and f.suffix in ('.txt','.log','.json','.jsonl','.asm'):
                      assert f.stat().st_size < 12*1024*1024
                      z.write(f,f.name)
          assert dest.stat().st_size<=16*1024*1024
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stream-nullability-evidence
          path: artifacts/stream-nullability-evidence.zip
          retention-days: 30
          if-no-files-found: error
