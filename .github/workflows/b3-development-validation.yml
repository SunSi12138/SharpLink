name: B3 Development Validation
on:
  push:
    branches: [work/742-b3-production-20261011]
    paths: [eng/b3-development/**, .github/workflows/b3-development-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_PROCESSOR_COUNT: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.102
      - name: Construct source-pinned development candidate
        run: |
          set -euo pipefail
          python eng/b3-development/apply.py
          git rev-parse HEAD > artifacts/b3-development/branch-commit.txt
          dotnet --info > artifacts/b3-development/dotnet-info.txt
          git diff -- src test > artifacts/b3-development/tracked.patch
      - name: Build actual repository unit tests
        run: |
          set -euo pipefail
          taskset -c 0,1 dotnet build test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release 2>&1 | tee artifacts/b3-development/build.log
      - name: Run focused CSharp regressions
        run: |
          set -euo pipefail
          taskset -c 0,1 dotnet run --no-build --no-launch-profile -c Release --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -- --treenode-filter '/*/*/WriterReadySchedulerTests/*' --maximum-parallel-tests 1 --report-trx --report-trx-filename focused.trx --results-directory "$PWD/artifacts/b3-development/focused" 2>&1 | tee artifacts/b3-development/focused.log
          python - <<'PY'
          import xml.etree.ElementTree as E, pathlib, json
          p=pathlib.Path('artifacts/b3-development/focused/focused.trx')
          root=E.parse(p).getroot(); rows=root.findall('.//{*}UnitTestResult')
          data={'tests':len(rows),'passed':sum(x.attrib.get('outcome')=='Passed' for x in rows),'names':[x.attrib['testName'] for x in rows]}
          pathlib.Path('artifacts/b3-development/focused-result.json').write_text(json.dumps(data,indent=2))
          assert data['tests']==22 and data['passed']==22, data
          PY
      - name: Run complete repository unit tests
        run: |
          set -euo pipefail
          taskset -c 0,1 dotnet run --no-build --no-launch-profile -c Release --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -- --maximum-parallel-tests 2 --report-trx --report-trx-filename full.trx --results-directory "$PWD/artifacts/b3-development/full" 2>&1 | tee artifacts/b3-development/full.log
      - name: Capture compiled source set
        if: always()
        run: |
          python - <<'PY'
          import pathlib, json, shutil
          out=pathlib.Path('artifacts/b3-development'); out.mkdir(parents=True,exist_ok=True)
          manifest=out/'source-sha256.json'
          if manifest.exists():
            for name in json.loads(manifest.read_text()):
              dst=out/'sources'/name; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(name,dst)
          for src in pathlib.Path('eng/b3-development').glob('*Tests.cs'):
            dst=out/'sources/test/SharpLink.UnitTests/Runtime'/src.name; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(src,dst)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: b3-development-validation-${{ github.sha }}
          path: artifacts/b3-development
          compression-level: 6
          retention-days: 7
          if-no-files-found: error
