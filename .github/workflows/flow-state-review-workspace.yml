name: Flow State Review Workspace

on:
  pull_request:
    branches: [dev]
    paths: ['.github/workflows/flow-state-review-workspace.yml']

permissions:
  contents: read

jobs:
  workspace:
    if: github.event.pull_request.number == 742
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact review head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
      - name: Restore review dependencies
        run: dotnet restore Sharplink.slnx
      - name: Export tracked sources and public build dependencies
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/flow-state-review"
          mkdir -p "$out"
          git archive --format=tar HEAD | gzip -1 > "$out/candidate-source.tar.gz"
          git archive --format=tar 56c643cd308f294cb03df79d9f1214fb8292affb | gzip -1 > "$out/baseline-source.tar.gz"
          git diff 56c643cd308f294cb03df79d9f1214fb8292affb HEAD > "$out/candidate.patch"
          git rev-parse HEAD > "$out/candidate-sha.txt"
          dotnet --info > "$out/dotnet-info.txt"
          dotnet_root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          sdk="$(dotnet --version)"
          paths=(dotnet "sdk/$sdk")
          for family in host/fxr shared/Microsoft.NETCore.App shared/Microsoft.AspNetCore.App packs/Microsoft.NETCore.App.Ref packs/Microsoft.AspNetCore.App.Ref packs/Microsoft.NETCore.App.Host.linux-x64; do
            for directory in "$dotnet_root/$family"/10.*; do
              if [[ -d "$directory" ]]; then
                paths+=("${directory#"$dotnet_root/"}")
              fi
            done
          done
          # Deliberately exclude checkout credentials, .git, runner environment and NuGet config.
          tar -C "$dotnet_root" -czf "$out/dotnet-toolchain.tar.gz" "${paths[@]}"
          tar -C "$HOME/.nuget" -czf "$out/nuget-packages.tar.gz" packages
          sha256sum "$out"/*.tar.gz > "$out/archive-sha256.txt"
      - name: Upload isolated review inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flow-state-review-workspace-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/flow-state-review
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
