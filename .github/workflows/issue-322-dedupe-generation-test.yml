name: Issue 322 Dedupe Generation Test

on:
  push:
    branches:
      - issue-322-admission-program-generation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-322-admission-program-generation
          fetch-depth: 0

      - name: Remove duplicated barrier insertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/SharpLink.IntegrationTests/DynamicAdmissionGenerationTests.cs')
          text = path.read_text()
          replacements = [
              (
                  '        var captureCompleted = new TaskCompletionSource(\n            TaskCreationOptions.RunContinuationsAsynchronously);\n        var captureCompleted = new TaskCompletionSource(\n            TaskCreationOptions.RunContinuationsAsynchronously);\n',
                  '        var captureCompleted = new TaskCompletionSource(\n            TaskCreationOptions.RunContinuationsAsynchronously);\n'
              ),
              (
                  '                captureCompleted.TrySetResult();\n                captureCompleted.TrySetResult();\n',
                  '                captureCompleted.TrySetResult();\n'
              ),
              (
                  '                await captureCompleted.Task.WaitAsync(TimeSpan.FromSeconds(5));\n                await captureCompleted.Task.WaitAsync(TimeSpan.FromSeconds(5));\n',
                  '                await captureCompleted.Task.WaitAsync(TimeSpan.FromSeconds(5));\n'
              )
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one duplicate pair, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit dedupe and remove helper
        shell: bash
        run: |
          rm .github/workflows/issue-322-dedupe-generation-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/SharpLink.IntegrationTests/DynamicAdmissionGenerationTests.cs .github/workflows/issue-322-dedupe-generation-test.yml
          git commit -m "test(server): dedupe admission publication barrier"
          git push origin HEAD:issue-322-admission-program-generation
