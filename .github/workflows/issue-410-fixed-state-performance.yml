name: Issue 410 FixedWindow state performance

on:
  push:
    branches:
      - tmp/issue-410-fixed-lineage-cleanup-20260906

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET CI environment
        uses: ./.github/actions/setup-dotnet
      - name: Compare current PR vs cleaned Fixed state
        shell: bash
        env:
          PRE_SHA: 45ea9ff2143f5b5896f99349197f28d8489d9b32
        run: |
          set -euo pipefail
          lineage_script="$RUNNER_TEMP/lineage.py"
          sequence_script="$RUNNER_TEMP/sequence.py"
          cp .github/issue410-fixed-lineage-cleanup.py "$lineage_script"
          cp .github/issue410-fixed-sequence-cleanup.py "$sequence_script"
          output="$RUNNER_TEMP/issue410-fixed-state-performance"
          mkdir -p "$output"
          dotnet --info > "$output/dotnet-info.txt"
          lscpu > "$output/cpu.txt"

          run_pre() {
            local label="$1"
            git reset --hard
            git clean -fdx
            git checkout --force "$PRE_SHA"
            dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
            rm -rf BenchmarkDotNet.Artifacts
            dotnet run -c Release --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -- \
              --filter '*AdmissionRateControllerBenchmarks.FixedWindow*'
            mkdir -p "$output/$label"
            cp -R BenchmarkDotNet.Artifacts/. "$output/$label/"
          }

          run_post() {
            local label="$1"
            git reset --hard
            git clean -fdx
            git checkout --force "$PRE_SHA"
            mkdir -p .github
            cp "$lineage_script" .github/issue410-fixed-lineage-cleanup.py
            cp "$sequence_script" .github/issue410-fixed-sequence-cleanup.py
            python3 .github/issue410-fixed-lineage-cleanup.py
            python3 .github/issue410-fixed-sequence-cleanup.py
            dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
            rm -rf BenchmarkDotNet.Artifacts
            dotnet run -c Release --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -- \
              --filter '*AdmissionRateControllerBenchmarks.FixedWindow*'
            mkdir -p "$output/$label"
            cp -R BenchmarkDotNet.Artifacts/. "$output/$label/"
          }

          run_pre pre-forward
          run_post post-forward
          run_post post-reverse
          run_pre pre-reverse

          git checkout --force "$GITHUB_SHA"
          mkdir -p artifacts/issue410-fixed-state-performance
          cp -R "$output/." artifacts/issue410-fixed-state-performance/
      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-410-fixed-state-performance-${{ github.sha }}
          path: artifacts/issue410-fixed-state-performance
          if-no-files-found: error
          retention-days: 30
