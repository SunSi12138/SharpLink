name: 742 Quiescent Retirement Correctness and Screen
on:
  push:
    branches: ['perf/735-preflight-flags']
    paths:
      - '.github/workflows/742-quiescent-screen.yml'
      - 'eng/preflight-742-quiescent/**'
permissions:
  contents: read
concurrency:
  group: 742-quiescent-screen
  cancel-in-progress: false
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_PROCESSOR_COUNT: '4'
      TUNIT_MAX_PARALLEL_TESTS: '8'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Pin original C N unchanged F and exact final G
        run: |
          set -euo pipefail
          python3 eng/preflight-742-quiescent/self-tests.py
          python3 eng/preflight-742-quiescent/prepare.py "$RUNNER_TEMP/quiescent"
          echo "CONTROL_ROOT=$RUNNER_TEMP/quiescent/n-reconstruction/control" >> "$GITHUB_ENV"
          echo "OLD_N_ROOT=$RUNNER_TEMP/quiescent/n-reconstruction/candidate" >> "$GITHUB_ENV"
          echo "PRIOR_F_ROOT=$RUNNER_TEMP/quiescent/prior-f" >> "$GITHUB_ENV"
          echo "CANDIDATE_ROOT=$RUNNER_TEMP/quiescent/candidate" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$(python3 -c 'import json; print(json.load(open("eng/preflight-742-quiescent/candidate.json"))["candidate_tree"])')" >> "$GITHUB_ENV"
          echo "OUT=$PWD/artifacts/quiescent-correctness" >> "$GITHUB_ENV"
          mkdir -p artifacts/quiescent-correctness
          cp "$RUNNER_TEMP/quiescent/identities.json" artifacts/quiescent-correctness/
          dotnet --info > artifacts/quiescent-correctness/dotnet.txt
          lscpu > artifacts/quiescent-correctness/cpu.txt
      - name: Original registry terminal and admission negative controls with source restoration
        run: |
          set -euo pipefail
          python3 eng/preflight-742-quiescent/original-controls.py "$CONTROL_ROOT" "$CANDIDATE_ROOT" "$OUT/original-controls"
      - name: Final author supplied portable old-N controls with source restoration
        run: |
          set -euo pipefail
          python3 eng/preflight-742-quiescent/author-controls.py "$OLD_N_ROOT" "$CANDIDATE_ROOT" "$OUT/author-controls"
      - name: Final author supplied portable F-negative controls with source restoration
        run: |
          set -euo pipefail
          python3 eng/preflight-742-quiescent/counter-controls.py "$PRIOR_F_ROOT" "$CANDIDATE_ROOT" "$OUT/g-controls"
      - name: Pristine F full cold and warm lifecycle allocation baseline
        run: |
          set -euo pipefail
          git -C "$PRIOR_F_ROOT" diff --exit-code -- src test
          dotnet build "$PRIOR_F_ROOT/test/SharpLink.UnitTests" -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true -m:1 /nodeReuse:false -p:UseSharedCompilation=false > "$OUT/f-build.log" 2>&1 || { cat "$OUT/f-build.log"; exit 1; }
          python3 eng/preflight-742-redesign/lifecycle.py control "$PRIOR_F_ROOT" "$OUT"
      - name: Exact G build and full original default engineering and unit gates
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ROOT"
          git diff --exit-code -- src test
          test "$(git write-tree)" = "$CANDIDATE_TREE"
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true -m:1 /nodeReuse:false -p:UseSharedCompilation=false > "$OUT/final-build.log" 2>&1 || { cat "$OUT/final-build.log"; exit 1; }
          mapfile -t changed < <(git diff --cached --name-only -- src test)
          dotnet format whitespace test/SharpLink.UnitTests/SharpLink.UnitTests.csproj --no-restore --verify-no-changes --include "${changed[@]}" 2>&1 | tee "$OUT/format.log"
          python3 eng/check-project-reference-boundaries.py 2>&1 | tee "$OUT/references.log"
          bash eng/check-maintainability.sh 2>&1 | tee "$OUT/maintainability.log"
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU 2>&1 | tee "$OUT/default-unit.log"
          sha256sum src/SharpLink.Runtime/bin/Release/net10.0/SharpLink.Runtime.dll test/SharpLink.UnitTests/bin/Release/net10.0/SharpLink.UnitTests.dll > "$OUT/default-g-binaries.sha256"
      - name: Exact G full cold and warm lifecycle matrix with unchanged allocation threshold
        run: |
          set -euo pipefail
          python3 eng/preflight-742-quiescent/actual-setup.py "$PRIOR_F_ROOT" "$CANDIDATE_ROOT" "$OUT/actual-setup"
          python3 eng/preflight-742-quiescent/production-lifecycle.py "$PRIOR_F_ROOT" "$CANDIDATE_ROOT" "$OUT/production-lifecycle"
          python3 eng/preflight-742-redesign/lifecycle.py candidate "$CANDIDATE_ROOT" "$OUT"
      - name: Preserve original single-consumption and suspended-consumer negative controls
        run: |
          set -euo pipefail
          python3 eng/preflight-742-redesign/ownership-controls.py "$CANDIDATE_ROOT" "$OUT"
      - name: Restore exact G and original deterministic allocation gate
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ROOT"
          git diff --exit-code -- src test
          test "$(git write-tree)" = "$CANDIDATE_TREE"
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true -m:1 /nodeReuse:false -p:UseSharedCompilation=false > "$OUT/restored-build.log" 2>&1 || { cat "$OUT/restored-build.log"; exit 1; }
          for suite in ClientStreamValueTaskConsumptionTests PooledDispatcherSlowWaitTests; do
            dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU -- --treenode-filter "/*/*/$suite/*" 2>&1 | tee "$OUT/$suite-final.log"
          done
          dotnet build test/SharpLink.Benchmarks -c Release -p:Platform=AnyCPU -p:PublishAot=false -p:TreatWarningsAsErrors=true > "$OUT/benchmark-build.log" 2>&1 || { cat "$OUT/benchmark-build.log"; exit 1; }
          SHARPLINK_ALLOCATION_OUTPUT="$OUT/allocation-gate.json" bash eng/run-allocation-gate.sh 2>&1 | tee "$OUT/allocation-gate.log"
      - name: Original 171 writer checks and complete experimental unit suite
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ROOT"
          python3 eng/test-ready-writer.py 2>&1 | tee "$OUT/writer-source-checks.log"
          python3 eng/test-ready-writer-budget.py 2>&1 | tee "$OUT/writer-budget-checks.log"
          python3 eng/test-ready-writer-collection.py 2>&1 | tee "$OUT/writer-collection-checks.log"
          python3 eng/test-ready-writer-native.py 2>&1 | tee "$OUT/writer-native-source-checks.log"
          python3 eng/prepare-ready-writer.py --apply
          dotnet build test/SharpLink.Benchmarks -c Release -p:ReadyWriterExperiment=true -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true > "$OUT/writer-build.log" 2>&1 || { cat "$OUT/writer-build.log"; exit 1; }
          dotnet test/SharpLink.Benchmarks/bin/Release/net10.0/SharpLink.Benchmarks.dll --ready-writer-self-test 2>&1 | tee "$OUT/writer-checks.log"
          grep -Fx '171/171 ready writer transport checks passed.' "$OUT/writer-checks.log"
          dotnet build test/SharpLink.UnitTests -c Release -p:Platform=AnyCPU -p:TreatWarningsAsErrors=true > "$OUT/experimental-build.log" 2>&1 || { cat "$OUT/experimental-build.log"; exit 1; }
          dotnet test --project test/SharpLink.UnitTests -c Release --no-build -p:Platform=AnyCPU 2>&1 | tee "$OUT/experimental-unit.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: 742-quiescent-correctness-${{ github.sha }}
          path: |
            artifacts/quiescent-correctness
            ${{ runner.temp }}/quiescent/candidate/artifacts/first-receive-integration
            ${{ runner.temp }}/quiescent/prior-f/artifacts/first-receive-integration
          if-no-files-found: error
          retention-days: 30

  untraced-dfg-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_PROCESSOR_COUNT: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Reconstruct exact D F G and build common original benchmark hosts
        run: |
          set -euo pipefail
          python3 eng/preflight-742-quiescent/prepare.py "$RUNNER_TEMP/quiescent" --include-dev
          mkdir -p artifacts/quiescent-screen
          cp "$RUNNER_TEMP/quiescent/identities.json" artifacts/quiescent-screen/
          cp -a "$RUNNER_TEMP/quiescent/prior-f/artifacts/first-receive-integration" artifacts/quiescent-screen/parent-f-source
          cp -a "$RUNNER_TEMP/quiescent/candidate/artifacts/first-receive-integration" artifacts/quiescent-screen/candidate-g-source
          dotnet --info > artifacts/quiescent-screen/dotnet.txt
          lscpu > artifacts/quiescent-screen/cpu.txt
          python3 - <<'PY'
          import os
          available = sorted(os.sched_getaffinity(0))
          assert len(available) >= 4, 'The screen requires four available CPUs; do not silently change capacity.'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CPU_LIST=' + ','.join(map(str, available[:4])) + '\n')
          PY
          for label in dev prior-f candidate; do
            root="$RUNNER_TEMP/quiescent/$label"
            safe="${label//\//-}"
            for project in SharpLink.Benchmarks SharpLink.StreamLoadTest; do
              dotnet build "$root/test/$project" -c Release -p:PublishAot=false -m:1 /nodeReuse:false -p:UseSharedCompilation=false > "artifacts/quiescent-screen/build-$safe-$project.log" 2>&1 || { cat "artifacts/quiescent-screen/build-$safe-$project.log"; exit 1; }
            done
          done
      - name: Six complete arm permutations with unchanged workload phase order
        run: |
          set -euo pipefail
          python3 eng/preflight-742-quiescent/screen.py "$RUNNER_TEMP/quiescent/dev" "$RUNNER_TEMP/quiescent/prior-f" "$RUNNER_TEMP/quiescent/candidate" artifacts/quiescent-screen/raw --affinity "$CPU_LIST"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: 742-quiescent-DFG-screen-${{ github.sha }}
          path: artifacts/quiescent-screen
          if-no-files-found: error
          retention-days: 30
