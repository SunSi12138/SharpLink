name: Nonce Recovery Deterministic Diagnostic

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.github/workflows/nonce-recovery-diagnostic.yml'
      - 'eng/nonce-recovery-diagnostic/**'
      - 'test/SharpLink.IntegrationTests/SharedMemoryTransportConnectionIntegrationTests.ProcessAndHandshake.cs'
      - 'src/SharpLink.Runtime/Transport/SharedMemoryTransport.cs'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      TUNIT_MAX_PARALLEL_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-dotnet
      - name: Validate diagnostic tool rejection controls
        run: python3 eng/nonce-recovery-diagnostic/test_run.py
      - name: Gated old-backlog and exact fixture negative controls
        run: python3 eng/nonce-recovery-diagnostic/run.py --out artifacts/nonce-recovery-diagnostic
      - name: Retain every source overlay, binary identity and result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nonce-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/nonce-recovery-diagnostic
          if-no-files-found: error
          retention-days: 30
          overwrite: false
