name: Issue 368 Admission Benchmark Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  benchmark:
    if: github.event.pull_request.number == 463
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate

      - name: Checkout current dev baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dev
          path: baseline

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Publish compared revisions
        shell: bash
        run: |
          echo "baseline=$(git -C baseline rev-parse HEAD)"
          echo "candidate=$(git -C candidate rev-parse HEAD)"

      - name: Install identical admission benchmark in baseline
        shell: bash
        run: cp candidate/test/SharpLink.Benchmarks/ServerCallAdmissionHotPathBenchmarks.cs baseline/test/SharpLink.Benchmarks/

      - name: Admission microbenchmark - dev baseline
        shell: bash
        run: |
          dotnet run -c Release --project baseline/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -- \
            --filter "*ServerCallAdmissionHotPathBenchmarks*" \
            --artifacts "$GITHUB_WORKSPACE/artifacts/baseline-admission" | tee baseline-admission.log

      - name: Admission microbenchmark - PR candidate
        shell: bash
        run: |
          dotnet run -c Release --project candidate/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -- \
            --filter "*ServerCallAdmissionHotPathBenchmarks*" \
            --artifacts "$GITHUB_WORKSPACE/artifacts/candidate-admission" | tee candidate-admission.log

      - name: End-to-end RPC dispatch - dev baseline
        shell: bash
        run: |
          dotnet run -c Release --project baseline/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -- \
            --filter "*AdmissionRpcBenchmarks.Disabled*" \
            --artifacts "$GITHUB_WORKSPACE/artifacts/baseline-rpc" | tee baseline-rpc.log

      - name: End-to-end RPC dispatch - PR candidate
        shell: bash
        run: |
          dotnet run -c Release --project candidate/test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -- \
            --filter "*AdmissionRpcBenchmarks.Disabled*" \
            --artifacts "$GITHUB_WORKSPACE/artifacts/candidate-rpc" | tee candidate-rpc.log

      - name: Benchmark evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "### #368 admission benchmark evidence"
            echo
            echo '```text'
            echo "baseline=$(git -C baseline rev-parse HEAD)"
            echo "candidate=$(git -C candidate rev-parse HEAD)"
            for file in baseline-admission.log candidate-admission.log baseline-rpc.log candidate-rpc.log; do
              if [[ -f "$file" ]]; then
                echo
                echo "===== $file ====="
                grep -E '^\| .*(AcquireAndRelease|Disabled).*\|' "$file" || true
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
