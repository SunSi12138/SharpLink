name: Codec Mobile Lab

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: codec-mobile-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      SHARPLINK_COMMIT: ${{ github.sha }}
      ANDROID_API: '36'
      ANDROID_AVD: sharplink-codec
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Record SDK version
        shell: bash
        run: echo "SHARPLINK_SDK_VERSION=$(dotnet --version)" >> "$GITHUB_ENV"

      - name: Prepare Android x64 emulator
        shell: bash
        run: |
          sudo chmod 666 /dev/kvm || true
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-$ANDROID_API" "system-images;android-$ANDROID_API;google_apis;x86_64"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo no | "$AVDMANAGER" create avd --force --name "$ANDROID_AVD" --package "system-images;android-$ANDROID_API;google_apis;x86_64" --device pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$ANDROID_AVD" -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > artifacts-android-emulator.log 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              break
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.product.cpu.abi

      - name: Build and run Android Mono producer
        shell: bash
        run: |
          rm -rf test/SharpLink.CodecCompatibility.Android/bin test/SharpLink.CodecCompatibility.Android/obj
          dotnet build -c Debug -f net10.0-android -r android-x64 \
            test/SharpLink.CodecCompatibility.Android/SharpLink.CodecCompatibility.Android.csproj \
            -t:SignAndroidPackage \
            -p:CodecRuntime=mono \
            -p:AndroidPackageFormats=apk \
            -p:AndroidBuildApplicationPackage=true
          apk="$(find test/SharpLink.CodecCompatibility.Android/bin/Debug -name '*-Signed.apk' -type f | head -n 1)"
          test -n "$apk"
          adb install -r "$apk"
          node test/SharpLink.CodecCompatibility.Android/run-android.mjs \
            produce artifacts/codec-compat/android-mono-corpus \
            "$SHARPLINK_COMMIT" "$SHARPLINK_SDK_VERSION"
          adb uninstall com.sharplink.codeccompat || true

      - name: Build and run Android CoreCLR producer
        shell: bash
        run: |
          rm -rf test/SharpLink.CodecCompatibility.Android/bin test/SharpLink.CodecCompatibility.Android/obj
          dotnet build -c Debug -f net10.0-android -r android-x64 \
            test/SharpLink.CodecCompatibility.Android/SharpLink.CodecCompatibility.Android.csproj \
            -t:SignAndroidPackage \
            -p:CodecRuntime=coreclr \
            -p:AndroidPackageFormats=apk \
            -p:AndroidBuildApplicationPackage=true
          apk="$(find test/SharpLink.CodecCompatibility.Android/bin/Debug -name '*-Signed.apk' -type f | head -n 1)"
          test -n "$apk"
          adb install -r "$apk"
          node test/SharpLink.CodecCompatibility.Android/run-android.mjs \
            produce artifacts/codec-compat/android-coreclr-corpus \
            "$SHARPLINK_COMMIT" "$SHARPLINK_SDK_VERSION"

      - name: Upload Android Mono corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codec-corpus-android-x64-mono-lab
          path: artifacts/codec-compat/android-mono-corpus
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Android CoreCLR corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codec-corpus-android-x64-coreclr-lab
          path: artifacts/codec-compat/android-coreclr-corpus
          if-no-files-found: warn
          retention-days: 7

      - name: Upload emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codec-android-emulator-diagnostics
          path: artifacts-android-emulator.log
          if-no-files-found: warn
          retention-days: 7

  ios-produce:
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      SHARPLINK_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Record SDK version
        shell: bash
        run: echo "SHARPLINK_SDK_VERSION=$(dotnet --version)" >> "$GITHUB_ENV"

      - name: Boot an x64 iOS simulator
        shell: bash
        run: |
          xcrun simctl shutdown all || true
          udid="$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and device.get('name', '').startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit
          raise SystemExit('No available iPhone simulator found')
          PY
          )"
          echo "IOS_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          for attempt in $(seq 1 90); do
            state="$(xcrun simctl list devices -j | python3 -c 'import json,sys,os; d=json.load(sys.stdin); u=os.environ["IOS_TARGET"]; print(next((x.get("state","") for xs in d["devices"].values() for x in xs if x.get("udid")==u), ""))' IOS_TARGET="$udid" 2>/dev/null || true)"
            if [[ "$state" == "Booted" ]]; then
              break
            fi
            sleep 2
          done
          xcrun simctl list devices | grep "$udid" | grep '(Booted)'

      - name: Build and run iOS x64 simulator producer
        shell: bash
        run: |
          rm -rf test/SharpLink.CodecCompatibility.iOS/bin test/SharpLink.CodecCompatibility.iOS/obj
          dotnet build -c Debug -f net10.0-ios -r iossimulator-x64 \
            test/SharpLink.CodecCompatibility.iOS/SharpLink.CodecCompatibility.iOS.csproj
          app="$(find test/SharpLink.CodecCompatibility.iOS/bin/Debug -name '*.app' -type d | head -n 1)"
          test -n "$app"
          xcrun simctl install "$IOS_SIMULATOR_UDID" "$app"
          node test/SharpLink.CodecCompatibility.iOS/run-ios.mjs \
            produce artifacts/codec-compat/ios-simulator-x64-corpus \
            "$SHARPLINK_COMMIT" "$SHARPLINK_SDK_VERSION"

      - name: Upload iOS simulator corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codec-corpus-iossimulator-x64-mono-lab
          path: artifacts/codec-compat/ios-simulator-x64-corpus
          if-no-files-found: warn
          retention-days: 7
