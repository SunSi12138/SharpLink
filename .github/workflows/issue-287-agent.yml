name: Issue 287 temporary workbench

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-287-call-control-cleanup
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Apply prototype patch
        run: |
          python3 .github/issue-287-patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/SharpLink.Abstractions/ProtocolV2.cs')
          text = p.read_text().replace(
              '    public const ushort TimeBudgetMinorVersion = 4;',
              '    /// <summary>Protocol minor version that encodes request lifetime as remaining TimeBudget ticks.</summary>\n    public const ushort TimeBudgetMinorVersion = 4;')
          p.write_text(text)
          PY
          git diff --stat
          git diff --check
          echo '=== remaining source references ==='
          git grep -n 'SharpLinkCallOptions' src || true
      - name: Restore
        run: dotnet restore Sharplink.slnx
      - name: Build core projects
        run: |
          dotnet build src/SharpLink.Abstractions/SharpLink.Abstractions.csproj --no-restore -c Release -v minimal
          dotnet build src/SharpLink.Runtime/SharpLink.Runtime.csproj --no-restore -c Release -v minimal
          dotnet build src/SharpLink.Client/SharpLink.Client.csproj --no-restore -c Release -v minimal
          dotnet build src/SharpLink.Server/SharpLink.Server.csproj --no-restore -c Release -v minimal
