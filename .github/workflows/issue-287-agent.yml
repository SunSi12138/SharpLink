name: Issue 287 temporary workbench

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect implementation details
        shell: bash
        run: |
          set -euo pipefail
          echo '=== RpcDeadline definitions/usages ==='
          git grep -n 'RpcDeadline' src | head -120 || true
          echo '=== Deadline-related abstractions/runtime ==='
          git grep -n -E 'TimestampFrequency|UtcDeadline|Remaining|NegotiatedMinor|MinorVersion' src/SharpLink.* | head -220 || true
          echo '=== Invoker wire writer ==='
          sed -n '940,1080p' src/SharpLink.Client/SharpLinkClient.Invokers.cs
          echo '=== Proxy emitter ==='
          sed -n '100,190p' src/SharpLink.Generator/RpcGenerator.ProxyEmitter.cs
          sed -n '330,380p' src/SharpLink.Generator/RpcGenerator.ProxyEmitter.cs
          echo '=== Stub emitter ==='
          sed -n '260,330p' src/SharpLink.Generator/RpcGenerator.StubEmitter.cs
          echo '=== Models ==='
          sed -n '1,115p' src/SharpLink.Generator/RpcGenerator.Models.cs
          echo '=== Generator registration ==='
          sed -n '50,165p' src/SharpLink.Generator/RpcGenerator.cs
          echo '=== Analysis special parameter helpers ==='
          sed -n '520,760p' src/SharpLink.Generator/RpcGenerator.Analysis.cs
          sed -n '1090,1190p' src/SharpLink.Generator/RpcGenerator.Analysis.cs
          echo '=== Session negotiated properties ==='
          git grep -n -E 'NegotiatedCapabilities|NegotiatedMinor|MinorVersion' src/SharpLink.Runtime src/SharpLink.Client src/SharpLink.Server | head -220 || true
