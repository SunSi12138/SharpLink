name: Issue 287 temporary workbench

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-287-call-control-cleanup
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Apply prototype patch
        run: |
          python3 .github/issue-287-patch.py
          python3 .github/issue-287-generator.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/SharpLink.Abstractions/ProtocolV2.cs')
          text = p.read_text().replace(
              '    public const ushort TimeBudgetMinorVersion = 4;',
              '    /// <summary>Protocol minor version that encodes request lifetime as remaining TimeBudget ticks.</summary>\n    public const ushort TimeBudgetMinorVersion = 4;')
          p.write_text(text)

          p = Path('src/SharpLink.Client/SharpLinkClient.RpcChannel.cs')
          text = p.read_text().replace(
              'DateTimeOffset? deadline = null,',
              'RpcDeadline deadline = default,')
          p.write_text(text)

          p = Path('src/SharpLink.Client/SharpLinkClient.Interceptors.cs')
          p.write_text(p.read_text().replace('context.Options', 'context.Metadata'))

          p = Path('src/SharpLink.Generator/RpcGenerator.Analysis.cs')
          text = p.read_text().replace('                m.Parameters.Count(IsCallOptionsParameter) > 1 ||\n', '')
          p.write_text(text)

          p = Path('src/SharpLink.Generator/RpcGenerator.DtoAnalysis.cs')
          text = p.read_text().replace(
              'if (IsCancellationTokenParameter(parameter) || IsCallOptionsParameter(parameter))',
              'if (IsCancellationTokenParameter(parameter))')
          p.write_text(text)
          PY
          git diff --stat
          git diff --check
          echo '=== removed source concepts ==='
          git grep -n -E 'SharpLinkCallOptions|IsCallOptions|HasCallOptions' src && exit 1 || true
      - name: Restore
        run: dotnet restore Sharplink.slnx
      - name: Build solution
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal
