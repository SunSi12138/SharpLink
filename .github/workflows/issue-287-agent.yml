name: Issue 287 temporary workbench

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-287-call-control-cleanup
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Apply prototype patch
        run: |
          python3 .github/issue-287-patch.py
          python3 .github/issue-287-generator.py
          python3 .github/issue-287-tests.py
          python3 .github/issue-287-review-tests.py
          python3 .github/issue-287-followup.py
          python3 .github/issue-287-generator-tests.py
          python3 .github/issue-287-syntax-fix.py
          python3 .github/issue-287-inherited-budget.py
          python3 .github/issue-287-server-handshake-test.py
          python3 .github/issue-287-docs.py
          python3 .github/issue-287-review-round2.py
          python3 .github/issue-287-review-round2-followup.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/SharpLink.Client/SharpLinkClient.RpcChannel.cs')
          text = p.read_text().replace(
              'DateTimeOffset? deadline = null,',
              'RpcDeadline deadline = default,')
          p.write_text(text)

          p = Path('src/SharpLink.Client/SharpLinkClient.Interceptors.cs')
          p.write_text(p.read_text().replace('context.Options', 'context.Metadata'))

          p = Path('src/SharpLink.Generator/RpcGenerator.Analysis.cs')
          text = p.read_text().replace('                m.Parameters.Count(IsCallOptionsParameter) > 1 ||\n', '')
          p.write_text(text)

          p = Path('src/SharpLink.Generator/RpcGenerator.DtoAnalysis.cs')
          text = p.read_text().replace(
              'if (IsCancellationTokenParameter(parameter) || IsCallOptionsParameter(parameter))',
              'if (IsCancellationTokenParameter(parameter))')
          p.write_text(text)
          PY
          git diff --stat
          git diff --check
          echo '=== removed source concepts ==='
          git grep -n -E 'SharpLinkCallOptions|IsCallOptions|HasCallOptions' src && exit 1 || true
          echo '=== legacy wire compatibility gates ==='
          git grep -n -E 'TimeBudgetMinorVersion|ToUnixTimeMilliseconds|FromUnixTimeMilliseconds' -- src/SharpLink.Client src/SharpLink.Server src/SharpLink.Abstractions/ProtocolV2.cs && exit 1 || true
          echo '=== stale active docs ==='
          git grep -n 'SharpLinkCallOptions' -- README.md doc && exit 1 || true
          python3 - <<'PY'
          from pathlib import Path
          changelog = Path('CHANGELOG.md').read_text()
          unreleased = changelog.split('## [1.1.1]', 1)[0]
          stale = [
              'all four SharpLink 1.1.1/2.0 Protocol v2 process pairs',
              'separate 1.1.1 and 2.0 processes interoperate',
              'Protocol v2 wire format, contract/schema identity, and call-path performance are unchanged',
          ]
          for phrase in stale:
              assert phrase not in unreleased, phrase
          migration = Path('doc/migration.md').read_text()
          for phrase in [
              '1.1.x Client 与 2.0 Server、2.0 Client 与 1.1.x Server 仍可通过 Protocol v2 互操作',
              '迁移到 2.0 不改变 wire frame 或 capability negotiation',
          ]:
              assert phrase not in migration, phrase
          PY
      - name: Restore
        run: dotnet restore Sharplink.slnx
      - name: Build solution
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal
      - name: Unit tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj --no-build -c Release
      - name: Generator tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj --no-build -c Release
      - name: Integration tests
        run: >-
          dotnet run -c Release --no-build
          --project test/SharpLink.IntegrationTests
          --
          --maximum-parallel-tests 1
          --timeout 120s
