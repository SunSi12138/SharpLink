name: Issue 287 materialize cleanup

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'issue-287-call-control-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply final issue patch
        run: bash .github/issue-287-apply-current.sh
      - name: Materialize source and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f .github/issue-287-*
          git rm -f .github/workflows/issue-287-*.yml
          git add -A

          git diff --cached --check
          test -z "$(git ls-files '.github/issue-287-*')"
          test -z "$(git ls-files '.github/workflows/issue-287-*.yml')"

          echo '=== final staged summary ==='
          git diff --cached --stat
          git status --short

          git commit -m "api: materialize call-control cleanup"
          git push origin HEAD:issue-287-call-control-cleanup
