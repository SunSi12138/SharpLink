name: Issue 335 P9 Patch

on:
  push:
    branches:
      - issue-335-dynamic-admission-partition-update

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-335-dynamic-admission-partition-update
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Sharplink.slnx

      - name: Apply reviewed P9 patch
        run: python eng/issue-335-p9-patch.py

      - name: Normalize formatting
        run: dotnet format whitespace Sharplink.slnx --no-restore --verbosity minimal

      - name: Preflight diff
        run: git diff --check

      - name: Build Debug
        run: dotnet build Sharplink.slnx --no-restore -c Debug -v minimal

      - name: Build Release
        run: dotnet build Sharplink.slnx --no-restore -c Release -v minimal

      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build

      - name: Commit production fix
        shell: bash
        run: |
          git add src/SharpLink.Server/Admission/SharpLinkAdmissionController.cs src/SharpLink.Server/Admission/AdmissionStateKernel.cs
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(admission): bind captured partition policy generations"
          git push origin HEAD:issue-335-dynamic-admission-partition-update
