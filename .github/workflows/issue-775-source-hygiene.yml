name: Issue 775 one-time source hygiene
on:
  push:
    branches: [prototype/775-static-session-binding]
    paths: [.github/workflows/issue-775-source-hygiene.yml]
permissions:
  contents: write
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Apply the audited source-only patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/prototype/775-static-session-binding
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess
          data = ''
          patch = gzip.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '4b452c3d7c1290ebaddbd25b074df7499d34135d8ea44763d67a469d58497513'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
      - name: Apply SDK whitespace formatting and verify unchanged debt policy
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Sharplink.slnx
          dotnet format whitespace Sharplink.slnx --no-restore --include src/SharpLink.Client/SharpLinkClient.Invokers.cs test/SharpLink.Benchmarks/StaticBindingEvidence.cs src/SharpLink.Server/SharpLinkServer.AdmissionDispatch.cs src/SharpLink.Server/SharpLinkServer.QueuedAdmission.cs --verbosity minimal
          dotnet format whitespace Sharplink.slnx --no-restore --verify-no-changes --verbosity minimal
          python3 eng/check-project-reference-boundaries.py
          python3 eng/test-verify-maintainability.py
          bash eng/check-maintainability.sh
      - name: Compile and exercise the prototype after source-only hygiene
        shell: bash
        run: |
          set -euo pipefail
          dotnet build test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release -p:SharpLinkStaticBindingPrototype=true
          timeout 120 dotnet test/SharpLink.Benchmarks/bin/Release/net10.0/SharpLink.Benchmarks.dll --static-binding-smoke | tee artifacts/hygiene-smoke.log
      - name: Commit only the reviewed source files after validation
        shell: bash
        run: |
          set -euo pipefail
          git add src/SharpLink.Client/SharpLinkClient.Invokers.cs test/SharpLink.Benchmarks/StaticBindingEvidence.cs src/SharpLink.Server/SharpLinkServer.AdmissionDispatch.cs src/SharpLink.Server/SharpLinkServer.QueuedAdmission.cs
          git diff --cached --check
          git diff --cached --binary > artifacts/hygiene.patch
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor: separate queued admission and satisfy existing formatting policy (#775)'
          git push origin HEAD:refs/heads/prototype/775-static-session-binding
          git rev-parse HEAD > artifacts/hygiene-sha.txt
      - name: Retain source and formatter proposal
        if: always()
        run: |
          mkdir -p artifacts
          git archive HEAD | gzip > artifacts/hygiene-source.tar.gz
          git diff HEAD --binary > artifacts/uncommitted.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue775-source-hygiene
          path: artifacts/
          retention-days: 30
