name: Issue 801 - Stage IRpcChannel dead sink ABI cleanup
on:
  push:
    branches:
      - cleanup/issue-801-channel-stream-sink
permissions:
  contents: write
jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'chore(issue-801)')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      TUNIT_MAX_PARALLEL_TESTS: '8'
    steps:
      - name: Checkout exact 3.0 dev source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Configure .NET 10
        uses: ./.github/actions/setup-dotnet
      - name: Apply reviewed source-level ABI change
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/audit/issue-801-dev-3x-deadcode
          mkdir -p eng/issue801 artifacts/issue-801-channel-sink
          git show FETCH_HEAD:eng/issue801/probe-rpc-channel-sink.py > eng/issue801/probe-rpc-channel-sink.py
          python3 eng/issue801/probe-rpc-channel-sink.py artifacts/issue-801-channel-sink
          python3 - <<'PY'
          from pathlib import Path
          api = Path("eng/public-api/3.0.0/SharpLink.Abstractions.api.txt")
          old = "    public interface IRpcChannel : SharpLink.Abstractions.IRpcClientStreamSink"
          new = "    public interface IRpcChannel"
          text = api.read_text(encoding="utf-8")
          assert text.count(old) == 1
          api.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY
          cat > doc/rpc-channel-3.0-migration.md <<'DOC'
          # RPC channel / client stream sink split in 3.0

          In 3.0, `IRpcChannel` no longer inherits `IRpcClientStreamSink`.
          `SharpLinkClient.SendClientStreamAsync<T>` always failed, and metadata/dynamic
          channel forwarding methods delegated only to that failure; all have been removed.

          **Generated client streaming is preserved.** Generated proxy and stream writers
          use the real connection-bound `IRpcClientStreamSink`, not the channel facade.
          Application callers should use generated `[RpcContract]` proxy streaming methods;
          they must not cast an `IRpcChannel` to an `IRpcClientStreamSink`.

          This is a CLR/Generated ABI migration for 3.0; regenerate contracts with the same
          3.0 SDK and deploy matching Runtime, Abstractions, Client and Server packages.
          It does **not** change Protocol v2 wire frames or the client stream semantics.
          DOC
          git diff --check
          git diff --stat
      - name: Full Release solution build
        run: |
          dotnet restore Sharplink.slnx -v minimal
          dotnet build Sharplink.slnx -c Release --no-restore -v minimal
      - name: Unit Tests
        run: dotnet test --project test/SharpLink.UnitTests/SharpLink.UnitTests.csproj -c Release --no-build
      - name: Generator Tests
        run: dotnet test --project test/SharpLink.Generator.Tests/SharpLink.Generator.Tests.csproj -c Release --no-build
      - name: Integration Tests
        run: dotnet run --project test/SharpLink.IntegrationTests -c Release --no-build --no-restore -- --maximum-parallel-tests 1 --timeout 120s
      - name: Commit validated source and reviewed ABI diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/SharpLink.Abstractions/IRpcChannel.cs src/SharpLink.Client/SharpLinkClient.RpcChannel.cs src/SharpLink.Client/SharpLinkClient.DynamicChannel.cs src/SharpLink.Client/SharpLinkMetadataRpcChannel.cs eng/public-api/3.0.0/SharpLink.Abstractions.api.txt doc/rpc-channel-3.0-migration.md
          git rm -f .github/workflows/issue-801-stage-channel-sink.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "refactor(3.0)!: remove failing IRpcChannel client-stream sink inheritance (#801)"
          git push origin HEAD:refs/heads/cleanup/issue-801-channel-stream-sink
