name: Issue 252 Experiment A Observable

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  experiment-a:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      EVIDENCE_ROOT: ${{ runner.temp }}/issue252-experiment-a
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/issue-252-pending-segments

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run Experiment A scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          workflow = Path('.github/workflows/issue252-experiment-a.yml').read_text().splitlines()
          wanted = [
              'Apply Experiment A locally',
              'Validate Experiment A correctness',
              'Prepare paired benchmark worktrees',
              'Run paired benchmarks',
              'Evaluate 3 percent gate',
          ]

          def extract_run_block(name: str) -> str:
              marker = f'- name: {name}'
              start = next(i for i, line in enumerate(workflow) if line.strip() == marker)
              run_index = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == 'run: |')
              run_indent = len(workflow[run_index]) - len(workflow[run_index].lstrip())
              content_indent = run_indent + 2
              body = []
              for line in workflow[run_index + 1:]:
                  if line.strip():
                      indent = len(line) - len(line.lstrip())
                      if indent <= run_indent:
                          break
                  body.append(line[content_indent:] if len(line) >= content_indent else '')
              if not body:
                  raise SystemExit(f'empty run block: {name}')
              return '\n'.join(body) + '\n'

          env = os.environ.copy()
          for name in wanted:
              print(f'=== {name} ===', flush=True)
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', extract_run_block(name)],
                  check=True,
                  env=env,
              )
          PY

      - name: Show gate result
        if: always()
        shell: bash
        run: |
          if [ -f "$EVIDENCE_ROOT/result.json" ]; then
            cat "$EVIDENCE_ROOT/result.json"
          fi

      - name: Upload Experiment A evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue252-experiment-a-observable
          path: ${{ runner.temp }}/issue252-experiment-a
          if-no-files-found: warn
          retention-days: 30
