name: Deterministic allocation gate
description: Builds and runs the Release allocation regression harness.
inputs:
  artifact-directory:
    description: Directory for JSON evidence.
    required: false
    default: artifacts/perf/allocation-gate
  negative-control:
    description: Run the injected-allocation negative control and require it to fail.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Restore allocation gate
      shell: bash
      run: dotnet restore test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj

    - name: Build allocation gate in Release
      shell: bash
      run: dotnet build test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release --no-restore -v minimal

    - name: Allocation gate harness self-tests
      shell: bash
      run: >-
        dotnet run
        --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj
        -c Release
        --no-build
        --
        --allocation-gate-self-test
        --output "${{ inputs.artifact-directory }}/self-test.json"

    - name: Enforce allocation budgets
      shell: bash
      env:
        SHARPLINK_ALLOCATION_OUTPUT: ${{ inputs.artifact-directory }}/gate.json
      run: ./eng/run-allocation-gate.sh

    - name: Prove injected allocation is rejected
      if: inputs.negative-control == 'true'
      shell: bash
      env:
        SHARPLINK_ALLOCATION_OUTPUT: ${{ inputs.artifact-directory }}/negative-control.json
      run: |
        set +e
        ./eng/run-allocation-gate.sh \
          --filter rpc-add-sharedmemory-c1 \
          --inject-bytes-per-operation 512
        status=$?
        set -e
        if [[ $status -eq 0 ]]; then
          echo "::error::Injected allocation negative control unexpectedly passed."
          exit 1
        fi
        echo "Injected allocation was rejected as expected."

    - name: Issue 399 exact-base BenchmarkDotNet A/B evidence
      shell: bash
      env:
        ISSUE399_BASE: e42e80c5e87c2fa075d45bbae0f46c00dcd67821
        ISSUE399_HEAD: d3fdfe424cbd3585c616f279416060e6aea842c5
        ISSUE399_ARTIFACT_ROOT: ${{ runner.temp }}/issue399-bdn
      run: |
        set -euo pipefail

        rm -rf "$ISSUE399_ARTIFACT_ROOT"
        mkdir -p "$ISSUE399_ARTIFACT_ROOT/environment" "$ISSUE399_ARTIFACT_ROOT/allocation-gate"
        cp -R "${{ inputs.artifact-directory }}/." "$ISSUE399_ARTIFACT_ROOT/allocation-gate/"
        printf '%s\n' "$ISSUE399_BASE" > "$ISSUE399_ARTIFACT_ROOT/environment/base-sha.txt"
        printf '%s\n' "$ISSUE399_HEAD" > "$ISSUE399_ARTIFACT_ROOT/environment/head-sha.txt"
        dotnet --info > "$ISSUE399_ARTIFACT_ROOT/environment/dotnet-info.txt"
        uname -a > "$ISSUE399_ARTIFACT_ROOT/environment/uname.txt"
        lscpu > "$ISSUE399_ARTIFACT_ROOT/environment/cpu.txt"

        git fetch --no-tags --depth=1 origin "$ISSUE399_BASE"
        git checkout --detach --force "$ISSUE399_BASE"
        git clean -ffdx

        dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release -- \
          --filter '*UnaryBenchmarks.Rpc_Add*' \
          --launchCount 1 --warmupCount 3 --iterationCount 5 \
          --artifacts "$ISSUE399_ARTIFACT_ROOT/baseline/unary"
        dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release -- \
          --filter '*StreamingBenchmarks*' \
          --launchCount 1 --warmupCount 3 --iterationCount 5 \
          --artifacts "$ISSUE399_ARTIFACT_ROOT/baseline/streaming"

        git fetch --no-tags --depth=1 origin "$ISSUE399_HEAD"
        git checkout --detach --force "$ISSUE399_HEAD"
        git clean -ffdx

        dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release -- \
          --filter '*UnaryBenchmarks.Rpc_Add*' \
          --launchCount 1 --warmupCount 3 --iterationCount 5 \
          --artifacts "$ISSUE399_ARTIFACT_ROOT/head/unary"
        dotnet run --project test/SharpLink.Benchmarks/SharpLink.Benchmarks.csproj -c Release -- \
          --filter '*StreamingBenchmarks*' \
          --launchCount 1 --warmupCount 3 --iterationCount 5 \
          --artifacts "$ISSUE399_ARTIFACT_ROOT/head/streaming"

        mkdir -p "${{ inputs.artifact-directory }}/issue399-bdn"
        cp -R "$ISSUE399_ARTIFACT_ROOT/environment" "${{ inputs.artifact-directory }}/issue399-bdn/"
        cp -R "$ISSUE399_ARTIFACT_ROOT/baseline" "${{ inputs.artifact-directory }}/issue399-bdn/"
        cp -R "$ISSUE399_ARTIFACT_ROOT/head" "${{ inputs.artifact-directory }}/issue399-bdn/"
        cp -R "$ISSUE399_ARTIFACT_ROOT/allocation-gate/." "${{ inputs.artifact-directory }}/"
